<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nghịch Thiên Cải Mệnh — Phàm Nhân Tu Tiên Lộ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090b0d;
    --bg-hero: radial-gradient(ellipse at 50% -20%, #1e3230 0%, #0d1414 45%, #090b0d 80%);
    --panel:#12181c;
    --panel2:#171e23;
    --border:#2a3532;
    --border-soft:#1e2624;
    --jade:#57bb96;
    --jade-dim:#2f6e57;
    --jade-bright:#7fd4b0;
    --jade-glow: rgba(87,187,150,.25);
    --gold:#d4af6a;
    --gold-dim:#7d6737;
    --gold-bright:#eecb8f;
    --gold-glow: rgba(212,175,106,.22);
    --blood:#c15d4a;
    --blood-dim:#5e2f28;
    --blood-bright:#e08268;
    --blood-glow: rgba(193,93,74,.22);
    --text:#efe9d8;
    --text-dim:#9aa19a;
    --text-faint:#606a63;
    --radius:7px;
    --radius-sm:5px;
    --shadow-card: 0 3px 10px rgba(0,0,0,.32), 0 1px 2px rgba(0,0,0,.4);
    --shadow-pop: 0 8px 28px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Be Vietnam Pro',sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(87,187,150,.05) 0%, transparent 35%),
      radial-gradient(circle at 85% 0%, rgba(212,175,106,.04) 0%, transparent 30%);
    background-attachment:fixed;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif',serif;}
  ::selection{background:var(--jade-dim);color:#fff;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--bg-hero);
    border-bottom:1px solid var(--border);
    padding:18px 16px 15px;
    position:relative;
  }
  .topbar::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    opacity:.6;
  }
  .topbar .name-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .topbar .name{font-family:'Noto Serif',serif;font-weight:700;font-size:20px;color:var(--text);letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.4);}
  .topbar .title{font-size:12.5px;color:var(--gold-bright);letter-spacing:.2px;}
  .topbar .realm{font-size:12px;color:var(--jade-bright);margin-top:2px;font-weight:600;letter-spacing:.3px;padding:3px 9px;background:rgba(87,187,150,.1);border:1px solid var(--jade-dim);border-radius:20px;}
  .stat-bars{margin-top:12px;display:flex;flex-direction:column;gap:7px;}
  .bar-row{display:flex;align-items:center;gap:9px;}
  .bar-label{font-size:10.5px;color:var(--text-dim);width:40px;flex:none;letter-spacing:.2px;}
  .bar-track{flex:1;height:9px;background:#141a19;border-radius:20px;overflow:hidden;border:1px solid var(--border-soft);box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
  .bar-fill{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1);border-radius:20px;position:relative;}
  .bar-fill::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.18), transparent 55%);
  }
  .bar-fill.hp{background:linear-gradient(90deg,var(--blood-dim),var(--blood));box-shadow:0 0 8px var(--blood-glow);}
  .bar-fill.tuvi{background:linear-gradient(90deg,var(--jade-dim),var(--jade));box-shadow:0 0 8px var(--jade-glow);}
  .bar-num{font-size:10.5px;color:var(--text-faint);width:76px;text-align:right;flex:none;font-variant-numeric:tabular-nums;}
  .resource-row{display:flex;gap:8px;margin-top:11px;font-size:11.5px;color:var(--text-dim);flex-wrap:wrap;}
  .resource-row span{background:rgba(255,255,255,.03);border:1px solid var(--border-soft);padding:4px 9px;border-radius:20px;}
  .resource-row span b{color:var(--gold-bright);font-weight:700;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel);overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:0;z-index:10;}
  .tab-btn{
    flex:1;min-width:76px;background:none;border:none;color:var(--text-faint);
    padding:12px 6px 10px;font-size:12.5px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;
    transition:color .15s, background .15s;
  }
  .tab-btn:active{background:rgba(255,255,255,.03);}
  .tab-btn.active{color:var(--jade-bright);border-bottom-color:var(--jade);background:linear-gradient(180deg, rgba(87,187,150,.09), transparent);}

  /* ---------- Sub-tabs (within a main tab) ---------- */
  .subtab-row{display:flex;gap:7px;margin-bottom:1px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:1px;}
  .subtab-btn{
    flex:none;background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);
    padding:8px 15px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;
    transition:all .15s;
  }
  .subtab-btn.active{
    background:linear-gradient(180deg, rgba(87,187,150,.2), rgba(87,187,150,.05));
    border-color:var(--jade);color:var(--jade-bright);box-shadow:0 0 0 1px var(--jade-glow);
  }

  main{flex:1;padding:15px 14px 90px;display:flex;flex-direction:column;gap:13px;}

  /* ---------- Cards / sections ---------- */
  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel2));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px 15px;
    box-shadow:var(--shadow-card);
    position:relative;
  }
  .card + .card{margin-top:0;}
  .sec-title{
    font-family:'Noto Serif',serif;font-size:14px;color:var(--gold-bright);margin:0 0 11px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px;
    padding-bottom:8px;border-bottom:1px solid var(--border-soft);
  }
  .sec-note{font-size:11.5px;color:var(--text-faint);margin:-6px 0 10px;line-height:1.5;}
  .flavor{font-size:12.5px;color:var(--text-dim);font-style:italic;line-height:1.6;margin:0 0 9px;}

  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:var(--text-dim);}
  .row .v{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600;text-align:right;}

  .btn{
    background:linear-gradient(180deg, var(--jade-dim), #285f4a);color:#eafff4;border:1px solid var(--jade);
    border-radius:var(--radius-sm);padding:11px 14px;font-size:13.5px;font-weight:700;
    width:100%;text-align:center;transition:transform .1s, box-shadow .15s, filter .15s;
    box-shadow:0 2px 6px rgba(0,0,0,.3);letter-spacing:.2px;
  }
  .btn:active{transform:translateY(1px) scale(.99);filter:brightness(1.15);}
  .btn.gold{background:linear-gradient(180deg,#4a3c22,#332a17);border-color:var(--gold);color:var(--gold-bright);}
  .btn.gold:active{filter:brightness(1.25);}
  .btn.blood{background:linear-gradient(180deg,var(--blood-dim),#4a231d);border-color:var(--blood);color:#ffe9e2;}
  .btn.blood:active{filter:brightness(1.2);}
  .btn.ghost{background:rgba(255,255,255,.02);border-color:var(--border);color:var(--text-dim);box-shadow:none;}
  .btn.ghost:active{background:rgba(255,255,255,.06);}
  .btn:disabled{opacity:.3;pointer-events:none;filter:grayscale(.4);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;min-width:120px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .tile{
    background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:11px 12px;display:flex;flex-direction:column;gap:7px;
    box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  .tile.locked{opacity:.38;}
  .tile-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;}
  .tile-head .tn{color:var(--text);font-weight:700;}
  .tile-head .tc{color:var(--text-faint);font-size:11px;}
  .tile .btn{padding:8px 8px;font-size:11.5px;}

  .zone-card{border-left:3px solid var(--jade-dim);}
  .zone-card.locked{border-left-color:var(--border);}
  .zone-card h3{font-family:'Noto Serif',serif;font-size:15px;margin:0 0 4px;color:var(--gold-bright);}
  .zone-card p{font-size:11.5px;color:var(--text-dim);margin:0 0 10px;line-height:1.55;}
  .zone-lock{font-size:11px;color:var(--text-faint);font-style:italic;}

  /* ---------- Combat ---------- */
  .enemy-block{text-align:center;padding:8px 0 6px;}
  .enemy-name{font-family:'Noto Serif',serif;font-size:16px;color:var(--blood-bright);margin-bottom:8px;letter-spacing:.2px;}
  .combat-log{
    background:#0c1110;border:1px solid var(--border-soft);border-radius:var(--radius-sm);
    padding:9px 11px;max-height:130px;overflow-y:auto;font-size:11.5px;color:var(--text-dim);
    display:flex;flex-direction:column-reverse;gap:5px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4);
  }

  /* ---------- Log ---------- */
  .log-entry{font-size:12px;color:var(--text-dim);padding:8px 0;border-bottom:1px solid var(--border-soft);line-height:1.55;}
  .log-entry:first-child{color:var(--text);}
  .log-entry:last-child{border-bottom:none;}

  /* ---------- Overlay ---------- */
  #overlay{
    position:fixed;inset:0;background:rgba(4,6,7,.9);
    display:none;align-items:center;justify-content:center;z-index:50;padding:22px;
    backdrop-filter:blur(3px);
  }
  #overlay.show{display:flex;}
  .modal{
    background:linear-gradient(180deg, var(--panel), #0f1518);border:1px solid var(--gold-dim);border-radius:10px;
    max-width:440px;width:100%;padding:24px 21px;max-height:86vh;overflow-y:auto;
    box-shadow:var(--shadow-pop), 0 0 40px rgba(212,175,106,.06);
  }
  .modal h2{font-size:20px;margin:0 0 11px;color:var(--gold-bright);letter-spacing:.2px;}
  .modal p{font-size:13.5px;color:var(--text-dim);line-height:1.7;margin:0 0 10px;}
  .modal .epilogue{color:var(--text);}
  .modal .stat-list{margin:14px 0;padding:0;}
  .modal .stat-list .row{font-size:12.5px;}

  .root-result{
    background:#0d1211;border:1px solid var(--border-soft);border-radius:var(--radius-sm);
    padding:12px 13px;margin:2px 0 12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.3);
  }
  .root-tier{font-size:10.5px;color:var(--text-faint);}
  .root-name{font-family:'Noto Serif',serif;font-size:17px;color:var(--gold-bright);margin-top:2px;}

  .path-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 0;}
  .path-tile{
    background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:13px 10px;cursor:pointer;transition:all .15s;
    text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60px;gap:4px;
  }
  .path-tile:active{transform:scale(.97);}
  .path-tile.selected{
    border-color:var(--jade);background:linear-gradient(180deg, rgba(87,187,150,.16), rgba(87,187,150,.04));
    box-shadow:0 0 0 1px var(--jade-glow), 0 4px 14px rgba(87,187,150,.18);
  }
  .path-icon{font-size:19px;line-height:1;}
  .path-name{font-family:'Noto Serif',serif;font-size:12.5px;color:var(--text);line-height:1.3;}
  .path-tile.selected .path-name{color:var(--jade-bright);font-weight:700;}
  .path-desc{font-size:11px;color:var(--text-dim);line-height:1.55;margin:0;}

  .step-progress{display:flex;gap:6px;margin:2px 0 16px;}
  .step-seg{flex:1;height:5px;border-radius:3px;background:var(--border-soft);overflow:hidden;position:relative;}
  .step-seg.done{background:var(--jade-dim);}
  .step-seg.current{background:var(--border-soft);}
  .step-seg.current::after{
    content:'';position:absolute;inset:0;width:55%;border-radius:3px;
    background:linear-gradient(90deg, var(--jade), var(--gold-bright));
    box-shadow:0 0 6px var(--jade-glow);
  }

  input.name-input{
    width:100%;background:#0d1211;border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);padding:11px 13px;font-size:14px;margin:10px 0 14px;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.4);transition:border-color .15s;
  }
  input.name-input:focus{outline:none;border-color:var(--jade);box-shadow:inset 0 1px 3px rgba(0,0,0,.4), 0 0 0 2px var(--jade-glow);}

  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  /* ---------- Loading screen ---------- */
  #loadingScreen{
    position:fixed;inset:0;z-index:100;
    background:var(--bg-hero), var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    transition:opacity .5s ease;
  }
  #loadingScreen.hide{opacity:0;pointer-events:none;}
  .loading-ring{
    width:54px;height:54px;border-radius:50%;
    border:3px solid var(--border-soft);border-top-color:var(--jade);border-right-color:var(--gold-dim);
    animation:loading-spin 1.1s linear infinite;
  }
  @keyframes loading-spin{to{transform:rotate(360deg);}}
  .loading-title{font-family:'Noto Serif',serif;font-size:21px;color:var(--gold-bright);letter-spacing:1.5px;text-shadow:0 2px 12px rgba(0,0,0,.5);}
  .loading-sub{font-size:12px;color:var(--text-faint);letter-spacing:.5px;}

  @media (prefers-reduced-motion: reduce){
    .bar-fill{transition:none;}
    .btn{transition:none;}
    .loading-ring{animation:none;border-top-color:var(--border-soft);}
  }
</style>
</head>
<body>
<div id="loadingScreen">
  <div class="loading-ring"></div>
  <div class="loading-title">Nghịch Thiên Cải Mệnh</div>
  <div class="loading-sub" id="loadingText">Đang tập hợp thiên địa linh khí...</div>
</div>
<div id="app">
  <div class="topbar">
    <div class="name-row">
      <div>
        <div class="name" id="hdrName" onclick="debugTap()">—</div>
        <div class="title" id="hdrTitle">—</div>
      </div>
      <div class="realm" id="hdrRealm">—</div>
    </div>
    <div class="stat-bars">
      <div class="bar-row">
        <div class="bar-label">Khí huyết</div>
        <div class="bar-track"><div class="bar-fill hp" id="hpFill" style="width:0%"></div></div>
        <div class="bar-num" id="hpNum">0/0</div>
      </div>
      <div class="bar-row">
        <div class="bar-label">Tu vi</div>
        <div class="bar-track"><div class="bar-fill tuvi" id="tuviFill" style="width:0%"></div></div>
        <div class="bar-num" id="tuviNum">0/0</div>
      </div>
    </div>
    <div class="resource-row">
      <span>💎 Linh thạch <b id="rsStones">0</b></span>
      <span>✨ Linh lực <b id="rsLinhLuc">0</b></span>
      <span>⏳ Thọ nguyên <b id="rsAge">0</b> tuổi</span>
    </div>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="content"></main>
</div>

<div id="overlay"><div class="modal" id="modalBody"></div></div>


<script>
/* =====================================================================
   DỮ LIỆU NỀN TẢNG
===================================================================== */
/* =====================================================================
   HỆ THỐNG CẢNH GIỚI — Hạ/Trung/Thượng Cảnh Giới, mỗi đại cảnh giới
   (trừ Luyện Khí và Đạo Tổ) chia thành 4 tiểu cảnh giới: Sơ Kỳ, Trung Kỳ,
   Hậu Kỳ, Đỉnh Phong. Luyện Khí Kỳ chia làm 13 tầng. Đột phá tiểu cảnh
   giới diễn ra thường xuyên; đột phá ĐẠI cảnh giới ở ba mốc Hóa Thần Kỳ,
   Đại Thừa Kỳ, Đại La Kỳ phải vượt qua Cửu Cửu Lôi Kiếp.
===================================================================== */
const SUBSTAGE_NAMES = ["Sơ Kỳ","Trung Kỳ","Hậu Kỳ","Đỉnh Phong"];

const MAJOR_REALMS = [
  {name:"Luyện Khí Kỳ",  world:"Hạ Cảnh Giới", substageCount:13, tuViMax:15,    hp:25,    atk:4,    def:1,    spd:4,   note:"Dẫn linh khí nhập thể, gột rửa kinh mạch từng tầng một."},
  {name:"Trúc Cơ Kỳ",    world:"Hạ Cảnh Giới", substageCount:4,  tuViMax:120,   hp:90,    atk:12,   def:5,    spd:9,   note:"Đan điền hóa lỏng linh khí, tuổi thọ tăng lên khoảng 200 năm, chính thức thoát kiếp phàm nhân."},
  {name:"Kết Đan Kỳ",    world:"Hạ Cảnh Giới", substageCount:4,  tuViMax:320,   hp:220,   atk:26,   def:12,   spd:13,  note:"Linh khí lỏng ngưng tụ thành một viên Kim Đan trong đan điền, tuổi thọ đạt khoảng 500 năm."},
  {name:"Nguyên Anh Kỳ", world:"Hạ Cảnh Giới", substageCount:4,  tuViMax:700,   hp:500,   atk:55,   def:26,   spd:19,  note:"Kim Đan hóa thành Nguyên Anh, có khả năng xuất hồn, đoạt xá hoặc thoát xác trốn chạy khi nhục thân bị phá hủy. Tuổi thọ tăng lên hơn 1.000 năm."},
  {name:"Hóa Thần Kỳ",   world:"Hạ Cảnh Giới", substageCount:4,  tuViMax:1500,  hp:1100,  atk:115,  def:55,   spd:27,  note:"Đỉnh cao Nhân Giới — mượn được Thiên Địa Nguyên Khí để chiến đấu, tuổi thọ lên tới 2.000-3.000 năm, đủ điều kiện phi thăng Linh Giới."},
  {name:"Luyện Hư Kỳ",   world:"Trung Cảnh Giới", substageCount:4, tuViMax:3000,  hp:2400,  atk:230,  def:110,  spd:38,  note:"Nguyên Anh dung hợp hoàn toàn vào nhục thân, đạt trạng thái ngũ hành đồng hóa, không còn bị giới hạn tuổi thọ thông thường — nhưng phải đối mặt với thiên kiếp định kỳ."},
  {name:"Hợp Thể Kỳ",    world:"Trung Cảnh Giới", substageCount:4, tuViMax:6000,  hp:4600,  atk:420,  def:200,  spd:50,  note:"Thần thức, pháp lực và nhục thân đạt đến độ hòa quyện tuyệt đối, ngưng tụ ra Pháp Tướng cường hãn."},
  {name:"Đại Thừa Kỳ",   world:"Trung Cảnh Giới", substageCount:4, tuViMax:11000, hp:8500,  atk:750,  def:360,  spd:64,  note:"Đỉnh phong Trung Cảnh Giới, sức mạnh đủ chấn nhiếp một đại tộc — chỉ còn giai đoạn Độ Kiếp trước cửa Tiên Giới."},
  {name:"Chân Tiên Kỳ",  world:"Thượng Cảnh Giới", substageCount:4, tuViMax:20000, hp:15000, atk:1300, def:620,  spd:82,  note:"Vượt qua thiên kiếp, chính thức ngưng tụ Tiên Khiếu và Tiên Linh Lực đầu tiên."},

/* Ba mốc đại cảnh giới kích hoạt Cửu Cửu Lôi Kiếp thay vì đột phá thường:
   Hóa Thần Kỳ (Nhân Giới → Linh Giới), Đại Thừa Kỳ (Trung Cảnh Giới → Tiên Giới),
   Đại La Kỳ (Thượng Cảnh Giới → Đạo Tổ, kết thúc thật sự). */
const TRIBULATION_REALMS = [4,7,11];

function subStageLabel(realmIdx, subStage){
  const r = MAJOR_REALMS[realmIdx];
  if(realmIdx===0) return `Tầng ${subStage+1}`;
  if(r.substageCount<=1) return '';
  return SUBSTAGE_NAMES[subStage] || '';
}
function fullRealmName(realmIdx, subStage){
  const r = MAJOR_REALMS[realmIdx];
  const sub = subStageLabel(realmIdx, subStage);
  return sub ? `${r.name} — ${sub}` : r.name;
}
/* Chỉ số/tu vi cần thiết thực tế tại một tiểu cảnh giới cụ thể — tăng dần
   qua từng tiểu cảnh giới trong cùng một đại cảnh giới. */
function realmStatsAt(realmIdx, subStage){
  const r = MAJOR_REALMS[realmIdx];
  const growth = Math.pow(1.14, subStage);
  const tuViGrowth = Math.pow(1.35, subStage);
  return {
    tuViMax: r.tuViMax===Infinity ? Infinity : Math.round(r.tuViMax*tuViGrowth),
    hp: Math.round(r.hp*growth),
    atk: Math.round(r.atk*growth),
    def: Math.round(r.def*growth),
    spd: Math.round(r.spd*growth)
  };
}

function isAdvancedTechAccessible(t){
  if(state.techniques.some(x=>x.name===t.name)) return false;
  if(state.manuals.includes(t.id)) return false;
  if(t.reqType==='any'){
    return true;
  }
  if(t.reqType==='realm_only'){
    return state.realmIdx >= t.minRealm-1;
  }
  if(t.reqType==='element'){
    return !!(state.root && state.root.elements && state.root.elements.includes(t.element));
  }
  if(t.reqType==='element_or_physique'){
    const elMatch = state.root && state.root.elements && state.root.elements.includes(t.element);
    const phyMatch = state.physique && state.physiqueKnown && state.physique.id===t.physiqueId;
    return !!(elMatch || phyMatch);
  }
  if(t.reqType==='path'){
    return !!(state.path && state.path.id===t.pathId);
  }
  return false;
}

  if(!t || !state.manuals.includes(id)) return;
  if(state.realmIdx<t.minRealm){ addLog(`Cảnh giới chưa đủ, cần đạt ${MAJOR_REALMS[t.minRealm].name} trở lên mới đủ sức tu luyện 【${t.name}】.`); render(); return; }
  const herbHave = state.herbs[t.cost.herbTier]||0;
  if(state.spiritStones<t.cost.stones || herbHave<t.cost.herbCount){
    addLog(`Cần ${t.cost.stones} linh thạch và ${t.cost.herbCount} ${HERB_NAMES[t.cost.herbTier-1]} làm tài nguyên phụ trợ mới đủ luyện 【${t.name}】.`);
    render(); return;
  }
  state.spiritStones -= t.cost.stones;
  state.herbs[t.cost.herbTier] -= t.cost.herbCount;
  let success = true, chance = 100;
  if(t.madnessRisk){
    chance = Math.min(90, Math.max(15, 50+(state.realmIdx-t.minRealm)*15));
    success = Math.random()*100<chance;
  }
  state.manuals = state.manuals.filter(m=>m!==id);
  if(success){
    state.techniques.push({name:t.name, desc:t.desc, bonus:t.bonus});
    state.learnedNames.push(t.name);
    addLog(`Sau bao gian khổ, ngươi luyện thành 【${t.name}】— ${t.desc}`);
  } else {
    const dmg = Math.round(state.stats.hpMax*0.35);
    state.hp = Math.max(1, state.hp-dmg);
    addLog(`Tâm cảnh không đủ vững, cưỡng luyện 【${t.name}】khiến tẩu hỏa nhập ma! Chịu ${dmg} sát thương, bí kíp cũng theo đó thất truyền.`);
  }
  computeStats();
  render();
}

function pickDistinctElements(pool, n){
  const p = [...pool], res = [];
  for(let i=0;i<n && p.length;i++){
    const idx = Math.floor(Math.random()*p.length);
    res.push(p.splice(idx,1)[0]);
  }
  return res;
}

function rollSpiritRoot(){
  const total = ROOT_TEMPLATES.reduce((s,r)=>s+r.weight,0);
  let roll = Math.random()*total;
  let tpl = ROOT_TEMPLATES[0];
  for(const r of ROOT_TEMPLATES){
    if(roll<r.weight){ tpl = r; break; }
    roll -= r.weight;
  }
  let elements=[], elementLabel='';
  if(tpl.id==='thien'){
    elements = pickDistinctElements(NGU_HANH,1);
    elementLabel = elements[0];
  } else if(tpl.id==='bienli'){
    elements = pickDistinctElements(DI_THUOC,1);
    elementLabel = elements[0];
  } else if(tpl.id==='chan'){
    const n = Math.random()<0.5?2:3;
    elements = pickDistinctElements(NGU_HANH,n);
    elementLabel = elements.join(' + ');
  } else if(tpl.id==='nguy'){
    const n = Math.random()<0.5?4:5;
    elements = pickDistinctElements(NGU_HANH,n);
    elementLabel = elements.join(' + ');
  } else if(tpl.id==='nguhanh'){
    elements = [...NGU_HANH];
    elementLabel = elements.join(' + ');
  }
  return {
    id: tpl.id,
    name: tpl.catName,
    desc: tpl.desc,
    elements, elementLabel,
    isDynamic: !!tpl.isDynamic,
    tuViMult: tpl.tuViMult, critBonus: tpl.critBonus, pillMult: tpl.pillMult, breakEase: tpl.breakEase,
    early: tpl.early, late: tpl.late
  };
}

/* Trả về chỉ số hiệu lực thực tế của linh căn tại cảnh giới hiện tại.
   Với Ngũ Hành Cụ Toàn, chỉ số đảo chiều khi realmIdx đạt NGUHANH_LATE_REALM. */
function rootMods(root, realmIdx){
  if(!root){
    return {tuViMult:1, critBonus:0, pillMult:1, breakEase:0, lateActive:false};
  }
  if(root.isDynamic){
    const late = realmIdx >= NGUHANH_LATE_REALM;
    const src = late ? root.late : root.early;
    return {...src, lateActive:late};
  }
  return {tuViMult:root.tuViMult, critBonus:root.critBonus, pillMult:root.pillMult, breakEase:root.breakEase, lateActive:false};
}

function scaleBloodline(b, mult, suffix){
  const scaled = {name: b.name+(suffix||''), desc: b.desc};
  ['atkMult','defMult','spdMult','hpMult','pillMult','tuViMult'].forEach(k=>{
    if(b[k]!==undefined) scaled[k] = 1+(b[k]-1)*mult;
  });
  if(b.critBonus!==undefined) scaled.critBonus = Math.round(b.critBonus*mult);
  return scaled;
}

function rollPhysique(){
  const total = PHYSIQUE_TEMPLATES.reduce((s,p)=>s+p.weight,0);

/* Trả về các hệ số hiệu lực thực tế của thể chất tại thời điểm hiện tại,
   đã gộp cả trường hợp ngủ yên (chưa kích phát), trường hợp chỉ phát
   huy uy lực khi đạt cảnh giới cao, và trường hợp bị phế bỏ do tu sai
   đạo lộ tương hợp. */
function physiqueMods(){
  const base = {atkMult:1, defMult:1, spdMult:1, hpMult:1, critBonus:0, pillMult:1,
    meditateMishapMult:1, trapDmgMult:1, lifestealPct:0, earlyTuViMult:1, earlyRealmCap:-1};
  const phy = state.physique;
  if(!phy) return base;
  if(phy.dormant){
    if(state.physiqueAwakened){
      const b = state.physiqueAwakened;
      return {...base,
        atkMult:b.atkMult||1, defMult:b.defMult||1, spdMult:b.spdMult||1, hpMult:b.hpMult||1,
        critBonus:b.critBonus||0, pillMult:b.pillMult||1,
        earlyTuViMult:b.tuViMult||1, earlyRealmCap:99};
    }
    return base;
  }
  if(phy.isDynamic){
    const late = state.realmIdx >= PHYSIQUE_LATE_REALM;
    if(late) return {...base, atkMult:1.2, defMult:1.2, spdMult:1.15, hpMult:1.2, critBonus:10};
    return {...base, lateActive:false};
  }
  if(phy.idealPath && (!state.path || state.path.id!==phy.idealPath)){
    return base; // tu sai đạo lộ — thể chất coi như phế bỏ
  }
  return {
    ...base,
    atkMult: phy.atkMult||1, defMult: phy.defMult||1, spdMult: phy.spdMult||1, hpMult: phy.hpMult||1,
    critBonus: phy.critBonus||0, pillMult: phy.pillMult||1,
    meditateMishapMult: phy.meditateMishapMult||1, trapDmgMult: phy.trapDmgMult||1,
    lifestealPct: phy.lifestealPct||0,
    earlyTuViMult: phy.earlyTuViMult||1, earlyRealmCap: phy.earlyRealmCap!==undefined?phy.earlyRealmCap:-1
  };
}

function awakenBloodline(){
  const phy = state.physique;
  if(!phy || !phy.dormant || state.physiqueAwakened) return;
  if(state.realmIdx<PHYSIQUE_AWAKEN_REALM){ addLog(`Huyết mạch còn quá yếu, cần tu vi đạt ${MAJOR_REALMS[PHYSIQUE_AWAKEN_REALM].name} trở lên mới có thể thử kích phát.`); render(); return; }
  const cost = 150+state.realmIdx*60;
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để thử kích phát huyết mạch.`); render(); return; }
  state.spiritStones -= cost;
  const late = state.realmIdx>=PHYSIQUE_LATE_REALM;
  const chance = late ? Math.min(92, 55+(state.realmIdx-PHYSIQUE_LATE_REALM)*15) : Math.min(30, 12+state.realmIdx*5);
  if(Math.random()*100<chance){
    const base = BLOODLINES[Math.floor(Math.random()*BLOODLINES.length)];
    const b = late ? scaleBloodline(base,1) : scaleBloodline(base,0.5,' (huyết mạch loãng)');
    state.physiqueAwakened = b;
    addLog(late
      ? `⚡ Kích phát thành công, huyết mạch thuần khiết hiếm có — xứng danh Thánh Tử/Thánh Nữ! 【${b.name}】— ${b.desc}`
      : `⚡ Kích phát thành công, nhưng do còn ở Nhân Giới nên huyết mạch chỉ đạt độ tinh thuần thấp. 【${b.name}】— ${b.desc}`);
  } else {
    const dmg = Math.round(state.stats.hpMax*0.15);
    state.hp = Math.max(1, state.hp-dmg);
    addLog(`Kích phát thất bại, huyết mạch phản kháng dữ dội, chịu ${dmg} sát thương. Có thể tích lũy thêm rồi thử lại sau${late?'':', hoặc chờ phi thăng Linh Giới để tăng cơ hội'}.`);
  }
  computeStats();
  render();
}

   Long Ngâm Chi Thể nếu không phát hiện kịp có nguy cơ dương khí bạo
   phát gây họa (như Tân Như Âm năm xưa).
===================================================================== */
function revealPhysique(msg){
  state.physiqueKnown = true;
  addLog(msg);
}

function checkPhysiqueDiscovery(){
  const phy = state.physique;
  if(!phy || !phy.idealPath || state.physiqueKnown) return;

  if(phy.id==='bang_co'){
    if(Math.random()<0.5){
      revealPhysique(`Vào một hang động lạnh lẽo, ngươi chợt nhận ra mình chẳng hề thấy rét — ngược lại còn thư thái lạ thường, tu vi tự động vận chuyển. Té ra ngươi mang 【Băng Cơ Ngọc Cốt】từ bẩm sinh!`);
    }
    return;
  }

  if(phy.id==='long_ngam'){
    if(!state.longNgamCrisisOccurred && Math.random()<0.05){
      state.longNgamCrisisOccurred = true;
      const dmg = Math.round(state.stats.hpMax*0.6);
      state.hp = Math.max(1, state.hp-dmg);
      state.physiqueKnown = true;
      addLog(`Đột nhiên dương khí trong người bạo phát không kiểm soát, kinh mạch như muốn nứt toác — ngươi choáng váng ngã quỵ, chịu ${dmg} sát thương! May mắn giữ được mạng, không như Tân Như Âm năm xưa vì không phát hiện kịp thời mà đoản mệnh chết sớm. Ngươi nhận ra mình mang 【Long Ngâm Chi Thể】, cần sớm tìm công pháp áp chế dương khí.`);
    }
    return;
  }

  if(Math.random()<0.06){
    revealPhysique(`Trong một lần tình cờ, ngươi gặp được một vị tiền bối tu vi thâm hậu, dùng linh mục nhìn thấu kinh mạch của ngươi, kinh ngạc thốt lên: "Ngươi mang 【${phy.name}】!"`);
  }
}

function learnOrLevelProfession(id){
  const prof = PROFESSIONS.find(p=>p.id===id);
  const cur = state.professions[id]||0;
  if(cur>=prof.maxLevel){ addLog(`${prof.name} đã tu tới cực hạn, không thể tinh tấn thêm.`); render(); return; }
  const cost = professionCost(cur);
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để ${cur===0?'bái sư học nghề':'tinh tấn'} ${prof.name}.`); render(); return; }
  state.spiritStones -= cost;
  state.professions[id] = cur+1;
  addLog(cur===0
    ? `Ngươi bái sư học nghề, chính thức nhập môn ${prof.name}.`
    : `${prof.name} của ngươi tinh tấn lên cấp ${cur+1}.`);
  computeStats();
  render();
}

function forgeTreasure(){
  const lvl = state.professions.khiSu||0;
  if(lvl<1){ addLog("Cần học nghề Luyện Khí Sư trước đã."); render(); return; }
  const cost = 60+state.realmIdx*40;
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để rèn chế pháp bảo.`); render(); return; }
  state.spiritStones -= cost;
  if(!state.hasKhiPhuong){
    const fluke = Math.random()<0.15;
    if(!fluke){
      addLog(`Thiếu Khí Phương, không rõ tỷ lệ dung hợp khoáng thạch lẫn cách khắc cấm chế — mẻ đúc chỉ ra một khối kim loại tầm thường, không thể dẫn truyền pháp lực. Linh thạch coi như mất trắng.`);
      render();
      return;
    } else {
      addLog(`Thiếu Khí Phương nhưng ngươi liều lĩnh mò đúng vài phần quy trình, đúc ra được một món pháp bảo thô sơ — công hiệu kém xa đồ bài bản.`);
    }
  }
  const base = TREASURES[Math.floor(Math.random()*TREASURES.length)];
  const scale = (1+state.realmIdx*0.3+lvl*0.12) * (state.hasKhiPhuong?1:0.5);
  const t = {name:base.name, tier:state.realmIdx, bonus:{
    atk: Math.round((base.bonus.atk||0)*scale),
    def: Math.round((base.bonus.def||0)*scale),
    crit: Math.round((base.bonus.crit||0)*scale)
  }};
  if(!state.treasure || (t.bonus.atk||0) >= (state.treasure.bonus.atk||0)){
    state.treasure = t;
    addLog(`Ngươi đích thân rèn chế thành công pháp bảo【${t.name}】, trang bị ngay lập tức!`);
  } else {
    const refund = Math.round(cost*0.4);
    state.spiritStones += refund;
    addLog(`Pháp bảo rèn ra không hơn được món hiện có, đành nấu chảy lấy lại ${refund} linh thạch.`);
  }
  computeStats();
  render();
}

function temperTreasure(){
  const lvl = state.professions.khiSu||0;
  if(lvl<3){ addLog("Cần Luyện Khí Sư đạt cấp 3 trở lên mới đủ hỏa hầu tôi luyện bản mệnh pháp bảo."); render(); return; }
  if(!state.treasure){ addLog("Cần có pháp bảo tùy thân trước đã."); render(); return; }
  if(!state.hasKhiPhuong){ addLog("Thiếu Khí Phương, không nắm được quy trình khắc cấm chế — chưa dám tôi luyện thêm cho bản mệnh pháp bảo, sợ nứt vỡ khi giao chiến."); render(); return; }
  const cost = 70+ (state.treasure.temperCount||0)*35;
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để tôi luyện thêm cho 【${state.treasure.name}】.`); render(); return; }
  state.spiritStones -= cost;
  state.treasure.bonus.atk = (state.treasure.bonus.atk||0)+5;
  state.treasure.bonus.crit = (state.treasure.bonus.crit||0)+1;
  state.treasure.temperCount = (state.treasure.temperCount||0)+1;
  addLog(`Ngươi dồn tâm huyết tôi luyện thêm một tầng cho 【${state.treasure.name}】 — bản mệnh pháp bảo càng thêm sắc bén (đã tôi luyện ${state.treasure.temperCount} lần).`);
  computeStats();
  render();
}

function craftTalisman(tier){
  const lvl = state.professions.phuLuc||0;
  if(lvl<1){ addLog("Cần học nghề Phù Lục Sư trước đã."); render(); return; }
  const t = TALISMAN_TIERS.find(x=>x.tier===tier);
  if(!t) return;
  const herbTier = MATERIAL_TIER_HERB[tier-1];
  const herbHave = state.herbs[herbTier]||0;
  if(state.spiritStones<t.stones || herbHave<t.herbCount){
    addLog(`Cần ${t.stones} linh thạch và ${t.herbCount} ${HERB_NAMES[herbTier-1]} để vẽ 【${t.name}】.`);
    render(); return;
  }
  state.spiritStones -= t.stones;
  state.herbs[herbTier] -= t.herbCount;
  const n = 1+(Math.random()<0.35?1:0);
  state.talismans[tier] = (state.talismans[tier]||0)+n;
  addLog(`Vẽ xong ${n} đạo 【${t.name}】 (vật liệu ${HERB_NAMES[herbTier-1]} càng hiếm, phù chú càng mạnh), sẵn sàng kích hoạt giữa trận chiến sinh tử.`);
  render();
}

function bestTalismanTier(){
  for(let t=3;t>=1;t--){ if((state.talismans[t]||0)>0) return t; }
  return 0;
}

function craftPuppet(tier){

  const herbTier = MATERIAL_TIER_HERB[tier-1];
  const herbHave = state.herbs[herbTier]||0;
  if(state.spiritStones<dt.stones || herbHave<dt.herbCount){
    addLog(`Cần ${dt.stones} linh thạch và ${dt.herbCount} ${HERB_NAMES[herbTier-1]} để lắp một khôi lỗi dùng 【${dt.name}】.`);

  state.spiritStones -= dt.stones;
  state.herbs[herbTier] -= dt.herbCount;
  if(!state.hasKhoiLoiVe){
    const fluke = Math.random()<0.15;
    if(!fluke){
      addLog(`Thiếu Bản Vẽ Khôi Lỗi, ngươi không rõ cấu trúc xương khớp lẫn đường dẫn phù văn để rót thần thức — cỗ máy lắp ra thành phế thải, không thể cử động. Nguyên liệu mất trắng.`);
      render();
      return;
    } else {
      addLog(`Thiếu Bản Vẽ Khôi Lỗi nhưng ngươi liều lĩnh mò đúng vài phần cấu trúc, lắp ra được một con khôi lỗi tạm dùng được — dù phản ứng không nhanh nhạy như đồ bài bản.`);

  addLog(`Ngươi dùng 【${dt.name}】 (vật liệu ${HERB_NAMES[herbTier-1]}) lắp thành một khôi lỗi mới — vật liệu càng hiếm, khôi lỗi càng mạnh. Đội quân giờ có ${state.puppets} con.`);

  render();

function prepareTranKy(tier){
  const lvl = state.professions.tranPhap||0;

  render();
}

===================================================================== */
function addLog(msg){
  state.log.unshift(msg);
  if(state.log.length>90) state.log.pop();
}

function computeStats(){
  const r = realmStatsAt(state.realmIdx, state.subStage||0);
  let atk=r.atk, def=r.def, spd=r.spd, hpMax=r.hp, crit=5;
  state.techniques.forEach(t=>{
    atk += t.bonus.atk||0; def += t.bonus.def||0; spd += t.bonus.spd||0;
    hpMax += t.bonus.hp||0; crit += t.bonus.crit||0;
  });
  if(state.path){
    const p = state.path;
    atk = Math.round(atk*p.atkMult);
    def = Math.round(def*p.defMult);
    spd = Math.round(spd*p.spdMult);
    hpMax = Math.round(hpMax*p.hpMult);
    crit += p.critBonus||0;
  }
  if(state.physique){
    const pm = physiqueMods();
    atk = Math.round(atk*pm.atkMult);
    def = Math.round(def*pm.defMult);
    spd = Math.round(spd*pm.spdMult);
    hpMax = Math.round(hpMax*pm.hpMult);
    crit += pm.critBonus;
  }
  if(state.treasure){
    const tMult = state.path && state.path.treasureMult ? state.path.treasureMult : 1;
    const khiSuMult = 1+(state.professions ? (state.professions.khiSu||0)*0.08 : 0);
    atk += Math.round((state.treasure.bonus.atk||0)*tMult*khiSuMult);
    def += state.treasure.bonus.def||0;
    crit += Math.round((state.treasure.bonus.crit||0)*khiSuMult);
  }
  if(state.worm.have){
    const pt = PET_TYPES.find(p=>p.id===state.worm.typeId) || PET_TYPES[0];
    atk += state.worm.level*pt.atkPerLvl;
    def += state.worm.level*pt.defPerLvl;
    hpMax += state.worm.level*pt.hpPerLvl;
    crit += state.worm.level*pt.critPerLvl;
  }
  if(state.professions){
    def += (state.professions.tranPhap||0)*4;
  }
  if(state.puppets>0){
    const honBonus = (state.path && state.path.id==='hon') ? 2 : 1;
    let pAtk=0, pDef=0;
    DOTRI_TIERS.forEach(dt=>{
      const n = state.puppetsByTier ? (state.puppetsByTier[dt.tier]||0) : 0;
      pAtk += n*dt.atkPerUnit;
      pDef += n*dt.defPerUnit;
    });
    atk += Math.round(pAtk*honBonus);
    def += Math.round(pDef*honBonus);
  }
  if(state.root){
    crit += rootMods(state.root, state.realmIdx).critBonus;
  }
  if(state.statPillBonus){
    atk += state.statPillBonus.atk||0;
    def += state.statPillBonus.def||0;
    spd += state.statPillBonus.spd||0;
    crit += state.statPillBonus.crit||0;
  }
  state.stats = {atk,def,spd,hpMax,crit: Math.max(1,crit)};
  if(state.hp>hpMax) state.hp = hpMax;
}

function tuViRateBonus(){
  return state.techniques.reduce((s,t)=>s+(t.bonus.tuViRate||0),0);
}

function checkBreakthroughAvailable(){
  state.canBreak = state.tuVi >= realmStatsAt(state.realmIdx, state.subStage||0).tuViMax;
}

function calcDamage(atk, def, critChance){
  let base = Math.max(1, Math.round(atk - def*0.5));
  const isCrit = Math.random()*100 < critChance;
  if(isCrit) base = Math.round(base*1.8);
  return {dmg:base, crit:isCrit};
}

function clampHerbTierAvailable(){
  return Math.min(state.bottleLevel, MAJOR_REALMS.length);
}

/* =====================================================================
   HÀNH ĐỘNG: TU LUYỆN
===================================================================== */
function meditate(densityMult, zoneName){
  densityMult = densityMult || 1;
  const base = Math.round(6 + state.realmIdx*4);
  const mods = rootMods(state.root, state.realmIdx);
  const pathTuViMult = (state.path && state.path.meditateMult) ? state.path.meditateMult : 1;
  const pm = physiqueMods();
  const physiqueEarlyMult = (state.realmIdx<=pm.earlyRealmCap) ? pm.earlyTuViMult : 1;
  let gain = Math.round(base*(1+tuViRateBonus())*mods.tuViMult*(1+state.caiMenhBonus)*pathTuViMult*physiqueEarlyMult*densityMult);
  gain = Math.max(1, gain);
  const linhLuc = 3+state.realmIdx;
  const mishapChance = 0.08*((state.path && state.path.meditateMishapMult) ? state.path.meditateMishapMult : 1)*pm.meditateMishapMult;
  if(Math.random()<mishapChance){
    const dmg = Math.round(state.stats.hpMax*0.08);
    state.hp = Math.max(1, state.hp-dmg);
    gain *= 2;
    addLog(`Tâm cảnh dao động, suýt tẩu hỏa nhập ma! Nhờ hiểm cảnh mà tu vi tăng vọt +${gain}, nhưng mất ${dmg} khí huyết.`);
  } else if(zoneName){
    addLog(`Ngươi tĩnh tọa ngay tại long mạch của ${zoneName}, linh khí thiên địa dày đặc cuồn cuộn đổ về qua từng khiếu huyệt, tu vi +${gain}.`);
  } else {
    addLog(`Ngươi vận công tu luyện suốt một canh giờ, tu vi +${gain}.`);
  }
  state.tuVi += gain;
  state.linhLuc += linhLuc;
  checkPhysiqueDiscovery();
  checkBreakthroughAvailable();
  render();
}

function meditateAtZone(zoneIdx){
  if(zoneIdx>state.realmIdx) return;
  const zone = ZONES[zoneIdx];
  meditate(zone.linhMachDensity, zone.name);
}

function channelSpiritStones(){
  const cost = 30+state.realmIdx*20;
  if(state.spiritStones<cost){ addLog(`Cần ít nhất ${cost} linh thạch mới đủ để vận công hút linh khí từ đá quý.`); render(); return; }
  state.spiritStones -= cost;
  const mods = rootMods(state.root, state.realmIdx);
  const gain = Math.max(1, Math.round(cost*0.7*mods.tuViMult*(1+state.caiMenhBonus)));
  state.tuVi += gain;
  addLog(`Ngươi cầm chặt ${cost} viên linh thạch trong tay, vận công hút thẳng linh khí bị nén chặt bên trong vào cơ thể, tu vi +${gain}.`);
  checkBreakthroughAvailable();
  render();
}

function growHerb(tier){
  if(tier>state.bottleLevel){ addLog("Lục Bình chưa đủ cấp để ươm dưỡng loại dược liệu này."); render(); return; }
  const cost = tier*6;
  if(state.linhLuc<cost){ addLog("Linh lực không đủ để thúc đẩy Lục Bình vận chuyển."); render(); return; }
  state.linhLuc -= cost;
  state.herbs[tier] = (state.herbs[tier]||0)+1;
  addLog(`Lục Bình tỏa ánh sáng nhu hòa, một cây ${HERB_NAMES[tier-1]} vụt lớn chỉ trong nháy mắt!`);
  render();
}

function refinePill(tier){
  if((state.professions.danSu||0)<1){ addLog("Cần học nghề Luyện Đan Sư trước mới có thể luyện đan."); render(); return; }
  const have = state.herbs[tier]||0;
  if(have<3){ addLog(`Cần ít nhất 3 ${HERB_NAMES[tier-1]} mới đủ luyện thành đan dược.`); render(); return; }
  const hasRecipe = state.danPhuongTiers.includes(tier);
  state.herbs[tier] -= 3;
  if(!hasRecipe){
    const fluke = Math.random()<0.15;
    if(!fluke){
      const dmg = Math.round(state.stats.hpMax*0.12);
      state.hp = Math.max(1, state.hp-dmg);
      addLog(`Thiếu Đan Phương cho ${PILL_NAMES[tier-1]}, ngươi liều lĩnh mò mẫm tỷ lệ và hỏa hầu — "ầm" một tiếng, lò đan bạo phát! Dược liệu cháy sạch, ngươi chịu ${dmg} sát thương.`);
    } else {
      state.pills[tier] = (state.pills[tier]||0)+1;
      addLog(`Thiếu Đan Phương nhưng may mắn mò đúng tỷ lệ phối hợp, luyện liều được 1 viên ${PILL_NAMES[tier-1]} — phẩm chất không ổn định nhưng dùng tạm được.`);
    }
    render();
    return;
  }
  const danSu = state.professions ? (state.professions.danSu||0) : 0;
  let n = 1;
  if(Math.random()<0.3+danSu*0.1) n++;
  if(danSu>=4 && Math.random()<0.25) n++;
  state.pills[tier] = (state.pills[tier]||0)+n;
  addLog(`Hỏa hầu vừa đủ — luyện thành công ${n} viên ${PILL_NAMES[tier-1]}!${danSu>=5?' Lấy số lượng đè chất lượng, xứng danh Luyện Đan Tông Sư!':''}`);
  render();
}

function grantStatPill(sp){
  state.statPillBonus[sp.stat] = (state.statPillBonus[sp.stat]||0)+sp.amount;
  addLog(`Kỳ ngộ hiếm có! Ngươi tìm được một viên 【${sp.name}】 — thứ đan dược mà không tu sĩ luyện đan nào trên đời chế ra được. ${sp.desc} (+${sp.amount}${sp.stat==='crit'?'%':''} vĩnh viễn).`);
  computeStats();
}

function craftBreakthroughPill(){
  if((state.professions.danSu||0)<3){ addLog("Cần Luyện Đan Sư đạt cấp 3 trở lên mới đủ hỏa hầu luyện Phá Cảnh Đan."); render(); return; }
  const cost = breakthroughPillCost();
  const herbHave = state.herbs[cost.herbTier]||0;
  if(state.spiritStones<cost.stones || herbHave<cost.herbCount){
    addLog(`Cần ${cost.stones} linh thạch và ${cost.herbCount} ${HERB_NAMES[cost.herbTier-1]} để luyện 【${BREAKTHROUGH_PILL_NAME}】.`);
    render(); return;
  }
  state.spiritStones -= cost.stones;
  state.herbs[cost.herbTier] -= cost.herbCount;
  state.breakthroughBoost = Math.min(30, state.breakthroughBoost+15);
  addLog(`Ngươi luyện thành và nuốt ngay một viên 【${BREAKTHROUGH_PILL_NAME}】 — chân khí ổn định hẳn, tỷ lệ đột phá lần tới tăng thêm (hiện +${state.breakthroughBoost}%).`);
  render();
}

function danSuPillMult(){
  const danSuMult = 1+(state.professions ? (state.professions.danSu||0)*0.05 : 0);
  const physiqueMult = physiqueMods().pillMult;
  return danSuMult*physiqueMult;
}

function usePill(tier){
  const have = state.pills[tier]||0;
  if(have<1) return;
  state.pills[tier]--;
  const mods = rootMods(state.root, state.realmIdx);
  const gain = Math.max(1, Math.round(tier*35*mods.pillMult*danSuPillMult()));
  state.tuVi += gain;
  state.buffStack = Math.min(3, state.buffStack+1);
  addLog(`Nuốt một viên ${PILL_NAMES[tier-1]} như ăn kẹo, tu vi +${gain}, cơ thể ổn định hơn cho lần đột phá sắp tới.`);
  checkBreakthroughAvailable();
  render();
}

function bestPillTier(){
  for(let t=6;t>=1;t--){ if((state.pills[t]||0)>0) return t; }
  return 0;
}

function sellHerbs(tier){
  const have = state.herbs[tier]||0;
  if(have<1) return;
  const price = tier*4;
  const total = have*price;
  state.herbs[tier] = 0;
  state.spiritStones += total;
  addLog(`Ngươi bán bớt ${have} phần ${HERB_NAMES[tier-1]} dư thừa, thu về ${total} linh thạch.`);
  render();
}

function sellPills(tier){
  const have = state.pills[tier]||0;
  if(have<1) return;
  const price = tier*15;
  const total = have*price;
  state.pills[tier] = 0;
  state.spiritStones += total;
  addLog(`Ngươi bán bớt ${have} viên ${PILL_NAMES[tier-1]} dư thừa, thu về ${total} linh thạch.`);
  render();
}

/* =====================================================================
   ĐỘT PHÁ CẢNH GIỚI
===================================================================== */
function attemptBreakthrough(){
  if(!state.canBreak || state.ascended) return;
  const realm = MAJOR_REALMS[state.realmIdx];
  const atLastSubstage = (state.subStage||0) >= realm.substageCount-1;
  if(atLastSubstage && TRIBULATION_REALMS.includes(state.realmIdx)){ startTribulation(); return; }
  const mods = rootMods(state.root, state.realmIdx);
  const easeFactor = state.realmIdx<=2 ? 1 : 0.5; // tư chất tốt giúp ích rõ nhất ở các bình cảnh đầu
  const danSuBonus = (state.professions ? (state.professions.danSu||0) : 0)*3;
  const chance = Math.min(95, Math.max(5, 55+state.buffStack*10+mods.breakEase*easeFactor+danSuBonus+state.breakthroughBoost));
  state.buffStack = 0;
  state.breakthroughBoost = 0;
  const success = Math.random()*100 < chance;
  if(success){
    const curStats = realmStatsAt(state.realmIdx, state.subStage||0);
    const overflow = state.tuVi-curStats.tuViMax;
    if(atLastSubstage){
      state.realmIdx++;
      state.subStage = 0;
    } else {
      state.subStage = (state.subStage||0)+1;
    }
    const newStats = realmStatsAt(state.realmIdx, state.subStage);
    state.tuVi = Math.max(0, Math.min(overflow, Math.round(newStats.tuViMax*0.3)));
    state.age += 8 + state.realmIdx*4;
    computeStats();
    state.hp = state.stats.hpMax;
    const newName = fullRealmName(state.realmIdx, state.subStage);
    addLog(`💥 Đột phá thành công! Ngươi chính thức bước vào ${newName}.${atLastSubstage?' '+MAJOR_REALMS[state.realmIdx].note:''}`);
    if(!state.physiqueKnown && state.physique && state.physique.idealPath){
      state.physiqueKnown = true;
      addLog(`Bước vào ${newName}, thể chất tiềm ẩn trong người rốt cuộc cũng bộc phát rõ ràng — ngươi mang 【${state.physique.name}】!`);
    }
    checkBreakthroughAvailable();
    render();
    showModal('breakthrough');
  } else {
    const loss = Math.round(state.tuVi*0.35);
    state.tuVi -= loss;
    const dmg = Math.round(state.stats.hpMax*0.2);
    state.hp = Math.max(1, state.hp-dmg);
    addLog(`Đột phá thất bại, chân khí phản phệ! Mất ${loss} tu vi và ${dmg} khí huyết. Hãy chuẩn bị đan dược kỹ càng hơn cho lần sau.`);
    checkBreakthroughAvailable();
    render();
  }
}

/* =====================================================================
   THÁM HIỂM
===================================================================== */
function genEnemy(zoneIdx){
  const pool = ENEMY_NAMES[zoneIdx];
  let name = pool[Math.floor(Math.random()*pool.length)];
  const isBoss = Math.random()<0.12;
  if(isBoss) name += " · Thủ Lĩnh";
  const mult = isBoss?2.2:1;
  const baseR = realmStatsAt(Math.min(zoneIdx, MAJOR_REALMS.length-1), 1);
  const jitter = 0.8+Math.random()*0.4;
  return {
    name,
    hpMax: Math.round(baseR.hp*(0.55+zoneIdx*0.05)*mult*jitter),
    atk:   Math.round(baseR.atk*0.6*mult*jitter),
    def:   Math.round(baseR.def*0.55*mult),
    spd:   Math.round(baseR.spd*0.7*mult),
    isBoss
  };
}

function encounterRival(zoneIdx){
  const baseR = realmStatsAt(Math.min(zoneIdx, MAJOR_REALMS.length-1), 1);
  const pm = state.rival.powerMult;
  const enemy = {
    name: `${state.rival.name} · Kình Địch`,
    hpMax: Math.round(baseR.hp*0.9*pm),
    atk:   Math.round(baseR.atk*0.75*pm),
    def:   Math.round(baseR.def*0.65*pm),
    spd:   Math.round(baseR.spd*0.8*pm),
    isBoss: true,
    isRival: true
  };
  addLog(`Không ngờ lại chạm mặt kình địch ${state.rival.name} ngay tại đây! Hai bên ánh mắt giao nhau, sát khí bừng lên tức khắc.`);
  startCombat(enemy);
}

function explore(zoneIdx){
  state.currentZone = zoneIdx;
  const roll = Math.random()*100;
  if(roll<55){
    const enemy = genEnemy(zoneIdx);
    startCombat(enemy);
  } else if(roll<75){
    const stones = Math.round(15+zoneIdx*10+Math.random()*20);
    const tuvi = Math.round(5+zoneIdx*5);
    state.spiritStones += stones;
    state.tuVi += tuvi;
    addLog(`Ngươi phát hiện một mạch linh thạch nhỏ ẩn trong khe đá, thu được ${stones} linh thạch và ${tuvi} tu vi.`);
  } else if(roll<85){
    const tranPhap = state.professions ? (state.professions.tranPhap||0) : 0;
    const isRift = zoneIdx===3;
    const dmgMult = isRift ? 1.8 : 1;
    const dmg = Math.max(1, Math.round(state.stats.hpMax*(0.08+zoneIdx*0.01)*dmgMult*(1-tranPhap*0.08)*physiqueMods().trapDmgMult));
    state.hp = Math.max(1, state.hp-dmg);
    const trapMsg = isRift
      ? 'Vô tình sượt qua một vết Không Gian Liệt Phùng vô hình, suýt chút nữa đứt lìa thân xác'
      : 'Vô tình chạm phải cấm chế tàn lưu từ thượng cổ';
    addLog(`${trapMsg}, chịu ${dmg} sát thương.${tranPhap>0?' Trận pháp hộ thân đã hóa giải bớt một phần.':''}`);
  } else {
    rareEvent(zoneIdx);
  }
  checkPhysiqueDiscovery();
  checkBreakthroughAvailable();
  render();
}

function getMissingRecipeOptions(){
  const opts = [];
  const nextDanTier = state.danPhuongTiers.length ? Math.max(...state.danPhuongTiers)+1 : 1;
  if((state.professions.danSu||0)>=1 && nextDanTier<=6 && !state.danPhuongTiers.includes(nextDanTier)) opts.push({type:'danPhuong', tier:nextDanTier});
  if((state.professions.khiSu||0)>=1 && !state.hasKhiPhuong) opts.push({type:'khiPhuong'});
  if((state.professions.khoiLoi||0)>=1 && !state.hasKhoiLoiVe) opts.push({type:'khoiLoiVe'});
  if((state.professions.tranPhap||0)>=1 && !state.hasTranDo) opts.push({type:'tranDo'});
  return opts;
}

function rareEvent(zoneIdx){
  const options = [];
  if(state.bottleLevel<6) options.push('shard');
  if(!state.worm.have && zoneIdx>=2) options.push('egg');
  const learnable = TECHNIQUES.filter(t=>!state.learnedNames.includes(t.name));
  if(learnable.length) options.push('technique');
  const accessibleManuals = ADVANCED_TECHNIQUES.filter(isAdvancedTechAccessible);
  if(accessibleManuals.length && zoneIdx>=1) options.push('manual');
  const missingRecipes = getMissingRecipeOptions();
  if(missingRecipes.length) options.push('recipe');
  if([0,2,3,4].includes(zoneIdx)) options.push('harvest');
  if(zoneIdx>=2 && state.caiMenhBonus<0.3) options.push('caimenh');
  if(zoneIdx===4 && state.phapTacInsight<4) options.push('phaptac');
  if(zoneIdx>=2) options.push('statpill');
  if(zoneIdx>=1) options.push('rival');
  options.push('treasure');
  options.push('rest');
  const pick = options[Math.floor(Math.random()*options.length)];

  if(pick==='shard'){
    state.bottleShards++;
    const need = state.bottleLevel*2;
    addLog(`Ngươi hấp thu được một tia Tinh Hoa Nhật Nguyệt, Lục Bình khẽ rung động (${state.bottleShards}/${need}).`);
    if(state.bottleShards>=need){
      state.bottleShards = 0;
      state.bottleLevel++;
      addLog(`Lục Bình đột phá lên cấp ${state.bottleLevel}, giờ có thể ươm dưỡng dược liệu phẩm cấp cao hơn!`);
    }
  } else if(pick==='recipe'){
    const r = missingRecipes[Math.floor(Math.random()*missingRecipes.length)];
    if(r.type==='danPhuong'){
      state.danPhuongTiers.push(r.tier);
      addLog(`Ngươi tìm được một quyển Đan Phương ghi rõ danh mục linh thảo, tỷ lệ phối hợp và hỏa hầu cho ${PILL_NAMES[r.tier-1]} — từ nay luyện đan cấp này không còn lo bạo đỉnh!`);
    } else if(r.type==='khiPhuong'){
      state.hasKhiPhuong = true;
      addLog(`Ngươi tìm được một bộ Khí Phương ghi rõ tỷ lệ dung hợp khoáng thạch và quy trình khắc cấm chế — từ nay rèn chế pháp bảo không còn phải mò mẫm.`);
    } else if(r.type==='khoiLoiVe'){
      state.hasKhoiLoiVe = true;
      addLog(`Ngươi tìm được một bản Đồ Trí khôi lỗi hoàn chỉnh, ghi rõ cấu trúc xương khớp và đường dẫn phù văn — từ nay chế tạo khôi lỗi không còn sợ thành phế thải.`);
    } else if(r.type==='tranDo'){
      state.hasTranDo = true;
      addLog(`Ngươi tìm được một bức Trận Đồ cổ xưa, ghi rõ tọa độ Trận Kỳ và vị trí Trận Nhãn — từ nay bố trận không còn lo linh khí hỗn loạn phản phệ.`);
    }
  } else if(pick==='egg'){
    const pt = PET_TYPES[Math.floor(Math.random()*PET_TYPES.length)];
    state.worm.have = true;
    state.worm.level = 1;
    state.worm.typeId = pt.id;
    addLog(`Trong hốc đá sâu, ngươi tàn nhẫn khuất phục một con ${pt.name} còn non nớt! ${pt.desc} Từ nay nó sẽ là lá bài tẩy giấu kín của ngươi.`);
  } else if(pick==='harvest'){
    const tierCap = Math.max(1, Math.min(clampHerbTierAvailable(), zoneIdx+2));
    const n = 3+Math.floor(Math.random()*3);
    const gained = [];
    for(let i=0;i<n;i++){
      const t = 1+Math.floor(Math.random()*tierCap);
      state.herbs[t] = (state.herbs[t]||0)+1;
      gained.push(HERB_NAMES[t-1]);
    }
    const stones = Math.round(30+zoneIdx*20);
    state.spiritStones += stones;
    addLog(`Ngươi lạc vào một góc bí cảnh chưa ai từng đặt chân tới, đại thu hoạch ${n} phần dược liệu quý (${gained.join(', ')}) cùng ${stones} linh thạch!`);
  } else if(pick==='caimenh'){
    state.caiMenhBonus = Math.min(0.3, state.caiMenhBonus+0.08);
    addLog(`Ngươi may mắn đoạt được một viên Cải Mệnh Đan cực phẩm! Nuốt vào bụng, linh căn như được tẩy rửa lại từ đầu, tốc độ tu luyện vĩnh viễn tăng thêm (tổng cộng +${Math.round(state.caiMenhBonus*100)}%).`);
  } else if(pick==='statpill'){
    if(Math.random()<0.25){
      const sp = STAT_PILLS[Math.floor(Math.random()*STAT_PILLS.length)];
      grantStatPill(sp);
    } else {
      const stones = Math.round(20+zoneIdx*15);
      state.spiritStones += stones;
      addLog(`Ngươi thoáng cảm nhận được một luồng dị bảo khí tức gần đó, nhưng tìm mãi không thấy, đành nhặt được ${stones} linh thạch rơi vãi mà tiếc nuối rời đi.`);
    }
  } else if(pick==='rival'){
    encounterRival(zoneIdx);
  } else if(pick==='phaptac'){
    state.phapTacInsight++;
    addLog(`Giữa bí cảnh, ngươi bất chợt lĩnh ngộ được một tia thiên địa pháp tắc sơ kỳ, tâm cảnh thăng hoa — uy lực thiên kiếp sau này sẽ giảm bớt phần nào.`);
  } else if(pick==='manual'){
    const t = accessibleManuals[Math.floor(Math.random()*accessibleManuals.length)];
    const source = MANUAL_SOURCES[Math.floor(Math.random()*MANUAL_SOURCES.length)];
    state.manuals.push(t.id);
    addLog(`${source} — 【${t.name}】! Thiên đạo tựa hồ không phụ người có duyên, tư chất của ngươi lại vừa vặn tương hợp với bí kíp này. Cần đủ tài nguyên và cảnh giới mới luyện thành được.`);
  } else if(pick==='technique'){
    const base = learnable[Math.floor(Math.random()*learnable.length)];
    const scale = 1+zoneIdx*0.4;
    const t = {name:base.name, desc:base.desc, bonus:{}};
    Object.keys(base.bonus).forEach(k=>{
      t.bonus[k] = k==='tuViRate' ? base.bonus[k] : Math.round(base.bonus[k]*scale);
    });
    state.techniques.push(t);
    state.learnedNames.push(base.name);
    addLog(`Ngươi lãnh ngộ được thất truyền công pháp【${t.name}】— ${t.desc}`);
  } else if(pick==='treasure'){
    const base = TREASURES[Math.floor(Math.random()*TREASURES.length)];
    const scale = 1+zoneIdx*0.35;
    const t = {name:base.name, tier:zoneIdx, bonus:{
      atk: Math.round((base.bonus.atk||0)*scale),
      def: Math.round((base.bonus.def||0)*scale),
      crit: Math.round((base.bonus.crit||0)*scale)
    }};
    const better = !state.treasure || (t.bonus.atk||0) >= (state.treasure.bonus.atk||0);
    if(better){
      state.treasure = t;
      addLog(`Ngươi tự tay luyện chế thành công pháp bảo【${t.name}】, uy năng bạo kích kinh người — trang bị ngay lập tức!`);
    } else {
      const stones = Math.round(20+zoneIdx*15);
      state.spiritStones += stones;
      addLog(`Tìm được vật liệu quý nhưng không hơn pháp bảo hiện có, đành bán lấy ${stones} linh thạch.`);
    }
  } else {
    const heal = Math.round(state.stats.hpMax*0.5);
    state.hp = Math.min(state.stats.hpMax, state.hp+heal);
    const tv = Math.round(8+zoneIdx*4);
    state.tuVi += tv;
    addLog(`Ngươi tìm được một hang động bình yên để trấn tĩnh tâm thần, hồi phục thương thế và thu hoạch ${tv} tu vi.`);
  }
  computeStats();
}

/* =====================================================================
   CHIẾN ĐẤU
===================================================================== */
function startCombat(enemy){
  state.combat = {
    enemy: {...enemy, hp: enemy.hpMax},
    log: [`Bất ngờ chạm trán ${enemy.name}!`],
    cdTreasure: 0,
    cdWorm: 0,
    cdKhoiLoi: 0,
    formationActive: false
  };
  render();
}

function combatLog(msg){
  state.combat.log.unshift(msg);
  if(state.combat.log.length>40) state.combat.log.pop();
}

function pathAdjustedDamage(baseAtk, enemyDef, baseCrit, enemy, isBasic){
  const path = state.path;
  let def = enemyDef, crit = baseCrit;
  if(path){
    if(path.ignoreDefPct) def = enemyDef*(1-path.ignoreDefPct);
    if(path.critFloor) crit = Math.max(crit, path.critFloor);
  }
  const r = calcDamage(baseAtk, def, crit);
  let dmg = r.dmg;
  if(path){
    if(isBasic && path.physFlatPct) dmg += Math.round(state.stats.hpMax*path.physFlatPct);
    if(path.vsEvilBonusPct && isEvilEnemy(enemy)) dmg = Math.round(dmg*(1+path.vsEvilBonusPct));
  }
  return {dmg, crit:r.crit};
}

function applyLifesteal(dmg){
  const pathPct = (state.path && state.path.lifestealPct) ? state.path.lifestealPct : 0;
  const physiquePct = physiqueMods().lifestealPct;
  const totalPct = pathPct+physiquePct;
  if(totalPct>0){
    const heal = Math.round(dmg*totalPct);
    if(heal>0) state.hp = Math.min(state.stats.hpMax, state.hp+heal);
    return heal;
  }
  return 0;
}

function playerAttack(type){
  const c = state.combat;
  if(!c) return;
  if(type==='flee'){ tryFlee(); return; }
  if(type==='pill'){ usePillInCombat(); return; }

  let dmg=0, msg='';
  if(type==='atk'){
    const r = pathAdjustedDamage(state.stats.atk, c.enemy.def, state.stats.crit, c.enemy, true);
    dmg=r.dmg;
    const label = (state.path && state.path.atkLabel) ? state.path.atkLabel : 'công kích';
    msg = r.crit ? `Bạo kích! Ngươi thi triển ${label}, gây ${dmg} sát thương.` : `Ngươi thi triển ${label}, gây ${dmg} sát thương.`;
    const heal = applyLifesteal(dmg);
    if(heal>0) msg += ` Sinh cơ đối phương bị hấp thu, hồi ${heal} khí huyết.`;
  } else if(type==='treasure'){
    if(!state.treasure){ combatLog("Chưa có pháp bảo nào để thi triển."); render(); return; }
    if(c.cdTreasure>0){ combatLog("Pháp bảo chưa hồi đủ linh lực."); render(); return; }
    const r = pathAdjustedDamage(state.stats.atk*1.6, c.enemy.def, state.stats.crit+15, c.enemy, false);
    dmg=r.dmg;
    msg = `${state.treasure.name} bộc phát uy năng bạo kích, gây ${dmg} sát thương!`;
    const heal = applyLifesteal(dmg);
    if(heal>0) msg += ` Hồi ${heal} khí huyết.`;
    c.cdTreasure = 2;
  } else if(type==='worm'){
    if(!state.worm.have){ combatLog("Chưa thu phục được linh sủng nào."); render(); return; }
    if(c.cdWorm>0){ combatLog("Linh sủng còn đang hồi sức, chưa thể xuất thủ."); render(); return; }
    const pt = PET_TYPES.find(p=>p.id===state.worm.typeId) || PET_TYPES[0];
    dmg = Math.round(state.stats.atk*0.5 + state.worm.level*10);
    if(state.path && state.path.vsEvilBonusPct && isEvilEnemy(c.enemy)) dmg = Math.round(dmg*(1+state.path.vsEvilBonusPct));
    const wormHeal = Math.round(dmg*0.3);
    state.hp = Math.min(state.stats.hpMax, state.hp+wormHeal);
    const lifestealHeal = applyLifesteal(dmg);
    const heal = wormHeal + lifestealHeal;
    msg = `${pt.name} thi triển ${pt.skillName}, gây ${dmg} sát thương và giúp ngươi hồi ${heal} khí huyết.`;
    c.cdWorm = 3;
  } else if(type==='phu'){
    const bestTier = bestTalismanTier();
    if(bestTier===0){ combatLog("Trong người không còn linh phù nào."); render(); return; }
    state.talismans[bestTier]--;
    const tt = TALISMAN_TIERS.find(x=>x.tier===bestTier);
    const phuLvl = state.professions ? (state.professions.phuLuc||0) : 0;
    const r = pathAdjustedDamage(state.stats.atk*tt.dmgMult+phuLvl*tt.dmgFlat, c.enemy.def*0.7, state.stats.crit, c.enemy, false);
    dmg=r.dmg;
    msg = `Ngươi giật đứt một đạo 【${tt.name}】, linh phù bùng cháy dữ dội, gây ${dmg} sát thương!`;
  } else if(type==='khoiLoi'){
    if((state.puppets||0)<1){ combatLog("Chưa chế tạo khôi lỗi nào."); render(); return; }
    if(c.cdKhoiLoi>0){ combatLog("Đội khôi lỗi còn đang chỉnh đốn đội hình."); render(); return; }
    const honBonus = (state.path && state.path.id==='hon') ? 2 : 1;
    dmg = Math.round((10+state.professions.khoiLoi*8)*state.puppets*honBonus*0.4);
    msg = `Ngươi điều khiển toàn bộ ${state.puppets} khôi lỗi xông lên hội đồng, gây ${dmg} sát thương!`;
    c.cdKhoiLoi = 3;
  } else if(type==='tran'){
    if((state.professions.tranPhap||0)<2){ combatLog("Chưa đủ tinh thông trận pháp để bố trận."); render(); return; }
    if(c.formationActive){ combatLog("Trận pháp đã được bố trí rồi."); render(); return; }
    if(!state.hasTranDo){
      const backfire = Math.random()<0.7;
      if(backfire){
        const dmg2 = Math.round(state.stats.hpMax*0.18);
        state.hp = Math.max(1, state.hp-dmg2);
        combatLog(`Thiếu Trận Đồ, ngươi không rõ tọa độ cắm Trận Kỳ lẫn vị trí Trận Nhãn — linh khí hỗn loạn bạo phát ngược lại chính ngươi, chịu ${dmg2} sát thương!`);
        enemyTurn();
        return;
      } else {
        combatLog(`Thiếu Trận Đồ nhưng ngươi liều lĩnh mò đúng vài phần bố cục, miễn cưỡng dựng được trận pháp phòng ngự.`);
      }
    } else {
      combatLog(`Ngươi nhanh tay bày ra bộ Trận Kỳ mang sẵn theo người, trận pháp phòng ngự bao trùm quanh thân!`);
    }
    c.formationActive = true;
    enemyTurn();
    return;
  }
  c.enemy.hp -= dmg;
  combatLog(msg);
  if(c.enemy.hp<=0){ winCombat(); return; }
  enemyTurn();
}

function enemyTurn(){
  const c = state.combat;
  const r = calcDamage(c.enemy.atk, state.stats.def, 5);
  let dmg = r.dmg;
  if(c.formationActive){
    const tranPhap = state.professions ? (state.professions.tranPhap||0) : 0;
    const tranKyBonus = state.tranKyTier>0 ? TRANKY_TIERS.find(x=>x.tier===state.tranKyTier).mitigationBonus : 0;
    dmg = Math.max(1, Math.round(dmg*(1-Math.min(0.65, tranPhap*0.08+tranKyBonus))));
  }
  state.hp -= dmg;
  combatLog(`${c.enemy.name} phản kích${r.crit?' chí mạng':''}, ngươi chịu ${dmg} sát thương.${c.formationActive?' (đã được trận pháp hóa giải bớt)':''}`);
  if(c.cdTreasure>0) c.cdTreasure--;
  if(c.cdWorm>0) c.cdWorm--;
  if(c.cdKhoiLoi>0) c.cdKhoiLoi--;
  if(state.hp<=0){ loseCombat(); return; }
  render();
}

function usePillInCombat(){
  const c = state.combat;
  const tier = bestPillTier();
  if(tier===0){ combatLog("Trong người không còn đan dược nào."); render(); return; }
  state.pills[tier]--;
  const heal = Math.round(state.stats.hpMax*0.25*danSuPillMult());
  state.hp = Math.min(state.stats.hpMax, state.hp+heal);
  combatLog(`Nuốt vội một viên ${PILL_NAMES[tier-1]}, hồi phục ${heal} khí huyết.`);
  enemyTurn();
}

function tryFlee(){
  const c = state.combat;
  const chance = 40+state.stats.spd-c.enemy.spd;
  if(Math.random()*100<chance){
    addLog(`Ngươi thi triển thân pháp thoát khỏi ${c.enemy.name}, tránh một trận huyết chiến không cần thiết.`);
    state.combat = null;
    render();
  } else {
    combatLog("Chạy trốn bất thành!");
    enemyTurn();
  }
}

function winCombat(){
  const c = state.combat;
  const rewardTuVi = Math.round(10+state.realmIdx*8+Math.random()*15);
  const stoneReward = Math.round(5+state.realmIdx*4+Math.random()*10);
  state.tuVi += rewardTuVi;
  state.spiritStones += stoneReward;
  let herbMsg = '';
  if(Math.random()<0.4){
    const maxT = Math.min(clampHerbTierAvailable(), state.currentZone+2);
    const tier = 1+Math.floor(Math.random()*Math.max(1,maxT));
    state.herbs[tier] = (state.herbs[tier]||0)+1;
    herbMsg = `, thu được ${HERB_NAMES[tier-1]}`;
  }
  let recipeMsg = '';
  if(c.enemy.isBoss){
    const missing = getMissingRecipeOptions();
    if(missing.length && Math.random()<0.25){
      const r = missing[Math.floor(Math.random()*missing.length)];
      let label = '';
      if(r.type==='danPhuong'){ state.danPhuongTiers.push(r.tier); label = `Đan Phương ${PILL_NAMES[r.tier-1]}`; }
      else if(r.type==='khiPhuong'){ state.hasKhiPhuong = true; label = 'Khí Phương'; }
      else if(r.type==='khoiLoiVe'){ state.hasKhoiLoiVe = true; label = 'Bản Vẽ Khôi Lỗi'; }
      else if(r.type==='tranDo'){ state.hasTranDo = true; label = 'Trận Đồ'; }
      recipeMsg = `. Lục soát túi trữ vật của kẻ địch, ngươi đoạt được 【${label}】 — hóa ra hắn cũng đang tranh đoạt thứ này!`;
    }
  }
  let rivalMsg = '';
  if(c.enemy.isRival){
    state.rival.wins++;
    state.rival.powerMult = Math.round((state.rival.powerMult+0.15)*100)/100;
    const bonusStones = Math.round(30+state.realmIdx*15);
    state.spiritStones += bonusStones;
    rivalMsg = ` ${state.rival.name} ôm hận bỏ đi tìm nơi bế quan khổ luyện, thề sẽ quay lại báo thù — thu thêm ${bonusStones} linh thạch từ túi trữ vật của hắn.`;
  }
  addLog(`Đánh bại ${c.enemy.name}! Nhận ${rewardTuVi} tu vi, ${stoneReward} linh thạch${herbMsg}${recipeMsg}.${rivalMsg}`);
  state.combat = null;
  checkBreakthroughAvailable();
  render();
}

function buyRecipeAtAuction(type, tier){
  let cost, label, already;
  if(type==='danPhuong'){
    cost = 150*tier; label = `Đan Phương ${PILL_NAMES[tier-1]}`;
    already = state.danPhuongTiers.includes(tier);
  } else if(type==='khiPhuong'){
    cost = 600; label = 'Khí Phương'; already = state.hasKhiPhuong;
  } else if(type==='khoiLoiVe'){
    cost = 600; label = 'Bản Vẽ Khôi Lỗi'; already = state.hasKhoiLoiVe;
  } else if(type==='tranDo'){
    cost = 500; label = 'Trận Đồ'; already = state.hasTranDo;
  } else return;
  if(already) return;
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch mới đủ sức tranh đấu giá 【${label}】 — sàn đấu giá ngầm luôn có vô số tu sĩ giàu có cạnh tranh, giá cắt cổ.`); render(); return; }
  state.spiritStones -= cost;
  if(type==='danPhuong') state.danPhuongTiers.push(tier);
  else if(type==='khiPhuong') state.hasKhiPhuong = true;
  else if(type==='khoiLoiVe') state.hasKhoiLoiVe = true;
  else if(type==='tranDo') state.hasTranDo = true;
  addLog(`Ngươi dốc hết gia tài, thắng phiên đấu giá kịch liệt trước bao ánh mắt thèm khát, đoạt được 【${label}】 với giá ${cost} linh thạch!`);
  render();
}

function loseCombat(){
  const c = state.combat;
  let rivalMsg = '';
  if(c.enemy.isRival){
    state.rival.losses++;
    state.rival.powerMult = Math.round((state.rival.powerMult+0.1)*100)/100;
    rivalMsg = ` ${state.rival.name} cười nhạt bỏ đi, để lại một câu: "Tu vi ngươi còn kém xa, lần sau đừng chạm mặt ta nữa!"`;
  }
  addLog(`Trọng thương trước ${c.enemy.name}, đành nuốt hận lui về dưỡng thương.${rivalMsg}`);
  state.hp = Math.round(state.stats.hpMax*0.3);
  state.tuVi = Math.max(0, state.tuVi-Math.round(state.tuVi*0.1));
  state.combat = null;
  render();
}

/* =====================================================================
   YÊU TRÙNG — PHỆ LINH TRÙNG

/* Các loại linh trùng/linh sủng có thể thu phục được — mỗi loại một hệ
   chỉ số và một chiêu thức riêng khi xuất trận. */
const PET_TYPES = [
  {id:'phe_linh_trung', name:"Phệ Linh Trùng", skillName:"Phệ Linh Nhất Khẩu", atkPerLvl:4, defPerLvl:0, hpPerLvl:20, critPerLvl:0,
   desc:"Kỳ trùng chuyên nuốt linh khí địch, mỗi lần cắn còn hấp thu một phần sinh cơ hồi phục cho chủ nhân."},
  {id:'hoa_van_diep', name:"Hỏa Vân Điệp", skillName:"Liệt Diễm Phần Thân", atkPerLvl:3, defPerLvl:0, hpPerLvl:5, critPerLvl:2,
   desc:"Linh điệp mang theo chân hỏa, đôi cánh rực lửa mỗi khi xuất kích đều thiêu đốt kẻ địch."},
  {id:'huyen_quy_linh', name:"Huyền Quy Linh", skillName:"Quy Giáp Phòng Ngự", atkPerLvl:1, defPerLvl:5, hpPerLvl:25, critPerLvl:0,
   desc:"Linh quy mai cứng như thép nguội, luôn che chắn chủ nhân trước những đòn hiểm ác nhất."},
  {id:'thanh_van_bao', name:"Thanh Vân Báo", skillName:"Cuồng Phong Liên Kích", atkPerLvl:4, defPerLvl:0, hpPerLvl:8, critPerLvl:3,
   desc:"Linh báo thân pháp nhanh tựa gió cuốn, ra đòn liên hoàn không ngừng nghỉ."}
];

function feedWorm(){
  if(!state.worm.have) return;
  const pt = PET_TYPES.find(p=>p.id===state.worm.typeId) || PET_TYPES[0];
  if(state.worm.level>=10){ addLog(`${pt.name} đã đạt cực hạn tu vi hiện tại, cần cảnh giới cao hơn mới có thể tiến hóa thêm.`); render(); return; }
  const cost = state.worm.level*80;
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để luyện hóa huyết nhục nuôi dưỡng linh sủng.`); render(); return; }
  state.spiritStones -= cost;
  state.worm.level++;
  addLog(`Sau một phen luyện hóa huyết nhục yêu thú, ${pt.name} tiến hóa lên cấp ${state.worm.level}!`);
  computeStats();
  render();
}

/* =====================================================================
   ĐỘ KIẾP — CỬU CỬU LÔI KIẾP
===================================================================== */
function startTribulation(){
  state.tribulation = {wave:1, maxWave:9};
  render();
  showModal('tribulation-intro');
}

function faceTribulationWave(){
  const t = state.tribulation;
  if(!t) return;
  const dmgBase = Math.round(state.stats.hpMax*(0.08+t.wave*0.02));
  let mitigated = Math.max(1, Math.round(dmgBase-state.stats.def*0.3));
  const mods = rootMods(state.root, state.realmIdx);
  let extra = '';
  if(state.root.isDynamic && mods.lateActive){
    mitigated = Math.max(1, Math.round(mitigated*0.8));
    extra = ' Ngũ Hành Cụ Toàn cộng hưởng, dung hòa bớt một phần uy lực thiên kiếp.';
  }
  if(state.path && state.path.tribulationDmgMult){
    mitigated = Math.max(1, Math.round(mitigated*state.path.tribulationDmgMult));
    extra += ' Ma tính trong người khiến thiên kiếp giáng xuống mãnh liệt hơn hẳn.';
  }
  if(state.phapTacInsight>0){
    mitigated = Math.max(1, Math.round(mitigated*(1-Math.min(0.2,state.phapTacInsight*0.05))));
    extra += ' Những tia thiên địa pháp tắc từng lĩnh ngộ giúp ngươi dung hòa bớt uy lực thiên kiếp.';
  }
  state.hp -= mitigated;
  addLog(`Lôi kiếp đợt ${t.wave}/9 giáng xuống, ngươi vận chuyển toàn bộ linh lực chống đỡ, chịu ${mitigated} sát thương.${extra}`);
  if(state.hp<=0){
    state.hp = Math.round(state.stats.hpMax*0.25);
    addLog(`Thân thể không trụ nổi trước uy lực thiên kiếp, ngươi tạm lui về điều tức dưỡng thương, chờ thời cơ nghênh đón lại.`);
    state.tribulation = null;
    render();
    return;
  }
  if(t.wave>=t.maxWave){ finishAscension(); return; }
  t.wave++;
  render();
}

function tribulationHeal(){
  const tier = bestPillTier();
  if(tier===0){ addLog("Không còn đan dược nào để trợ lực giữa các đợt lôi kiếp."); render(); return; }
  state.pills[tier]--;
  const heal = Math.round(state.stats.hpMax*0.3*danSuPillMult());
  state.hp = Math.min(state.stats.hpMax, state.hp+heal);
  addLog(`Giữa hai đợt lôi kiếp, ngươi vội nuốt một viên ${PILL_NAMES[tier-1]}, hồi phục ${heal} khí huyết.`);
  render();
}

function finishAscension(){
  state.tribulation = null;
  const idx = TRIBULATION_REALMS.indexOf(state.realmIdx);
  if(idx < TRIBULATION_REALMS.length-1){
    state.realmIdx++;
    state.subStage = 0;
    state.tuVi = 0;
    computeStats();
    state.hp = state.stats.hpMax;
    state.age += 50 + state.realmIdx*20;
    checkBreakthroughAvailable();
    const worldName = idx===0 ? 'Linh Giới' : 'Tiên Giới';
    addLog(`⚡ Ngươi đã vượt qua trọn vẹn cửu cửu lôi kiếp! Không gian trước mặt rách toạc, thân ảnh ngươi bị cuốn vào cơn bão táp hư không cuồng nộ, phi thăng ${worldName}, chính thức bước vào ${fullRealmName(state.realmIdx,state.subStage)}. ${MAJOR_REALMS[state.realmIdx].note}`);
    render();
    showModal(idx===0 ? 'ascend-linhgioi' : 'ascend-tiengioi');
  } else {
    state.ascended = true;
    addLog(`⚡ Ngươi đã vượt qua trọn vẹn cửu cửu lôi kiếp cuối cùng! Không gian trước mặt rách toạc, ánh sáng chói lòa nuốt trọn thân ảnh của ngươi...`);
    render();
    showModal('ascension');
  }
}

      </div>

      <div class="root-result">

      </div>

  } else {
    const pathTiles = PATHS.map(p=>{
      const selected = pendingPath && pendingPath.id===p.id;
      return `<div class="path-tile ${selected?'selected':''}" onclick="selectPath('${p.id}')"><div class="path-icon">${PATH_ICONS[p.id]||'✦'}</div><div class="path-name">${p.name}</div></div>`;

      <div class="root-result" style="margin-top:9px;">
        <p class="flavor" style="margin:0 0 9px;">${pendingPath.desc}</p>
        <div class="row"><span class="k">Công / Thủ / Tốc / Sinh lực</span><span class="v">×${pendingPath.atkMult} / ×${pendingPath.defMult} / ×${pendingPath.spdMult} / ×${pendingPath.hpMult}</span></div>
        <div class="row"><span class="k">Bạo kích</span><span class="v">${pendingPath.critBonus>=0?'+':''}${pendingPath.critBonus}%</span></div>
      </div>
    ` : `<p class="sec-note" style="margin-top:9px;">Chạm vào một đạo lộ để xem chi tiết.</p>`;
    content = `
      <h2 class="serif">Chọn Đạo Lộ Tu Luyện</h2>
      ${stepDots}
      <p class="sec-note" style="margin-top:-6px;">Con đường ngươi tự chọn — định hình lối đánh và cách tu luyện suốt hành trình.</p>
      <div class="path-list">${pathTiles}</div>
      ${pathDetail}
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn ghost" onclick="goToCreationStep(2)">Quay Lại</button>
        <button class="btn gold" ${pendingPath?'':'disabled'} onclick="startGame()">Bắt Đầu Hành Trình</button>
      </div>
    `;
  }

  body.innerHTML = content;
}

function goToCreationStep(step){
  const input = document.getElementById('nameInput');
  if(input) pendingName = input.value||'';
  creationStep = step;
  renderStartModal();
}

function selectPath(id){
  const input = document.getElementById('nameInput');
  if(input) pendingName = input.value||'';
  pendingPath = PATHS.find(p=>p.id===id) || null;
  renderStartModal();
}

function startGame(){
  const input = document.getElementById('nameInput');
  const rawName = input ? input.value : pendingName;
  const name = (rawName||'').trim() || 'Vô Danh';
  if(!pendingRoot) pendingRoot = rollSpiritRoot();
  if(!pendingPath) return;
  state = freshState(name, pendingRoot, pendingPath, pendingPhysique);
  const physiqueMsg = (pendingPhysique && !pendingPhysique.idealPath) ? `, mang trong mình 【${pendingPhysique.name}】` : '';
  addLog(`${name} rời khỏi Sương Lạnh Sơn Thôn, mang theo chiếc lục bình bí ẩn, tư chất 【${pendingRoot.name}】${physiqueMsg} và bước chân vào 【${pendingPath.name}】, chính thức dấn thân vào con đường tu tiên nghịch thiên.`);
  computeStats();
  checkBreakthroughAvailable();
  closeModal();
  render();
}

function restartGame(){
  pendingName = state.name;
  pendingRoot = null;
  pendingPath = null;
  pendingPhysique = null;
  pendingPhysiqueRolled = false;
  creationStep = 1;
  renderStartModal();
  document.getElementById('overlay').classList.add('show');
}

const TAB_DEFS = [
  {id:'nhanvat',   label:'👤 Nhân Vật'},
  {id:'tuluyen',   label:'☯ Tu Luyện'},
  {id:'thamhiem',  label:'🗺 Thám Hiểm'},
  {id:'trung',     label:'🐛 Linh Sủng'},
  {id:'nghephu',   label:'🛠 Nghề Phụ'},
  {id:'hanhtrang', label:'🎒 Hành Trang'},
  {id:'nhatky',    label:'📜 Nhật Ký'}
];

function setTab(id){ state.activeTab = id; render(); }
function setSubTab(mainId, subId){ state.subTabs[mainId] = subId; render(); }

function render(){
  computeStats();
  renderHeader();
  renderTabs();
  renderContent();
}

function renderHeader(){
  document.getElementById('hdrName').textContent = state.name;
  document.getElementById('hdrTitle').textContent = TITLES[state.realmIdx];
  document.getElementById('hdrRealm').textContent = fullRealmName(state.realmIdx, state.subStage||0);

  const hpPct = Math.max(0, Math.min(100, (state.hp/state.stats.hpMax)*100));
  document.getElementById('hpFill').style.width = hpPct+'%';
  document.getElementById('hpNum').textContent = `${state.hp}/${state.stats.hpMax}`;

  const r = realmStatsAt(state.realmIdx, state.subStage||0);
  const tuviPct = Math.max(0, Math.min(100, (state.tuVi/r.tuViMax)*100));
  document.getElementById('tuviFill').style.width = tuviPct+'%';
  document.getElementById('tuviNum').textContent = state.canBreak ? 'Viên Mãn' : `${state.tuVi}/${r.tuViMax}`;

  document.getElementById('rsStones').textContent = state.spiritStones;
  document.getElementById('rsLinhLuc').textContent = state.linhLuc;
  document.getElementById('rsAge').textContent = state.age;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = TAB_DEFS.map(t=>`
    <button class="tab-btn ${state.activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>
  `).join('');
}

function renderContent(){
  const el = document.getElementById('content');
  if(!state.root || !state.path){
    el.innerHTML = `<div class="card"><p class="flavor">Hãy đặt tên, chọn đạo lộ và bắt đầu hành trình để khai mở tư chất của ngươi.</p></div>`;
    return;
  }
  if(state.combat){ el.innerHTML = renderCombatPanel(); return; }
  if(state.tribulation){ el.innerHTML = renderTribulationPanel(); return; }
  switch(state.activeTab){
    case 'nhanvat':  el.innerHTML = renderCharacterTab(); break;
    case 'tuluyen':  el.innerHTML = renderCultivateTab(); break;
    case 'thamhiem': el.innerHTML = renderExploreTab(); break;
    case 'trung':    el.innerHTML = renderWormTab(); break;
    case 'nghephu':  el.innerHTML = renderProfessionsTab(); break;
    case 'hanhtrang': el.innerHTML = renderInventoryTab(); break;
    case 'nhatky':   el.innerHTML = renderLogTab(); break;
  }
}
