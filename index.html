        <div class="tile-head"><span class="tc">Cần 3 ${HERB_NAMES[tier-1]}</span><span class="tc">có ${herbHave}</span></div>
        <div class="tile-head"><span class="tc" style="color:${hasRecipe?'var(--jade)':'var(--blood)'};">${hasRecipe?'✓ Có Đan Phương':'⚠ Thiếu Đan Phương'}</span></div>
        <button class="btn ghost" ${herbHave<3?'disabled':''} onclick="refinePill(${tier})">Luyện Đan</button>
        <button class="btn ghost" ${pillHave<1?'disabled':''} onclick="usePill(${tier})">Sử Dụng (+${tier*35} tu vi)</button>
        <button class="btn ghost" ${pillHave<1?'disabled':''} onclick="sellPills(${tier})">Bán Hết (+${sellPrice}/viên)</button>
      </div>
    `;
  }).join('');

  const cardTuLuyen = `
    <div class="card">
      <div class="sec-title">☯ Bế Quan Tu Luyện</div>
      <p class="flavor">Vận chuyển chân khí, hấp thu linh khí trời đất bồi đắp tu vi.</p>
      <button class="btn" onclick="meditate()">Tu Luyện Một Canh Giờ</button>
      <button class="btn ghost" onclick="channelSpiritStones()" style="margin-top:8px;">Vận Linh Thạch Trợ Tu (${30+state.realmIdx*20} linh thạch)</button>
    </div>
  `;

  const cardDuocVien = `
    <div class="card">
      <div class="sec-title">🌿 Lục Bình Dược Viên<span style="font-size:11px;color:var(--text-faint);font-weight:400;">cấp ${state.bottleLevel}/6</span></div>
      <p class="flavor">Chiếc lục bình thần bí có thể thúc đẩy linh thảo sinh trưởng vạn năm chỉ trong nháy mắt. Cấp càng cao, dược liệu ươm được càng quý hiếm.</p>
      <div class="grid2">${herbTiles}</div>
    </div>
  `;

  const cardLuyenDan = `
    <div class="card">
      <div class="sec-title">⚗ Luyện Đan Phòng</div>
      <p class="flavor">Đan dược luyện thành có thể nuốt để bồi bổ tu vi ngay lập tức, như ăn kẹo. Thiếu Đan Phương cho cấp nào thì luyện cấp đó rất dễ nổ lò — hãy tìm Đan Phương qua thám hiểm. Cần học nghề Luyện Đan Sư trước mới thao tác được ở đây.</p>
      <div class="grid2">${pillTiles}</div>
    </div>
    ${(state.professions.danSu||0)>=3 ? `
    <div class="card">
      <div class="sec-title">⚡ ${BREAKTHROUGH_PILL_NAME}</div>
      <p class="flavor">Đan dược chuyên dùng để cưỡng ép đột phá — cộng thẳng vào tỷ lệ thành công của lần đột phá kế tiếp, tiêu hao ngay sau khi đột phá dù thành hay bại.</p>
      <div class="row"><span class="k">Tỷ lệ đột phá đang cộng thêm</span><span class="v">+${state.breakthroughBoost}%</span></div>
      <button class="btn gold" onclick="craftBreakthroughPill()" style="margin-top:8px;">Luyện & Dùng (${breakthroughPillCost().stones} linh thạch, ${breakthroughPillCost().herbCount} ${HERB_NAMES[breakthroughPillCost().herbTier-1]})</button>
    </div>
    ` : ''}
  `;

  const subDefs = [
    {id:'tuluyen',  label:'☯ Tu Luyện'},
    {id:'duocvien', label:'🌿 Dược Viên'},
    {id:'luyendan', label:'⚗ Luyện Đan'}
  ];
  const nav = `<div class="subtab-row">${subDefs.map(d=>`<button class="subtab-btn ${state.subTabs.tuluyen===d.id?'active':''}" onclick="setSubTab('tuluyen','${d.id}')">${d.label}</button>`).join('')}</div>`;
  const bodies = {tuluyen:cardTuLuyen, duocvien:cardDuocVien, luyendan:cardLuyenDan};
  const body = bodies[state.subTabs.tuluyen] || cardTuLuyen;
  return nav+body;
}

function renderExploreTab(){
  const rivalCard = `
    <div class="card">
      <div class="sec-title">⚔ Kình Địch Đồng Đạo</div>
      <p class="flavor">${state.rival.name} — một tán tu cùng thời, số phận trói buộc hai người cứ tình cờ tái ngộ giữa các bí cảnh. Càng chạm trán nhiều, hắn càng khó lường.</p>
      <div class="row"><span class="k">Thắng / Thua</span><span class="v">${state.rival.wins} / ${state.rival.losses}</span></div>
      <div class="row"><span class="k">Uy lực hiện tại của hắn</span><span class="v">×${state.rival.powerMult.toFixed(2)}</span></div>
    </div>
  `;
  const zones = ZONES.map((z,i)=>{
    const locked = i>state.realmIdx;
    return `
      <div class="card zone-card ${locked?'locked':''}">
        <h3>${z.name}</h3>
        <p>${z.blurb}</p>
        ${locked
          ? `<div class="zone-lock">Cần đạt ${MAJOR_REALMS[i].name} để tiến vào.</div>`
          : `<div class="btn-row">
              <button class="btn blood" onclick="explore(${i})">Thám Hiểm</button>
              <button class="btn ghost" onclick="meditateAtZone(${i})">Tọa Quan Linh Mạch</button>
            </div>
            <div class="sec-note" style="margin-top:6px;">Mật độ linh mạch nơi đây: ×${z.linhMachDensity} tu vi khi tĩnh tọa tại chỗ, an toàn hơn thám hiểm nhưng không có cơ duyên hay chiến lợi phẩm.</div>`
        }
      </div>
    `;
  }).join('');
  return rivalCard+zones;
}

function renderCombatPanel(){
  const c = state.combat;
  const e = c.enemy;
  const ePct = Math.max(0, Math.min(100,(e.hp/e.hpMax)*100));
  const atkLabel = (state.path && state.path.atkLabel) ? state.path.atkLabel : 'Tấn Công';
  const petName = state.worm.have ? (PET_TYPES.find(p=>p.id===state.worm.typeId)||PET_TYPES[0]).name : 'Linh Sủng';
  return `
    <div class="card">
      <div class="enemy-block">
        <div class="enemy-name">${e.name}${e.isBoss?' ⚔':''}</div>
        <div class="bar-row" style="max-width:340px;margin:0 auto;">
          <div class="bar-track"><div class="bar-fill hp" style="width:${ePct}%"></div></div>
          <div class="bar-num">${Math.max(0,e.hp)}/${e.hpMax}</div>
        </div>
      </div>
      <div class="combat-log">${c.log.map(l=>`<div>${l}</div>`).join('')}</div>
      <div class="btn-row" style="margin-top:11px;">
        <button class="btn" onclick="playerAttack('atk')">${atkLabel}</button>
        <button class="btn gold" ${!state.treasure||c.cdTreasure>0?'disabled':''} onclick="playerAttack('treasure')">Pháp Bảo${c.cdTreasure>0?` (${c.cdTreasure})`:''}</button>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn ghost" ${!state.worm.have||c.cdWorm>0?'disabled':''} onclick="playerAttack('worm')">${petName}${c.cdWorm>0?` (${c.cdWorm})`:''}</button>
        <button class="btn ghost" onclick="playerAttack('pill')">Dùng Đan</button>
      </div>
      ${(state.puppets>0 || (state.professions.tranPhap||0)>=2) ? `
      <div class="btn-row" style="margin-top:8px;">
        ${state.puppets>0?`<button class="btn ghost" ${c.cdKhoiLoi>0?'disabled':''} onclick="playerAttack('khoiLoi')">Khôi Lỗi Quân Đoàn${c.cdKhoiLoi>0?` (${c.cdKhoiLoi})`:''}</button>`:''}
        ${(state.professions.tranPhap||0)>=2?`<button class="btn ghost" ${c.formationActive?'disabled':''} onclick="playerAttack('tran')">${c.formationActive?'Đã Bố Trận':(state.hasTranDo?'Bố Trận':'Bố Trận ⚠')}</button>`:''}
      </div>
      ` : ''}
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn ghost" ${bestTalismanTier()<1?'disabled':''} onclick="playerAttack('phu')">Dùng Phù${bestTalismanTier()>0?` (${(state.talismans[1]||0)+(state.talismans[2]||0)+(state.talismans[3]||0)})`:''}</button>
        <button class="btn ghost" onclick="playerAttack('flee')">Chạy Trốn</button>
      </div>
    </div>
  `;
}

function renderProfessionsTab(){
  const auctionItems = [];
  if((state.professions.danSu||0)>=1){
    const nextDanTier = state.danPhuongTiers.length ? Math.max(...state.danPhuongTiers)+1 : 1;
    if(nextDanTier<=6) auctionItems.push({type:'danPhuong', tier:nextDanTier, label:`Đan Phương ${PILL_NAMES[nextDanTier-1]}`, cost:150*nextDanTier});
  }
  if((state.professions.khiSu||0)>=1 && !state.hasKhiPhuong) auctionItems.push({type:'khiPhuong', label:'Khí Phương', cost:600});
  if((state.professions.khoiLoi||0)>=1 && !state.hasKhoiLoiVe) auctionItems.push({type:'khoiLoiVe', label:'Bản Vẽ Khôi Lỗi', cost:600});
  if((state.professions.tranPhap||0)>=1 && !state.hasTranDo) auctionItems.push({type:'tranDo', label:'Trận Đồ', cost:500});

  const auctionCard = auctionItems.length ? `
    <div class="card">
      <div class="sec-title">🏛 Đấu Giá Hội Ngầm</div>
      <p class="flavor">Đan phương tuyệt tích hay bản vẽ khôi lỗi thượng cổ luôn là thứ khiến vô số tu sĩ tranh giành, chém giết. Nếu không muốn liều mạng mò mẫm hay chờ cơ duyên, có thể dốc gia tài tranh mua tại sàn đấu giá ngầm — chắc chắn có được, nhưng giá cắt cổ.</p>
      ${auctionItems.map(it=>`
        <div class="row"><span class="k">${it.label}</span><span class="v">${it.cost} linh thạch</span></div>
      `).join('')}
      <div class="btn-row" style="margin-top:8px;">
        ${auctionItems.map(it=>`<button class="btn gold" ${state.spiritStones<it.cost?'disabled':''} onclick="buyRecipeAtAuction('${it.type}'${it.tier?`,${it.tier}`:''})">Đấu Giá ${it.label}</button>`).join('')}
      </div>
    </div>
  ` : '';

  const tiles = PROFESSIONS.map(p=>{
    const lvl = state.professions[p.id]||0;
    const maxed = lvl>=p.maxLevel;
    const cost = professionCost(lvl);
    const btnLabel = maxed ? 'Đã Viên Mãn' : (lvl===0?`Bái Sư (${cost} linh thạch)`:`Tinh Tấn (${cost} linh thạch)`);
    let extra = '';
    if(p.id==='danSu' && lvl>=1){
      extra = `<div class="sec-note" style="margin-top:2px;">Đan Phương đã có: ${state.danPhuongTiers.slice().sort((a,b)=>a-b).map(t=>PILL_NAMES[t-1]).join(', ')||'chưa có'}</div>`;
    }
    if(p.id==='khiSu' && lvl>=1){
      const fCost = 60+state.realmIdx*40;
      extra = `<div class="sec-note" style="margin-top:2px;color:${state.hasKhiPhuong?'var(--jade)':'var(--blood)'};">${state.hasKhiPhuong?'✓ Đã có Khí Phương':'⚠ Chưa có Khí Phương — rèn chế dễ ra phế phẩm'}</div>
        <button class="btn gold" onclick="forgeTreasure()" style="margin-top:7px;">Rèn Chế Pháp Bảo (${fCost} linh thạch)</button>`;
      if(lvl>=3 && state.treasure){
        const tCost = 70+(state.treasure.temperCount||0)*35;
        extra += `<button class="btn gold" onclick="temperTreasure()" style="margin-top:7px;">Tôi Luyện Bản Mệnh Pháp Bảo (${tCost} linh thạch)</button>`;
      }
    }
    if(p.id==='tranPhap' && lvl>=1){
      extra = `<div class="sec-note" style="margin-top:2px;color:${state.hasTranDo?'var(--jade)':'var(--blood)'};">${state.hasTranDo?'✓ Đã có Trận Đồ':'⚠ Chưa có Trận Đồ — bố trận trong chiến đấu dễ phản phệ'}</div>`;
      if(state.hasTranDo && lvl>=2){
        extra += `<div class="row"><span class="k">Trận Kỳ hiện tại</span><span class="v">${state.tranKyTier>0?TRANKY_TIERS.find(x=>x.tier===state.tranKyTier).name:'chưa bố trí'}</span></div>`;
        extra += TRANKY_TIERS.map(tk=>{
          const herbTier = MATERIAL_TIER_HERB[tk.tier-1];
          const owned = state.tranKyTier>=tk.tier;
          return `<button class="btn ${owned?'ghost':'gold'}" ${owned?'disabled':''} onclick="prepareTranKy(${tk.tier})" style="margin-top:6px;">${owned?'✓ ':''}${tk.name} (${tk.stones} linh thạch, ${tk.herbCount} ${HERB_NAMES[herbTier-1]})</button>`;
        }).join('');
      }
    }
    if(p.id==='phuLuc' && lvl>=1){
      const totalPhu = (state.talismans[1]||0)+(state.talismans[2]||0)+(state.talismans[3]||0);
      extra = `<div class="row"><span class="k">Linh phù trong người</span><span class="v">${totalPhu} (Sơ ${state.talismans[1]||0} / Trung ${state.talismans[2]||0} / Cao ${state.talismans[3]||0})</span></div>`;
      extra += TALISMAN_TIERS.map(t=>{
        const herbTier = MATERIAL_TIER_HERB[t.tier-1];
        return `<button class="btn gold" onclick="craftTalisman(${t.tier})" style="margin-top:6px;">Vẽ ${t.name} (${t.stones} linh thạch, ${t.herbCount} ${HERB_NAMES[herbTier-1]})</button>`;
      }).join('');
    }
    if(p.id==='khoiLoi' && lvl>=1){
      const cap = lvl*4;
      extra = `<div class="row"><span class="k">Khôi lỗi hiện có</span><span class="v">${state.puppets}/${cap}</span></div>
        <div class="sec-note" style="margin-top:2px;color:${state.hasKhoiLoiVe?'var(--jade)':'var(--blood)'};">${state.hasKhoiLoiVe?'✓ Đã có Bản Vẽ Khôi Lỗi':'⚠ Chưa có Bản Vẽ — dễ chế ra phế rối'}</div>`;
      extra += DOTRI_TIERS.map(dt=>{
        const herbTier = MATERIAL_TIER_HERB[dt.tier-1];
        return `<button class="btn gold" ${state.puppets>=cap?'disabled':''} onclick="craftPuppet(${dt.tier})" style="margin-top:6px;">Lắp bằng ${dt.name} (${dt.stones} linh thạch, ${dt.herbCount} ${HERB_NAMES[herbTier-1]})</button>`;
      }).join('');
    }
    return `
      <div class="card">
        <div class="sec-title">${p.name}<span style="font-size:11px;color:var(--text-faint);font-weight:400;">cấp ${lvl}/${p.maxLevel}</span></div>
        <p class="flavor">${p.desc}</p>
        <button class="btn ${maxed?'ghost':''}" ${maxed?'disabled':''} onclick="learnOrLevelProfession('${p.id}')">${btnLabel}</button>
        ${extra}
      </div>
    `;
  }).join('');
  const subDefs = [{id:'nghe', label:'🛠 Nghề Nghiệp'}];
  if(auctionItems.length) subDefs.unshift({id:'dausgia', label:'🏛 Đấu Giá'});
  let activeSub = state.subTabs.nghephu;
  if(!subDefs.some(d=>d.id===activeSub)) activeSub = 'nghe';
  const nav = `<div class="subtab-row">${subDefs.map(d=>`<button class="subtab-btn ${activeSub===d.id?'active':''}" onclick="setSubTab('nghephu','${d.id}')">${d.label}</button>`).join('')}</div>`;
  const body = activeSub==='dausgia' ? auctionCard : tiles;
  return nav+body;
}

      <div class="row"><span class="k">Bản Vẽ Khôi Lỗi</span><span class="v" style="color:${state.hasKhoiLoiVe?'var(--jade)':'var(--blood)'};">${state.hasKhoiLoiVe?'✓ Đã có':'⚠ Chưa có'}</span></div>
      <div class="row"><span class="k">Trận Đồ</span><span class="v" style="color:${state.hasTranDo?'var(--jade)':'var(--blood)'};">${state.hasTranDo?'✓ Đã có':'⚠ Chưa có'}</span></div>
      ${state.tranKyTier>0?`<div class="row"><span class="k">Trận Kỳ đã bố trí</span><span class="v">${TRANKY_TIERS.find(x=>x.tier===state.tranKyTier).name}</span></div>`:''}

  const equipCard = `

      <div class="sec-title">⚔ Trang Bị &amp; Tùy Thân</div>

      <div class="row"><span class="k">Linh sủng</span><span class="v">${state.worm.have?`${(PET_TYPES.find(p=>p.id===state.worm.typeId)||PET_TYPES[0]).name} cấp ${state.worm.level}`:'chưa có'}</span></div>
      <div class="row"><span class="k">Khôi lỗi</span><span class="v">${state.puppets} con</span></div>
      ${talismanRows || '<div class="row"><span class="k">Linh phù</span><span class="v">chưa có</span></div>'}
    </div>
  `;

  const statPillCard = STAT_PILLS.some(sp=>(state.statPillBonus[sp.stat]||0)>0) ? `
    <div class="card">
      <div class="sec-title">💠 Đan Dược Kỳ Ngộ</div>
      ${STAT_PILLS.filter(sp=>(state.statPillBonus[sp.stat]||0)>0).map(sp=>`<div class="row"><span class="k">${sp.name}</span><span class="v">+${state.statPillBonus[sp.stat]}${sp.stat==='crit'?'%':''}</span></div>`).join('')}
    </div>
  ` : '';

  return `
    <div class="card">
      <div class="sec-title">💊 Đan Dược</div>
      ${pillRows || `<p class="flavor">Chưa có đan dược nào trong người.</p>`}
    </div>
    <div class="card">
      <div class="sec-title">🌿 Dược Liệu</div>
      ${herbRows || `<p class="flavor">Chưa có dược liệu nào trong người.</p>`}
    </div>
    ${recipeCard}
    ${techCard}
    ${equipCard}
    ${statPillCard}
  `;
}

function renderLogTab(){
  if(!state.log.length){
    return `<div class="card"><p class="flavor">Chưa có sự kiện nào được ghi lại.</p></div>`;
  }
  return `<div class="card">${state.log.map(l=>`<div class="log-entry">${l}</div>`).join('')}</div>`;
}

/* =====================================================================
   KHỞI TẠO
===================================================================== */
window.onload = function(){
  state = freshState('', null, null, null);
  pendingName = '';
  pendingRoot = null;
  pendingPath = null;
  pendingPhysique = null;
  pendingPhysiqueRolled = false;
  creationStep = 1;
  render();
  const loadingTexts = ["Đang tập hợp thiên địa linh khí...", "Đang khai mở cõi tu tiên...", "Đang gieo quẻ định mệnh..."];
  const loadingTextEl = document.getElementById('loadingText');
  let ltIdx = 0;
  const ltTimer = setInterval(()=>{
    ltIdx = (ltIdx+1)%loadingTexts.length;
    if(loadingTextEl) loadingTextEl.textContent = loadingTexts[ltIdx];
  }, 550);
  setTimeout(()=>{
    clearInterval(ltTimer);
    const ls = document.getElementById('loadingScreen');
    if(ls) ls.classList.add('hide');
    showModal('start');
  }, 1400);
};
</script>
