<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Phàm Nhân Vấn Đạo · Hành Động</title>
<meta name="theme-color" content="#0b0f10">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#0b0f10;--panel:#131a1b;--border:#26332f;--text:#e6eee9;--dim:#9db0a8;--faint:#6f817a;--jade:#4fc98f;--jade-b:#8ff0c0;--gold:#d4af6a;--gold-b:#f3d38f;--blood:#e0604f;--mana:#5fb3e8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none;}
  body{min-height:100vh;display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  #app{width:100%;max-width:960px;display:flex;flex-direction:column;gap:8px;padding:8px 12px 12px;user-select:none;-webkit-user-select:none;}
  header{display:flex;align-items:center;gap:10px;}
  header h1{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.2;margin:0;color:var(--gold-b);font-weight:600;flex:1;}
  header a,header button{font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 10px;text-decoration:none;cursor:pointer;}
  #hud{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px;}
  #hud .who{font-size:13px;} #hud .who b{color:var(--gold-b);} #hud .who span{color:var(--jade-b);}
  #hud .zone{font-size:12px;color:var(--dim);text-align:right;}
  .bars{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .bar{position:relative;height:14px;border-radius:7px;background:#0a0e0f;border:1px solid var(--border);overflow:hidden;}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;transition:width .15s;}
  .bar.hp i{background:linear-gradient(90deg,#a8382c,var(--blood));}
  .bar.mp i{background:linear-gradient(90deg,#2d6f9e,var(--mana));}
  .bar.tv i{background:linear-gradient(90deg,#2f8f62,var(--jade-b));}
  .bar em{position:absolute;inset:0;font-style:normal;font-size:10px;line-height:13px;text-align:center;color:#fff;text-shadow:0 1px 2px #000;}
  #brk{grid-column:1/-1;display:none;background:linear-gradient(180deg,var(--gold-b),var(--gold));color:#2a1e08;border:0;border-radius:10px;padding:8px;font-weight:700;font-size:14px;cursor:pointer;}
  #brk.on{display:block;animation:pulse 1.2s infinite;} @keyframes pulse{50%{filter:brightness(1.25);}}
  #stage{position:relative;}
  canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:12px;border:1px solid var(--border);background:#000;touch-action:none;}
  #target{position:absolute;left:50%;top:8px;transform:translateX(-50%);min-width:160px;max-width:70%;text-align:center;font-size:12px;color:#ffd9d2;text-shadow:0 1px 2px #000;pointer-events:none;display:none;}
  #target .bar{height:7px;margin-top:3px;}
  #overlay{position:fixed;inset:0;z-index:10;display:none;background:rgba(5,8,9,.9);padding:16px;overflow:auto;}
  #overlay.on{display:flex;}
  .box{max-width:560px;width:100%;margin:auto;text-align:center;}
  .box h2{font-family:Georgia,serif;color:var(--gold-b);margin:4px 0 6px;font-weight:600;}
  .box p{color:var(--dim);font-size:13px;margin:4px 0 10px;line-height:1.5;}
  .btn{background:linear-gradient(180deg,#2f8f62,#226b49);color:#eafff4;border:1px solid #3fae7b;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn.ghost{background:transparent;color:var(--dim);border-color:var(--border);}
  .zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;text-align:left;padding:2px;}
  .zc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;}
  .zc b{display:block;font-size:13px;color:var(--gold-b);} .zc small{display:block;font-size:11px;color:var(--faint);margin-top:2px;}
  .zc.done b::after{content:' ✓';color:var(--jade-b);}
  .zc.lock{opacity:.4;cursor:not-allowed;}
  #pad{display:flex;justify-content:space-between;gap:10px;touch-action:none;}
  #pad .grp{display:flex;gap:6px;flex:1;}
  #pad button{flex:1;min-width:0;padding:0 4px;height:56px;border-radius:14px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;touch-action:none;cursor:pointer;}
  #pad button.on{background:#1e3a2e;border-color:var(--jade);}
  #pad #bAtk{background:#2a2216;border-color:var(--gold);color:var(--gold-b);}
  #pad #bSkill{color:var(--jade-b);}
  .keys{font-size:11px;color:var(--faint);text-align:center;}
  @media (hover:none){.keys{display:none;}}
  @media (orientation:landscape) and (max-height:520px){
    #app{max-width:none;padding:4px 8px;gap:4px;} header{display:none;} #hud{padding:4px 8px;}
    canvas{height:calc(100vh - 150px);width:auto;margin:0 auto;}
    #pad button{height:44px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Phàm Nhân Vấn Đạo · Hành Động</h1>
    <button id="mapBtn">Bản đồ</button>
    <a href="index.html">Bản chữ</a>
  </header>
  <div id="hud">
    <div class="who"><b id="hName">Hàn Lập</b> · <span id="hRealm"></span></div>
    <div class="zone" id="hZone"></div>
    <div class="bars">
      <div class="bar hp"><i id="hpI"></i><em id="hpT"></em></div>
      <div class="bar mp"><i id="mpI"></i><em id="mpT"></em></div>
      <div class="bar tv"><i id="tvI"></i><em id="tvT"></em></div>
    </div>
    <button id="brk">Đột Phá</button>
  </div>
  <div id="stage">
    <canvas id="cv" width="480" height="270"></canvas>
    <div id="target"><div id="tName"></div><div class="bar hp"><i id="tHp"></i></div></div>
    <div id="overlay"><div class="box" id="ovBox"></div></div>
  </div>
  <div id="pad">
    <div class="grp">
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
      <button data-k="med" id="bMed">Đả tọa</button>
    </div>
    <div class="grp act">
      <button data-k="skill" id="bSkill">Kiếm khí</button>
      <button data-k="jump">Nhảy</button>
      <button data-k="atk" id="bAtk">Chém</button>
    </div>
  </div>
  <div class="keys">← → di chuyển · ↑ / Space nhảy · J chém · K kiếm khí · ↓ đả tọa (hồi khí huyết, tăng tu vi) · M bản đồ</div>
</div>

<script>
/* ===== Dữ liệu lấy nguyên từ bản chữ (index.html) ===== */
const SUBSTAGE_NAMES = ["Sơ Kỳ","Trung Kỳ","Hậu Kỳ","Đỉnh Phong"];

const MAJOR_REALMS = [
  {name:"Luyện Khí Kỳ",  world:"Hạ Cảnh Giới", substageCount:13, tuViMax:15,    hp:25,    atk:4,    def:1,    spd:4,   note:"Dẫn linh khí nhập thể, gột rửa kinh mạch từng tầng một."},
  {name:"Trúc Cơ Kỳ",    world:"Hạ Cảnh Giới", substageCount:4,  tuViMax:120,   hp:90,    atk:12,   def:5,    spd:9,   note:"Đan điền hóa lỏng linh khí, tuổi thọ tăng lên khoảng 200 năm, chính thức thoát kiếp phàm nhân."},
  {name:"Kết Đan Kỳ",    world:"Hạ Cảnh Giới", substageCount:4,  tuViMax:320,   hp:220,   atk:26,   def:12,   spd:13,  note:"Linh khí lỏng ngưng tụ thành một viên Kim Đan trong đan điền, tuổi thọ đạt khoảng 500 năm."},
  {name:"Nguyên Anh Kỳ", world:"Hạ Cảnh Giới", substageCount:4,  tuViMax:700,   hp:500,   atk:55,   def:26,   spd:19,  note:"Kim Đan hóa thành Nguyên Anh, có khả năng xuất hồn, đoạt xá hoặc thoát xác trốn chạy khi nhục thân bị phá hủy. Tuổi thọ tăng lên hơn 1.000 năm."},
  {name:"Hóa Thần Kỳ",   world:"Hạ Cảnh Giới", substageCount:4,  tuViMax:1500,  hp:1100,  atk:115,  def:55,   spd:27,  note:"Đỉnh cao Nhân Giới — mượn được Thiên Địa Nguyên Khí để chiến đấu, tuổi thọ lên tới 2.000-3.000 năm, đủ điều kiện phi thăng Linh Giới."},
  {name:"Luyện Hư Kỳ",   world:"Trung Cảnh Giới", substageCount:4, tuViMax:3000,  hp:2400,  atk:230,  def:110,  spd:38,  note:"Nguyên Anh dung hợp hoàn toàn vào nhục thân, đạt trạng thái ngũ hành đồng hóa, không còn bị giới hạn tuổi thọ thông thường — nhưng phải đối mặt với thiên kiếp định kỳ."},
  {name:"Hợp Thể Kỳ",    world:"Trung Cảnh Giới", substageCount:4, tuViMax:6000,  hp:4600,  atk:420,  def:200,  spd:50,  note:"Thần thức, pháp lực và nhục thân đạt đến độ hòa quyện tuyệt đối, ngưng tụ ra Pháp Tướng cường hãn."},
  {name:"Đại Thừa Kỳ",   world:"Trung Cảnh Giới", substageCount:4, tuViMax:11000, hp:8500,  atk:750,  def:360,  spd:64,  note:"Đỉnh phong Trung Cảnh Giới, sức mạnh đủ chấn nhiếp một đại tộc — chỉ còn giai đoạn Độ Kiếp trước cửa Tiên Giới."},
  {name:"Chân Tiên Kỳ",  world:"Thượng Cảnh Giới", substageCount:4, tuViMax:20000, hp:15000, atk:1300, def:620,  spd:82,  note:"Vượt qua thiên kiếp, chính thức ngưng tụ Tiên Khiếu và Tiên Linh Lực đầu tiên."},
  {name:"Kim Tiên Kỳ",   world:"Thượng Cảnh Giới", substageCount:4, tuViMax:35000, hp:26000, atk:2200, def:1050, spd:104, note:"Mở rộng số lượng Tiên Khiếu, tích lũy lực lượng Pháp Tắc Thiên Địa sâu sắc."},
  {name:"Thái Ất Kỳ",    world:"Thượng Cảnh Giới", substageCount:4, tuViMax:60000, hp:44000, atk:3700, def:1750, spd:130, note:"Pháp tắc đạt đến mức thâm sâu, ngưng tụ Thái Ất Đan ngay trong cơ thể."},
  {name:"Đại La Kỳ",     world:"Thượng Cảnh Giới", substageCount:4, tuViMax:100000,hp:72000, atk:6200, def:2900, spd:160, note:"Đột phá giới hạn Tiên Giới, pháp tắc đại thành, xưng bá một phương — chỉ còn một đạo thiên kiếp cuối cùng trước Đạo Tổ."},
  {name:"Đạo Tổ Kỳ",     world:"Thượng Cảnh Giới", substageCount:1, tuViMax:Infinity, hp:120000,atk:10000,def:5000, spd:200, note:"Cảnh giới tối cao của vũ trụ — kẻ nắm giữ trọn vẹn bản nguyên một loại Pháp Tắc Thiên Địa, vạn cổ chỉ có một người."}
];

/* Ba mốc đại cảnh giới kích hoạt Cửu Cửu Lôi Kiếp thay vì đột phá thường:
   Hóa Thần Kỳ (Nhân Giới → Linh Giới), Đại Thừa Kỳ (Trung Cảnh Giới → Tiên Giới),
   Đại La Kỳ (Thượng Cảnh Giới → Đạo Tổ, kết thúc thật sự). */
const TRIBULATION_REALMS = [4,7,11];

function subStageLabel(realmIdx, subStage){
  const r = MAJOR_REALMS[realmIdx];
  if(realmIdx===0) return `Tầng ${subStage+1}`;
  if(r.substageCount<=1) return '';
  return SUBSTAGE_NAMES[subStage] || '';
}
function fullRealmName(realmIdx, subStage){
  const r = MAJOR_REALMS[realmIdx];
  const sub = subStageLabel(realmIdx, subStage);
  return sub ? `${r.name} — ${sub}` : r.name;
}
/* Chỉ số/tu vi cần thiết thực tế tại một tiểu cảnh giới cụ thể — tăng dần
   qua từng tiểu cảnh giới trong cùng một đại cảnh giới. */
function realmStatsAt(realmIdx, subStage){
  const r = MAJOR_REALMS[realmIdx];
  const growth = Math.pow(1.14, subStage);
  const tuViGrowth = Math.pow(1.35, subStage);
  return {
    tuViMax: r.tuViMax===Infinity ? Infinity : Math.round(r.tuViMax*tuViGrowth),
    hp: Math.round(r.hp*growth),
    atk: Math.round(r.atk*growth),
    def: Math.round(r.def*growth),
    spd: Math.round(r.spd*growth)
  };
}
const ZONES = [
  {name:"Huyết Sắc Cấm Địa", linhMachDensity:1.15, blurb:"Bí cảnh sáu mươi năm mới mở một lần, cửa cấm chế chỉ mở trong sáu ngày. Đệ tử các đại phái không chỉ đối mặt yêu thú thượng cổ và độc chướng, mà còn tàn sát lẫn nhau để tranh đoạt linh thảo luyện Trúc Cơ Đan — tỷ lệ sống sót trở ra chưa tới ba thành."},
  {name:"Loạn Thạch Cốc", linhMachDensity:1.05, blurb:"Vực đá răng cưa nối dài vô tận, yêu thú cấp thấp ẩn trong từng hang sâu. Là chặng dừng chân của tán tu giữa hai đại bí cảnh — nhiều khoáng thạch, yêu đan, và cả những cuộc gặp gỡ tình cờ."},
  {name:"Hư Thiên Điện", linhMachDensity:1.25, blurb:"Cấm địa giữa Loạn Tinh Hải, ba trăm năm mới mở một lần, gồm nhiều ải tử thần đầy huyễn cảnh và cấm chế. Nơi cất giữ Hư Thiên Đỉnh và Càn Lam Băng Diễm — lão quái Nguyên Anh như Cực Âm Tổ Sư sẵn sàng dùng tu sĩ cấp thấp làm bia đỡ đạn."},
  {name:"Trụy Ma Cốc", linhMachDensity:1.3, blurb:"Chiến trường thượng cổ phong ấn cổ ma, chằng chịt vết nứt không gian vô hình — lỡ chạm vào là thân xác đứt lìa. Không gian hỗn loạn tới mức pháp bảo cũng mất tác dụng."},
  {name:"Quảng Hàn Giới", linhMachDensity:1.45, blurb:"Mảnh vỡ không gian vạn năm mới mở cửa một lần — cả đời tu sĩ may ra gặp được một lần. Áp lực không gian đè nén càng vào sâu càng nặng, dị tộc khắp nơi tranh đoạt Huyết Tinh."},
  {name:"Địa Uyên", linhMachDensity:1.6, blurb:"Vực sâu không đáy của Linh Giới, nơi ẩn cư của những tồn tại cổ xưa như Thanh Nguyên Tử — ngay cả cao thủ Độ Kiếp cũng từng xuất hiện ở đây."},
  {name:"Ma Giới · Tẩy Linh Trì", linhMachDensity:1.8, blurb:"Ma Giới bên kia thông đạo — nơi Hàn Lập cùng mười cao thủ Nhân tộc, Linh tộc tiến vào tìm Tẩy Linh Trì và Tịnh Linh Liên."},
  {name:"Lôi Minh Đại Lục", linhMachDensity:2.0, blurb:"Đại lục nơi lôi đình giáng xuống không ngớt, quê hương dị bảo thuộc tính lôi. Hàn Lập từng lưu lạc tại đây, thu được vô số dị bảo giúp chống thiên kiếp."},
  {name:"Hôi Giới", linhMachDensity:2.3, blurb:"Tiểu giới xám tro tách khỏi Tiên Giới, pháp tắc suy tàn, tàn hồn và kẻ lưu đày lẩn khuất — nơi Hàn Lập từng rơi vào."},
  {name:"Tích Không Giới", linhMachDensity:2.6, blurb:"Không gian độc lập áp chế pháp lực, luyện thể sĩ xưng hùng — nơi Lục Xuyên Phong, Đồ Cừu và Hàn Lập khai mở Huyền Khiếu."},
  {name:"Hắc Phong Hải", linhMachDensity:3.0, blurb:"Hải vực thuộc Hắc Sơn Tiên Vực, gió đen cuồn cuộn, thế lực Chân Tiên, Kim Tiên cát cứ từng hòn đảo."},
  {name:"Man Hoang Tiên Vực", linhMachDensity:3.5, blurb:"Vùng hoang dã hung hiểm nhất Tiên Giới, cự thú man hoang hoành hành, kẻ yếu không có chỗ dung thân."}
];

const ENEMY_NAMES = [
  ["Thượng Cổ Giao Thú","Cấm Địa Độc Chướng Yêu","Đồng Đạo Tranh Đoạt","Huyết Sắc Cổ Toái Thú"],
  ["Thạch Yêu Cốc Chủ","Toan Nê Quái Vật","Phi Ưng Yêu Thú","Cốc Để Cự Xà"],
  ["Hư Thiên Điện Vệ","Nguyên Anh Lão Quái Phân Thân","Huyễn Cảnh Ảo Ma","Băng Hỏa Song Sát Thú"],

  ["Dị Tộc Chiến Tướng","Linh Giới Cường Giả","Thiên Kiêu Đối Địch","Cổ Tộc Sát Thần"],

  ["Cửu Thiên Lôi Đế Thú","Huyền Vực Thâm Uyên Ma","Đại Thừa Cấm Vệ","Hắc Ám Thái Cổ Linh"],

function enemyKind(name){
  if(/Ưng|Phi /.test(name)) return 'fly';
  if(/Thú|Xà|Giao|Quái|Quy|Hung/.test(name)) return 'beast';
  if(/Ảnh|Ma|Hồn|Linh|Niệm|Chướng|Huyễn/.test(name)) return 'spirit';
  return 'human';
}

const SAVE_KEY = 'vandao-hanhdong-v1';
let save = {r:0, s:0, tv:0, unlocked:1, cleared:[], stones:0};
try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) save = Object.assign(save, JSON.parse(raw)); }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ===== Trạng thái ===== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 480, H = 270, GROUND = 232, LEVEL_LEN = 2600;
const keys = {left:false,right:false,jump:false,atk:false,skill:false,med:false};
const tap = {};   // lần bấm nhanh (nhấn-nhả trong cùng một khung hình) vẫn được tính
const want = k => keys[k] || tap[k];
let P, enemies, shots, orbs, texts, pickups, platforms, decor, zone, camX, shake, trib, paused = true, boss, spawnIdx, levelDone;

function stats(){ return realmStatsAt(save.r, save.s); }
function tvMax(){ return stats().tuViMax; }
function mpMax(){ return 30 + save.r*15 + save.s*2; }
function isLastSub(){ return save.s >= MAJOR_REALMS[save.r].substageCount-1; }

function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s ^= s<<13; s ^= s>>>17; s ^= s<<5; return ((s>>>0)%100000)/100000; }; }

function startZone(z){
  zone = z;
  const r = rng(z*7919+13);
  const st = stats();
  P = {x:60, y:GROUND, vx:0, vy:0, w:18, h:50, face:1, onGround:true, hp:st.hp, mp:mpMax(), atkT:-1, hitSet:null, inv:0, med:false, medT:0, walkT:0, skillCd:0};
  enemies = []; shots = []; orbs = []; texts = []; pickups = []; camX = 0; shake = 0; trib = null; boss = null; spawnIdx = 0; levelDone = false;
  platforms = [];
  for(let x = 320; x < LEVEL_LEN-400; x += 260 + r()*220){ platforms.push({x, y:GROUND-46-Math.round(r()*40), w:60+Math.round(r()*60)}); }
  decor = [];
  for(let x = 0; x < LEVEL_LEN*0.6; x += 30 + r()*70) decor.push({x, h:18+r()*34, kind:r()<0.5?'tree':'rock'});
  far = []; let h = 60;
  for(let i = 0; i < 260; i++){ h = Math.max(25, Math.min(110, h + (r()-0.5)*22)); far.push(Math.round(h)); }
  paused = false; closeOverlay(); updateHud();
}
let far = [];
const SPAWNS = [450, 800, 1150, 1500, 1850, 2150];

function spawnEnemy(x, isBoss){
  const names = ENEMY_NAMES[zone];
  const name = isBoss ? names[0] : names[1 + Math.floor(Math.random()*(names.length-1))];
  const kind = enemyKind(name);
  const base = realmStatsAt(zone, isBoss ? 3 : 1);
  const m = isBoss ? {hp:3.2, atk:0.85, def:0.8} : {hp:0.45, atk:0.55, def:0.5};
  const px = isBoss ? 5 : 3;
  const map = PIX[kind==='fly'?'beast':kind][0];
  const e = {name, kind, boss:isBoss, x, y:kind==='spirit'||kind==='fly' ? GROUND-70 : GROUND, vx:0, vy:0, face:-1, px,
    w:map[0].length*px, h:map.length*px, hp:Math.round(base.hp*m.hp), hpMax:Math.round(base.hp*m.hp), atk:Math.max(1,Math.round(base.atk*m.atk)), def:Math.round(base.def*m.def),
    cd:1+Math.random(), wind:0, stun:0, t:Math.random()*10, shootCd:2.5, flash:0, id:Math.random()};
  enemies.push(e);
  if(isBoss){ boss = e; toast(`${name} xuất hiện!`, '#ffb3a8'); }
}

/* ===== Chiến đấu ===== */
function dmgTo(atk, def, mult){ return Math.max(1, Math.round(atk*(0.85+Math.random()*0.3)*mult - def*0.6)); }
function hitEnemy(e, mult){
  const st = stats();
  const crit = Math.random() < 0.12;
  const d = dmgTo(st.atk, e.def, mult*(crit?1.8:1));
  e.hp -= d; e.flash = 0.12; e.stun = e.boss ? 0.05 : 0.25; e.vx = (e.x > P.x ? 1 : -1) * (e.boss ? 0.5 : 2.4);
  addText(e.x, e.y - e.h - 4, (crit?'Bạo kích ':'') + '−' + d, crit ? '#ffd27a' : '#fff');
  if(crit) shake = 0.15;
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  e.dead = true;
  for(let i = 0; i < 10; i++) orbs.push({x:e.x, y:e.y - e.h/2, vx:(Math.random()-0.5)*3, vy:-Math.random()*3, t:0.6, c:'#8ff0c0', s:2});
  const diffR = save.r - zone;
  const gain = Math.max(1, Math.round(tvMax() * (e.boss ? 0.5 : 0.12) * (diffR > 0 ? Math.pow(0.35, diffR) : 1)));
  addTuVi(gain);
  const st = 1 + zone*2 + (e.boss ? 20 : 0);
  save.stones += st;
  addText(e.x, e.y - e.h - 16, `+${gain} tu vi`, '#8ff0c0');
  if(Math.random() < (e.boss ? 1 : 0.18)) pickups.push({x:e.x, y:GROUND-8, vy:-3, kind:'pill'});
  if(e.boss){ boss = null; levelDone = true; setTimeout(zoneCleared, 900); }
  persist();
}
function hurtPlayer(atk, src){
  if(P.inv > 0 || paused) return;
  const d = dmgTo(atk, stats().def, 1);
  P.hp -= d; P.inv = 0.8; P.med = false; shake = 0.2;
  P.vx = (P.x < src ? -1 : 1) * 3; P.vy = -2.5; P.onGround = false;
  addText(P.x, P.y - 60, '−' + d, '#ff8a7a');
  if(P.hp <= 0){ P.hp = 0; die(); }
}
function addTuVi(n){
  const mx = tvMax();
  if(mx === Infinity) return;
  save.tv = Math.min(mx, save.tv + n);
}
function addText(x, y, s, c){ texts.push({x, y, s, c, t:1}); }

/* ===== Đột phá / Lôi kiếp ===== */
function breakChance(){ const major = isLastSub(); return Math.max(20, (major ? 62 : 86) - save.r*2); }
function tryBreak(){
  if(paused || save.tv < tvMax() || trib) return;
  const major = isLastSub();
  if(save.r >= MAJOR_REALMS.length-1) return;
  if(major && TRIBULATION_REALMS.includes(save.r)){
    trib = {left:9, t:1.2, warnX:null};
    toast('Cửu Cửu Lôi Kiếp giáng xuống — né tránh chín đạo thiên lôi!', '#d8c8ff');
    updateHud(); return;
  }
  const ch = breakChance();
  if(Math.random()*100 < ch) advanceRealm();
  else { save.tv = Math.round(save.tv*0.75); P.hp = Math.max(1, Math.round(P.hp*0.8)); toast(`Đột phá thất bại (${ch}%) — tổn thất một phần tu vi.`, '#ffb3a8'); persist(); updateHud(); }
}
function advanceRealm(){
  if(isLastSub()){ save.r++; save.s = 0; } else save.s++;
  save.tv = 0;
  const st = stats(); P.hp = st.hp; P.mp = mpMax();
  for(let i = 0; i < 30; i++) orbs.push({x:P.x, y:P.y-30, vx:(Math.random()-0.5)*5, vy:-Math.random()*4, t:1, c:'#f3d38f', s:2});
  toast(`Đột phá thành công: ${fullRealmName(save.r, save.s)}!`, '#f3d38f');
  persist(); updateHud();
}

/* ===== Vòng lặp ===== */
let last = performance.now(), msgT = 0, msgS = '', msgC = '#fff';
function toast(s, c){ msgS = s; msgC = c || '#fff'; msgT = 2.6; }
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if(!paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  const st = stats();
  P.inv = Math.max(0, P.inv - dt); P.skillCd = Math.max(0, P.skillCd - dt); shake = Math.max(0, shake - dt); msgT = Math.max(0, msgT - dt);
  // đả tọa
  const wantMed = keys.med && P.onGround && P.atkT < 0;
  if(wantMed && !P.med){ P.med = true; P.medT = 0; }
  if(!keys.med) P.med = false;
  if(P.med){
    P.medT += dt; P.vx = 0;
    P.hp = Math.min(st.hp, P.hp + st.hp*0.06*dt);
    P.mp = Math.min(mpMax(), P.mp + 15*dt);
    addTuVi(tvMax()*0.012*dt*(1 + zone*0.05));
  } else {
    P.mp = Math.min(mpMax(), P.mp + 4*dt);
    const spd = 105 + st.spd*0.4;
    const dir = (keys.right?1:0) - (keys.left?1:0);
    if(P.atkT < 0 || !P.onGround){
      if(dir){ P.vx = dir*spd/60; P.face = dir; P.walkT += dt; }
      else P.vx *= P.onGround ? 0.6 : 0.95;
    } else P.vx *= 0.7;
    if(want('jump') && P.onGround){ P.vy = -6.4; P.onGround = false; }
    if(want('atk') && P.atkT < 0){ P.atkT = 0; P.hitSet = new Set(); }
    if(want('skill') && P.skillCd <= 0 && P.mp >= 20){
      P.mp -= 20; P.skillCd = 0.45;
      shots.push({x:P.x + P.face*20, y:P.y-30, vx:P.face*5.5, t:0.9, hit:new Set(), mine:true});
    }
  }
  // chém: khung 9–14 của 25 khung là lúc lưỡi kiếm quét
  if(P.atkT >= 0){
    P.atkT += dt;
    const f = Math.floor(P.atkT/0.02);
    if(f >= 9 && f <= 14){
      const hx = P.x + P.face*26;
      enemies.forEach(e=>{ if(!e.dead && !P.hitSet.has(e.id) && Math.abs(e.x - hx) < 30 + e.w/2 && Math.abs((e.y - e.h/2) - (P.y - 25)) < 30 + e.h/2){ P.hitSet.add(e.id); hitEnemy(e, 1); } });
    }
    if(f >= 25) P.atkT = -1;
  }
  // vật lý người chơi
  P.vy += 0.36; P.x += P.vx*dt*60; P.y += P.vy*dt*60;
  P.x = Math.max(12, Math.min(LEVEL_LEN-12, P.x));
  const wasY = P.y - P.vy*dt*60; P.onGround = false;
  if(P.y >= GROUND){ P.y = GROUND; P.vy = 0; P.onGround = true; }
  else if(P.vy > 0) platforms.forEach(p=>{ if(P.x > p.x-6 && P.x < p.x+p.w+6 && wasY <= p.y && P.y >= p.y){ P.y = p.y; P.vy = 0; P.onGround = true; } });
  // sinh quái theo tiến độ
  if(spawnIdx < SPAWNS.length && P.x > SPAWNS[spawnIdx] - 300){
    const n = 2 + Math.floor(Math.random()*2) + (zone > 5 ? 1 : 0);
    for(let i = 0; i < n; i++) spawnEnemy(SPAWNS[spawnIdx] + 60 + i*50, false);
    spawnIdx++;
  }
  if(spawnIdx >= SPAWNS.length && !boss && !levelDone && P.x > LEVEL_LEN-520 && !enemies.some(e=>e.boss)) spawnEnemy(LEVEL_LEN-140, true);
  // quái
  enemies.forEach(e=>{
    if(e.dead) return;
    e.t += dt; e.flash = Math.max(0, e.flash - dt); e.cd -= dt;
    const dx = P.x - e.x, adx = Math.abs(dx);
    const flying = e.kind === 'spirit' || e.kind === 'fly';
    if(e.stun > 0){ e.stun -= dt; e.x += e.vx*dt*60; e.vx *= 0.85; return; }
    if(adx < 300){
      e.face = dx > 0 ? 1 : -1;
      const sp = (e.kind==='beast' ? 1.25 : flying ? 0.9 : 0.85) * (e.boss ? 0.8 : 1);
      if(e.wind > 0){
        e.wind -= dt;
        if(e.wind <= 0){
          const reach = e.boss ? 46 : 30;
          if(adx < reach + e.w/2 && Math.abs((e.y - e.h/2) - (P.y - 25)) < 40 + e.h/2) hurtPlayer(e.atk, e.x);
          e.cd = e.boss ? 1.1 : 1.3 + Math.random()*0.6;
        }
      } else if(adx > (e.boss ? 34 : 20) + e.w/2) e.x += e.face*sp*dt*60;
      else if(e.cd <= 0) e.wind = 0.35;
      if(flying) e.y += ((P.y - 34 + Math.sin(e.t*3)*12) - e.y)*0.03;
      if(e.boss){
        e.shootCd -= dt;
        if(e.shootCd <= 0 && adx > 60){ e.shootCd = 2.4; shots.push({x:e.x, y:e.y - e.h*0.6, vx:e.face*3, t:2.5, mine:false, atk:Math.round(e.atk*0.8)}); }
      }
    }
  });
  enemies = enemies.filter(e=>!e.dead);
  // đạn
  shots.forEach(s=>{
    s.x += s.vx*dt*60; s.t -= dt;
    if(s.mine) enemies.forEach(e=>{ if(!s.hit.has(e.id) && Math.abs(e.x - s.x) < e.w/2 + 10 && Math.abs((e.y - e.h/2) - s.y) < e.h/2 + 10){ s.hit.add(e.id); hitEnemy(e, 1.5); } });
    else if(Math.abs(P.x - s.x) < 12 && Math.abs(P.y - 25 - s.y) < 28){ hurtPlayer(s.atk, s.x); s.t = 0; }
  });
  shots = shots.filter(s=>s.t > 0);
  // vật phẩm
  pickups.forEach(p=>{ p.vy += 0.3; p.y = Math.min(GROUND-6, p.y + p.vy); if(Math.abs(p.x - P.x) < 16 && Math.abs(p.y - (P.y-10)) < 30){ p.got = true; P.hp = Math.min(st.hp, P.hp + st.hp*0.3); addText(P.x, P.y-64, 'Hồi Khí Đan +30%', '#8ff0c0'); } });
  pickups = pickups.filter(p=>!p.got);
  orbs.forEach(o=>{ o.x += o.vx; o.y += o.vy; o.vy += 0.15; o.t -= dt; }); orbs = orbs.filter(o=>o.t > 0);
  texts.forEach(t=>{ t.y -= 22*dt; t.t -= dt; }); texts = texts.filter(t=>t.t > 0);
  // lôi kiếp
  if(trib){
    trib.t -= dt;
    if(trib.warnX === null && trib.t <= 0.9){ trib.warnX = P.x; }
    if(trib.t <= 0){
      if(Math.abs(P.x - trib.warnX) < 20) { const d = Math.round(stats().hp*0.22); P.hp -= d; addText(P.x, P.y-60, '−' + d, '#d8c8ff'); shake = 0.3; if(P.hp <= 0){ P.hp = 0; trib = null; die(true); return; } }
      for(let i = 0; i < 8; i++) orbs.push({x:trib.warnX, y:GROUND-4, vx:(Math.random()-0.5)*4, vy:-Math.random()*3, t:0.5, c:'#d8c8ff', s:2});
      trib.flash = 0.12; trib.strikeX = trib.warnX;
      trib.left--; trib.warnX = null; trib.t = 1.3 - Math.min(0.5, (9-trib.left)*0.05);
      if(trib.left <= 0){ trib = null; advanceRealm(); }
    }
  }
  camX = Math.max(0, Math.min(LEVEL_LEN - W, P.x - 190));
  for(const k in tap) delete tap[k];
  updateHud();
}

/* ===== Vẽ ===== */
function shade(hex, f){ const n = parseInt(hex.slice(1),16); const c = [n>>16, (n>>8)&255, n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f)))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function draw(){
  const T = THEMES[zone||0];
  ctx.save();
  if(shake > 0) ctx.translate(Math.round((Math.random()-0.5)*4), Math.round((Math.random()-0.5)*4));
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(-4,-4,W+8,H+8);
  if(!P){ ctx.restore(); return; }
  // núi xa (thị sai 0.2)
  ctx.fillStyle = T.far;
  for(let i = 0; i < far.length; i++){ const x = Math.round(i*8 - camX*0.2); if(x < -8 || x > W) continue; ctx.fillRect(x, GROUND - far[i] - 20, 8, far[i] + 20); }
  // cây đá (thị sai 0.5)
  decor.forEach(d=>{
    const x = Math.round(d.x - camX*0.5); if(x < -40 || x > W+40) return;
    ctx.fillStyle = T.mid;
    if(d.kind === 'tree'){ ctx.fillRect(x+6, GROUND - d.h, 4, d.h); ctx.fillRect(x, GROUND - d.h - 12, 16, 12); ctx.fillRect(x+3, GROUND - d.h - 18, 10, 6); }
    else { ctx.fillRect(x, GROUND - d.h*0.5, 22, d.h*0.5); ctx.fillRect(x+4, GROUND - d.h*0.5 - 6, 12, 6); }
  });
  ctx.translate(-Math.round(camX), 0);
  // mặt đất
  ctx.fillStyle = T.ground; ctx.fillRect(camX-4, GROUND, W+8, H-GROUND+4);
  ctx.fillStyle = T.top; ctx.fillRect(camX-4, GROUND, W+8, 3);
  ctx.fillStyle = shade(T.ground.length===7?T.ground:'#333333', 0.75);
  for(let x = Math.floor(camX/16)*16; x < camX+W; x += 16){ ctx.fillRect(x + ((x/16)%2?6:2), GROUND+8 + ((x/16)%3)*7, 4, 3); }
  // cổng cuối
  ctx.fillStyle = T.top; ctx.fillRect(LEVEL_LEN-40, GROUND-70, 6, 70); ctx.fillRect(LEVEL_LEN-14, GROUND-70, 6, 70); ctx.fillRect(LEVEL_LEN-46, GROUND-76, 44, 6);
  // bệ đá
  platforms.forEach(p=>{ ctx.fillStyle = T.top; ctx.fillRect(p.x, p.y, p.w, 3); ctx.fillStyle = T.ground; ctx.fillRect(p.x, p.y+3, p.w, 8); ctx.fillStyle = shade(T.ground.length===7?T.ground:'#333333',0.7); ctx.fillRect(p.x+4, p.y+11, p.w-8, 3); });
  // vật phẩm
  pickups.forEach(p=>{ ctx.fillStyle = '#2f8f62'; ctx.fillRect(Math.round(p.x)-3, Math.round(p.y)-6, 6, 6); ctx.fillStyle = '#8ff0c0'; ctx.fillRect(Math.round(p.x)-1, Math.round(p.y)-8, 2, 2); });
  // quái
  enemies.forEach(e=>drawEnemy(e, T));
  // người chơi
  drawPlayer();
  // đạn
  shots.forEach(s=>{
    const x = Math.round(s.x), y = Math.round(s.y);
    if(s.mine){ const d = Math.sign(s.vx); ctx.fillStyle = 'rgba(143,240,192,.35)'; ctx.fillRect(d>0?x-26:x, y-3, 26, 6); ctx.fillStyle = '#8ff0c0'; ctx.fillRect(d>0?x-16:x, y-1, 16, 3); ctx.fillStyle = '#e6fff2'; ctx.fillRect(d>0?x:x-4, y-2, 4, 5); }
    else { ctx.fillStyle = '#ff6f5a'; ctx.fillRect(x-4, y-4, 8, 8); ctx.fillStyle = '#ffd2c8'; ctx.fillRect(x-2, y-2, 4, 4); }
  });
  orbs.forEach(o=>{ ctx.fillStyle = o.c; ctx.globalAlpha = Math.min(1, o.t*2); ctx.fillRect(Math.round(o.x), Math.round(o.y), o.s, o.s); });
  ctx.globalAlpha = 1;
  // lôi kiếp
  if(trib){
    if(trib.warnX !== null){ ctx.fillStyle = `rgba(216,200,255,${0.25 + 0.25*Math.sin(performance.now()/60)})`; ctx.fillRect(trib.warnX-20, 0, 40, GROUND); }
    if(trib.flash > 0){ trib.flash -= 1/60; ctx.fillStyle = '#efe6ff'; let x = trib.strikeX; for(let y = 0; y < GROUND; y += 12){ const nx = trib.strikeX + (Math.random()-0.5)*14; ctx.fillRect(Math.min(x,nx)-2, y, Math.abs(nx-x)+4, 13); x = nx; } }
  }
  texts.forEach(t=>{ ctx.globalAlpha = Math.min(1, t.t*2); ctx.font = 'bold 9px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(t.s, Math.round(t.x)+1, Math.round(t.y)+1); ctx.fillStyle = t.c; ctx.fillText(t.s, Math.round(t.x), Math.round(t.y)); });
  ctx.globalAlpha = 1;
  ctx.restore();
  if(trib){ ctx.fillStyle = 'rgba(20,10,40,.25)'; ctx.fillRect(0,0,W,H); ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#d8c8ff'; ctx.fillText(`Lôi kiếp còn ${trib.left} đạo`, W/2, 44); }
  if(msgT > 0){ ctx.globalAlpha = Math.min(1, msgT); ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,.55)'; const w = ctx.measureText(msgS).width + 16; ctx.fillRect(W/2 - w/2, H - 30, w, 18); ctx.fillStyle = msgC; ctx.fillText(msgS, W/2, H - 17); ctx.globalAlpha = 1; }
}
function drawPlayer(){
  if(P.inv > 0 && Math.floor(P.inv*20)%2) return;
  const x = Math.round(P.x), y = Math.round(P.y);
  let img = IMG_ATK, f = 0, bob = 0;
  if(P.med){ img = IMG_MED; f = Math.floor(P.medT*8) % 20; }
  else if(P.atkT >= 0) f = Math.min(24, Math.floor(P.atkT/0.02));
  else if(!P.onGround) f = 3;
  else if(Math.abs(P.vx) > 0.3) bob = Math.floor(P.walkT*10)%2;
  if(P.med){ ctx.fillStyle = 'rgba(143,240,192,.12)'; ctx.fillRect(x-22, y-46, 44, 46); }
  ctx.save(); ctx.translate(x, y - bob); if(P.face < 0) ctx.scale(-1, 1);
  ctx.imageSmoothingEnabled = true;
  if(img.complete && img.naturalWidth) ctx.drawImage(img, f*FW, 0, FW, FH, -FW*PS/2, -FH*PS + 2, FW*PS, FH*PS);
  ctx.restore();
}
function drawEnemy(e, T){
  const kind = e.kind === 'fly' ? 'beast' : e.kind;
  const map = PIX[kind][Math.floor(e.t*(kind==='spirit'?3:6))%2];
  const hue = (T.hue + (kind==='spirit'?150:kind==='human'?60:0)) % 360;
  const col = {a:`hsl(${hue},${e.boss?55:40}%,${kind==='spirit'?62:40}%)`, b:`hsl(${hue},35%,20%)`, e: e.wind>0 ? '#fff' : '#ff4a3a', s:'#e8c39e', c:'#c9d4d0'};
  const px = e.px, w = map[0].length*px, h = map.length*px;
  const bx = Math.round(e.x - w/2), by = Math.round(e.y - h + (kind==='spirit'||e.kind==='fly' ? Math.sin(e.t*4)*2 : 0));
  if(e.kind !== 'spirit' && e.kind !== 'fly'){ ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(bx+2, GROUND-2, w-4, 3); }
  if(e.kind === 'spirit') ctx.globalAlpha = 0.85;
  for(let r = 0; r < map.length; r++){
    const row = map[r];
    for(let c = 0; c < row.length; c++){
      const ch = row[c]; if(ch === '.') continue;
      ctx.fillStyle = e.flash > 0 ? '#ffffff' : (e.wind > 0 && ch==='a' ? shade('#c84030',1) : col[ch]);
      const cx = e.face > 0 ? c : row.length-1-c;
      ctx.fillRect(bx + cx*px, by + r*px, px, px);
    }
  }
  ctx.globalAlpha = 1;
  if(e.boss){ ctx.fillStyle = '#f3d38f'; ctx.fillRect(Math.round(e.x)-6, by-8, 12, 3); }
}

/* ===== HUD ===== */
const $ = id => document.getElementById(id);
function updateHud(){
  const st = stats(), mx = tvMax();
  $('hRealm').textContent = fullRealmName(save.r, save.s);
  $('hZone').textContent = zone != null ? `${ZONES[zone].name} · ${save.stones} linh thạch` : '';
  if(P){
    $('hpI').style.width = (P.hp/st.hp*100) + '%'; $('hpT').textContent = `Khí huyết ${Math.ceil(P.hp)}/${st.hp}`;
    $('mpI').style.width = (P.mp/mpMax()*100) + '%'; $('mpT').textContent = `Linh lực ${Math.floor(P.mp)}/${mpMax()}`;
  }
  $('tvI').style.width = (mx===Infinity ? 100 : save.tv/mx*100) + '%';
  $('tvT').textContent = mx===Infinity ? 'Tu vi viên mãn' : `Tu vi ${Math.floor(save.tv)}/${mx}`;
  const can = mx !== Infinity && save.tv >= mx && !trib;
  const b = $('brk'); b.classList.toggle('on', can);
  if(can){ const t = isLastSub() && TRIBULATION_REALMS.includes(save.r); b.textContent = t ? `Độ Cửu Cửu Lôi Kiếp → ${MAJOR_REALMS[save.r+1].name}` : `Đột Phá → ${isLastSub() ? fullRealmName(save.r+1,0) : fullRealmName(save.r, save.s+1)} · ${breakChance()}%`; }
  const tgt = boss && !boss.dead ? boss : enemies && enemies.filter(e=>!e.dead).sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x))[0];
  if(tgt && Math.abs(tgt.x - P.x) < 260){ $('target').style.display = 'block'; $('tName').textContent = (tgt.boss?'Thủ lĩnh · ':'') + tgt.name; $('tHp').style.width = Math.max(0, tgt.hp/tgt.hpMax*100) + '%'; }
  else $('target').style.display = 'none';
}

/* ===== Màn phủ: bản đồ, kết quả ===== */
function openOverlay(html){ paused = true; $('ovBox').innerHTML = html; $('overlay').classList.add('on'); Object.keys(keys).forEach(k=>keys[k]=false); document.querySelectorAll('#pad button').forEach(b=>b.classList.remove('on')); }
function closeOverlay(){ $('overlay').classList.remove('on'); }
function showMap(){
  const cards = ZONES.map((z,i)=>{
    const lock = i >= save.unlocked, done = save.cleared.includes(i);
    return `<div class="zc ${lock?'lock':''} ${done?'done':''}" ${lock?'':`onclick="startZone(${i})"`}><b>${i+1}. ${z.name}</b><small>Đề nghị: ${MAJOR_REALMS[Math.min(i, MAJOR_REALMS.length-1)].name}</small><small>${ENEMY_NAMES[i][0]}</small></div>`;
  }).join('');
  openOverlay(`<h2>Tam Giới Bí Cảnh</h2><p>Chém yêu thú để tích tu vi, đầy thanh tu vi thì đột phá. Hạ thủ lĩnh cuối bí cảnh để mở bí cảnh kế tiếp. Ngồi đả tọa để hồi khí huyết — nhưng quái vẫn đánh được ngươi.</p><div class="zones">${cards}</div>${P && !levelDone ? `<p style="margin-top:10px"><button class="btn ghost" onclick="resume()">Tiếp tục</button></p>` : ''}`);
}
function resume(){ paused = false; closeOverlay(); }
function zoneCleared(){
  if(!save.cleared.includes(zone)) save.cleared.push(zone);
  save.unlocked = Math.max(save.unlocked, Math.min(ZONES.length, zone+2));
  persist();
  const next = zone+1 < ZONES.length ? `<button class="btn" onclick="startZone(${zone+1})">Tiến vào ${ZONES[zone+1].name}</button> ` : '';
  openOverlay(`<h2>Đã chinh phục ${ZONES[zone].name}</h2><p>${ZONES[zone].blurb}</p><p>${next}<button class="btn ghost" onclick="startZone(${zone})">Đánh lại</button> <button class="btn ghost" onclick="showMap()">Bản đồ</button></p>`);
}
function die(byTrib){
  save.tv = Math.round(save.tv * (byTrib ? 0.5 : 0.8)); persist();
  openOverlay(`<h2>Tọa hóa</h2><p>${byTrib ? 'Thiên lôi đánh tan nhục thân — tu vi tổn thất một nửa.' : 'Khí huyết cạn kiệt giữa ' + ZONES[zone].name + '. Tu vi tổn thất hai phần mười.'}</p><p><button class="btn" onclick="startZone(${zone})">Trùng tu</button> <button class="btn ghost" onclick="showMap()">Bản đồ</button></p>`);
}

/* ===== Điều khiển ===== */
const KEYMAP = {ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right', ArrowUp:'jump', w:'jump', W:'jump', ' ':'jump', j:'atk', J:'atk', z:'atk', Z:'atk', k:'skill', K:'skill', x:'skill', X:'skill', ArrowDown:'med', s:'med', S:'med'};
addEventListener('keydown', e=>{
  if(e.key === 'm' || e.key === 'M'){ showMap(); return; }
  if(e.key === 'b' || e.key === 'B'){ tryBreak(); return; }
  const k = KEYMAP[e.key]; if(k){ if(!e.repeat) tap[k] = true; keys[k] = true; e.preventDefault(); }
});
addEventListener('keyup', e=>{ const k = KEYMAP[e.key]; if(k) keys[k] = false; });
document.querySelectorAll('#pad button').forEach(b=>{
  const k = b.dataset.k;
  const on = e=>{ e.preventDefault(); keys[k] = true; tap[k] = true; b.classList.add('on'); try{ b.setPointerCapture(e.pointerId); }catch(_){} };
  const off = e=>{ keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e=>e.preventDefault());
});
$('brk').addEventListener('click', tryBreak);
$('mapBtn').addEventListener('click', showMap);
addEventListener('blur', ()=>Object.keys(keys).forEach(k=>keys[k]=false));

updateHud();
showMap();
requestAnimationFrame(loop);
</script>
</body>
