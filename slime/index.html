<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Chuyển Sinh Thành Slime</title>
<style>
:root{
  --bg:#0b1020;--bg2:#111833;--panel:#141c3a;--panel2:#1a2347;--line:rgba(130,170,255,.18);--line2:rgba(130,170,255,.35);
  --txt:#e6ebff;--dim:#93a0c8;--cyan:#7fdcff;--gold:#ffd46b;--hp:#ef5b5b;--mp:#4ea3ff;--ok:#7fd88f;--bad:#ff8f8f;--vio:#c19bff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
#top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
#top .nm{font-weight:700;font-size:15px}
#top .race{color:var(--cyan);font-size:12.5px}
#top .chip{font-size:12.5px;color:var(--dim)}
#top .chip b{color:var(--txt)}
.bar{position:relative;width:150px;height:14px;background:rgba(255,255,255,.07);border-radius:7px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:7px}
.bar span{position:absolute;inset:0;text-align:center;font-size:10.5px;line-height:14px;text-shadow:0 1px 2px #000}
.bar.hp i{background:linear-gradient(90deg,#b52d2d,var(--hp))}.bar.mp i{background:linear-gradient(90deg,#1f5fb8,var(--mp))}
.bar.sm{width:100%;height:9px}.bar.sm span{display:none}
#wrap{display:grid;grid-template-columns:170px 1fr 380px;min-height:0}
#nav{display:flex;flex-direction:column;gap:3px;padding:8px;border-right:1px solid var(--line);overflow:auto;background:var(--bg2)}
#nav button{background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;text-align:left;color:var(--dim)}
#nav button.on{background:var(--panel2);border-color:var(--line2);color:var(--txt)}
#nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
#main{overflow:auto;padding:14px 18px 40px}
#logbox{display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0;background:#0d132a}
#logbox .lh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12.5px}
#log{flex:1;overflow:auto;padding:10px 12px;font-family:Georgia,"Noto Serif","Times New Roman",serif;font-size:14px;line-height:1.6}
#log p{margin:0 0 6px}
.l-sys{color:var(--cyan)}
.l-nar{color:#cfd6f2;font-style:italic}
.l-dlg b{color:var(--gold);font-style:normal}
.l-good{color:var(--ok)}.l-bad{color:var(--bad)}.l-dmg{color:#ffb38f}.l-info{color:var(--dim)}.l-day{color:var(--vio);text-align:center;font-family:"Segoe UI",sans-serif;font-size:12px;letter-spacing:.1em;margin:10px 0!important}
h2{margin:2px 0 10px;font-size:19px}
h3{margin:18px 0 8px;font-size:14.5px;color:#bcd0ff}
.sub{color:var(--dim);font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px}
.cell .t{font-weight:700}
.cell .d{color:var(--dim);font-size:12.5px;margin-top:3px;line-height:1.45}
.cell.rec{border-color:rgba(255,212,107,.6)}
.cell.lock{opacity:.5}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);margin:3px 4px 3px 0}
.btn:hover:not(:disabled){border-color:var(--cyan)}
.btn.pri{background:linear-gradient(180deg,#2c55a0,#203f78);border-color:#4f7fd6}
.btn.gold{background:linear-gradient(180deg,#7d6219,#5a450f);border-color:#c9a23e}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.red{background:rgba(160,40,40,.35);border-color:rgba(255,120,120,.5)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:rgba(255,255,255,.07);margin:2px 3px 0 0;color:var(--dim)}
.tag.c{color:var(--cyan)}.tag.g{color:var(--gold)}.tag.v{color:var(--vio)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.gd{color:var(--gold)}.cy{color:var(--cyan)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px}
.stats b{display:block;font-size:11px;color:var(--dim);font-weight:400}
.obj{border-left:3px solid var(--gold);background:rgba(255,212,107,.06);padding:9px 12px;border-radius:0 10px 10px 0;margin-bottom:12px}
.obj .t{font-size:12px;color:var(--gold);letter-spacing:.06em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:400;font-size:12px}
input[type=text]{background:#0c1430;border:1px solid var(--line2);border-radius:8px;color:var(--txt);padding:8px 10px;font-size:15px;width:100%}
/* battle */
.foes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.foe{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.foe.sel{border-color:var(--gold)}
.foe.dead{opacity:.35;cursor:default}
.foe .nm{font-weight:700}
.pred{margin-top:6px;font-size:12px;color:var(--cyan);background:rgba(127,220,255,.06);border-radius:6px;padding:4px 7px}
.side{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0}
.side .cell{padding:8px 10px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.acts button{text-align:left;padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-size:13px}
.acts button small{display:block;color:var(--dim);font-size:11px}
.acts button.sp{border-color:rgba(127,220,255,.55)}
.acts button.ul{border-color:rgba(255,212,107,.6)}
.pill{font-size:11px;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.08);margin-left:4px}
/* overlay */
#ov{position:fixed;inset:0;background:rgba(4,6,16,.8);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
#ovc{width:min(640px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#ovc .story{font-family:Georgia,"Noto Serif",serif;font-size:15px;line-height:1.7}
#ovc .story p{margin:0 0 9px}
#ovc .ch{display:flex;flex-direction:column;gap:6px;margin-top:14px}
#ovc .ch button{text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2)}
#ovc .ch button:hover:not(:disabled){border-color:var(--gold)}
#ovc .ch button small{display:block;color:var(--dim);font-size:12px}
.title{font-size:30px;margin:0;background:linear-gradient(90deg,#8fe0ff,#c4a4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:1100px){#wrap{grid-template-columns:150px 1fr 300px}}
@media (max-width:820px){
  #app{grid-template-rows:auto auto 1fr}
  #wrap{display:contents}
  #nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  #nav button{white-space:nowrap;padding:6px 10px}
  #main{padding:12px 12px 12px}
  #logbox{position:fixed;left:0;right:0;bottom:0;height:34vh;border-left:0;border-top:1px solid var(--line2);z-index:5}
  #logbox.min{height:36px}
  #main{padding-bottom:calc(34vh + 16px)}
  body.logmin #main{padding-bottom:50px}
  .bar{width:110px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <div id="wrap">
    <nav id="nav"></nav>
    <main id="main"></main>
    <aside id="logbox"><div class="lh"><span>📜 Nhật ký — dòng suy nghĩ & thông báo của Đại Hiền Giả</span><button class="btn sm" id="logT">▾</button></div><div id="log"></div></aside>
  </div>
</div>
<div id="ov" class="hidden"><div id="ovc"></div></div>

// Chỉ số
// =====================================================================
function baseStats(ep) { const s = Math.sqrt(ep); return { atk: 5 + s * .9, def: 3 + s * .5, hp: 40 + s * 5, mp: 30 + s * 3, spd: 10 + s * .1 }; }
function PS() {
  const b = baseStats(G.ep), m = MIM[G.form];
  let atk = b.atk * m.atk, def = b.def * m.def, spd = b.spd * m.spd, hp = b.hp, mp = b.mp;
  if (has('thangiap')) def *= 1.2;
  if (G.gear.a) def *= 1 + (GEAR[G.gear.a].def || 0);
  if (m.weapon && G.gear.w) atk *= 1 + GEAR[G.gear.w].atk;
  if (G.race !== 'slime') { hp *= 1.3; mp *= 1.5; }
  if (G.flags.named) { hp *= 1.05; mp *= 1.05; }
  return { atk, def, spd, hp: Math.round(hp), mp: Math.round(mp) };
}
function res(el) {
  if (!el || el === 'space') return 0;
  let r = 0;
  for (const k in RES_OF) if (RES_OF[k] === el) {
    if (G.nul[k]) return 1;
    if (G.skills[k]) r = Math.min(.9, .4 + .1 * G.skills[k]);
  }
  if (['poison', 'para', 'corr'].includes(el) && has('taisinhvohan')) r = Math.max(r, .9);
  if (G.path === 'spirit' && ['fire', 'water', 'wind', 'earth'].includes(el)) r = Math.max(r, .6);
  return r;
}
const dmgTaken = () => (has('rdau') ? .9 : 1) * (has('uriel') ? .6 : 1);
function dodgeRate(el, foe) {
  const m = MIM[G.form]; let d = m.dodge + (el === 'phys' ? m.pd : 0);
  if (has('trigiac')) d += .05; if (has('raphael')) d += .2;
  if (B && B.buf.dodge > 0) d += .5;
  if (foe) d += clamp((PS().spd - foe.spd * (foe.st.slow > 0 ? .6 : 1)) * .004, -.1, .12);
  return clamp(d, 0, .85);
}
function critRate() { let c = .05; if (has('malucamtri')) c += .05; if (has('nhietcamtri')) c += .03; if (has('trigiac')) c += .1; if (has('raphael')) c += .15; return c; }
function elBonus(el) {
  let b = 1;
  if (G.path === 'demon') b *= 1.2;
  const elem = ['water', 'fire', 'wind', 'earth'].includes(el);
  if (G.path === 'spirit' && elem) b *= 1.3;
  if (has('tinhlinhvuong') && elem) b *= 1.5;
  if (el === 'thunder' && has('veldora')) b *= 1.5;
  if (G.form === 'human' && el && el !== 'phys') b *= MIM.human.magic;
  return b;
}

function log(type, text, who) {
  G.log.push([type, text, who || '']);
  if (G.log.length > 250) G.log.splice(0, G.log.length - 250);
  appendLog([type, text, who]);
}
function lineHtml([type, text, who]) {
  if (type === 'sys') return `<p class="l-sys">《${esc(text)}》</p>`;
  if (type === 'dlg') return `<p class="l-dlg"><b>${esc(who)}:</b> 「${esc(text)}」</p>`;
  return `<p class="l-${type}">${esc(text)}</p>`;
}
function appendLog(l) { const el = $('#log'); el.insertAdjacentHTML('beforeend', lineHtml(l)); el.scrollTop = el.scrollHeight; }
function renderLog() { $('#log').innerHTML = G.log.map(lineHtml).join(''); $('#log').scrollTop = 1e9; }
const sage = t => log('sys', t);
const sageName = () => has('raphael') ? 'Trí Tuệ Chi Vương' : 'Đại Hiền Giả';

// =====================================================================
// Thời gian
// =====================================================================
function spend(n, auto) {
  for (let i = 0; i < n; i++) {
    G.phase++;
    G.mp = Math.min(PS().mp, G.mp + PS().mp * .08);
    if (G.phase >= 4) { G.phase = 0; newDay(auto); }
  }
}
function newDay(auto) {
  G.day++;
  log('day', `— Ngày ${G.day} —`);
  const s = PS(); G.hp = Math.min(s.hp, G.hp + s.hp * .3);
  for (const v of G.vas) v.hp = Math.min(1, (v.hp ?? 1) + .5);
  if (G.flags.veldEaten && !G.flags.veldFree) {
    const add = has('raphael') ? 25 : .5 + (has('kebiendoi') ? .3 : 0);
    G.veld = Math.min(100, G.veld + add);
    if (G.veld >= 100 && !G.flags.veldReady) { G.flags.veldReady = 1; sage('Thông báo. Đã giải mã hoàn toàn Vô Hạn Lao Ngục. Có thể giải phóng Veldora bất cứ lúc nào.'); queue('veld_free'); }
  }
  townTick();
  storyDay();
  if (!auto && G.town.lv >= 1 && Math.random() < .4) dailyEvent();
}
function doSleep(days) {
  sage(`Cảnh báo: Ma tố cạn kiệt. Chuyển sang Chế độ Ngủ Đông (dự kiến ${days} ngày).`);
  log('nar', 'Cơ thể ngài mềm nhũn, ý thức chìm vào bóng tối…');
  for (let d = 0; d < days; d++) { G.phase = 0; newDay(true); }
  const s = PS(); G.mp = s.mp; G.hp = s.hp;
  sage('Ma tố đã hồi phục. Kết thúc Chế độ Ngủ Đông.');
}

function queue(id) { if (!G.evq.includes(id)) G.evq.push(id); }
function L(...a) { return a; }
const N = t => ['nar', t], D = (w, t) => ['dlg', t, w], S = t => ['sys', t];
const EV = {};
function showNext() {
  if (B || !G.evq.length || !$('#ov').classList.contains('hidden')) return;
  const id = G.evq[0], e = EV[id];
  if (!e) { G.evq.shift(); return showNext(); }
  const lines = e.l();
  for (const l of lines) log(...l);
  const chs = e.c ? e.c() : [{ t: 'Tiếp tục' }];
  $('#ovc').innerHTML = `<div class="sub">${esc(e.t || '')}</div><div class="story">${lines.map(lineHtml).join('')}</div><div class="ch">${chs.map((c, i) => `<button data-i="${i}" ${c.dis ? 'disabled' : ''}>${esc(c.t)}${c.s ? `<small>${esc(c.s)}</small>` : ''}</button>`).join('')}</div>`;
  $('#ov').classList.remove('hidden');
  $('#ovc').scrollTop = 0;
  $('#ovc').querySelectorAll('.ch button').forEach(b => b.onclick = () => {
    const c = chs[+b.dataset.i];
    $('#ov').classList.add('hidden');
    G.evq.shift();
    if (c.t !== 'Tiếp tục') log('info', '▸ ' + c.t);
    if (c.f) c.f();
    save(); render(); showNext();
  });
}

  let h = `<h2>🔀 Dung Hợp Kỹ Năng</h2><p class="sub">${sageName()} có thể hợp nhất các kỹ năng cùng nhóm thành kỹ năng cấp cao. Kỹ năng thành phần biến mất nhưng hiệu lực của chúng được kế thừa. Các công thức cao cấp cần [Kẻ Biến Đổi]; Kỹ năng Tối thượng cần thức tỉnh.</p><div class="grid">`;
  for (const f of FU) {
    const st = fuseState(f), k = SK[f.id];
    h += `<div class="cell ${st.ok ? 'rec' : st.done ? '' : 'lock'}"><div class="t">${k.n} ${st.done ? '<span class="ok">✓</span>' : ''}${k.t === 'ultimate' || k.ult ? ' <span class="tag g">Tối thượng</span>' : ''}</div>
      <div class="d">${f.from.map(c => `<span class="${G.skills[c] ? 'ok' : 'bad'}">${SK[c].n}</span>`).join(' + ')}${f.need ? ` · cần giữ: ${f.need.map(c => `<span class="${has(c) ? 'ok' : 'bad'}">${SK[c].n}</span>`).join(', ')}` : ''}${f.cond ? ` · <span class="${st.cond ? 'ok' : 'bad'}">${f.condT}</span>` : ''}<br>${esc(k.d)}</div>
      ${st.ok ? `<button class="btn sm gold" data-a="fuse:${f.id}">★ Dung hợp</button>` : ''}</div>`;
  }
  return h + '</div>';
}
function bagView() {
  let h = `<h2>🍽️ Dạ Dày</h2><p class="sub">Không gian lưu trữ của Kẻ Săn Mồi. Mọi thứ được hấp thụ sẽ được ${sageName()} phân tích và có thể tái tạo.</p>`;
  if (G.flags.veldEaten && !G.flags.veldFree) h += `<div class="card">🐲 <b>Bạo Phong Long Veldora</b> đang bị cách ly. Giải mã Vô Hạn Lao Ngục: <b>${G.veld.toFixed(1)}%</b><div class="bar mp sm" style="margin-top:6px"><i style="width:${G.veld}%"></i></div></div>`;
  h += `<h3>Nguyên liệu</h3><div class="grid">${Object.keys(MAT).filter(k => G.mats[k] > 0).map(k => `<div class="cell"><div class="t">${MAT[k][1]} ${MAT[k][0]} <span class="gd">x${G.mats[k]}</span></div></div>`).join('') || '<div class="cell lock">Trống</div>'}</div>`;
  if (G.town.lv >= 1) h += `<div class="row" style="margin-top:6px"><button class="btn sm" data-a="meat" ${G.mats.thit ? '' : 'disabled'}>🍖 Chuyển Thịt Ma Vật vào kho lương (+6/miếng)</button><button class="btn sm" data-a="herb" ${(G.mats.hipokute || 0) >= 2 ? '' : 'disabled'}>🌿 Chuyển Cỏ Hipokute vào kho thảo dược</button><button class="btn sm" data-a="ore" ${G.mats.maquang ? '' : 'disabled'}>🪨 Chuyển Ma Quặng vào kho lĩnh địa</button></div>`;
  h += `<h3>⚗️ Chế tạo trong Dạ Dày</h3><div class="grid">${CRAFT.map(r => { const ok = canPay(G.mats, r.need); return `<div class="cell ${ok ? 'rec' : ''}"><div class="t">${ITEM[r.id].i} ${ITEM[r.id].n} <span class="sub">(có ${G.items[r.id] || 0})</span></div><div class="d">${Object.keys(r.need).map(k => `<span class="${(G.mats[k] || 0) >= r.need[k] ? 'ok' : 'bad'}">${MAT[k][0]} ${G.mats[k] || 0}/${r.need[k]}</span>`).join(' · ')}<br>${ITEM[r.id].d}</div>${ok ? `<button class="btn sm gold" data-a="craft:${r.id}">★ Chế tạo</button>` : ''}</div>`; }).join('')}</div>`;
  h += `<h3>⚒️ Rèn đúc trang bị</h3><div class="grid">${Object.keys(GEAR).map(k => { const g = GEAR[k], own = G.owned.includes(k), ok = !own && g.req() && canPay(G.mats, g.need); return `<div class="cell ${ok ? 'rec' : ''} ${!own && !g.req() ? 'lock' : ''}"><div class="t">${g.n} ${own ? '<span class="ok">✓</span>' : ''}</div><div class="d">${g.armor ? `Thủ +${pct(g.def)}` : `Công +${pct(g.atk)} (Nhân Hình)`} · ${Object.keys(g.need).map(m => `<span class="${(G.mats[m] || 0) >= g.need[m] ? 'ok' : 'bad'}">${MAT[m][0]} ${G.mats[m] || 0}/${g.need[m]}</span>`).join(' · ')} · <span class="${g.req() ? 'ok' : 'bad'}">${g.reqT}</span></div>${ok ? `<button class="btn sm gold" data-a="forge:${k}">Rèn</button>` : ''}${own ? `<button class="btn sm" data-a="equip:${k}">${G.gear.w === k || G.gear.a === k ? 'Tháo' : 'Trang bị'}</button>` : ''}</div>`; }).join('')}</div>`;
  return h;
}
function vasView() {
  let h = `<h2>👥 Thuộc Hạ (${G.vas.length})</h2><p class="sub">Tối đa 3 thuộc hạ đồng hành trong chiến đấu. Thuộc hạ ở lại lĩnh địa có thể làm trưởng bộ phận để tăng năng suất.</p><table><tr><th></th><th>Tên</th><th>Chủng tộc</th><th>EP</th><th>Đồng hành</th><th>Phụ trách</th></tr>`;
  for (const v of G.vas) {
    const c = CANON[v.canon];
    h += `<tr><td>${c ? c.i : '🛡️'}</td><td><b>${esc(v.name)}</b><div class="sub">${esc(c ? c.role : 'Thuộc hạ được ban tên')}</div></td><td class="sub">${RACE[v.race]}</td><td>${fmt(v.ep)}${v.hp < 1 ? `<div class="sub">HP ${pct(v.hp)}</div>` : ''}</td>
      <td>${v.race === 'dwarf' || (c && !c.acts) ? '<span class="sub">—</span>' : `<button class="btn sm ${v.party ? 'gold' : ''}" data-a="party:${v.id}">${v.party ? '✓ Đi cùng' : 'Đưa đi'}</button>`}</td>
      <td>${G.town.lv >= 1 ? `<select onchange="leadSel(${v.id},this.value)">${['', ...Object.keys(JOB), 'intel', 'train', 'all'].map(j => `<option value="${j}" ${v.lead === j || (!v.lead && j === '') ? 'selected' : ''}>${j ? (JOB[j] ? JOB[j].i + ' ' + JOB[j].n : LEAD_EXTRA[j]) : '—'}</option>`).join('')}</select>` : ''}</td></tr>`;
  }
  return h + '</table>';
}
window.leadSel = (id, j) => { const v = G.vas.find(x => x.id === id); if (v) { v.lead = j || null; save(); render(); } };
function townView() {
  const T = G.town, R = T.res, o = prodPreview(), idle = workers() - assigned();
  let h = `<h2>🏘️ ${esc(townName())}</h2><div class="stats">
    ${Object.keys(RES_N).map(k => `<div><b>${RES_N[k][1]} ${RES_N[k][0]}</b>${fmt(R[k])}${k !== 'vang' ? `<span class="sub"> / ${fmt(resCap(k))}</span>` : ''}</div>`).join('')}
    <div><b>Dân số / Chỗ ở</b>${fmt(totalPop())} / ${fmt(housing())}</div><div><b>Sĩ khí</b>${Math.round(T.morale)}</div><div><b>Phòng thủ</b>${fmt(townDef())}</div><div><b>Hiệu suất chủng tộc</b>x${raceEff().toFixed(2)}</div></div>
    <p class="sub">Dân cư: ${G.pop.goblin ? `${fmt(G.pop.goblin)} ${G.evo.goblin ? 'Hobgoblin' : 'Goblin'}` : ''}${G.pop.wolf ? ` · ${fmt(G.pop.wolf)} ${G.evo.wolf ? 'Lang Bão Tố' : 'Hắc Lang'}` : ''}${G.pop.orc ? ` · ${fmt(G.pop.orc)} ${G.evo.orc ? 'High Orc' : 'Orc'}` : ''}${G.pop.lizard ? ` · ${fmt(G.pop.lizard)} ${G.evo.lizard ? 'Long Nhân' : 'Lizardman'}` : ''}${G.pop.dwarf ? ` · ${G.pop.dwarf} Người Lùn` : ''} · ${G.vas.length} thuộc hạ có tên</p>`;
  const nx = TLV[T.lv + 1];
  if (nx) h += `<div class="card"><b>⬆️ Phát triển thành ${esc(nx.n())}</b><div class="sub">${townReqText(T.lv + 1)}</div><button class="btn sm gold" data-a="townup" ${townReqOk(T.lv + 1) ? '' : 'disabled'}>Phát triển</button></div>`;
  h += `<h3>👷 Phân công lao động — ${fmt(assigned())}/${fmt(workers())} (rảnh ${fmt(idle)})</h3><table><tr><th>Công việc</th><th>Số người</th><th></th><th>Trưởng bộ phận</th></tr>`;
  for (const j in JOB) {
    const ok = jobOk(j), leads = G.vas.filter(v => v.lead === j && !v.party).map(v => v.name);
    h += `<tr class="${ok ? '' : 'sub'}"><td>${JOB[j].i} ${JOB[j].n}${ok ? '' : ` <span class="tag">cần ${BLD[JOB[j].bld].n}</span>`}</td><td><b>${fmt(G.jobs[j])}</b></td><td>${[-50, -10, 10, 50].map(d => `<button class="btn sm" data-a="job:${j}:${d}">${d > 0 ? '+' : ''}${d}</button>`).join('')}</td><td class="sub">${leads.join(', ') || '—'}${leadMul(j) > 1 ? ` (x${leadMul(j).toFixed(1)})` : ''}</td></tr>`;
  }
  h += `</table><div class="row" style="margin-top:6px"><button class="btn sm pri" data-a="autojob">🧠 ${sageName()}: tối ưu hóa phân công</button></div>`;
  h += `<p class="sub">Dự kiến mỗi ngày: lương thực ${o.food - o.eat >= 0 ? '+' : ''}${fmt(o.food - o.eat)} (sản xuất ${fmt(o.food)}, tiêu thụ ${fmt(o.eat)}) · gỗ +${fmt(o.go)} · điểm xây dựng +${fmt(o.pts)} · Ma Quặng +${fmt(o.ore)} · vũ khí +${o.vk.toFixed(1)} · vải +${o.vai.toFixed(1)} · thuốc +${o.duoc.toFixed(1)} · vàng +${fmt(o.vang)}</p>`;
  h += `<h3>🏗️ Công trình ${T.q.length ? `— đang xây: ${BLD[T.q[0].id].n} cấp ${T.q[0].lv} (${Math.floor(T.q[0].prog)}/${T.q[0].need})${T.q.length > 1 ? ` · chờ ${T.q.length - 1}` : ''}` : ''}</h3><div class="grid">`;
  for (const id in BLD) {
    const Bd = BLD[id], l = (T.bld[id] || 0), nl = l + T.q.filter(q => q.id === id).length + 1, lock = Bd.req && !Bd.req(), max = nl > Bd.max;
    const c = !max ? Bd.cost(nl) : null;
    h += `<div class="cell ${lock ? 'lock' : ''}"><div class="t">${Bd.n} ${l ? `<span class="tag g">cấp ${l}/${Bd.max}</span>` : ''}</div><div class="d">${esc(Bd.d)}${lock ? `<br><span class="bad">${Bd.reqT}</span>` : max ? '<br><span class="ok">Tối đa</span>' : `<br>${Object.keys(c).map(k => `<span class="${(R[k] || 0) >= c[k] ? 'ok' : 'bad'}">${RES_N[k][1]}${c[k]}</span>`).join(' ')} · ${Bd.pts(nl)} điểm xây</div>${!lock && !max ? `<button class="btn sm" data-a="build:${id}" ${canPay(R, c) ? '' : 'disabled'}>${l || nl > 1 ? 'Nâng cấp' : 'Xây dựng'}</button>` : ''}`}</div>`;
  }
  return h + '</div>';
}
function dipView() {
  let h = `<h2>🤝 Ngoại Giao</h2><p class="sub">Hảo cảm tăng khi giao thương, tặng quà và qua các sự kiện. Thông thương cần Đường Lớn và hảo cảm ≥ 10; hiệp ước tăng giá bán 30%.</p><table><tr><th>Thế lực</th><th>Hảo cảm</th><th>Quan hệ</th><th></th></tr>`;
  for (const k in NAT) {
    const r = G.rel[k], st = G.treaty[k] ? '<span class="ok">Đồng minh (hiệp ước)</span>' : r >= 50 ? '<span class="ok">Thân thiện</span>' : r >= 0 ? 'Trung lập' : '<span class="bad">Thù địch</span>';
    const canTrade = NAT[k].trade && (G.town.bld.duong || 0) >= (NAT[k].trade === 'duong1' ? 1 : 2);
    h += `<tr><td><b>${NAT[k].n}</b><div class="sub">${NAT[k].r}</div></td><td>${r}</td><td>${st}</td><td>${['dwargon', 'blumund', 'jura', 'milim'].includes(k) ? `<button class="btn sm" data-a="gift:${k}" ${G.town.res.vang >= 100 && r < 100 ? '' : 'disabled'}>🎁 Tặng quà (100 vàng)</button>` : ''}${NAT[k].trade ? `<button class="btn sm ${G.trade[k] ? 'gold' : ''}" data-a="trade:${k}" ${canTrade ? '' : 'disabled'}>${G.trade[k] ? '✓ Đang thông thương' : 'Mở thông thương'}${canTrade ? '' : ` (cần Đường Lớn cấp ${NAT[k].trade === 'duong1' ? 1 : 2})`}</button>` : ''}</td></tr>`;
  }
  return h + '</table><p class="sub">Dwargon mua vũ khí & Ma Quặng · Blumund mua thuốc & vải · Khách điếm thu hút du khách Blumund.</p>';
}
function sageView() {
  return `<h2>🧠 ${sageName()}</h2><p class="sub">${has('raphael') ? '« Thông báo. Mọi câu hỏi của chủ nhân đều đã có câu trả lời. »' : '« Trả lời. Xin hãy đặt câu hỏi. »'}</p>
  <div class="grid">
    <div class="cell"><div class="t">Phân tích bản thân</div><div class="d">Tỉ lệ né, chí mạng, kháng tính hiện tại.</div><button class="btn sm" data-a="ask:self">Hỏi</button></div>
    <div class="cell"><div class="t">Đề xuất dung hợp</div><div class="d">Công thức khả dụng hoặc gần nhất.</div><button class="btn sm" data-a="ask:fuse">Hỏi</button></div>
    <div class="cell"><div class="t">Đề xuất chế tạo</div><div class="d">Vật phẩm & trang bị có thể làm ngay.</div><button class="btn sm" data-a="ask:craft">Hỏi</button></div>
    <div class="cell"><div class="t">Phân tích mục tiêu kế tiếp</div><div class="d">Điểm yếu của Boss và EP đề xuất.</div><button class="btn sm" data-a="ask:boss">Hỏi</button></div>
    <div class="cell"><div class="t">Tối ưu hóa lĩnh địa</div><div class="d">Lương thực, lao động, chỗ ở, điều kiện phát triển.</div><button class="btn sm" data-a="ask:town" ${G.town.lv ? '' : 'disabled'}>Hỏi</button></div>
    <div class="cell"><div class="t">Vô Hạn Lao Ngục</div><div class="d">Tiến độ giải mã phong ấn của Veldora.</div><button class="btn sm" data-a="ask:veld">Hỏi</button></div>
  </div><p class="sub" style="margin-top:12px">Câu trả lời hiện trong Nhật ký.</p>`;
}
function dexView() {
  let h = `<h2>📖 Bách Khoa Ma Vật</h2><div class="grid">`;
  for (const k in SP) {
    const d = SP[k]; if (!G.seen[k]) continue;
    const a = G.ana[k] || 0;
    h += `<div class="cell"><div class="t">${d.i} ${d.n}</div><div class="d">EP ~${fmt(d.ep)} · Phân tích ${Math.floor(a)}% · Đã nuốt ${G.eaten[k] || 0}<br>${a > 0 || has('trigiac') ? esc(weakText(d)) : 'Chưa rõ điểm yếu'}<br>${d.learn.length ? 'Kỹ năng: ' + d.learn.map(([th, s]) => a >= th ? SK[s].n : `??? (${th}%)`).join(', ') : ''}${d.mim ? `<br>Mô Phỏng: ${G.forms.includes(d.mim) ? MIM[d.mim].n : '??? (100%)'}` : ''}${d.name ? '<br><span class="gd">Có thể thu phục & ban tên</span>' : ''}</div></div>`;
  }
  return h + '</div>';
}

// =====================================================================
// Lưu / tải / khởi động
// =====================================================================
function save() { if (!G) return; try { localStorage.setItem(SAVE, JSON.stringify(G)); } catch (e) { } }
function load() { try { const d = JSON.parse(localStorage.getItem(SAVE)); return d && d.v ? d : null; } catch (e) { return null; } }
function titleScreen() {
  const sv = load();
  $('#ovc').innerHTML = `<h1 class="title">Chuyển Sinh Thành Slime</h1><div class="sub">Text RPG · Xây dựng Quốc gia · Theo light novel <i>Tensei Shitara Slime Datta Ken</i></div>
    <div class="story" style="margin-top:12px"><p>Một nhân viên văn phòng 37 tuổi bị đâm chết trên đường phố Tokyo — và tỉnh dậy trong một hang động tối tăm, dưới hình dạng một con slime.</p>
    <p>Nuốt Chửng ma vật để giải mã kỹ năng · Dung hợp thành Kỹ năng Tối thượng · Ban tên cho thuộc hạ · Dựng nên Liên Bang Jura Tempest · Thức tỉnh thành Ma Vương.</p></div>
    <label class="sub">Tên được Veldora ban cho</label><input type="text" id="tName" value="${esc(sv ? sv.name : 'Rimuru')}" maxlength="16">
    <div class="ch"><button id="tNew">Bắt đầu kiếp mới<small>Chương 1 · Chuyển Sinh</small></button>${sv ? `<button id="tCont">Tiếp tục<small>${esc(sv.name)} · Ngày ${sv.day} · Chương ${Math.min(10, sv.ch)} · EP ${fmt(sv.ep)}</small></button>` : ''}</div>
    <p class="sub" style="margin-top:14px">Muốn hành động thời gian thực? <a href="hanh-dong/" style="color:var(--cyan)">Chơi bản hành động</a> · <a href="../" style="color:var(--cyan)">Phàm Nhân Vấn Đạo</a></p>`;
  $('#ov').classList.remove('hidden');
  $('#tNew').onclick = () => { if (sv && !confirm('Bắt đầu lại sẽ xóa tiến trình cũ. Tiếp tục?')) return; newGame(($('#tName').value.trim() || 'Rimuru').slice(0, 16)); $('#ov').classList.add('hidden'); renderLog(); render(); showNext(); };
  if (sv) $('#tCont').onclick = () => { G = sv; B = G.battle; if (B) for (const a of B.allies) a.v = G.vas.find(v => v.id === a.id) || a.v; $('#ov').classList.add('hidden'); renderLog(); render(); showNext(); };
}
$('#logT').onclick = () => { const m = $('#logbox').classList.toggle('min'); document.body.classList.toggle('logmin', m); $('#logT').textContent = m ? '▴' : '▾'; };
titleScreen();
</script>
