/* ---------------- Cửa hàng ---------------- */
function tgItemLabel(it){
  if(it.type==='insight') return `Pháp tắc tinh hoa ${LAWS[it.law].short} (+${it.amt})`;
  if(it.type==='memory') return 'Hồi Ức Đan (1 mảnh ký ức)';
  if(it.type==='timeArt') return TIME_ARTS.find(a=>a.id===it.id).name;
  if(it.type==='heal') return `${HEAL_PILLS[it.tier-1].name} ×${it.n}`;
  if(it.type==='heritage') return 'Thiên Sát Trấn Ngục Công';
  if(it.type==='tienkhi') return 'Luyện một kiện tiên khí ở thần lò';
  if(it.type==='tinhsa') return `Tinh Thần Sa ×${it.n}`;
  if(it.type==='relic') return relicDef(it.relic).name;
  if(it.type==='ltExt') return 'Luyện Thần Thuật — tàn thiên Tiên Giới';
  if(it.type==='daoThanChau') return 'Đạo Thần Châu';
  return '?';
}
function tgItemBlocked(it){
  const g = tg();
  if(it.type==='memory' && g.memoryRestored) return 'Đã nhớ lại';
  if(it.type==='timeArt' && g.timeArts.includes(it.id)) return 'Đã có';
  if(it.type==='heritage' && g.thienSat.have) return 'Đã có';
  if(it.type==='ltExt' && g.ltExt) return 'Đã có';
  if(it.type==='daoThanChau' && g.daoThanChau) return 'Đã có';
  if(it.type==='relic' && hasRelic(it.relic)) return 'Đã có';
  if(it.type==='insight' && g.laws[it.law]>=lawCap()) return 'Đã chạm trần';
  return '';
}
function tgBuy(slot, idx){
  const g = tg(), m = g[slot]; if(!m) return;
  const it = tgFaction(m.id).shop[idx];
  if(m.rank<it.rank || tgItemBlocked(it)) return;
  if(m.contrib<it.cost){ addLog('Không đủ cống hiến.'); render(); return; }
  m.contrib -= it.cost;
  let msg = '';
  if(it.type==='insight'){ g.laws[it.law] = Math.min(lawCap(), g.laws[it.law]+it.amt); msg = `${LAWS[it.law].short} +${it.amt}.`; }
  else if(it.type==='memory') msg = 'Nuốt Hồi Ức Đan.' + addMemory();
  else if(it.type==='timeArt') msg = grantTimeArt(it.id);
  else if(it.type==='heal'){ state.healPills[it.tier] = (state.healPills[it.tier]||0)+it.n; msg = `Nhận ${tgItemLabel(it)}.`; }
  else if(it.type==='heritage') msg = grantTgHeritage('thienSat');
  else if(it.type==='ltExt') msg = grantTgHeritage('ltExt');
  else if(it.type==='tinhsa'){ g.tinhSa += it.n; msg = `Nhận ${it.n} Tinh Thần Sa.`; }
  else if(it.type==='relic') msg = grantRelic(it.relic);
  else if(it.type==='daoThanChau'){ g.daoThanChau = true; msg = 'Thiên Đình ban thưởng Đạo Thần Châu — mọi pháp tắc lĩnh ngộ nhanh hơn 50%.'; }
  else if(it.type==='tienkhi'){
    const base = TREASURES[Math.floor(Math.random()*TREASURES.length)], s = 6+state.realmIdx*0.8;
    const t = {name:`${base.name} · Tiên Khí`, tier:4, temperCount:0, bonus:{atk:Math.round((base.bonus.atk||0)*s*3), def:Math.round((base.bonus.def||0)*s*3), crit:Math.round((base.bonus.crit||0)*s*0.3)}};
    if(state.treasure && state.lg && lg().bachMach.have && lg().spare.length<12) lg().spare.push(state.treasure);
    state.treasure = t; msg = `Thần lò Bách Tạo Sơn luyện ra 【${t.name}】 (${ngFmtBonus(t.bonus)}), trang bị ngay.`;
  }

}
function exchangeTienThach(n){
  const cost = n*1000;
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để đổi ${n} tiên nguyên thạch.`); render(); return; }
  state.spiritStones -= cost; tg().tienThach += n;
  addLog(`Đổi ${cost} linh thạch hạ giới lấy ${n} tiên nguyên thạch — tỷ giá cắt cổ, nhưng không còn cách nào khác.`); render();
}

function tamThiDone(){ const t = tg().tamThi; return t.thien && t.ac && t.chap; }
function startTamThi(k){
  const g = tg();
  if(state.realmIdx<10 || g.tamThi[k] || state.combat || state.expd) return;

  addLog(`Ngươi nhập định, ${TAM_THI[k].name} tách ra khỏi thân thể, mang dung mạo của chính ngươi. ${TAM_THI[k].desc}`);

function canChungDao(){ const g = tg(); return g.mainLaw && g.laws[g.mainLaw]>=100 && g.daoToBeaten; }
function challengeDaoTo(){
  const g = tg();

    text:`Mỗi đại đạo chỉ dung một Đạo Tổ. ${d.desc} Muốn chứng đạo ${LAWS[g.mainLaw].short}, ngươi phải đánh bại kẻ này.`,
    options:[{label:'Chiến', act:'fightEnemy', args:[e]},{label:'Chưa phải lúc', act:'ok', args:[]}]});

function tgOnCombatWin(enemy){
  if(!state.tg || !tgSeen()) return '';
  const g = tg(); let msg = '';
  if(state.realmIdx>=8){ const t = Math.round((3+Math.random()*5)*(state.realmIdx-7)*(enemy.isBoss?3:1)); g.tienThach += t; msg += ` +${t} tiên nguyên thạch.`; }
  if(enemy.tgPatrol){ g.wanted = Math.min(100, g.wanted+8); msg += ' Giết người của Thiên Đình — truy nã +8.'; }
  if(enemy.tgMission){ const m = g[enemy.tgMission]; if(m){ const c = Math.round(50+state.realmIdx*6); m.merit += c; m.contrib += c; msg += ` Cống hiến +${c}.`; } }
  if(enemy.tamThi){ g.tamThi[enemy.tamThi] = true; msg += ` ${TAM_THI[enemy.tamThi].name} bị chém, tan thành tro — tâm cảnh nhẹ bẫng.${tamThiDone()?' Tam thi đã trảm, cánh cửa Đại La mở ra!':''}`; }
  if(enemy.daoThanRaid){ g.daoThanChau = true; if(g.side) { g.side.merit += 800; g.side.contrib += 800; } msg += ' Đạo Thần Châu nằm trong tay ngươi! Mọi pháp tắc lĩnh ngộ nhanh hơn 50%. Thiên Đình chấn động, truy nã tối đa.'; }
  if(enemy.daoTo){ g.daoToBeaten = true; msg += ` ${enemy.name} bại trận, đại đạo ${LAWS[g.mainLaw].short} không còn chủ! Giờ chỉ còn đạo thiên kiếp cuối cùng.`; }
  return msg;
}
function tgTimeSkip(c){
  const v = lawVal('thoi');
  if(v<10 || Math.random()>=Math.min(0.2, v/500)) return false;
  combatLog(`Thời Gian Pháp Tắc vận chuyển — thời gian quanh ${c.enemy.name} đình trệ, nó không thể ra tay!`);
  return true;
}
function tgSpaceReduce(){ return Math.min(0.25, lawVal('khong')/400); }
function tgTryRevive(c){
  if(c.revived) return false;
  let pct = 0, src = '';
  if(soulImmortal()){ pct = 0.5; src = 'Thần hồn bất diệt của Luyện Thần Thuật'; }
  else if(lawVal('luan')>=30){ pct = 0.3; src = 'Luân Hồi Pháp Tắc'; }
  if(!pct) return false;
  c.revived = true;
  state.hp = Math.round(state.stats.hpMax*pct);
  combatLog(`${src} xoay chuyển sinh tử — ngươi trùng sinh với ${state.hp} khí huyết!`);
  return true;
}
function tgCombatAction(type){
  const c = state.combat, g = tg();
  if(type==='huyenthe'){
    if(!g.daiNguHanh || c.huyenUsed) return null;
    const r = pathAdjustedDamage(state.stats.atk*(3+g.laws.thoi/50), c.enemy.def*0.5, state.stats.crit, c.enemy, false);
    c.frozen = Math.max(c.frozen||0, 2); c.huyenUsed = true;
    return {dmg:r.dmg, msg:`Đại Ngũ Hành Huyễn Thế Quyết — năm dòng thời gian quấn lấy ${c.enemy.name}, đông cứng hai lượt và chém ra ${r.dmg} sát thương!`};
  }
  if(type==='tranguc'){
    const tier = Math.floor(g.thienSat.khieu/120);
    if(!g.thienSat.have || tier<3 || c.ngucUsed) return null;
    const r = pathAdjustedDamage(state.stats.atk*(2+tier*0.2), c.enemy.def*0.6, state.stats.crit, c.enemy, true);
    c.ngucUsed = true;
    return {dmg:r.dmg, msg:`${g.thienSat.khieu} huyền khiếu đồng loạt bùng sáng tinh quang — Thiên Sát Trấn Ngục quyền giáng xuống, ${r.dmg} sát thương!`};
  }
  return null;
}
function renderTgCombatButtons(c){
  if(!state.tg || !tgSeen()) return '';

}

/* ---------------- Chưởng Thiên Bình & Tạo Hóa Lộ ----------------
   Bình nhỏ hấp thụ ánh trăng, ngưng thành Tạo Hóa Lộ (lục dịch). Một giọt
   thúc linh dược lên cả trăm năm dược tính. */
const LU_COST = [1,2,4,8,16,32];
function luCap(){ return 20 + state.bottleLevel*20; }
function luRate(){ return (1 + (state.bottleLevel-1)*0.5) * (state.realmIdx>=8 ? 2 : 1); }
function accrueLuDich(months){
  if(state.luDich==null) state.luDich = 0;
  state.luAcc = (state.luAcc||0) + months*luRate();
  const whole = Math.floor(state.luAcc);
  state.luAcc -= whole;
  state.luDich = Math.min(luCap(), state.luDich + whole);
}
function herbYield(){ return state.tucNhuong ? 2 : 1; }
function growHerbN(tier, n){
  if(tier>state.bottleLevel) return;
  const cost = LU_COST[tier-1]*n;
  if((state.luDich||0)<cost){ addLog(`Cần ${cost} giọt Tạo Hóa Lộ để thúc ${n} cây ${HERB_NAMES[tier-1]}.`); render(); return; }
  state.luDich -= cost;
  const got = n*herbYield();
  state.herbs[tier] = (state.herbs[tier]||0)+got;
  addLog(`Nhỏ ${cost} giọt Tạo Hóa Lộ, ${got} cây ${HERB_NAMES[tier-1]} vụt lên dược tính trăm năm trong chớp mắt.${state.tucNhuong?' (Ngũ Sắc Tức Nhưỡng nhân đôi thu hoạch.)':''}`);
  render();
}
function growNgheThuong(){
  const cost = 4;
  if((state.luDich||0)<cost){ addLog('Cần 4 giọt Tạo Hóa Lộ để thúc một cây Nghê Thường Thảo.'); render(); return; }
  state.luDich -= cost; state.specHerbs.ngheThuong = (state.specHerbs.ngheThuong||0)+1;
  addLog('Một cây Nghê Thường Thảo nở hoa, hương thơm lan xa khiến yêu thú quanh vùng xao động.'); render();
}
function useNgheThuong(){
  if(state.combat || state.expd || !(state.specHerbs.ngheThuong>0)) return;
  state.specHerbs.ngheThuong--;
  const z = Math.min(ZONES.length-1, Math.max(0, state.realmIdx));
  state.currentZone = z;
  const e = mkEnemy(z, ['Yêu Lang','Hỏa Văn Báo','Hắc Giao','Thiết Giáp Yêu Hổ','Kim Sí Yêu Bằng'][Math.min(4,Math.floor(z/2))]+' · bị hương dụ tới', 1.2, {ngheThuong:true});
  addLog('Ngươi bày Nghê Thường Thảo giữa núi hoang rồi ẩn thân. Chẳng bao lâu, một đầu yêu thú lần theo hương hoa tìm tới.');
  startCombat(e);
}
function renderGardenPage(){
  const tiles = HERB_NAMES.map((n,i)=>{
    const t = i+1, locked = t>state.bottleLevel, cost = LU_COST[i];
    return `<div class="tile ${locked?'locked':''}">
      <div class="tile-head"><span class="tn">${n}</span><span class="tc">×${state.herbs[t]||0}</span></div>
      <div class="tile-head"><span class="tc">${locked?`Bình cần ${t} lần Nguyệt Hoa`:`${cost} giọt / cây`}</span></div>
      <div class="btn-row"><button class="btn ghost" ${locked||(state.luDich||0)<cost?'disabled':''} onclick="growHerbN(${t},1)">Thúc 1</button>
      <button class="btn ghost" ${locked||(state.luDich||0)<cost*5?'disabled':''} onclick="growHerbN(${t},5)">Thúc 5</button></div>

  }).join('');
  const sh = state.specHerbs;
  return `<div class="card">

    <p class="flavor">Chiếc bình nhỏ màu lục hấp thụ ánh trăng, mỗi tháng ngưng ra Tạo Hóa Lộ. Một giọt lục dịch ép linh dược lên trăm năm dược tính — dược liệu càng quý càng tốn nhiều giọt.${state.realmIdx>=8?' Ở Tiên Giới, bình lộ ra khả năng thao túng thời gian: lục dịch ngưng tụ nhanh gấp đôi, Thời Gian Pháp Tắc lĩnh ngộ thêm 20%.':''}</p>
    <div class="row"><span class="k">Tạo Hóa Lộ</span><span class="v">${state.luDich||0} / ${luCap()} giọt (+${luRate()}/tháng)</span></div>
    <div class="row"><span class="k">Nguyệt Hoa tinh túy</span><span class="v">${state.bottleLevel>=6?'Đã tối đa':`${state.bottleShards}/${state.bottleLevel*2}`}</span></div>
    ${state.tucNhuong?`<div class="row"><span class="k">Ngũ Sắc Tức Nhưỡng</span><span class="v ok-mark">Mỗi lần thúc thu gấp đôi</span></div>`:''}
    <div class="grid2" style="margin-top:10px;">${tiles}</div>
  </div>
  <div class="card">
    <div class="sec-title">${ic('herb')} Kỳ Hoa Dị Thảo</div>
    <div class="row"><span class="k">Nghê Thường Thảo ×${sh.ngheThuong||0}<br><small>Hương hoa dụ yêu thú tới để săn yêu đan</small></span><span class="v btn-inline">
      <button class="btn sm ghost" ${(state.luDich||0)<4?'disabled':''} onclick="growNgheThuong()">Thúc (4 giọt)</button>
      <button class="btn sm" ${!(sh.ngheThuong>0)||state.combat||state.expd?'disabled':''} onclick="useNgheThuong()">Dụ Yêu Thú</button></span></div>
    <div class="row"><span class="k">Ngọc Tủy Chi / Tử Hầu Hoa / Thiên Linh Quả</span><span class="v">${sh.ngocTuy||0} / ${sh.tuHau||0} / ${sh.thienLinh||0}</span></div>
    <p class="sec-note" style="margin:4px 0 0;">Ba vị chủ dược Trúc Cơ Đan chỉ mọc trong Huyết Sắc Cấm Địa, bình không thúc được.</p>
  </div>`;
}

function isMajorStep(){ const r = MAJOR_REALMS[state.realmIdx]; return (state.subStage||0) >= r.substageCount-1; }
function brewSpecial(kind, id){
  if(profLvl('danSu')<1){ addLog('Cần bái sư học nghề Luyện Đan Sư trước.'); render(); return; }
  const rec = kind==='break' ? BREAK_PILLS.find(p=>p.id===id) : kind==='dietTran' ? DIET_TRAN : DAO_DAN;
  if(profLvl('danSu')<rec.minLvl){ addLog(`Luyện ${rec.name} cần Luyện Đan Sư cấp ${rec.minLvl}.`); render(); return; }
  if(!ingOk(rec.ing)){ addLog(`Luyện ${rec.name} còn thiếu: ${ingMissing(rec.ing)}.`); render(); return; }
  ingTake(rec.ing);
  const chance = craftChance('danSu', rec.diff, true);
  if(Math.random()*100>=chance){ addLog(`Mẻ ${rec.name} thất bại, dược lực tan biến.` + gainProfExp('danSu', 2+rec.diff)); render(); return; }
  if(kind==='break') state.breakPills[id] = (state.breakPills[id]||0)+1;
  else if(kind==='dietTran') state.dietTran = (state.dietTran||0)+1;
  else state.daoDan = (state.daoDan||0)+1;
  addLog(`Luyện thành 1 viên ${rec.name}.` + gainProfExp('danSu', 4+rec.diff*2));
  render();
}
function useBreakPill(id){
  const p = BREAK_PILLS.find(x=>x.id===id);
  if(!(state.breakPills[id]>0)) return;
  if(state.realmIdx!==p.realm || !isMajorStep()){ addLog(`${p.name} chỉ có tác dụng ở bình cảnh ${MAJOR_REALMS[p.realm].name} đỉnh phong, khi sắp đột phá ${MAJOR_REALMS[p.realm+1].name}.`); render(); return; }
  state.breakPills[id]--;
  state.breakthroughBoost = Math.min(60, state.breakthroughBoost+p.boost);
  addLog(`Nuốt ${p.name}, dược lực bao bọc kinh mạch — tỷ lệ đột phá ${MAJOR_REALMS[p.realm+1].name} +${p.boost}% (hiện +${state.breakthroughBoost}%).`);
  render();
}
function useDietTran(){
  if(!(state.dietTran>0) || !(state.lg && lg().phiThangKhi)) return;
  state.dietTran--; lg().phiThangKhi = false;
  addLog('Diệt Trần Đan tan trong bụng, phi thăng chi khí hạ giới bị gột sạch — thiên địa Linh Giới không còn bài xích ngươi.');
  computeStats(); render();
}
function useDaoDan(){
  if(!(state.daoDan>0) || !(state.tg && tg().mainLaw)) return;
  const g = tg(); state.daoDan--;
  g.laws[g.mainLaw] = Math.min(lawCap(), g.laws[g.mainLaw]+10);
  addLog(`Đạo Đan chứa pháp tắc hóa vào thức hải — ${LAWS[g.mainLaw].short} +10.`);
  computeStats(); render();
}

  const lgPills = state.realmIdx>=4 ? recipeCard({prof:'danSu', title:DIET_TRAN.name, owned:state.dietTran||0, minLvl:DIET_TRAN.minLvl, ing:DIET_TRAN.ing, chance:craftChance('danSu', DIET_TRAN.diff, true),

  const tgPills = state.realmIdx>=9 ? recipeCard({prof:'danSu', title:DAO_DAN.name, owned:state.daoDan||0, minLvl:DAO_DAN.minLvl, ing:DAO_DAN.ing, chance:craftChance('danSu', DAO_DAN.diff, true),
    action:`brewSpecial('daoDan')`, btn:'Luyện', gold:true, desc:'Đan dược cảnh giới cao nhất, chứa đựng Pháp Tắc: dùng tăng 10 chủ tu pháp tắc. Cần quả của Huyền Thiên Tiên Đằng.'}) : '';
  return profHeader('danSu', lvl?`<div class="row"><span class="k">Đan Phương đã có</span><span class="v">${state.danPhuongTiers.slice().sort((a,b)=>a-b).map(t=>PILL_NAMES[t-1]).join(', ')||'chưa có'}</span></div>`:'') + `

function talismanLocked(t){ return t.tien && !(state.tg && tg().lucGiap); }
function craftTalisman(id){
  const t = TALISMANS.find(x=>x.id===id); if(!t) return;
  if(profLvl('phuLuc')<1){ addLog('Cần bái sư học nghề Phù Lục Sư trước.'); render(); return; }
  if(talismanLocked(t)){ addLog(`${t.name} là tiên phù — phải có Lục Giáp Thiên Thư mới biết cách vẽ.`); render(); return; }
  if(profLvl('phuLuc')<t.minLvl){ addLog(`Vẽ ${t.name} cần Phù Lục Sư cấp ${t.minLvl}.`); render(); return; }
  if(!ingOk(t.ing)){ addLog(`Vẽ ${t.name} còn thiếu: ${ingMissing(t.ing)}.`); render(); return; }
  ingTake(t.ing);
  const chance = craftChance('phuLuc', (t.tier-1)*1.5);
  const lvl = profLvl('phuLuc');
  if(Math.random()*100 >= chance){ addLog(`Nét bút cuối run tay, phù văn ${t.name} đứt mạch — tờ phù cháy thành tro.` + gainProfExp('phuLuc', 1+t.tier)); render(); return; }
  const n = 1 + (Math.random()<0.3+lvl*0.1 ? 1 : 0) + (lvl>=3 && Math.random()<0.3 ? 1 : 0);
  state.talismans[t.id] = (state.talismans[t.id]||0)+n;
  addLog(`Một nét liền mạch, vẽ thành ${n} đạo ${t.name}.` + gainProfExp('phuLuc', 3+t.tier*2));
  render();
}
function useTalisman(id){
  const c = state.combat;
  const t = TALISMANS.find(x=>x.id===id);
  if(!t || (state.talismans[id]||0)<1) return;
  state.talismans[id]--;
  c.phuMenu = false;
  const lvl = profLvl('phuLuc');
  const escape = (txt)=>{ addLog(txt); state.combat = null; render(); };
  if(t.kind==='atk'){
    const r = pathAdjustedDamage(state.stats.atk*t.dmgMult + Math.max(1,lvl)*t.flat, c.enemy.def*0.7, state.stats.crit, c.enemy, false);
    let dmg = r.dmg;
    if(t.vsEvil && isEvilEnemy(c.enemy)) dmg = Math.round(dmg*(1+t.vsEvil));
    c.enemy.hp -= dmg;
    fx('float',{sel:'.enemy-block', text:`-${dmg}`, cls:'crit'});
    combatLog(`Giật đứt ${t.name}, phù quang bùng nổ, gây ${dmg} sát thương!`);
    if(c.enemy.hp<=0){ winCombat(); return; }
  } else if(t.kind==='shield'){
    const amt = Math.round(state.stats.hpMax*t.pct); c.shield += amt;
    combatLog(`${t.name} hóa thành bộ giáp yêu thú quanh thân, hấp thụ tối đa ${amt} sát thương.`);
  } else if(t.kind==='wind'){
    const chance = 40+state.stats.spd-c.enemy.spd+60;
    if(Math.random()*100<chance) return escape(`Ngự Phong Phù cuốn ngươi đi như một cơn gió, bỏ lại ${c.enemy.name} phía sau.`);
    combatLog('Ngự Phong Phù kích hoạt nhưng đối phương vẫn bám sát!');
  } else if(t.kind==='hide'){
    if(!c.enemy.isBoss) return escape(`Ẩn Thân Phù xóa sạch hình bóng, ${c.enemy.name} mất dấu ngươi.`);
    combatLog(`${c.enemy.name} thần thức cường đại, nhìn thấu Ẩn Thân Phù!`);
  } else if(t.kind==='blood'){
    const d = Math.round(state.stats.hpMax*0.2); state.hp = Math.max(1, state.hp-d);
    return escape(`Thiêu đốt tinh huyết (mất ${d} khí huyết), Huyết Độn Phù hóa huyết quang đưa ngươi đi xa hàng trăm dặm.`);
  } else if(t.kind==='flee'){
    return escape(`Độn Không Phù xé rách không gian, ngươi biến mất khỏi tầm mắt ${c.enemy.name}.`);
  } else if(t.kind==='stealth'){
    return escape('Thái Nhất Hóa Thanh Phù phủ lên người, khí tức ngươi tan vào hư không — không ai còn cảm nhận được.');
  } else if(t.kind==='clone'){
    c.clone = (c.clone||0)+3;
    combatLog('Giáp Nguyên Phù hóa ra một phân thân giống hệt ngươi, lao lên đỡ đòn thay.');
  }
  enemyTurn();
}

function feedWorm(){

function petStrike(c){
  const pt = PET_TYPES.find(p=>p.id===state.worm.typeId) || PET_TYPES[0];
  let dmg = Math.round(state.stats.atk*0.5 + state.worm.level*10*(state.worm.level>10?3:1));
  let extra = '', heal = 0;
  if(pt.id==='phe_kim'){ c.enemy.def = Math.round(c.enemy.def*0.9); extra = ' Giáp phòng ngự của địch bị gặm mòn.'; }
  if(pt.id==='de_hon'){ if(isEvilEnemy(c.enemy)){ dmg *= 2; extra = ' Tà khí bị nuốt sạch!'; } heal = Math.round(dmg*0.3); state.hp = Math.min(state.stats.hpMax, state.hp+heal); }
  if(pt.id==='luc_duc' && Math.random()<0.3){ c.frozen = Math.max(c.frozen||0, 1); extra = ' Kẻ địch bị sương hàn đông cứng!'; }
  if(state.path && state.path.vsEvilBonusPct && isEvilEnemy(c.enemy)) dmg = Math.round(dmg*(1+state.path.vsEvilBonusPct));
  heal += applyLifesteal(dmg);
  c.cdWorm = 3;
  return {dmg, msg:`${petName()} thi triển ${pt.skillName}, gây ${dmg} sát thương${heal?`, hồi ${heal} khí huyết`:''}.${extra}`};
}

function useKimQuang(){
  const c = state.combat;
  if(!c || !(state.kimQuang>0)) return null;
  state.kimQuang--;
  const r = pathAdjustedDamage(state.stats.atk*2.2, c.enemy.def*0.6, state.stats.crit+10, c.enemy, false);

function luyenThanSeverity(){
  if(!luyenThanBacklash()) return 0;
  const h = lg().luyenThan, over = nowYears()-h.deadline;
  return Math.min(0.5, 0.15 + Math.floor(over/10)*0.05);
}

const SPEC_NAMES = {ngocTuy:'Ngọc Tủy Chi', tuHau:'Tử Hầu Hoa', thienLinh:'Thiên Linh Quả', ngheThuong:'Nghê Thường Thảo', huyenQua:'Huyền Thiên Quả', phongLoiSi:'Phong Lôi Sí'};
function specHave(type){
  if(type==='huyenQua') return (state.tg && tg().huyenQua) || 0;
  if(type==='phongLoiSi') return state.phongLoiSi||0;
  return (state.specHerbs && state.specHerbs[type]) || 0;
}
function specTake(type, n){
  if(type==='huyenQua') tg().huyenQua -= n;
  else if(type==='phongLoiSi') state.phongLoiSi -= n;
  else state.specHerbs[type] -= n;
}
function canonMigrate(){
  const s = state;
  if(!s || !s.root) return;
  if(!s.techCanon){
    s.techCanon = true;
    const ok = new Set([...TECHNIQUES.map(t=>t.name), ...ADVANCED_TECHNIQUES.map(t=>t.name), ...SECTS.flatMap(x=>x.shop.filter(i=>i.type==='tech').map(i=>i.name))]);
    const drop = (s.techniques||[]).filter(t=>!ok.has(t.name));
    if(drop.length){ s.techniques = s.techniques.filter(t=>ok.has(t.name)); s.learnedNames = s.learnedNames.filter(n=>ok.has(n)); s.spiritStones += drop.length*200; }
    s.manuals = (s.manuals||[]).filter(id=>ADVANCED_TECHNIQUES.some(t=>t.id===id));
  }
  if(s.relics && s.relics.length){ s.spiritStones += s.relics.length*500; s.relics = []; }
  if(!s.khieu1080){ s.khieu1080 = true; if(s.tg && s.tg.thienSat) s.tg.thienSat.khieu = Math.min(1080, (s.tg.thienSat.khieu||0)*10); }
  const phMap = {khue_thuy:'huyen_am', bang_co:'huyen_am', huyet_linh:'thuan_duong', nguhanh_linh_the:'huyen_linh', chan_linh_huyet_mach:'huyen_linh'};
  if(s.physique && (!s.physique.group || phMap[s.physique.id])){
    const nid = phMap[s.physique.id] || s.physique.id, t = PHYSIQUE_TEMPLATES.find(x=>x.id===nid);
    s.physique = t ? Object.assign({}, t) : null;
  }
  if(s.luDich==null){ s.luDich = 5; s.luAcc = 0; }
  if(!s.specHerbs) s.specHerbs = {};
  if(!s.breakPills) s.breakPills = {};
  const t = s.talismans || {};
  const conv = {hoa_cau:'hoa_dan', ngu_loi:'hoa_dan', truc_tien:'giap_nguyen', dinh_than:'giap_nguyen'};
  Object.keys(conv).forEach(k=>{ if(t[k]){ t[conv[k]] = (t[conv[k]]||0)+t[k]; } delete t[k]; });
  const petMap = {phe_linh_trung:'phe_kim', hoa_van_diep:'luc_duc', huyen_quy_linh:'de_hon', thanh_van_bao:'luc_duc'};
  if(s.worm && petMap[s.worm.typeId]) s.worm.typeId = petMap[s.worm.typeId];
  if(s.lg){
    if(s.lg.blood && s.lg.blood.tyhuu){ s.lg.blood.soncuvien = (s.lg.blood.soncuvien||0)+s.lg.blood.tyhuu; delete s.lg.blood.tyhuu; }
    if(s.lg.forms) s.lg.forms = s.lg.forms.map(f=>f==='tyhuu'?'soncuvien':f);
  }
}

    const b = pick(TREASURES).name;
    push({type:'tienkhi', grade:3, base_name:b, base:1500, star:true, note:'Cực phẩm Tiên Khí — cả Bách Tạo Các trăm năm mới có một món.'});
    push({type:'tienkhi', grade:1, base_name:pick(TREASURES).name, base:450});
    push({type:'tienkhi', grade:0, base_name:pick(TREASURES).name, base:200});
    if(!state.tienDinhLo) push({type:'dinhLo', base:600, note:'Đỉnh lô tiên giai chịu được lửa Chưởng Thiên Bình.'});
    push({type:'mat', mat:'khoang', tier:3, n:8, base:180, note:'Vật liệu nghịch thiên chế tạo trận pháp.'});
  } else if(a.id==='bodeyen'){
    push({type:'daoDan', base:1500, star:true, note:'Đạo Đan — đan dược cảnh giới cao nhất, chứa đựng Pháp Tắc.'});
    push({type:'lawBao', base:1200, star:true});
    push({type:'lawBao', base:1200});
    const miss = TIME_ARTS.filter(x=>!tg().timeArts.includes(x.id)); if(miss.length) push({type:'timeArt', id:pick(miss).id, barter:true});
    push({type:'huyenQua', base:600});
  } else if(a.id==='vothuong'){
    const miss = TIME_ARTS.filter(x=>!tg().timeArts.includes(x.id)); if(miss.length) push({type:'timeArt', id:pick(miss).id, base:700, star:true});
    push({type:'lawBao', base:900});
    push({type:'tinhsa', n:4, base:100});
    if(!tg().lucGiap) push({type:'lucGiap', base:500});
    push({type:'talisman', id:'than_hanh', n:3, base:120});
  } else if(a.id==='thapphuong'){
    if(!tg().timeArts.includes('quangam')) push({type:'timeArt', id:'quangam', base:900, star:true, stolen:true, note:'Tang vật lấy trộm từ Thiên Đình.'});
    if(!tg().lucGiap) push({type:'lucGiap', base:600, stolen:true});
    push({type:'lawBao', base:1000, stolen:true});
    const rel = randomRelicFor(11); if(rel) push({type:'relic', id:rel.id, base:500});
  }
  const bi = lots.findIndex(l=>l.barter);
  if(bi>=6){ const [b] = lots.splice(bi,1); lots.splice(3,0,b); }
  return lots.slice(0,6).map(l=>{
    if(l.barter){
      const pool = BARTER_WANTS.filter(w=>!w.lg || a.world!=='ng');
      const wants = [];
      while(wants.length<3 && wants.length<pool.length){ const w = pick(pool); if(!wants.includes(w.id)) wants.push(w.id); }
      if(!wants.includes('van_nien') && Math.random()<0.6) wants[0] = 'van_nien';
      return Object.assign(l, {wants, rivalScore:1+Math.floor(Math.random()*3)});
    }
    const base = Math.max(1, Math.round(l.base*(0.8+Math.random()*0.4)));
    const hot = l.star ? 1.8+Math.random()*1.2 : 1.1+Math.random()*0.9;
    return Object.assign(l, {price:base, rivalMax:Math.max(base+1, Math.round(base*hot)), leader:null});
  });
}

/* ---------- Tiền tệ, lịch, tư cách ---------- */
function aucState(){ if(!state.auc) state.auc = {sched:{}, tokens:{}, active:null, disguise:true}; return state.auc; }
function aucWorldOk(a){ return a.world==='ng' ? state.realmIdx<=4 : a.world==='lg' ? (state.realmIdx>=5 && state.realmIdx<=7) : state.realmIdx>=8; }
function aucRegionNow(a){ return a.world==='ng' ? ng().region : a.world==='lg' ? lg().region : tg().region; }
function aucHere(a){ return a.anywhere || aucRegionNow(a)===a.region; }
function aucRegionName(a){ if(a.anywhere) return a.virtual ? 'truyền thần thức qua mặt nạ / lệnh bài — ở đâu cũng dự được' : a.travelFee ? `Hắc Phong Hải (phí vượt biển ${a.travelFee} tiên thạch)` : 'chi nhánh khắp nơi'; return ([...NG_REGIONS, ...LG_REGIONS, ...TG_REGIONS].find(r=>r.id===a.region)||{}).name; }
function aucSched(a){
  const S = aucState().sched;
  if(!S[a.id]) S[a.id] = {next: Math.floor(nowYears())+1, attended:false};
  const s = S[a.id];
  while(nowYears() >= s.next+a.window || (s.attended && nowYears()>=s.next)){ s.next += a.cycle; s.attended = false; s.tokensLeft = null; }
  return s;
}
function aucOpen(a){ const s = aucSched(a); return nowYears()>=s.next && !s.attended; }
function aucCur(a){ return a.currency==='tien' ? 'tiên thạch' : a.currency==='cucpham' ? 'cực phẩm linh thạch' : 'linh thạch'; }
function aucMoney(a){ return a.currency==='tien' ? tg().tienThach : a.currency==='cucpham' ? (state.cucPham||0) : state.spiritStones; }
function aucPay(a, n){ if(a.currency==='tien') tg().tienThach -= n; else if(a.currency==='cucpham') state.cucPham -= n; else state.spiritStones -= n; }
function aucWealth(a){
  let herbV = 0; for(let t=1;t<=6;t++) herbV += (state.herbs[t]||0)*t*t*8;
  if(a.currency==='tien') return tg().tienThach;
  return state.spiritStones + herbV + (state.cucPham||0)*15000;
}
function helianElder(){ return (state.helianSold||0)>=10; }
function aucInvite(a){
  if(a.id==='helian' && helianElder()) return 'thân phận khách khanh trưởng lão Hách Liên Thương Minh';
  if(a.id==='vanthanh' && state.lg){ const r = lg().rep; if(r.thienvan>=30 || r.giacxi>=30) return 'thiệp mời của các đại tộc Lôi Minh (danh vọng Thân thiện)'; }
  if(a.id==='bodeyen' && state.tg && tg().sect && tg().sect.id==='cuunguyen') return 'thiệp mời Bồ Đề Yến gửi đệ tử Cửu Nguyên Quan';
  if(a.vipRealm!=null && state.realmIdx>=a.vipRealm) return `thiệp mời ban tổ chức gửi riêng bậc ${MAJOR_REALMS[state.realmIdx].name}`;
  if(a.world==='ng'){ const s = ng().sect; if(s && s.rank>=2) return `thiệp mời gửi ${SECT_RANKS[s.rank]} ${ngSectDef(s.id).name}`; }
  if(a.world==='lg'){ const g = lg(); if(g.tyRank>=2) return `thiệp mời gửi ${TY_RANKS[g.tyRank]} Thiên Uyên Thành`; if(g.family && g.family.rank>=1) return `thiệp mời gửi ${FAM_RANKS[g.family.rank]} ${famDef(g.family.id).name}`; }
  if(a.world==='tg'){ const g = tg(), m = g.sect || g.side; if(m && m.rank>=2) return `thiệp mời gửi ${TG_RANKS[m.rank]} ${tgFaction(m.id).name}`; }
  const kills = Object.keys(state.npcs||{}).filter(id=>state.npcs[id].dead && npcDef(id) && npcDef(id).kind==='enemy').length;
  if(kills>=1 || (state.relics||[]).length>=3) return 'thiệp mời gửi tán tu có danh tiếng';
  return null;
}
function aucSenior(){ const f = NPCS.find(n=>n.kind==='friend' && npcStatus(n.id)==='friend'); return f ? f.name : null; }
function aucEntry(a){
  const res = {checks:[], mode:null, vip:false};
  const realmOk = state.realmIdx>=a.minRealm, senior = aucSenior(), token = aucState().tokens[a.id]===aucSched(a).next, invite = aucInvite(a);
  let mode = null;
  for(const acc of a.access){
    if(acc==='open'){ mode = 'open'; break; }
    if(acc==='invite' && invite){ mode = 'invite:'+invite; break; }
    if(acc==='token' && token){ mode = 'token'; break; }
    if(acc==='mask' && state.tg && tg().voThuongMask){ mode = 'mask'; break; }
    if(acc==='senior' && senior){ mode = 'senior:'+senior; break; }
  }
  if(!realmOk && a.access.includes('senior') && senior) mode = 'senior:'+senior;
  const follower = (mode||'').startsWith('senior');
  res.checks.push([realmOk || follower, realmOk ? `Cảnh giới từ ${MAJOR_REALMS[a.minRealm].name}` : follower ? `Chưa đủ ${MAJOR_REALMS[a.minRealm].name} — vào với tư cách tùy tùng của ${senior}` : `Cần ${MAJOR_REALMS[a.minRealm].name} (hoặc theo hầu một vị tiền bối thân thiết)`]);
  if(a.fee) res.checks.push([aucMoney(a)>=a.fee + (a.travelFee||0), `Phí báo danh ${a.fee}${a.travelFee?` + phí vượt biển ${a.travelFee}`:''} ${aucCur(a)}`]);
  if(a.proof) res.checks.push([aucWealth(a)>=a.proof, `Chứng minh tài lực ${a.proof}${a.currency==='tien'?' tiên thạch':' linh thạch quy đổi'} (hiện ${aucWealth(a)})`]);
  const need = a.access.map(x=>AUC_ACCESS_LABEL[x]).join(' / ');
  const label = !mode ? `Cần: ${need}` : mode==='open' ? 'Tự do vào cửa' : mode==='token' ? 'Có lệnh bài phiên này' : mode==='mask' ? `Đeo Mặt nạ Vô Thường · ${tg().voThuongMask}` : mode.startsWith('invite') ? `Có ${mode.slice(7)}` : `Theo hầu ${mode.slice(7)}`;
  res.checks.push([!!mode, label]);
  res.ok = res.checks.every(c=>c[0]);
  res.mode = mode;
  res.vip = a.vipRealm!=null && state.realmIdx>=a.vipRealm && !follower;
  return res;
}
function aucBuyToken(id){
  const a = AUCTIONS.find(x=>x.id===id), s = aucSched(a), A = aucState();
  if(A.tokens[id]===s.next) return;
  if(aucMoney(a)<a.tokenPrice){ addLog(`Lệnh bài ${a.name} bán ${a.tokenPrice} ${aucCur(a)} một tấm.`); render(); return; }
  if(s.tokensLeft==null) s.tokensLeft = 3;
  if(s.tokensLeft<=0){ addLog(`Lệnh bài phiên này của ${a.name} đã bán hết.`); render(); return; }
  s.tokensLeft--;
  if(Math.random()<0.6){ aucPay(a, a.tokenPrice); A.tokens[id] = s.next; addLog(`Chen chúc giữa đám tu sĩ, ngươi giành được một tấm lệnh bài ${a.name} (${a.tokenPrice} ${aucCur(a)}).`); }
  else addLog(`Chậm tay một bước — tấm lệnh bài vừa về tay kẻ khác. (${a.name} còn ${s.tokensLeft} tấm)`);
  render();
}
function aucToggleDisguise(){ const A = aucState(); A.disguise = !A.disguise; render(); }
function buyVoThuongMask(){
  const g = tg();
  if(g.voThuongMask) return;
  if(g.tienThach<50){ addLog('Một chiếc Mặt nạ Vô Thường giá 50 tiên nguyên thạch.'); render(); return; }
  g.tienThach -= 50; g.voThuongMask = pick(VT_MASKS);
  addLog(`Ngươi mua được một chiếc Mặt nạ Vô Thường hình ${g.voThuongMask}. Truyền thần thức vào, cả mạng lưới Vô Thường Minh hiện ra trước mắt — không ai biết ngươi là ai.`);
  render();
}

/* ---------- Hách Liên: bán linh dược vạn năm ---------- */
function helianSell(n){
  if(!(state.lg && lgSeen()) || (state.herbs[6]||0)<n) return;
  state.herbs[6] -= n;
  state.cucPham = (state.cucPham||0)+n;
  const before = state.helianSold||0;
  state.helianSold = before+n;
  let msg = `Ký gửi ${n} cây linh dược vạn năm cho Hách Liên Thương Minh, nhận ${n} Cực Phẩm Linh Thạch.`;
  if(n>=5) msg += ' Cả thương minh chấn động — đã mấy vạn năm chưa ai bán ra nhiều linh dược vạn năm tới vậy.';
  if(before<10 && state.helianSold>=10) msg += ' Minh Tôn đích thân mời ngươi làm khách khanh trưởng lão của Hách Liên Thương Minh: từ nay có thiệp mời, phòng riêng, và được thương minh che chở khi rời hội.';
  if(!helianElder() && n>=3 && Math.random()<0.4){
    addLog(msg);
    presentEvent({title:'Bị để mắt', sub:'tin đồn lan nhanh hơn gió', icon:'eye', text:'Kẻ bán ra linh dược vạn năm chắc chắn còn nhiều hơn thế. Ngay khi rời chi nhánh thương minh, có kẻ đã bám theo.',
      options:aucTailOptions('helian', {disguise:aucState().disguise})});
    render(); return;
  }
  addLog(msg); render();
}
function helianExchange(n){
  const cost = n*15000;
  if(state.spiritStones<cost){ addLog(`Đổi ${n} Cực Phẩm Linh Thạch cần ${cost} linh thạch.`); render(); return; }
  state.spiritStones -= cost; state.cucPham = (state.cucPham||0)+n;
  addLog(`Đổi ${cost} linh thạch lấy ${n} Cực Phẩm Linh Thạch.`); render();
}

/* ---------- Tình báo & nhiệm vụ ---------- */
function intelCost(kind){ const R = state.realmIdx; return kind==='tien' ? 40 : Math.round(1500*(R-3)); }
function buyIntel(type, extra){
  if(type==='truytung' && !npcDef(extra)) return;
  const inTG = state.realmIdx>=8, cur = inTG ? 'tien' : 'stones';
  const cost = intelCost(cur);
  const have = inTG ? tg().tienThach : state.spiritStones;
  if(have<cost){ addLog(`Tin tức này giá ${cost} ${inTG?'tiên thạch':'linh thạch'}.`); render(); return; }
  if(inTG) tg().tienThach -= cost; else state.spiritStones -= cost;
  if(type==='truytung'){
    const r = npcRel(extra); r.tracked = true;
    addLog(`Tình báo trao tay: nơi ẩn thân, công pháp, sơ hở của ${npcDef(extra).name}. Lần giao thủ tới, hắn yếu đi một phần tư.`);
  } else if(type==='truyenthua'){
    state.intelHeritage = true;
    addLog('Ngươi mua được manh mối về một truyền thừa thất lạc. Lần thám hiểm địa vực tới, ngươi sẽ biết phải tìm ở đâu.');
  } else if(type==='thiendinh'){
    tg().wanted = Math.max(0, tg().wanted-20);
    addLog('Tin mật về lộ tuyến tuần tra Thiên Đình giúp ngươi xóa dấu vết — truy nã −20.');
  } else if(type==='maton'){
    state.intelMaTon = true;
    addLog('Tình báo về hành tung hóa thân Ma Tôn: lần tới vào Ma Giới Thông Đạo, ngươi sẽ chạm mặt một kẻ.');
  }
  render();
}
function takeContract(org){
  if(state.combat || state.expd) return;
  const hard = org==='thapphuong';
  const p = Math.min(11, state.realmIdx);
  const target = hard ? pick(['Thiên Đình tuần tra sứ bị treo thưởng','Kim Tiên phản đồ','Thế gia trưởng lão mang tội']) : pick(['Tán tiên cướp tiên mạch','Tội phạm Tiên Vực','Kẻ phản bội Vô Thường Minh']);
  const e = mkEnemy(p, `Mục tiêu: ${target}`, hard?1.9:1.5, {contract:org, isBoss:true});
  advanceTime(12);
  addLog(`${org==='thapphuong'?'Thập Phương Lâu':'Vô Thường Minh'} giao nhiệm vụ ${hard?'ám sát':'thu thập'} — truy lùng suốt một năm, ngươi chặn được mục tiêu.`);
  startCombat(e);
}

/* ---------- Vào hội, trả giá ---------- */
function aucEnter(id){
  const a = AUCTIONS.find(x=>x.id===id);
  if(!a || state.combat || state.expd || aucState().active) return;
  if(!aucWorldOk(a) || !aucHere(a)){ addLog(`${a.name} không ở nơi ngươi đang đứng.`); render(); return; }
  if(!aucOpen(a)){ addLog(`${a.name} chưa tới kỳ khai hội.`); render(); return; }
  const e = aucEntry(a);
  if(!e.ok){ addLog(`Người gác cửa ${a.name} lắc đầu — chưa đủ điều kiện.`); render(); return; }
  const A = aucState();
  const disguise = a.maskForced || a.virtual || A.disguise;
  const disguiseCost = (!a.maskForced && !a.virtual && A.disguise) ? Math.max(1, Math.round(a.fee*0.1)) : 0;
  aucPay(a, a.fee + disguiseCost + (a.travelFee||0));
  aucSched(a).attended = true;
  A.active = {id, lots:buildLots(a), idx:0, won:[], greedy:false, vip:e.vip, follower:(e.mode||'').startsWith('senior'), disguise, log:[]};
  advanceTime(a.virtual ? 0 : 1);
  const room = a.virtual ? `Truyền thần thức vào ${e.mode==='mask'?`Mặt nạ ${tg().voThuongMask}`:'lệnh bài'}, ngươi hiện diện trong phiên đấu giá ảo giữa hàng trăm cái bóng vô danh`
    : a.id==='hacvuc' ? 'Bước qua cửa không gian, trận pháp Hắc Vực đè xuống — tu vi mọi người đều bị áp chế, dung mạo bị che mờ hoàn toàn'
    : e.vip ? 'Tiểu nhị cung kính dẫn ngươi lên một phòng riêng có cấm chế cách ly thần thức'
    : A.active.follower ? `Ngươi đứng hầu sau lưng ${e.mode.slice(7)}` : 'Ngươi tìm một chỗ ngồi ở sảnh chung';
  aucLog(`${room}. ${disguise && !a.virtual && a.id!=='hacvuc'?'Mặt nạ và áo choàng che kín khí tức. ':''}${a.guard}.`);
  if(!a.virtual && Math.random()<0.3) aucLog(pick(['Một kẻ nóng nảy vừa định động thủ đã bị uy áp của vị tọa trấn đè sụp xuống đất — không ai dám làm loạn nữa.','Cấm chế hội trường lóe sáng khi có kẻ lén dùng thần thức dò xét phòng riêng, lập tức bị đẩy ra ngoài.']));
  state.activeTab = 'tuido'; state.subTabs.tuido = 'daugia';
  render(); window.scrollTo(0,0);
}
function aucLog(m){ const A = aucState().active; if(A){ A.log.unshift(m); if(A.log.length>30) A.log.pop(); } }
function aucLot(){ const A = aucState().active; return A ? A.lots[A.idx] : null; }
function aucCurA(){ return AUCTIONS.find(x=>x.id===aucState().active.id); }
function aucBid(pct){
  const A = aucState().active, a = aucCurA(), l = aucLot();
  if(!l || l.barter || l.done) return;
  const bid = Math.max(l.price+1, Math.round(l.price*(1+pct)));
  if(aucMoney(a)<bid){ aucLog(`Không đủ ${bid} ${aucCur(a)}.`); render(); return; }
  if(l.rivalMax>bid){
    const counter = Math.min(l.rivalMax, Math.max(bid+1, Math.round(bid*(1.05+Math.random()*0.1))));
    l.price = counter; l.leader = pick(a.rivals);
    aucLog(`Ngươi hô ${bid} — lập tức ${l.leader} nâng lên ${counter}.`);
    if(!A.vip && !a.noTail && l.star && Math.random()<0.3) aucLog('Vài đạo thần thức từ phòng riêng lướt qua chỗ ngươi ngồi, như muốn ghi nhớ khí tức.');
  } else {
    l.price = bid; l.done = true; l.winner = 'you';
    aucPay(a, bid);
    const msg = lotGrant(l);
    if(l.stolen){ tg().wanted = Math.min(100, tg().wanted+10); }
    A.won.push({label:lotLabel(l), star:!!l.star});
    aucLog(`Ngươi hô ${bid} ${aucCur(a)}. Gõ búa! ${msg}${l.stolen?' (Tang vật Thiên Đình — truy nã +10.)':''}`);
    addLog(`${a.name}: mua được ${lotLabel(l)} với giá ${bid} ${aucCur(a)}.`);
  }
  render();
}
function aucPass(){
  const A = aucState().active, a = aucCurA(), l = aucLot();
  if(!l) return;
  if(!l.done){ l.done = true; l.winner = l.leader || pick(a.rivals); aucLog(`${lotLabel(l)} về tay ${l.winner}${l.barter?'':` với giá ${l.leader?l.price:Math.round(l.price*1.3)}`}.`); }
  A.idx++;
  render();
}
function aucBarter(wid){
  const A = aucState().active, a = aucCurA(), l = aucLot();
  if(!l || !l.barter || l.done) return;
  const w = BARTER_WANTS.find(x=>x.id===wid);
  if(!w || !l.wants.includes(wid) || !w.have()) return;
  if(w.score>=l.rivalScore){
    w.take(); l.done = true; l.winner = 'you';
    if(w.greedy) A.greedy = true;
    const msg = lotGrant(l);
    A.won.push({label:lotLabel(l), star:!!l.star});
    aucLog(`Người bán ${w.greedy?'vừa thấy hai cây linh thảo vạn năm đã tái mặt, không thèm nhìn đề nghị của ai khác':'cân nhắc giây lát rồi gật đầu'} — đổi ${w.label} lấy ${lotLabel(l)}. ${msg}`);
    addLog(`${a.name}: dĩ vật dịch vật, dùng ${w.label} đổi lấy ${lotLabel(l)}.`);
  } else {
    aucLog(`Ngươi đưa ra ${w.label}, nhưng ${pick(a.rivals)} bày ra thứ khiến người bán ưng ý hơn.`);

  }

}

/* ---------- Ra khỏi cửa: tự sinh tự diệt ---------- */
function aucEvadeChance(A){ return Math.min(0.95, 0.35 + (A && A.disguise?0.2:0) + (isHonTu()?0.15:0) + (phaMietOpen()?0.15:0) + (state.wings?0.15:0)); }
function aucTailOptions(id, A){
  const opts = [{label:'Dịch dung đổi hướng, lẩn vào đám đông', note:`${Math.round(aucEvadeChance(A)*100)}% cắt đuôi`, act:'aucEvade', args:[id, !!A.disguise]}];
  if(state.talismans.an_than>0) opts.push({label:'Dán Ẩn Thân Phù', note:'chắc chắn cắt đuôi', act:'aucTalisman', args:['an_than']});
  if(state.talismans.than_hanh>0) opts.push({label:'Dùng Độn Không Phù', note:'chắc chắn cắt đuôi', act:'aucTalisman', args:['than_hanh']});
  if(state.talismans.thai_nhat>0) opts.push({label:'Dán Thái Nhất Hóa Thanh Phù', note:'chắc chắn cắt đuôi', act:'aucTalisman', args:['thai_nhat']});
  if(state.tranKyTier) opts.push({label:'Dụ chúng vào Điên Đảo Ngũ Hành Trận đã bày sẵn', note:'đánh với trận pháp mở sẵn, địch yếu đi', act:'aucFight', args:[id, true]});
  opts.push({label:'Quay lại nghênh chiến', act:'aucFight', args:[id, false]});
  return opts;
}
function aucLeave(){
  const A = aucState().active; if(!A) return;
  const a = AUCTIONS.find(x=>x.id===A.id);
  aucState().active = null;
  const stars = A.won.filter(w=>w.star).length, total = A.won.length;
  addLog(`Rời ${a.name}.${total?` Mang theo ${A.won.map(w=>w.label).join(', ')}.`:''}`);
  if(a.noTail || (a.id==='helian' && helianElder())){
    addLog(a.virtual ? 'Thu thần thức khỏi mạng lưới — không ai biết kẻ vừa mua là ai.' : a.id==='hacvuc' ? 'Không gian Hắc Vực đưa mỗi người ra một nơi khác nhau — không ai lần được dấu vết.' : 'Người của Hách Liên Thương Minh hộ tống khách khanh trưởng lão về tận nơi.');
    render(); return;
  }
  let risk = total ? 0.12 + stars*0.25 + total*0.05 : 0.04;
  if(A.greedy) risk += 0.25;
  if(hasTech('Liễm Tức Thuật')) risk *= 0.6;
  if(A.disguise) risk *= 0.5;
  if(A.vip) risk *= 0.35;
  risk = Math.min(0.85, risk);
  if(Math.random()<risk){
    presentEvent({title:'Bị bám đuôi', sub:'tự sinh tự diệt khi ra khỏi cửa', icon:'eye',
      text:`Vừa rời khỏi phạm vi cấm chế của ${a.name}, ngươi nhận ra ${stars?'mấy':'một'} luồng thần thức lén lút bám theo sau lưng. Ban tổ chức chỉ bảo vệ khách bên trong — ngoài cửa, sát nhân đoạt bảo là chuyện thường như cơm bữa.`,
      options:aucTailOptions(a.id, A)});
  } else addLog(total ? 'Ngươi vòng vèo mấy lượt, thay đổi dung mạo, chắc chắn không ai bám theo mới quay về động phủ.' : 'Không mua gì, cũng chẳng ai buồn để ý tới ngươi.');
  render();
}
EVENT_ACTS.aucEvade = function(id, disguised){
  if(Math.random()<aucEvadeChance({disguise:disguised})){ addLog('Ngươi đổi ba lớp dung mạo, lẩn vào phường thị đông đúc — kẻ bám đuôi mất dấu.'); return; }
  addLog('Kẻ bám đuôi không bị lừa — chúng đã chặn đường phía trước!');
  EVENT_ACTS.aucFight(id, false);
};
EVENT_ACTS.aucTalisman = function(tid){
  state.talismans[tid]--;
  if(tid==='thai_nhat' && state.tg) tg().hiddenUntil = Math.max(tg().hiddenUntil||0, Math.floor(nowYears())+20);
  addLog(`${TALISMANS.find(t=>t.id===tid).name} phát động — khí tức ngươi biến mất khỏi thần thức của kẻ bám đuôi.`);
};
EVENT_ACTS.aucFight = function(id, trap){
  const a = AUCTIONS.find(x=>x.id===id);
  const p = Math.min(MAJOR_REALMS.length-1, Math.max(a.minRealm, state.realmIdx));
  const e = mkEnemy(p, pick(['Tu sĩ bịt mặt đoạt bảo','Kẻ bám đuôi áo xám','Nhóm sát nhân đoạt bảo']), trap?1.1:1.45, {aucTail:true, isBoss:true});
  startCombat(e);
  if(trap && state.combat){ state.combat.formationActive = true; combatLog('Kẻ bám đuôi lao vào đúng trận địa ngươi bày sẵn — Điên Đảo Ngũ Hành Trận vận chuyển!'); render(); }
};
function aucOnCombatLose(enemy){
  if(enemy.contract){ return ` Nhiệm vụ thất bại.`; }
  if(!enemy.aucTail) return '';
  const lost = Math.round(state.spiritStones*0.3); state.spiritStones -= lost;
  return ` Kẻ đoạt bảo lục soát túi trữ vật, cướp đi ${lost} linh thạch.`;
}
function aucOnCombatWin(enemy){
  if(enemy.contract){
    const t = Math.round((enemy.contract==='thapphuong'?150:60)*(state.realmIdx-7));
    tg().tienThach += t;
    if(enemy.contract==='thapphuong' && Math.random()<0.5){ tg().wanted = Math.min(100, tg().wanted+5); return ` Hoàn thành nhiệm vụ, nhận ${t} tiên thạch — mục tiêu có dính dáng tới Thiên Đình (truy nã +5).`; }
    return ` Hoàn thành nhiệm vụ, nhận ${t} tiên thạch.`;
  }
  if(!enemy.aucTail) return '';
  const st = Math.round(200 + state.realmIdx*400);
  state.spiritStones += st;
  return ` Giết người đoạt bảo không thành, lại bị ngươi phản sát — túi trữ vật của chúng có ${st} linh thạch.`;
}
function aucMigrate(){
  const A = state.auc;
  if(A && A.active && !AUCTIONS.find(x=>x.id===A.active.id)) A.active = null;
}

function openCreation(){
  const el = document.getElementById('creation');
  el.classList.add('show');
  document.getElementById('overlay').classList.remove('show');
  renderCreation();
}
function closeCreation(){ document.getElementById('creation').classList.remove('show'); }
function renderStartModal(){ openCreation(); }
function goToCreationStep(step){ creationStep = step; renderCreation(); const el = document.getElementById('creation'); el.scrollTop = 0; }
function crRandomName(){
  pendingName = pick(NAME_SURNAME) + ' ' + pick(NAME_GIVEN);
  const i = document.getElementById('nameInput'); if(i) i.value = pendingName;
  crValidateName();
}
function crNameOk(){ const n = (pendingName||'').trim(); return n.length>=2 && n.length<=16; }
function crValidateName(){ const b = document.getElementById('crNext1'); if(b) b.disabled = !crNameOk(); }
function crSelectOrigin(id){ pendingOrigin = id; renderCreation(); }
function crSelectPath(id){ pendingPath = PATHS.find(p=>p.id===id) || null; renderCreation(); }
function crTestRoot(){
  if(crTesting || rootTries>=3) return;
  crTesting = true;
  if(!pendingPhysiqueRolled){ window.pendingInnate = rollPhysique(); pendingPhysiqueRolled = true; }
  const next = rollSpiritRoot();
  const orb = document.getElementById('crOrb');
  if(orb){ orb.classList.remove('lit'); orb.classList.add('testing'); }
  const reduce = !settings.motion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  setTimeout(()=>{ pendingRoot = next; const dl = diLinhFor(next); pendingPhysique = dl ? Object.assign({}, dl) : (window.pendingInnate||null); rootTries++; crTesting = false; renderCreation(); }, reduce ? 50 : 1300);
  const btn = document.getElementById('crTestBtn'); if(btn){ btn.disabled = true; btn.textContent = 'Trắc Linh Thạch đang cảm ứng…'; }
}
function orbGradient(els){
  if(!els || !els.length) return 'radial-gradient(circle at 35% 30%, #3a4a50, #151d20)';
  const cols = els.map(e=>ELEM_COLOR[e]||'#ccc');
  if(cols.length===1) return `radial-gradient(circle at 35% 30%, #ffffff 0%, ${cols[0]} 38%, #10181b 100%)`;
  return `radial-gradient(circle at 35% 30%, rgba(255,255,255,.85) 0%, transparent 32%), conic-gradient(from 30deg, ${cols.join(', ')}, ${cols[0]})`;
}
function crStars(n){ return n ? Array.from({length:5},(_,i)=>`<span class="${i<n?'on':''}">★</span>`).join('') : '<span class="q">?</span>'; }
function crStatBar(label, mult){
  const pct = Math.max(8, Math.min(100, (mult-0.6)/0.9*100));
  return `<div class="cr-stat"><span>${label}</span><div class="cr-stat-track"><div class="cr-stat-fill ${mult>1.05?'hi':mult<0.95?'lo':''}" style="width:${pct}%"></div></div><b>×${mult}</b></div>`;
}
function renderCreation(){
  const el = document.getElementById('creation');
  const step = creationStep;
  const prog = `<ol class="cr-steps">${CR_STEPS.map((n,i)=>`<li class="${i+1<step?'done':i+1===step?'cur':''}"><span class="dot"></span><span class="lb">${n}</span></li>`).join('')}</ol>`;
  const back = step>1 ? `<button class="cr-back" onclick="goToCreationStep(${step-1})" aria-label="Quay lại">‹ Quay lại</button>` : `<span></span>`;
  let body = '', foot = '';
  if(step===1){
    body = `<h2 class="cr-h">Đạo hiệu của ngươi</h2>
      <p class="cr-lead">Sương lạnh phủ kín một sơn thôn nghèo khó. Vận mệnh trớ trêu sắp cuốn ngươi vào tu tiên giới tinh phong huyết vũ — cùng một chiếc bình nhỏ màu lục bất ngờ rơi vào tay.</p>
      <label class="cr-label" for="nameInput">Tên gọi trên con đường tu tiên</label>
      <div class="cr-name-row">
        <input type="text" id="nameInput" class="cr-input" placeholder="Ví dụ: Lâm Thanh Vân" maxlength="16" autocomplete="off" value="${(pendingName||'').replace(/"/g,'&quot;')}"
          oninput="pendingName=this.value; crValidateName()" onkeydown="if(event.key==='Enter' && crNameOk()) goToCreationStep(2)">
        <button class="cr-dice" onclick="crRandomName()" aria-label="Đặt tên ngẫu nhiên">${ic('reset','keep')}</button>
      </div>
      <p class="cr-hint">Từ 2 tới 16 ký tự. Chạm nút bên cạnh để gieo một cái tên ngẫu nhiên.</p>`;
    foot = `<button class="btn gold" id="crNext1" ${crNameOk()?'':'disabled'} onclick="goToCreationStep(2)">Tiếp Theo</button>`;
  } else if(step===2){
    body = `<h2 class="cr-h">Xuất thân</h2><p class="cr-lead">Mỗi người bước vào tu tiên giới từ một nơi khác nhau.</p>
      <div class="cr-cards">${ORIGINS.map(o=>`<button class="cr-card ${pendingOrigin===o.id?'sel':''}" onclick="crSelectOrigin('${o.id}')" aria-pressed="${pendingOrigin===o.id}">
        <span class="cr-card-ic">${ic(o.icon,'keep')}</span>
        <span class="cr-card-body"><span class="cr-card-name">${o.name}</span><span class="cr-card-tag">${o.tag}</span>
        <span class="cr-card-desc">${o.desc}</span><span class="cr-card-bonus">${o.bonus}</span></span></button>`).join('')}</div>`;
    foot = `<button class="btn gold" ${pendingOrigin?'':'disabled'} onclick="goToCreationStep(3)">Tiếp Theo</button>`;
  } else if(step===3){
    const r = pendingRoot && rootTries>0 ? pendingRoot : null;
    const rank = r ? ROOT_RANK[r.id] || {stars:0,label:''} : null;
    const mods = r ? rootMods(r, 0) : null;
    body = `<h2 class="cr-h">Trắc linh căn</h2>
      <p class="cr-lead">Trưởng lão ngoại môn đặt trước mặt ngươi một khối Trắc Linh Thạch. Đặt tay lên — linh căn thế nào, đá sẽ tự nói.</p>
      <div class="cr-orb-wrap"><div class="cr-orb ${r?'lit':''}" id="crOrb" style="background:${orbGradient(r?r.elements:null)}"></div></div>
      ${r ? `<div class="cr-root">
          <div class="cr-root-top"><span class="cr-root-name">${r.name}</span><span class="cr-stars">${crStars(rank.stars)}</span></div>
          <div class="cr-elems">${r.elements.map(e=>`<span class="cr-elem" style="--c:${ELEM_COLOR[e]||'#ccc'}">${e}</span>`).join('')}<span class="cr-rank">${rank.label}</span></div>
          <p>${r.desc}</p>
          <div class="cr-mini"><span>Tu luyện <b>×${mods.tuViMult}</b></span><span>Đan dược <b>×${mods.pillMult}</b></span><span>Bạo kích <b>${mods.critBonus>=0?'+':''}${mods.critBonus}%</b></span></div>
          ${r.isDynamic?'<p class="cr-hint" style="margin:6px 0 0;">Chỉ số trên sẽ đảo ngược thành tư chất mạnh nhất khi đạt tới Linh Giới.</p>':''}

      <div class="cr-paths">${PATHS.map(p=>{ const sel = pendingPath && pendingPath.id===p.id;

        </button>`; }).join('')}</div>`;
    foot = `<button class="btn gold" ${pendingPath?'':'disabled'} onclick="goToCreationStep(5)">Tiếp Theo</button>`;
  } else {
    const o = ORIGINS.find(x=>x.id===pendingOrigin), r = pendingRoot, p = pendingPath;
    const phys = pendingPhysique && !pendingPhysique.hidden ? pendingPhysique.name : pendingPhysique ? 'Chưa rõ — có điều khác thường' : 'Phàm Thể';
    body = `<h2 class="cr-h">Mệnh bài</h2><p class="cr-lead">Một khối ngọc bài khắc tên ngươi được đặt vào hồn đăng của môn phái. Ngọc còn sáng, người còn sống.</p>
      <div class="cr-tablet">
        <div class="cr-tablet-orb" style="background:${orbGradient(r.elements)}"></div>
        <div class="cr-tablet-name">${(pendingName||'').trim()}</div>
        <div class="cr-tablet-row"><span>Xuất thân</span><b>${o.name}</b></div>

        <div class="cr-tablet-row"><span>Hành trang</span><b>${o.bonus}</b></div>
      </div>`;
    foot = `<button class="btn gold" onclick="startGame()">Bước Vào Tu Tiên Giới</button>`;
  }
  el.innerHTML = `<div class="cr-wrap">
      <div class="cr-top">${back}<span class="cr-brand">Phàm Nhân Vấn Đạo</span></div>
      ${prog}
      <div class="cr-body">${body}</div>
      <div class="cr-foot">${foot}</div>
    </div>`;
  if(step===1){ const i = document.getElementById('nameInput'); if(i && !pendingName) setTimeout(()=>i.focus({preventScroll:true}), 50); }
}

function phyId(){ return state.physique ? state.physique.id : null; }
function phyKnown(){ return state.physique && (!state.physique.hidden || state.physiqueKnown); }
function hasAcq(id){ return !!(state.acqPhys && state.acqPhys.includes(id)); }
function diLinhFor(root){
  if(!root || root.id!=='bienli') return null;
  return PHYSIQUE_TEMPLATES.find(p=>p.group==='dilinh' && root.elements.includes(p.element)) || null;
}
function rollPhysique(){
  const pool = PHYSIQUE_TEMPLATES.filter(p=>p.group!=='dilinh');
  const total = pool.reduce((s,p)=>s+p.weight,0);
  let roll = Math.random()*total;
  for(const p of pool){ if(roll<p.weight) return p.id==='none' ? null : Object.assign({}, p); roll -= p.weight; }
  return null;
}
function rootHas(els){ return !!(state.root && state.root.elements && state.root.elements.some(e=>els.includes(e))); }
function longNgamBacklash(){
  if(phyId()!=='long_ngam' || state.age<30) return false;
  return !(state.longNgamUntil && nowYears()<state.longNgamUntil);
}
function physiqueMods(){
  const m = {atkMult:1, defMult:1, spdMult:1, hpMult:1, critBonus:0, pillMult:1,
    meditateMishapMult:1, trapDmgMult:1, lifestealPct:0, earlyTuViMult:1, earlyRealmCap:-1,
    tuVi:0, breakBonus:0, evilMult:1, fleeBonus:0, dodge:0, freeze:0, tribMult:1, dmgTaken:1, lawMult:1, soulGuard:false, ignoreDef:0};
  const id = phyId();
  if(id==='long_ngam'){ m.critBonus += 5; m.tuVi -= 0.2; if(longNgamBacklash()){ m.hpMult *= 0.6; m.tuVi -= 0.3; } }
  if(id==='huyen_am'){ m.tuVi += (state.path && ['ma','hon'].includes(state.path.id)) || rootHas(['Băng','Thủy']) ? 0.8 : 0.1; m.soulGuard = true; }
  if(id==='huyen_linh'){ m.tuVi += 0.4; m.breakBonus += 10; }
  if(id==='tien_linh' && state.realmIdx>=8){ m.tuVi += 0.5; m.lawMult *= 1.3; m.soulGuard = true; m.meditateMishapMult = 0; }
  if(id==='thuan_duong'){ m.evilMult *= 1.5; if((state.path && state.path.id==='kiem') || rootHas(['Hỏa','Lôi'])) m.atkMult *= 1.15; }
  if(id==='loi_linh'){ m.tribMult *= 0.7; m.atkMult *= 1.15; m.evilMult *= 1.2; }
  if(id==='phong_linh'){ m.spdMult *= 1.3; m.fleeBonus += 30; m.dodge += 0.1; }
  if(id==='bang_linh'){ m.freeze += 0.15; m.defMult *= 1.1; }
  if(hasTech('Minh Vương Quyết')) m.evilMult *= 1.3;
  if(hasTech('Huyết Ảnh Độn Pháp')) m.fleeBonus += 30;
  if(hasTech('Độn Thổ Thuật')) m.fleeBonus += 10;
  if(hasTech('Song Tu Âm Dương Quyết')) m.breakBonus += 5;
  if(hasTech('Băng Tâm Tuyệt Tình Quyết')) m.soulGuard = true;
  if(hasAcq('phan_thanh')){ m.defMult *= 1.15; m.atkMult *= 1.2; }
  if(hasAcq('huyen_khieu')){ m.atkMult *= 1.2; m.ignoreDef += 0.2; }
  if(hasAcq('chan_long')){ m.hpMult *= 1.2; }
  if(hasAcq('ngu_hanh')){ m.dmgTaken *= 0.8; }
  if(hasAcq('cuong_thi')){ m.defMult *= 1.25; m.hpMult *= 1.1; m.pillMult *= 0.7; }
  return m;
}
function checkAcquiredPhysiques(){
  if(!state || !state.root) return;
  if(!state.acqPhys) state.acqPhys = [];
  ACQ_PHYSIQUES.forEach(p=>{
    if(!state.acqPhys.includes(p.id) && p.check()){
      state.acqPhys.push(p.id);
      addLog(`Nhục thân lột xác — thành tựu Hậu Thiên thể chất 【${p.name}】! ${p.desc}`);
      fx('flash',{color:'rgba(240,207,140,.35)',dur:700}); fx('banner',{text:p.name});
    }
  });
  if(phyId()==='tien_linh' && state.realmIdx>=8 && !state.physiqueKnown){ state.physiqueKnown = true; addLog('Vừa hít vào ngụm Tiên Linh Khí đầu tiên, toàn thân ngươi như được gột rửa — thứ ngủ say trong người bấy lâu thức tỉnh: 【Tiên Linh Chi Thể】!'); }
  if(longNgamBacklash() && !state.lnWarned){ state.lnWarned = true; addLog('Đã quá tuổi ba mươi — dương khí Long Ngâm Chi Thể thiêu đốt kinh mạch, tạng phủ: khí huyết −40%, tu luyện chậm thêm 30%. Cần Long Ngâm Quả để duy trì.'); }
  if(!longNgamBacklash()) state.lnWarned = false;
}
function eatLongNgamQua(){
  if(!(state.longNgamQua>0)) return;
  state.longNgamQua--;
  state.longNgamUntil = Math.max(state.longNgamUntil||0, nowYears()) + 30;
  addLog('Nuốt một quả Long Ngâm Quả, hàn khí dịu mát áp chế dương khí cuồng bạo — duy trì được thêm 30 năm.');
  computeStats(); render();
}
function buyLongNgamQua(){
  const cost = 300 + state.realmIdx*200;
  if(state.spiritStones<cost){ addLog(`Long Ngâm Quả giá ${cost} linh thạch.`); render(); return; }
  state.spiritStones -= cost; state.longNgamQua = (state.longNgamQua||0)+1;
  addLog(`Mua được một quả Long Ngâm Quả (${cost} linh thạch).`); render();
}
function refineCuongThi(){
  if(state.cuongThi) return;
  if(!state.path || !['ma','yeuquy','the'].includes(state.path.id)){ addLog('Chỉ Ma Tu, Yêu/Quỷ Tu hoặc Thể Tu mới luyện được Đồng Đầu Thiết Tí.'); render(); return; }
  if(state.realmIdx<2){ addLog('Luyện thi thân cần tu vi Kết Đan trở lên.'); render(); return; }
  const cost = 1500 + state.realmIdx*800;
  if(state.spiritStones<cost || (state.mats.huyet[2]||0)<3){ addLog(`Luyện thi thân cần ${cost} linh thạch và 3 ${matName('huyet',2)}.`); render(); return; }
  state.spiritStones -= cost; state.mats.huyet[2] -= 3; advanceTime(36);
  state.cuongThi = true;
  checkAcquiredPhysiques(); computeStats(); render();
}
function phyEvilMult(enemy){ return isEvilEnemy(enemy) ? physiqueMods().evilMult : 1; }
function phyCard(title, desc, extra, cls){ return `<div class="phy-item ${cls||''}"><div class="phy-name">${title}</div><p>${desc}</p>${extra||''}</div>`; }

    return `<div class="phy-row ${has?'has':''}"><div class="phy-row-head"><span>${a.name}${a.alias?` · ${a.alias}`:''}</span><b>${has?'Đã thành':'Chưa'}</b></div>
      <div class="phy-row-how">${has?a.desc:`Cách đạt: ${a.how}`}</div>${btn}</div>`;
  }).join('');
  const codex = PHYSIQUE_TEMPLATES.filter(t=>t.id!=='none').map(t=>`<div class="phy-row"><div class="phy-row-head"><span>${t.name}</span><b>${t.group==='dilinh'?'Dị Linh Thể':'Tiên Thiên'}</b></div><div class="phy-row-how">${t.owner}${t.group==='dilinh'?` — tự hình thành khi mang ${t.element} Linh Căn biến dị`:''}</div></div>`).join('')
    + RACE_PHYSIQUES.map(r=>`<div class="phy-row race"><div class="phy-row-head"><span>${r.name}</span><b>Chủng tộc</b></div><div class="phy-row-how">${r.desc} Nhân tộc không thể sở hữu.</div></div>`).join('');

    <div class="card"><div class="sec-title">${ic('mountain')} Thể Chất Hậu Thiên<span>${(state.acqPhys||[]).length}/${ACQ_PHYSIQUES.length}</span></div>
      <p class="sec-note" style="margin:0 0 6px;">Thể chất bá đạo nhất đều do khổ tu mà thành — Hàn Lập vốn Tạp Linh Căn, không thể chất bẩm sinh, vẫn tự rèn ra những nhục thân mạnh bậc nhất Tiên Giới.</p>${acq}</div>
    <details class="card phy-codex"><summary class="sec-title">${ic('book')} Thể Chất Đồ Giám</summary>${codex}</details>`;
}

function checkPhysiqueDiscovery(){
  const phy = state.physique;
  if(!phy || !phy.hidden || state.physiqueKnown) return;
  if(phy.id==='long_ngam' && !state.longNgamCrisisOccurred && Math.random()<0.06){

    const dmg = Math.round(state.stats.hpMax*0.6); state.hp = Math.max(1, state.hp-dmg);
    addLog(`Dương khí trong người đột nhiên bạo phát như tiếng rồng ngâm, kinh mạch như muốn nứt toác — ngươi ngã quỵ, chịu ${dmg} sát thương. Ngươi nhận ra mình mang 【Long Ngâm Chi Thể】: thiên tài trận pháp, nhưng khó sống qua tuổi ba mươi nếu không có Long Ngâm Quả.`);

/* Thọ nguyên theo cảnh giới (năm). Từ Chân Tiên trở lên coi như vô hạn. */
const LIFE_BY_REALM = [120, 200, 500, 1000, 2000, 5000, 10000, 30000, Infinity, Infinity, Infinity, Infinity, Infinity];
/* Số năm bế quan mỗi lần đột phá tiểu cảnh giới, theo đại cảnh giới đang đứng */
const BREAK_YEARS = [1, 5, 15, 40, 80, 150, 300, 600, 800, 1000, 1500, 2000, 0];
function lifeMax(){ const base = LIFE_BY_REALM[state.realmIdx]; return base===Infinity ? Infinity : base + (state.lifeBonus||0) + (hasTech('Trường Xuân Công')?20:0); }
function lifeLeft(){ const m = lifeMax(); return m===Infinity ? Infinity : Math.max(0, m - nowYears()); }
function lifePct(){ const m = lifeMax(); return m===Infinity ? 0 : Math.min(1, nowYears()/m); }
const DIEN_THO_MAX = 3;
function dienThoPrice(){ return Math.round(200 * Math.pow(3, state.realmIdx)); }
function buyDienTho(){
  if(state.realmIdx>=8) return;
  const used = (state.dienThoUsed||{})[state.realmIdx]||0;
  if(used>=DIEN_THO_MAX){ addLog(`Diên Thọ Đan dùng nhiều sẽ mất hiệu lực — ở ${MAJOR_REALMS[state.realmIdx].name} đã dùng đủ ${DIEN_THO_MAX} viên.`); render(); return; }
  const cost = dienThoPrice();
  if(state.spiritStones<cost){ addLog(`Diên Thọ Đan giá ${cost} linh thạch.`); render(); return; }
  state.spiritStones -= cost;
  state.dienThoUsed = state.dienThoUsed || {}; state.dienThoUsed[state.realmIdx] = used+1;
  const add = Math.round(LIFE_BY_REALM[state.realmIdx]*0.1);
  state.lifeBonus = (state.lifeBonus||0) + add;
  state.lifeWarn = 0;
  addLog(`Nuốt Diên Thọ Đan, thọ nguyên kéo dài thêm ${add} năm (đã dùng ${used+1}/${DIEN_THO_MAX} ở cảnh giới này).`);
  fx('banner', {text:`Thọ nguyên +${add} năm`, cls:'jade'});
  render();
}
/* Cảnh báo và tọa hóa — kiểm tra sau mỗi hành động */
function checkLifespan(){
  if(!state || !state.root || state.dead || state.combat || state.tribulation) return;
  const m = lifeMax(); if(m===Infinity) return;
  const left = m - nowYears();
  const warn = state.lifeWarn||0;
  if(left<=0){ triggerDeath(); return; }
  if(left<=m*0.05 && warn<2){ state.lifeWarn = 2; addLog(`Thọ nguyên chỉ còn khoảng ${Math.ceil(left)} năm — tóc bạc trắng, khí huyết khô kiệt. Không đột phá được thì sắp tọa hóa!`); fx('flash',{color:'rgba(193,93,74,.35)'}); }
  else if(left<=m*0.2 && warn<1){ state.lifeWarn = 1; addLog(`Thọ nguyên còn ${Math.ceil(left)} năm. Tu vi dậm chân tại chỗ quá lâu, cần tìm cách đột phá hoặc kéo dài thọ nguyên.`); }
}
function triggerDeath(){
  state.dead = true;
  const canFlee = state.realmIdx>=3;
  const soul = state.realmIdx>=5 ? 'nguyên thần' : 'Nguyên Anh';
  const body = document.getElementById('modalBody');
  body.innerHTML = `<h2 class="serif modal-head" style="color:var(--blood-bright);">${ic('hourglass','keep')}<span>Thọ Nguyên Đã Tận</span></h2>
    <p>${state.name} ngồi xếp bằng trong động phủ, hơi thở mỏng dần. ${state.age} năm tu hành, dừng lại ở ${fullRealmName(state.realmIdx, state.subStage||0)}.</p>
    ${canFlee?`<p>Nhục thân đã khô kiệt, nhưng ${soul} vẫn còn. Có thể thoát khỏi xác, tìm một thân thể mới để đoạt xá — cái giá là tu vi của cảnh giới hiện tại trở về sơ kỳ.</p>`:'<p>Chưa ngưng kết Nguyên Anh, hồn phách theo thân xác cùng tan biến.</p>'}
    <div class="btn-row" style="margin-top:14px;flex-direction:column;">
      ${canFlee?`<button class="btn gold" onclick="doatXa()">${soul==='Nguyên Anh'?'Nguyên Anh':'Nguyên Thần'} Xuất Khiếu — Đoạt Xá</button>`:''}
      <button class="btn ${canFlee?'ghost':'blood'}" onclick="deathRestart()">Luân Hồi Chuyển Thế (chơi lại)</button>
    </div>`;
  document.getElementById('overlay').classList.add('show');
  fx('flash',{color:'rgba(0,0,0,.6)', dur:1200});
}
function doatXa(){
  const soul = state.realmIdx>=5 ? 'nguyên thần' : 'Nguyên Anh';
  state.dead = false;
  state.doatXa = (state.doatXa||0)+1;
  state.age = 18; state.month = 0; state.lifeBonus = 0; state.dienThoUsed = {}; state.lifeWarn = 0;
  state.subStage = 0; state.tuVi = 0;
  computeStats(); state.hp = state.stats.hpMax;
  closeModal();
  addLog(`${soul[0].toUpperCase()+soul.slice(1)} thoát khỏi thân xác khô kiệt, bay ngàn dặm tìm được một thiếu niên vừa tắt thở — đoạt xá thành công (lần thứ ${state.doatXa}). Thân thể mới trẻ trung, nhưng tu vi phải bắt đầu lại từ ${fullRealmName(state.realmIdx,0)}.`);
  fx('banner',{text:'Đoạt Xá Trùng Sinh', cls:'gold'});
  render();
}
function deathRestart(){ closeModal(); try{ localStorage.removeItem(SAVE_KEY); }catch(e){} state.dead = false; restartGame(); }

/* Bế quan nhiều năm liền */
function meditateYears(n){
  if(state.combat || state.expd) return;
  let gain = 0, mishaps = 0, dmg = 0;
  const pm = physiqueMods();
  const mishapChance = 0.08*((state.path && state.path.meditateMishapMult) ? state.path.meditateMishapMult : 1)*pm.meditateMishapMult*(hasRelic('thanh_tam_boi')?0.5:1)*(luyenThanBacklash()?2:1);
  for(let i=0;i<12*n;i++){ let g = previewMeditateGain(); if(Math.random()<mishapChance){ g*=2; mishaps++; dmg += Math.round(state.stats.hpMax*0.08); } gain += g; }
  state.tuVi += gain; state.linhLuc += (3+state.realmIdx)*12*n;
  state.hp = Math.max(1, state.hp-dmg);
  advanceTime(12*n);
  addLog(`Bế quan tròn ${n} năm: tu vi +${gain}.${mishaps?` ${mishaps} lần tâm cảnh dao động, mất tổng ${dmg} khí huyết.`:''}`);
  fx('float', {sel:'#tuviFill', text:`+${gain}`, cls:'tuvi'});
  checkPhysiqueDiscovery(); checkBreakthroughAvailable(); render();
}

/* Trang Thời Gian */
function upcomingEvents(){
  const t = nowYears(), ev = [];
  const push = (years, label, cls)=>{ if(years>=0 && years<100000) ev.push({years, label, cls:cls||''}); };
  REALMS.forEach(R=>{ if(!R.cycle || state.realmIdx<R.z) return; const s = realmSched(R.z); if(!s) return;
    if(t>=s.nextOpen && !s.visited) push(0, `${ZONES[R.z].name} đang mở cửa — còn ${Math.ceil(s.nextOpen+R.window-t)} năm`, 'hot');
    else push(s.nextOpen-t, `${ZONES[R.z].name} mở cửa`); });
  if(typeof AUCTIONS!=='undefined') AUCTIONS.filter(aucWorldOk).forEach(a=>{ const s = aucSched(a); if(t>=s.next && !s.attended) push(0, `${a.name} đang khai hội`, 'hot'); else push(s.next-t, `${a.name} khai hội`); });
  if(state.lg && lgSeen()){ const mk = lg().maKiep; if(mk.startAge!=null && !mk.announced) push(mk.startAge-t, 'Ma Kiếp giáng lâm', 'blood'); if(maKiepActive()) push(mk.endAge-t, 'Ma Kiếp kết thúc', 'blood'); }
  if(state.lg && lg().luyenThan && lg().luyenThan.deadline!=null && [1,2,4,5].includes(lg().luyenThan.layer)) push(lg().luyenThan.deadline-t, `Hạn chót luyện tiếp Luyện Thần Thuật tầng ${lg().luyenThan.layer+1}`, 'blood');
  if(phyId()==='long_ngam'){ if(state.age<30) push(30-t, 'Tuổi ba mươi — dương khí Long Ngâm phản phệ', 'blood'); else if(state.longNgamUntil && t<state.longNgamUntil) push(state.longNgamUntil-t, 'Long Ngâm Quả hết tác dụng', 'blood'); }
  if(state.tg && tg().huyenDang) push((tg().huyenLastYear||Math.floor(t))+50-t, 'Huyền Thiên Tiên Đằng kết quả');
  const m = lifeMax(); if(m!==Infinity) push(m-t, 'Thọ nguyên cạn kiệt — tọa hóa', 'blood');
  return ev.sort((a,b)=>a.years-b.years).slice(0,12);
}
function fmtYears(y){ if(y<=0) return 'Ngay bây giờ'; if(y<1) return `${Math.max(1,Math.round(y*12))} tháng`; return `${Math.ceil(y)} năm`; }
function renderTimePage(){
  const m = lifeMax(), left = lifeLeft(), pct = lifePct();

  const lifeCls = m===Infinity ? 'jade' : pct>=0.95 ? 'blood' : pct>=0.8 ? 'gold' : 'jade';
  const ev = upcomingEvents();
  const yearsTu = Math.max(0, Math.floor(nowYears()) - (state.startAge||16));
  return `
    <div class="card time-card">
      <div class="sec-title">${ic('hourglass')} Tuế Nguyệt</div>
      <div class="time-big"><span class="tb-num">${state.age}</span><span class="tb-unit">tuổi</span><span class="tb-month">tháng ${(state.month||0)+1}</span></div>
      <div class="time-sub">Năm thứ ${yearsTu+1} trên con đường tu tiên${state.doatXa?` · đã đoạt xá ${state.doatXa} lần`:''}</div>
      <div class="life-track ${lifeCls}"><div class="life-fill" style="width:${m===Infinity?100:Math.round(pct*100)}%"></div></div>
      <div class="row"><span class="k">Thọ nguyên ${MAJOR_REALMS[state.realmIdx].name}</span><span class="v">${m===Infinity?'Vô hạn — tiên nhân bất lão':`${m} năm${state.lifeBonus?` (gồm +${state.lifeBonus} từ đan dược)`:''}`}</span></div>
      <div class="row"><span class="k">Còn lại</span><span class="v" style="color:var(--${lifeCls==='blood'?'blood-bright':lifeCls==='gold'?'gold-bright':'jade-bright'});">${m===Infinity?'∞':fmtYears(left)}</span></div>
      <p class="sec-note" style="margin:6px 0 0;">Đột phá lên đại cảnh giới mới mới thật sự kéo dài thọ nguyên. Hết thọ nguyên là tọa hóa — từ Nguyên Anh trở lên còn có thể xuất khiếu đoạt xá.</p>
    </div>
    <div class="card">
      <div class="sec-title">${ic('taiji')} Bế Quan Dài Hạn</div>
      <div class="btn-row"><button class="btn ghost" onclick="meditateYears(1)">1 năm</button><button class="btn ghost" onclick="meditateYears(10)">10 năm</button><button class="btn ghost" ${state.realmIdx<3?'disabled':''} onclick="meditateYears(50)">50 năm</button></div>
      <p class="sec-note" style="margin:8px 0 0;">Mỗi canh giờ bế quan là một tháng. Đột phá một tiểu cảnh giới ở ${MAJOR_REALMS[state.realmIdx].name} tốn ${BREAK_YEARS[state.realmIdx]} năm. Thám hiểm, truyền tống, tham ngộ pháp tắc đều tiêu hao thời gian.</p>
    </div>
    <div class="card">
      <div class="sec-title">${ic('bell')} Sự Kiện Sắp Tới</div>
      <ol class="timeline">${ev.map(e=>`<li class="${e.cls}"><span class="tl-when">${fmtYears(e.years)}</span><span class="tl-what">${e.label}</span></li>`).join('') || '<li><span class="tl-what">Chưa có sự kiện nào.</span></li>'}</ol>
    </div>`;

/* =====================================================================
   HIỆU ỨNG — số sát thương bay, rung màn hình, chớp sáng, biểu ngữ
   (tự tắt khi tắt "Hiệu ứng chuyển động" trong Cài Đặt)
===================================================================== */
let fxQueue = [];
function fx(type, opts){ if(!settings.motion) return; fxQueue.push({type, opts:opts||{}}); }
function fxLayer(){ let l = document.getElementById('fxLayer'); if(!l){ l = document.createElement('div'); l.id = 'fxLayer'; document.body.appendChild(l); } return l; }
function flushFx(){
  if(!fxQueue.length) return;
  const q = fxQueue; fxQueue = [];
  requestAnimationFrame(()=>q.forEach((e,i)=>setTimeout(()=>runFx(e), i*90)));
}
function runFx(e){
  const L = fxLayer(), o = e.opts;
  if(e.type==='float'){
    const t = document.querySelector(o.sel); if(!t) return;
    const r = t.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = `fx-float ${o.cls||''}`; d.textContent = o.text;
    d.style.left = (r.left + r.width*(0.35+Math.random()*0.3)) + 'px';
    d.style.top = (r.top - 6) + 'px';
    L.appendChild(d); setTimeout(()=>d.remove(), 1300);
  } else if(e.type==='flash'){
    const d = document.createElement('div'); d.className = 'fx-flash'; d.style.background = o.color || 'rgba(255,255,255,.6)';
    d.style.animationDuration = (o.dur||500)+'ms';
    L.appendChild(d); setTimeout(()=>d.remove(), (o.dur||500)+50);
  } else if(e.type==='shake'){
    const a = document.getElementById('app') || document.body;
    a.classList.remove('fx-shake'); void a.offsetWidth; a.classList.add('fx-shake');
    setTimeout(()=>a.classList.remove('fx-shake'), 450);
  } else if(e.type==='banner'){
    L.querySelectorAll('.fx-banner').forEach(x=>x.remove());
    const d = document.createElement('div'); d.className = `fx-banner ${o.cls||''}`; d.innerHTML = `<span>${o.text}</span>`;
    L.appendChild(d); setTimeout(()=>d.remove(), 2000);
  } else if(e.type==='bolt'){
    const d = document.createElement('div'); d.className = 'fx-bolt';
    d.innerHTML = `<svg viewBox="0 0 60 200" preserveAspectRatio="none"><path d="M34 0 L18 80 L32 80 L14 200 L46 70 L30 70 L44 0 Z" fill="#fff8e0"/></svg>`;
    d.style.left = (15+Math.random()*60)+'%';
    L.appendChild(d); setTimeout(()=>d.remove(), 450);
  }
}
