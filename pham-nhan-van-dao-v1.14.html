/* =====================================================================
   v1.14 — TÀI KHOẢN & LƯU TRÊN ĐÁM MÂY (Supabase)
   Đăng nhập email + mật khẩu, bản lưu nằm trên mạng: chơi ở máy nào
   cũng tiếp tục được. Cấu hình máy chủ nhập ngay trong game (Hệ Thống ▸
   Tài Khoản) hoặc điền sẵn vào CLOUD_DEFAULT dưới đây để chia sẻ file.
===================================================================== */
const CLOUD_DEFAULT = {url:'', key:''};   // điền sẵn Project URL và anon key nếu muốn chia sẻ file cho bạn bè
const CLOUD_CFG_KEY = 'pnvd_cloud_cfg_v1';
const SUPABASE_LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
const CLOUD_SQL = `create table if not exists public.saves (
  user_id uuid primary key references auth.users(id) on delete cascade,
  data jsonb not null,
  version text,
  updated_at timestamptz not null default now()
);
alter table public.saves enable row level security;
create policy "read own save" on public.saves for select using (auth.uid() = user_id);
create policy "insert own save" on public.saves for insert with check (auth.uid() = user_id);
create policy "update own save" on public.saves for update using (auth.uid() = user_id);`;
let cloud = {client:null, user:null, status:'off', error:'', lastSync:null, busy:false, loading:null, pushTimer:null, remoteT:null};

function cloudCfg(){
  try{ const c = JSON.parse(localStorage.getItem(CLOUD_CFG_KEY)||'null'); if(c && c.url && c.key) return c; }catch(e){}
  return (CLOUD_DEFAULT.url && CLOUD_DEFAULT.key) ? CLOUD_DEFAULT : null;
}
function cloudErrMsg(e){
  const m = (e && (e.message||e.error_description||e.msg)) || String(e||'');
  if(/Invalid login credentials/i.test(m)) return 'Sai email hoặc mật khẩu.';
  if(/already registered|already been registered/i.test(m)) return 'Email này đã được đăng ký — hãy đăng nhập.';
  if(/at least 6|Password should/i.test(m)) return 'Mật khẩu tối thiểu 6 ký tự.';
  if(/Email not confirmed/i.test(m)) return 'Email chưa xác nhận — mở hộp thư và bấm liên kết xác nhận trước.';
  if(/valid email|invalid format|Unable to validate email/i.test(m)) return 'Email không hợp lệ.';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Không kết nối được máy chủ — kiểm tra mạng hoặc cấu hình.';
  if(/relation .*saves.* does not exist|Could not find the table/i.test(m)) return 'Chưa tạo bảng lưu — chạy đoạn SQL ở bước 3 trong Supabase.';
  if(/rate limit/i.test(m)) return 'Thử quá nhiều lần, đợi một lát rồi thử lại.';
  return m || 'Lỗi không xác định.';
}
function loadSupabaseLib(){
  if(window.supabase && window.supabase.createClient) return Promise.resolve();
  if(cloud.loading) return cloud.loading;
  cloud.loading = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = SUPABASE_LIB; s.onload = res;
    s.onerror = ()=>{ cloud.loading = null; rej(new Error('Failed to fetch')); };
    document.head.appendChild(s);
  });
  return cloud.loading;
}
async function cloudInit(){
  const cfg = cloudCfg();
  if(!cfg){ cloud.status = 'unconfigured'; refreshCloudUI(); return; }
  cloud.status = 'connecting'; refreshCloudUI();
  try{
    await loadSupabaseLib();
    cloud.client = window.supabase.createClient(cfg.url, cfg.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:'pnvd-auth'}});
    const {data} = await cloud.client.auth.getSession();
    cloud.user = data && data.session ? data.session.user : null;
    cloud.status = cloud.user ? 'in' : 'out';
    cloud.client.auth.onAuthStateChange((ev, session)=>{ cloud.user = session ? session.user : null; cloud.status = cloud.user ? 'in' : 'out'; refreshCloudUI(); });
    if(cloud.user) await cloudPullIfNewer(true);
  }catch(e){ cloud.status = 'error'; cloud.error = cloudErrMsg(e); }
  refreshCloudUI();
}
function saveCloudConfig(){
  const url = (document.getElementById('cfgUrl').value||'').trim().replace(/\/+$/,'');
  const key = (document.getElementById('cfgKey').value||'').trim();
  if(!/^https:\/\/.+\.supabase\.co$/.test(url)){ toast('Project URL phải có dạng https://xxxx.supabase.co'); return; }
  if(key.length<40){ toast('Anon key có vẻ chưa đúng — hãy sao chép cả chuỗi dài'); return; }
  localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify({url, key}));
  cloud.client = null; cloud.user = null;
  toast('Đã lưu cấu hình máy chủ');
  cloudInit();
}
function clearCloudConfig(){
  localStorage.removeItem(CLOUD_CFG_KEY);
  cloud = {client:null, user:null, status:'unconfigured', error:'', lastSync:null, busy:false, loading:cloud.loading, pushTimer:null, remoteT:null};
  refreshCloudUI();
}
function copyCloudSql(){
  const done = ()=>toast('Đã sao chép đoạn SQL');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(CLOUD_SQL).then(done, ()=>fallbackCopy());
  else fallbackCopy();
  function fallbackCopy(){ const t = document.getElementById('cloudSql'); if(t){ t.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Hãy tự chọn và sao chép đoạn SQL'); } } }
}

/* ---------- Đăng ký, đăng nhập ---------- */
function cloudForm(){ return {email:(document.getElementById('accEmail').value||'').trim(), pw:document.getElementById('accPw').value||''}; }
async function cloudSignUp(){
  const {email, pw} = cloudForm();
  if(!cloud.client || cloud.busy) return;
  cloud.busy = true; refreshCloudUI();
  try{
    const {data, error} = await cloud.client.auth.signUp({email, password:pw});
    if(error) throw error;
    if(!data.session){ toast('Đã gửi email xác nhận — mở hộp thư, bấm liên kết rồi quay lại đăng nhập'); }
    else { cloud.user = data.session.user; cloud.status = 'in'; cloud.formPw = ''; toast('Tạo tài khoản thành công'); await cloudAfterLogin(); }
  }catch(e){ toast(cloudErrMsg(e)); }
  cloud.busy = false; refreshCloudUI();
}
async function cloudSignIn(){
  const {email, pw} = cloudForm();
  if(!cloud.client || cloud.busy) return;
  cloud.busy = true; refreshCloudUI();
  try{
    const {data, error} = await cloud.client.auth.signInWithPassword({email, password:pw});
    if(error) throw error;
    cloud.user = data.user || (data.session && data.session.user); cloud.status = 'in';
    cloud.formPw = '';
    toast('Đăng nhập thành công');
    await cloudAfterLogin();
  }catch(e){ toast(cloudErrMsg(e)); }
  cloud.busy = false; refreshCloudUI();
}
async function cloudSignOut(){
  if(!cloud.client) return;
  if(state && state.root) { saveGame(true); await cloudPush(true); }
  await cloud.client.auth.signOut();
  cloud.formPw = '';
  cloud.user = null; cloud.status = 'out'; cloud.lastSync = null;
  toast('Đã đăng xuất — bản lưu trên máy vẫn còn');
  refreshCloudUI();
}

/* ---------- Đồng bộ ---------- */
async function cloudFetch(){
  const {data, error} = await cloud.client.from('saves').select('data, updated_at').eq('user_id', cloud.user.id).maybeSingle();
  if(error) throw error;
  return data ? data.data : null;
}
async function cloudPush(silent){
  if(!cloud.client || !cloud.user) return false;
  const local = readSave();
  if(!local) return false;
  try{
    const {error} = await cloud.client.from('saves').upsert({user_id:cloud.user.id, data:local, version:GAME_VERSION, updated_at:new Date().toISOString()});
    if(error) throw error;
    cloud.lastSync = Date.now(); cloud.remoteT = local.t; cloud.error = '';
    if(!silent) toast('Đã đồng bộ lên đám mây');
    refreshCloudUI();
    return true;
  }catch(e){ cloud.error = cloudErrMsg(e); if(!silent) toast(cloud.error); refreshCloudUI(); return false; }
}
function scheduleCloudPush(){
  if(!cloud.user) return;
  if(cloud.pushTimer) return;
  cloud.pushTimer = setTimeout(()=>{ cloud.pushTimer = null; cloudPush(true); }, 20000);
}
function writeLocalSave(d){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(d)); }catch(e){} }
/* Lúc mở game: bản đám mây mới hơn thì âm thầm thay bản trên máy */
async function cloudPullIfNewer(atStart){
  const remote = await cloudFetch();
  cloud.remoteT = remote ? remote.t : null;
  const local = readSave();
  if(remote && (!local || (remote.t||0) > (local.t||0))){
    const ls = document.getElementById('loadingScreen');
    const inGame = state && state.root && ls && ls.classList.contains('hide');
    if(inGame){ askUseCloud(remote, false); return 'asked'; }
    writeLocalSave(remote);
    cloud.lastSync = Date.now();
    if(atStart){ const ls = document.getElementById('loadingScreen'); if(ls && !ls.classList.contains('hide') && document.getElementById('lsActions').classList.contains('show')) showTitleActions(); toast('Đã tải bản lưu mới nhất từ đám mây'); }
    return 'pulled';
  }
  if(local && (!remote || (local.t||0) > (remote.t||0))){ await cloudPush(true); return 'pushed'; }
  cloud.lastSync = Date.now();
  return 'same';
}
/* Sau khi đăng nhập: so sánh hai bản, hỏi nếu hai bên đều có tiến trình */
async function cloudAfterLogin(){
  try{
    const remote = await cloudFetch();
    const local = readSave();
    cloud.remoteT = remote ? remote.t : null;
    if(!remote){ if(local) await cloudPush(false); return; }
    if(!local){ writeLocalSave(remote); askUseCloud(remote, true); return; }
    if((remote.t||0) > (local.t||0)) askUseCloud(remote, false);
    else if((local.t||0) > (remote.t||0)) await cloudPush(false);
  }catch(e){ toast(cloudErrMsg(e)); }
}
function saveSummary(d){ const st = d.state; return `${st.name} · ${fullRealmName(st.realmIdx, st.subStage||0)} · ${st.age} tuổi · lưu lúc ${new Date(d.t).toLocaleString('vi-VN')}`; }
function askUseCloud(remote, onlyCloud){
  const local = readSave();
  document.getElementById('modalBody').innerHTML = `
    <h2 class="serif modal-head">${ic('cloud','keep')}<span>Bản lưu trên đám mây</span></h2>
    <p>Tài khoản này đã có tiến trình trên đám mây:</p>
    <div class="acc-save">${saveSummary(remote)}</div>
    ${local && !onlyCloud ? `<p style="margin-top:10px;">Trên máy này đang có:</p><div class="acc-save dim">${saveSummary(local)}</div>` : ''}
    <div class="btn-row" style="margin-top:14px;flex-direction:column;">
      <button class="btn gold" onclick="useCloudSave()">Dùng Bản Đám Mây</button>
      ${local && !onlyCloud ? `<button class="btn ghost" onclick="closeModal(); cloudPush(false)">Giữ Bản Trên Máy, Ghi Đè Đám Mây</button>` : ''}
    </div>`;
  document.getElementById('overlay').classList.add('show');
  cloud.pendingRemote = remote;
}
function useCloudSave(){
  const remote = cloud.pendingRemote; if(!remote) return;
  writeLocalSave(remote);
  cloud.lastSync = Date.now();
  closeModal();
  const ls = document.getElementById('loadingScreen');
  if(ls && !ls.classList.contains('hide')){ showTitleActions(); toast('Đã tải bản lưu từ đám mây'); return; }
  hideTitle(); closeCreation && closeCreation();
  restoreFromSave(remote);
  toast(`Tiếp tục đạo đồ của ${state.name} từ đám mây`);
}
async function cloudPullNow(){
  if(!cloud.user) return;
  try{ const remote = await cloudFetch(); if(!remote){ toast('Tài khoản chưa có bản lưu trên đám mây'); return; } askUseCloud(remote, false); }
  catch(e){ toast(cloudErrMsg(e)); }
}

      ${cloud.error?`<p class="bad-mark" style="font-size:12px;">${ic('warn')} ${cloud.error}</p>`:''}
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn gold" ${state&&state.root?'':'disabled'} onclick="saveGame(true); cloudPush(false)">${ic('cloud')}Đồng Bộ Lên</button>
        <button class="btn ghost" onclick="cloudPullNow()">Tải Bản Đám Mây</button>
      </div>
      <button class="btn ghost" style="margin-top:8px;" onclick="cloudSignOut()">Đăng Xuất</button>
    </div>`;
}

/* =====================================================================
   TIỆN ÍCH
===================================================================== */
function addLog(msg){
  state.log.unshift(msg);
  while(state.log.length>(settings.logLen||90)) state.log.pop();
}

function computeStats(){
  const r = realmStatsAt(state.realmIdx, state.subStage||0);
  let atk=r.atk, def=r.def, spd=r.spd, hpMax=r.hp, crit=5;
  state.techniques.forEach(t=>{
    atk += t.bonus.atk||0; def += t.bonus.def||0; spd += t.bonus.spd||0;
    hpMax += t.bonus.hp||0; crit += t.bonus.crit||0;
  });
  if(state.path){
    const p = state.path;
    atk = Math.round(atk*p.atkMult);
    def = Math.round(def*p.defMult);
    spd = Math.round(spd*p.spdMult);
    hpMax = Math.round(hpMax*p.hpMult);
    crit += p.critBonus||0;
  }
  if(state.physique || (state.acqPhys && state.acqPhys.length)){
    const pm = physiqueMods();
    atk = Math.round(atk*pm.atkMult);
    def = Math.round(def*pm.defMult);
    spd = Math.round(spd*pm.spdMult);
    hpMax = Math.round(hpMax*pm.hpMult);
    crit += pm.critBonus;
  }
  if(state.treasure){
    const tMult = state.path && state.path.treasureMult ? state.path.treasureMult : 1;
    const khiSuMult = 1+(state.professions ? (state.professions.khiSu||0)*0.08 : 0);
    atk += Math.round((state.treasure.bonus.atk||0)*tMult*khiSuMult);
    def += state.treasure.bonus.def||0;
    crit += Math.round((state.treasure.bonus.crit||0)*khiSuMult);
  }
  if(state.worm.have){
    const pt = PET_TYPES.find(p=>p.id===state.worm.typeId) || PET_TYPES[0];
    atk += state.worm.level*pt.atkPerLvl;
    def += state.worm.level*pt.defPerLvl;
    hpMax += state.worm.level*pt.hpPerLvl;
    crit += state.worm.level*pt.critPerLvl;
  }
  if(state.root){
    crit += rootMods(state.root, state.realmIdx).critBonus;
  }
  if(state.statPillBonus){
    atk += state.statPillBonus.atk||0;
    def += state.statPillBonus.def||0;
    spd += state.statPillBonus.spd||0;
    crit += state.statPillBonus.crit||0;
    hpMax += state.statPillBonus.hp||0;
  }
  if(state.ng){
    const nb = ngStatBonus();
    const mf = memorySealed() ? 0.5 : 1;
    atk += Math.round(nb.atk*mf); def += Math.round(nb.def*mf); spd += Math.round(nb.spd*mf); hpMax += Math.round(nb.hp*mf); crit += Math.round(nb.crit*mf);
  }
  if(state.lg && lgSeen()){
    const lb = lgStatBonus();
    const mf = memorySealed() ? 0.5 : 1;
    atk += Math.round(lb.atk*mf); def += Math.round(lb.def*mf); spd += Math.round(lb.spd*mf); hpMax += Math.round(lb.hp*mf); crit += Math.round(lb.crit*mf);
    atk = Math.round(atk*(1+(lb.atkMult-1)*mf)); def = Math.round(def*lb.defMult);
  }
  if(state.tg && tgSeen()){
    const tb = tgStatBonus();
    atk += tb.atk; def += tb.def; hpMax += tb.hp; crit += tb.crit;
    atk = Math.round(atk*tb.atkMult);
  }
  if(state.relics && state.relics.length){ const rm = relicMods(); atk = Math.round(atk*rm.atk); def = Math.round(def*rm.def); hpMax = Math.round(hpMax*rm.hp); crit += rm.crit; }
  if(state.expd && state.expd.mods && state.expd.mods.pressure){ const f = 1-Math.min(0.5, state.expd.mods.pressure*0.05*(state.path && state.path.id==='the'?0.5:1)); atk = Math.round(atk*f); def = Math.round(def*f); }
  if(state.wings) spd = Math.round(spd*1.2);
  state.stats = {atk,def,spd,hpMax,crit: Math.max(1,crit)};
  if(state.hp>hpMax) state.hp = hpMax;
}

function tuViRateBonus(){
  return (state.root ? physiqueMods().tuVi : 0) + state.techniques.reduce((s,t)=>s+(t.bonus.tuViRate||0),0) + (state.ng ? ngTuViRate() : 0) + (state.lg && lgSeen() ? lgStatBonus().tuViRate : 0) + (state.tg && tgSeen() ? tgStatBonus().tuViRate : 0);
}

function checkBreakthroughAvailable(){
  state.canBreak = state.tuVi >= realmStatsAt(state.realmIdx, state.subStage||0).tuViMax;
}

function calcDamage(atk, def, critChance){
  let base = Math.max(1, Math.round(atk - def*0.5));
  const isCrit = Math.random()*100 < critChance;
  if(isCrit) base = Math.round(base*1.8);
  return {dmg:base, crit:isCrit};
}

function clampHerbTierAvailable(){
  return Math.min(6, state.realmIdx+2);
}

/* =====================================================================
   HÀNH ĐỘNG: TU LUYỆN
===================================================================== */
function meditate(densityMult, zoneName){
  densityMult = densityMult || 1;
  const base = Math.round(6 + state.realmIdx*4);
  const mods = rootMods(state.root, state.realmIdx);
  const pathTuViMult = (state.path && state.path.meditateMult) ? state.path.meditateMult : 1;
  const pm = physiqueMods();
  const physiqueEarlyMult = (state.realmIdx<=pm.earlyRealmCap) ? pm.earlyTuViMult : 1;
  let gain = Math.round(base*(1+tuViRateBonus())*mods.tuViMult*(1+state.caiMenhBonus)*pathTuViMult*physiqueEarlyMult*densityMult*tuLinhMult());
  gain = Math.max(1, gain);
  const linhLuc = 3+state.realmIdx;
  const mishapChance = 0.08*((state.path && state.path.meditateMishapMult) ? state.path.meditateMishapMult : 1)*pm.meditateMishapMult*(hasRelic('thanh_tam_boi')?0.5:1)*(luyenThanBacklash()?2:1);
  if(Math.random()<mishapChance){
    const dmg = Math.round(state.stats.hpMax*0.08);
    state.hp = Math.max(1, state.hp-dmg);
    gain *= 2;
    addLog(`Tâm cảnh dao động, suýt tẩu hỏa nhập ma! Nhờ hiểm cảnh mà tu vi tăng vọt +${gain}, nhưng mất ${dmg} khí huyết.`);
  } else if(zoneName){
    addLog(`Ngươi tĩnh tọa ngay tại long mạch của ${zoneName}, linh khí thiên địa dày đặc cuồn cuộn đổ về qua từng khiếu huyệt, tu vi +${gain}.`);
  } else {
    addLog(`Ngươi vận công tu luyện suốt một canh giờ, tu vi +${gain}.`);
  }
  state.tuVi += gain;
  state.linhLuc += linhLuc;
  fx('float',{sel:'#tuviFill', text:`+${gain}`, cls:'tuvi'});
  advanceTime(1);
  checkPhysiqueDiscovery();
  checkBreakthroughAvailable();
  render();
}

function meditateAtZone(zoneIdx){
  if(zoneIdx>state.realmIdx) return;
  const zone = ZONES[zoneIdx];
  meditate(zone.linhMachDensity, zone.name);
}

function channelSpiritStones(){
  const cost = 30+state.realmIdx*20;
  if(state.spiritStones<cost){ addLog(`Cần ít nhất ${cost} linh thạch mới đủ để vận công hút linh khí từ đá quý.`); render(); return; }
  state.spiritStones -= cost;
  const mods = rootMods(state.root, state.realmIdx);
  const gain = Math.max(1, Math.round(cost*0.7*mods.tuViMult*(1+state.caiMenhBonus)));
  state.tuVi += gain;
  addLog(`Ngươi cầm chặt ${cost} viên linh thạch trong tay, vận công hút thẳng linh khí bị nén chặt bên trong vào cơ thể, tu vi +${gain}.`);
  checkBreakthroughAvailable();
  render();
}

function growHerb(tier){
  if(tier>state.bottleLevel){ addLog("Chưởng Thiên Bình chưa đủ cấp để ươm dưỡng loại dược liệu này."); render(); return; }
  const cost = tier*6;
  if(state.linhLuc<cost){ addLog("Linh lực không đủ để thúc đẩy Chưởng Thiên Bình vận chuyển."); render(); return; }
  state.linhLuc -= cost;
  state.herbs[tier] = (state.herbs[tier]||0)+1;
  addLog(`Chưởng Thiên Bình tỏa ánh sáng nhu hòa, một cây ${HERB_NAMES[tier-1]} vụt lớn chỉ trong nháy mắt!`);
  render();
}


function grantStatPill(sp){
  state.statPillBonus[sp.stat] = (state.statPillBonus[sp.stat]||0)+sp.amount;
  addLog(`Kỳ ngộ hiếm có! Ngươi tìm được một viên 【${sp.name}】 — thứ đan dược mà không tu sĩ luyện đan nào trên đời chế ra được. ${sp.desc} (+${sp.amount}${sp.stat==='crit'?'%':''} vĩnh viễn).`);
  computeStats();
}


function danSuPillMult(){
  const danSuMult = 1+(state.professions ? (state.professions.danSu||0)*0.05 : 0);
  const physiqueMult = physiqueMods().pillMult;
  return danSuMult*physiqueMult;
}

function usePill(tier){
  const have = state.pills[tier]||0;
  if(have<1) return;
  state.pills[tier]--;
  const mods = rootMods(state.root, state.realmIdx);
  const gain = Math.max(1, Math.round(tier*35*mods.pillMult*danSuPillMult()));
  state.tuVi += gain;
  state.buffStack = Math.min(3, state.buffStack+1);
  addLog(`Nuốt một viên ${PILL_NAMES[tier-1]} như ăn kẹo, tu vi +${gain}, cơ thể ổn định hơn cho lần đột phá sắp tới.`);
  checkBreakthroughAvailable();
  render();
}




/* =====================================================================
   ĐỘT PHÁ CẢNH GIỚI
===================================================================== */
function attemptBreakthrough(){
  if(!state.canBreak || state.ascended) return;
  const realm = MAJOR_REALMS[state.realmIdx];
  const atLastSubstage = (state.subStage||0) >= realm.substageCount-1;
  if(atLastSubstage && state.realmIdx===10 && !(state.tg && tamThiDone())){ addLog('Thái Ất đỉnh phong — muốn bước vào Đại La phải Trảm Tam Thi trước (Nhân Vật ▸ Pháp Tắc).'); render(); return; }
  if(atLastSubstage && state.realmIdx===11 && !(state.tg && canChungDao())){ addLog('Chưa đủ điều kiện chứng đạo: chủ tu pháp tắc phải viên mãn và phải đánh bại Đạo Tổ đang chiếm giữ đại đạo đó (Nhân Vật ▸ Pháp Tắc).'); render(); return; }
  if(atLastSubstage && TRIBULATION_REALMS.includes(state.realmIdx)){ startTribulation(); return; }
  const mods = rootMods(state.root, state.realmIdx);
  const easeFactor = state.realmIdx<=2 ? 1 : 0.5; // tư chất tốt giúp ích rõ nhất ở các bình cảnh đầu
  const danSuBonus = (state.professions ? (state.professions.danSu||0) : 0)*3;
  const chance = Math.min(95, Math.max(5, 55+state.buffStack*10+mods.breakEase*easeFactor+danSuBonus+state.breakthroughBoost+physiqueMods().breakBonus));
  state.buffStack = 0;
  state.breakthroughBoost = 0;
  const success = Math.random()*100 < chance;
  if(success){
    const curStats = realmStatsAt(state.realmIdx, state.subStage||0);
    const overflow = state.tuVi-curStats.tuViMax;
    if(atLastSubstage){
      state.realmIdx++;
      state.subStage = 0;
    } else {
      state.subStage = (state.subStage||0)+1;
    }
    const newStats = realmStatsAt(state.realmIdx, state.subStage);
    state.tuVi = Math.max(0, Math.min(overflow, Math.round(newStats.tuViMax*0.3)));
    advanceTime(BREAK_YEARS[state.realmIdx]*12);
    computeStats();
    state.hp = state.stats.hpMax;
    const newName = fullRealmName(state.realmIdx, state.subStage);
    addLog(`${ic('bolt')} Đột phá thành công! Ngươi chính thức bước vào ${newName}.${atLastSubstage?' '+MAJOR_REALMS[state.realmIdx].note:''}`);
    if(atLastSubstage && !state.physiqueKnown && state.physique && state.physique.hidden && state.physique.id!=='tien_linh'){
      state.physiqueKnown = true;
      addLog(`Bước vào ${newName}, thể chất tiềm ẩn trong người rốt cuộc cũng bộc phát rõ ràng — ngươi mang 【${state.physique.name}】!`);
    }
    fx('flash',{color:'rgba(240,207,140,.45)',dur:700}); fx('banner',{text: atLastSubstage ? MAJOR_REALMS[state.realmIdx].name : 'Đột Phá Thành Công'});
    checkBreakthroughAvailable();
    render();
    showModal('breakthrough');
  } else {
    const loss = Math.round(state.tuVi*0.35);
    state.tuVi -= loss;
    const dmg = Math.round(state.stats.hpMax*0.2);
    state.hp = Math.max(1, state.hp-dmg);
    fx('flash',{color:'rgba(193,93,74,.4)'}); fx('shake'); fx('banner',{text:'Đột Phá Thất Bại', cls:'blood'});
    addLog(`Đột phá thất bại, chân khí phản phệ! Mất ${loss} tu vi và ${dmg} khí huyết. Hãy chuẩn bị đan dược kỹ càng hơn cho lần sau.`);
    checkBreakthroughAvailable();
    render();
  }
}

/* =====================================================================
   THÁM HIỂM
===================================================================== */
function genEnemy(zoneIdx){
  const pool = ENEMY_NAMES[zoneIdx];
  let name = pool[Math.floor(Math.random()*pool.length)];
  const isBoss = Math.random()<0.12;
  if(isBoss) name += " · Thủ Lĩnh";
  const mult = isBoss?2.2:1;
  const baseR = realmStatsAt(Math.min(zoneIdx, MAJOR_REALMS.length-1), 1);
  const jitter = 0.8+Math.random()*0.4;
  return {
    name,
    hpMax: Math.round(baseR.hp*(0.55+zoneIdx*0.05)*mult*jitter),
    atk:   Math.round(baseR.atk*0.6*mult*jitter),
    def:   Math.round(baseR.def*0.55*mult),
    spd:   Math.round(baseR.spd*0.7*mult),
    isBoss
  };
}

function encounterRival(zoneIdx){
  const baseR = realmStatsAt(Math.min(zoneIdx, MAJOR_REALMS.length-1), 1);
  const pm = state.rival.powerMult;
  const enemy = {
    name: `${state.rival.name} · Kình Địch`,
    hpMax: Math.round(baseR.hp*0.9*pm),
    atk:   Math.round(baseR.atk*0.75*pm),
    def:   Math.round(baseR.def*0.65*pm),
    spd:   Math.round(baseR.spd*0.8*pm),
    isBoss: true,
    isRival: true
  };
  addLog(`Không ngờ lại chạm mặt kình địch ${state.rival.name} ngay tại đây! Hai bên ánh mắt giao nhau, sát khí bừng lên tức khắc.`);
  startCombat(enemy);
}

function explore(zoneIdx){
  state.currentZone = zoneIdx;
  const roll = Math.random()*100;
  if(roll<55){
    const enemy = genEnemy(zoneIdx);
    startCombat(enemy);
  } else if(roll<75){
    const stones = Math.round(15+zoneIdx*10+Math.random()*20);
    const tuvi = Math.round(5+zoneIdx*5);
    state.spiritStones += stones;
    state.tuVi += tuvi;
    const mt = zoneMatTier(zoneIdx), mk = Math.random()<0.6?'khoang':'moc', mn = 1+(Math.random()<0.4?1:0);
    addMat(mk, mt, mn);
    addLog(`Ngươi phát hiện một mạch linh thạch nhỏ ẩn trong khe đá, thu được ${stones} linh thạch, ${tuvi} tu vi và ${mn} ${matName(mk,mt)}.`);
  } else if(roll<85){
    const tranPhap = state.professions ? (state.professions.tranPhap||0) : 0;
    const isRift = zoneIdx===3;
    const dmgMult = isRift ? 1.8 : 1;
    const dmg = Math.max(1, Math.round(state.stats.hpMax*(0.08+zoneIdx*0.01)*dmgMult*(1-tranPhap*0.08)*physiqueMods().trapDmgMult*(hasRelic('huyen_am_kinh')?0.5:1)));
    state.hp = Math.max(1, state.hp-dmg);
    const trapMsg = isRift
      ? 'Vô tình sượt qua một vết Không Gian Liệt Phùng vô hình, suýt chút nữa đứt lìa thân xác'
      : 'Vô tình chạm phải cấm chế tàn lưu từ thượng cổ';
    addLog(`${trapMsg}, chịu ${dmg} sát thương.${tranPhap>0?' Trận pháp hộ thân đã hóa giải bớt một phần.':''}`);
  } else {
    rareEvent(zoneIdx);
  }
  checkPhysiqueDiscovery();
  checkBreakthroughAvailable();
  render();
}

function getMissingRecipeOptions(){
  const opts = [];
  const nextDanTier = state.danPhuongTiers.length ? Math.max(...state.danPhuongTiers)+1 : 1;
  if((state.professions.danSu||0)>=1 && nextDanTier<=6 && !state.danPhuongTiers.includes(nextDanTier)) opts.push({type:'danPhuong', tier:nextDanTier});
  if((state.professions.khiSu||0)>=1 && !state.hasKhiPhuong) opts.push({type:'khiPhuong'});
  if((state.professions.khoiLoi||0)>=1 && !state.hasKhoiLoiVe) opts.push({type:'khoiLoiVe'});
  if((state.professions.tranPhap||0)>=1 && !state.hasTranDo) opts.push({type:'tranDo'});
  return opts;
}

function rareEvent(zoneIdx){
  const options = [];
  if(state.bottleLevel<6) options.push('shard');
  if(!state.worm.have && zoneIdx>=2) options.push('egg');
  const learnable = TECHNIQUES.filter(t=>!state.learnedNames.includes(t.name));
  if(learnable.length) options.push('technique');
  const accessibleManuals = ADVANCED_TECHNIQUES.filter(isAdvancedTechAccessible);
  if(accessibleManuals.length && zoneIdx>=1) options.push('manual');
  const missingRecipes = getMissingRecipeOptions();
  if(missingRecipes.length) options.push('recipe');
  if([0,2,3,4].includes(zoneIdx)) options.push('harvest');
  if(zoneIdx>=2 && state.caiMenhBonus<0.3) options.push('caimenh');
  if(zoneIdx===4 && state.phapTacInsight<4) options.push('phaptac');
  if(zoneIdx>=2) options.push('statpill');
  options.push('treasure');
  options.push('rest');
  const pick = options[Math.floor(Math.random()*options.length)];

  if(pick==='shard'){
    state.bottleShards++;
    const need = state.bottleLevel*2;
    state.luDich = Math.min(luCap(), (state.luDich||0)+3);
    addLog(`Đêm trăng tròn giữa chốn linh khí dồi dào, Chưởng Thiên Bình hấp thụ một luồng Nguyệt Hoa tinh túy, ngưng thêm 3 giọt Tạo Hóa Lộ (${state.bottleShards}/${need}).`);
    if(state.bottleShards>=need){
      state.bottleShards = 0;
      state.bottleLevel++;
      addLog(`Chưởng Thiên Bình được Nguyệt Hoa tôi luyện lần thứ ${state.bottleLevel}: chứa được nhiều lục dịch hơn, ngưng tụ nhanh hơn, ép được dược liệu quý hơn!`);
    }
  } else if(pick==='recipe'){
    const r = missingRecipes[Math.floor(Math.random()*missingRecipes.length)];
    if(r.type==='danPhuong'){
      state.danPhuongTiers.push(r.tier);
      addLog(`Ngươi tìm được một quyển Đan Phương ghi rõ danh mục linh thảo, tỷ lệ phối hợp và hỏa hầu cho ${PILL_NAMES[r.tier-1]} — từ nay luyện đan cấp này không còn lo bạo đỉnh!`);
    } else if(r.type==='khiPhuong'){
      state.hasKhiPhuong = true;
      addLog(`Ngươi tìm được một bộ Khí Phương ghi rõ tỷ lệ dung hợp khoáng thạch và quy trình khắc cấm chế — từ nay rèn chế pháp bảo không còn phải mò mẫm.`);
    } else if(r.type==='khoiLoiVe'){
      state.hasKhoiLoiVe = true;
      addLog(`Ngươi tìm được một bản Đồ Trí khôi lỗi hoàn chỉnh, ghi rõ cấu trúc xương khớp và đường dẫn phù văn — từ nay chế tạo khôi lỗi không còn sợ thành phế thải.`);
    } else if(r.type==='tranDo'){
      state.hasTranDo = true;
      addLog(`Ngươi tìm được một bức Trận Đồ cổ xưa, ghi rõ tọa độ Trận Kỳ và vị trí Trận Nhãn — từ nay bố trận không còn lo linh khí hỗn loạn phản phệ.`);
    }
  } else if(pick==='egg'){
    const pt = PET_TYPES[Math.floor(Math.random()*PET_TYPES.length)];
    state.worm.have = true;
    state.worm.level = 1;
    state.worm.typeId = pt.id;
    addLog(`Trong hốc đá sâu, ngươi tàn nhẫn khuất phục một con ${pt.name} còn non nớt! ${pt.desc} Từ nay nó sẽ là lá bài tẩy giấu kín của ngươi.`);
  } else if(pick==='harvest'){
    const tierCap = Math.max(1, Math.min(clampHerbTierAvailable(), zoneIdx+2));
    const n = 3+Math.floor(Math.random()*3);
    const gained = [];
    for(let i=0;i<n;i++){
      const t = 1+Math.floor(Math.random()*tierCap);
      state.herbs[t] = (state.herbs[t]||0)+1;
      gained.push(HERB_NAMES[t-1]);
    }
    const stones = Math.round(30+zoneIdx*20);
    state.spiritStones += stones;
    addLog(`Ngươi lạc vào một góc bí cảnh chưa ai từng đặt chân tới, đại thu hoạch ${n} phần dược liệu quý (${gained.join(', ')}) cùng ${stones} linh thạch!`);
  } else if(pick==='caimenh'){
    state.caiMenhBonus = Math.min(0.3, state.caiMenhBonus+0.08);
    addLog(`Ngươi may mắn đoạt được một viên Cải Mệnh Đan cực phẩm! Nuốt vào bụng, linh căn như được tẩy rửa lại từ đầu, tốc độ tu luyện vĩnh viễn tăng thêm (tổng cộng +${Math.round(state.caiMenhBonus*100)}%).`);
  } else if(pick==='statpill'){
    if(Math.random()<0.25){
      const sp = STAT_PILLS[Math.floor(Math.random()*STAT_PILLS.length)];
      grantStatPill(sp);
    } else {
      const stones = Math.round(20+zoneIdx*15);
      state.spiritStones += stones;
      addLog(`Ngươi thoáng cảm nhận được một luồng dị bảo khí tức gần đó, nhưng tìm mãi không thấy, đành nhặt được ${stones} linh thạch rơi vãi mà tiếc nuối rời đi.`);
    }
  } else if(pick==='rival'){
    encounterRival(zoneIdx);
  } else if(pick==='phaptac'){
    state.phapTacInsight++;
    addLog(`Giữa bí cảnh, ngươi bất chợt lĩnh ngộ được một tia thiên địa pháp tắc sơ kỳ, tâm cảnh thăng hoa — uy lực thiên kiếp sau này sẽ giảm bớt phần nào.`);
  } else if(pick==='manual'){
    const t = accessibleManuals[Math.floor(Math.random()*accessibleManuals.length)];
    const source = MANUAL_SOURCES[Math.floor(Math.random()*MANUAL_SOURCES.length)];
    state.manuals.push(t.id);
    addLog(`${source} — 【${t.name}】! Thiên đạo tựa hồ không phụ người có duyên, tư chất của ngươi lại vừa vặn tương hợp với bí kíp này. Cần đủ tài nguyên và cảnh giới mới luyện thành được.`);
  } else if(pick==='technique'){
    const base = learnable[Math.floor(Math.random()*learnable.length)];
    const scale = 1+zoneIdx*0.4;
    const t = {name:base.name, desc:base.desc, bonus:{}};
    Object.keys(base.bonus).forEach(k=>{
      t.bonus[k] = k==='tuViRate' ? base.bonus[k] : Math.round(base.bonus[k]*scale);
    });
    state.techniques.push(t);
    state.learnedNames.push(base.name);
    addLog(`Ngươi lãnh ngộ được thất truyền công pháp【${t.name}】— ${t.desc}`);
  } else if(pick==='treasure'){
    const base = TREASURES[Math.floor(Math.random()*TREASURES.length)];
    const scale = 1+zoneIdx*0.35;
    const t = {name:base.name, tier:zoneIdx, bonus:{
      atk: Math.round((base.bonus.atk||0)*scale),
      def: Math.round((base.bonus.def||0)*scale),
      crit: Math.round((base.bonus.crit||0)*scale)
    }};
    const better = !state.treasure || (t.bonus.atk||0) >= (state.treasure.bonus.atk||0);
    if(better){
      state.treasure = t;
      addLog(`Ngươi tự tay luyện chế thành công pháp bảo【${t.name}】, uy năng bạo kích kinh người — trang bị ngay lập tức!`);
    } else {
      const stones = Math.round(20+zoneIdx*15);
      state.spiritStones += stones;
      addLog(`Tìm được vật liệu quý nhưng không hơn pháp bảo hiện có, đành bán lấy ${stones} linh thạch.`);
    }
  } else {
    const heal = Math.round(state.stats.hpMax*0.5);
    state.hp = Math.min(state.stats.hpMax, state.hp+heal);
    const tv = Math.round(8+zoneIdx*4);
    state.tuVi += tv;
    addLog(`Ngươi tìm được một hang động bình yên để trấn tĩnh tâm thần, hồi phục thương thế và thu hoạch ${tv} tu vi.`);
  }
  computeStats();
}

function combatLog(msg){
  state.combat.log.unshift(msg);
  if(state.combat.log.length>40) state.combat.log.pop();
}

function pathAdjustedDamage(baseAtk, enemyDef, baseCrit, enemy, isBasic){
  const path = state.path;
  let def = enemyDef, crit = baseCrit;
  if(path){
    if(path.ignoreDefPct) def = enemyDef*(1-path.ignoreDefPct);
    if(path.critFloor) crit = Math.max(crit, path.critFloor);
  }
  const r = calcDamage(baseAtk, def, crit);
  let dmg = r.dmg;
  if(path){
    if(isBasic && path.physFlatPct) dmg += Math.round(state.stats.hpMax*path.physFlatPct);
    if(path.vsEvilBonusPct && isEvilEnemy(enemy)) dmg = Math.round(dmg*(1+path.vsEvilBonusPct));
  }
  return {dmg, crit:r.crit};
}

function applyLifesteal(dmg){
  const pathPct = (state.path && state.path.lifestealPct) ? state.path.lifestealPct : 0;
  const physiquePct = physiqueMods().lifestealPct;
  const totalPct = pathPct+physiquePct+(hasRelic('van_linh_ngoc')?0.08:0);
  if(totalPct>0){
    const heal = Math.round(dmg*totalPct);
    if(heal>0) state.hp = Math.min(state.stats.hpMax, state.hp+heal);
    return heal;
  }
  return 0;
}




function tryFlee(){
  const c = state.combat;
  const chance = 40+state.stats.spd-c.enemy.spd+(hasRelic('pha_khong_toa')?25:0)+Math.round(lawVal('khong')/2)+(state.wings?30:0)+physiqueMods().fleeBonus;
  if(Math.random()*100<chance){
    addLog(`Ngươi thi triển thân pháp thoát khỏi ${c.enemy.name}, tránh một trận huyết chiến không cần thiết.`);
    state.combat = null;
    render();
  } else {
    combatLog("Chạy trốn bất thành!");
    enemyTurn();
  }
}

function winCombat(){
  const c = state.combat;
  const rewardTuVi = Math.round(10+state.realmIdx*8+Math.random()*15);
  const stoneReward = Math.round(5+state.realmIdx*4+Math.random()*10);
  state.tuVi += rewardTuVi;
  state.spiritStones += stoneReward;
  let herbMsg = '';
  if(Math.random()<0.4){
    const maxT = Math.min(clampHerbTierAvailable(), state.currentZone+2);
    const tier = 1+Math.floor(Math.random()*Math.max(1,maxT));
    state.herbs[tier] = (state.herbs[tier]||0)+1;
    herbMsg = `, thu được ${HERB_NAMES[tier-1]}`;
  }
  let recipeMsg = '';
  if(c.enemy.isBoss){
    const missing = getMissingRecipeOptions();
    if(missing.length && Math.random()<0.25){
      const r = missing[Math.floor(Math.random()*missing.length)];
      let label = '';
      if(r.type==='danPhuong'){ state.danPhuongTiers.push(r.tier); label = `Đan Phương ${PILL_NAMES[r.tier-1]}`; }
      else if(r.type==='khiPhuong'){ state.hasKhiPhuong = true; label = 'Khí Phương'; }
      else if(r.type==='khoiLoiVe'){ state.hasKhoiLoiVe = true; label = 'Bản Vẽ Khôi Lỗi'; }
      else if(r.type==='tranDo'){ state.hasTranDo = true; label = 'Trận Đồ'; }
      recipeMsg = `. Lục soát túi trữ vật của kẻ địch, ngươi đoạt được 【${label}】 — hóa ra hắn cũng đang tranh đoạt thứ này!`;
    }
  }
  let rivalMsg = '';
  if(c.enemy.isRival){
    state.rival.wins++;
    state.rival.powerMult = Math.round((state.rival.powerMult+0.15)*100)/100;
    const bonusStones = Math.round(30+state.realmIdx*15);
    state.spiritStones += bonusStones;
    rivalMsg = ` ${state.rival.name} ôm hận bỏ đi tìm nơi bế quan khổ luyện, thề sẽ quay lại báo thù — thu thêm ${bonusStones} linh thạch từ túi trữ vật của hắn.`;
  }
  const matMsg = dropMaterials(c.enemy);
  if(c.enemy.isBoss) fx('banner',{text:'Đắc Thắng'});
  const ngMsg = ngOnCombatWin(c.enemy);
  const advMsg = advOnCombatWin(c.enemy) + lgOnCombatWin(c.enemy) + tgOnCombatWin(c.enemy) + canonOnCombatWin(c.enemy) + aucOnCombatWin(c.enemy);
  addLog(`Đánh bại ${c.enemy.name}! Nhận ${rewardTuVi} tu vi, ${stoneReward} linh thạch${herbMsg}${matMsg}${recipeMsg}.${rivalMsg}${ngMsg}${advMsg}`);
  state.combat = null;
  checkBreakthroughAvailable();
  render();
}

function buyRecipeAtAuction(type, tier){
  let cost, label, already;
  if(type==='danPhuong'){
    cost = 150*tier; label = `Đan Phương ${PILL_NAMES[tier-1]}`;
    already = state.danPhuongTiers.includes(tier);
  } else if(type==='khiPhuong'){
    cost = 600; label = 'Khí Phương'; already = state.hasKhiPhuong;
  } else if(type==='khoiLoiVe'){
    cost = 600; label = 'Bản Vẽ Khôi Lỗi'; already = state.hasKhoiLoiVe;
  } else if(type==='tranDo'){
    cost = 500; label = 'Trận Đồ'; already = state.hasTranDo;
  } else return;
  if(already) return;
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch mới đủ sức tranh đấu giá 【${label}】 — sàn đấu giá ngầm luôn có vô số tu sĩ giàu có cạnh tranh, giá cắt cổ.`); render(); return; }
  state.spiritStones -= cost;
  if(type==='danPhuong') state.danPhuongTiers.push(tier);
  else if(type==='khiPhuong') state.hasKhiPhuong = true;
  else if(type==='khoiLoiVe') state.hasKhoiLoiVe = true;
  else if(type==='tranDo') state.hasTranDo = true;
  addLog(`Ngươi dốc hết gia tài, thắng phiên đấu giá kịch liệt trước bao ánh mắt thèm khát, đoạt được 【${label}】 với giá ${cost} linh thạch!`);
  render();
}

function loseCombat(){
  const c = state.combat;
  let rivalMsg = '';
  if(c.enemy.isRival){
    state.rival.losses++;
    state.rival.powerMult = Math.round((state.rival.powerMult+0.1)*100)/100;
    rivalMsg = ` ${state.rival.name} cười nhạt bỏ đi, để lại một câu: "Tu vi ngươi còn kém xa, lần sau đừng chạm mặt ta nữa!"`;
  }
  let pupMsg = '';
  if(c.puppetsOut){ const lost = destroyRandomPuppet(); if(lost) pupMsg = ` Tháo chạy vội vàng, bỏ lại một ${lost}.`; }
  addLog(`Trọng thương trước ${c.enemy.name}, đành nuốt hận lui về dưỡng thương.${rivalMsg}${ngOnCombatLose(c.enemy)}${pupMsg}${advOnCombatLose(c.enemy)}${aucOnCombatLose(c.enemy)}`);
  fx('flash',{color:'rgba(193,93,74,.4)'}); fx('shake');
  state.hp = Math.round(state.stats.hpMax*0.3);
  state.tuVi = Math.max(0, state.tuVi-Math.round(state.tuVi*(physiqueMods().soulGuard?0.05:0.1)));
  state.combat = null;
  render();
}

===================================================================== */
function startTribulation(){
  state.tribulation = {wave:1, maxWave:9};
  render();
  showModal('tribulation-intro');
}

function faceTribulationWave(){
  const t = state.tribulation;
  if(!t) return;
  const dmgBase = Math.round(state.stats.hpMax*(0.08+t.wave*0.02));
  let mitigated = Math.max(1, Math.round(dmgBase-state.stats.def*0.3));
  const mods = rootMods(state.root, state.realmIdx);
  let extra = '';
  if(state.root.isDynamic && mods.lateActive){
    mitigated = Math.max(1, Math.round(mitigated*0.8));
    extra = ' Ngũ Hành Cụ Toàn cộng hưởng, dung hòa bớt một phần uy lực thiên kiếp.';
  }
  if(state.path && state.path.tribulationDmgMult){
    mitigated = Math.max(1, Math.round(mitigated*state.path.tribulationDmgMult));
    extra += ' Ma tính trong người khiến thiên kiếp giáng xuống mãnh liệt hơn hẳn.';
  }
  if(state.phapTacInsight>0){
    mitigated = Math.max(1, Math.round(mitigated*(1-Math.min(0.2,state.phapTacInsight*0.05))));
    extra += ' Những tia thiên địa pháp tắc từng lĩnh ngộ giúp ngươi dung hòa bớt uy lực thiên kiếp.';
  }
  if(physiqueMods().tribMult<1){ mitigated = Math.max(1, Math.round(mitigated*physiqueMods().tribMult)); extra += ' Lôi Linh Thể hấp thụ một phần lôi lực.'; }
  state.hp -= mitigated;
  fx('bolt'); fx('flash',{color:'rgba(255,248,224,.7)',dur:380}); fx('shake');
  addLog(`Lôi kiếp đợt ${t.wave}/9 giáng xuống, ngươi vận chuyển toàn bộ linh lực chống đỡ, chịu ${mitigated} sát thương.${extra}`);
  if(state.hp<=0){
    state.hp = Math.round(state.stats.hpMax*0.25);
    addLog(`Thân thể không trụ nổi trước uy lực thiên kiếp, ngươi tạm lui về điều tức dưỡng thương, chờ thời cơ nghênh đón lại.`);
    state.tribulation = null;
    render();
    return;
  }
  if(t.wave>=t.maxWave){ finishAscension(); return; }
  t.wave++;
  render();
}


function finishAscension(){
  state.tribulation = null;
  const idx = TRIBULATION_REALMS.indexOf(state.realmIdx);
  if(idx < TRIBULATION_REALMS.length-1){
    state.realmIdx++;
    state.subStage = 0;
    state.tuVi = 0;
    computeStats();
    state.hp = state.stats.hpMax;
    state.age += 50 + state.realmIdx*20;
    checkBreakthroughAvailable();
    const worldName = idx===0 ? 'Linh Giới' : 'Tiên Giới';
    addLog(`${ic('bolt')} Ngươi đã vượt qua trọn vẹn cửu cửu lôi kiếp! Không gian trước mặt rách toạc, thân ảnh ngươi bị cuốn vào cơn bão táp hư không cuồng nộ, phi thăng ${worldName}, chính thức bước vào ${fullRealmName(state.realmIdx,state.subStage)}. ${MAJOR_REALMS[state.realmIdx].note}`);
    render();
    showModal(idx===0 ? 'ascend-linhgioi' : 'ascend-tiengioi');
  } else {
    state.ascended = true;
    addLog(`${ic('bolt')} Ngươi đã vượt qua trọn vẹn cửu cửu lôi kiếp cuối cùng! Không gian trước mặt rách toạc, ánh sáng chói lòa nuốt trọn thân ảnh của ngươi...`);
    render();
    showModal('ascension');
  }
}

/* ---------- Màn hình mở đầu: Chưởng Thiên Bình hứng ánh trăng ---------- */
const LS_LINES = [[0,'Ánh trăng rót xuống miệng bình…'],[0.3,'Ngưng tụ giọt Tạo Hóa Lộ đầu tiên…'],[0.6,'Khai mở tam giới…'],[0.92,'Đạo đồ đã hiện.']];
function runTitleScreen(){
  const fill = document.getElementById('lsFill'), wave = document.getElementById('lsWave'), txt = document.getElementById('loadingText');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce || (settings && !settings.motion) ? 300 : 2200;
  const t0 = performance.now();
  let line = -1, fontsReady = false;
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ fontsReady = true; }); else fontsReady = true;
  function frame(now){
    let p = Math.min(1, (now-t0)/dur);
    if(p>=1 && !fontsReady && now-t0<dur+1500) p = 0.97;
    const eased = 1-Math.pow(1-p, 2.2);
    const top = 246 - eased*78;
    fill.setAttribute('y', top); fill.setAttribute('height', 246-top+4);
    wave.setAttribute('d', `M40 ${top} q12 -4 25 0 t25 0 t25 0 t25 0 v4 h-100 z`);
    const L = LS_LINES.filter(x=>eased>=x[0]).length-1;
    if(L!==line){ line = L; txt.textContent = LS_LINES[L][1]; }
    if(p<1) requestAnimationFrame(frame); else showTitleActions();
  }
  requestAnimationFrame(frame);
}
function showTitleActions(){
  const box = document.getElementById('lsActions');
  const sv = readSave();
  if(sv){
    const st = sv.state;
    box.innerHTML = `<button class="btn gold" onclick="titleContinue()">Tiếp Tục Đạo Đồ<small>${st.name} · ${fullRealmName(st.realmIdx, st.subStage||0)} · ${st.age} tuổi</small></button>
      <button class="btn ghost" onclick="titleNew()">Bắt Đầu Kiếp Tu Mới</button>
      <div class="ls-note">Bản lưu cũ sẽ bị ghi đè khi nhân vật mới bắt đầu tu luyện.</div>`;
  } else {
    box.innerHTML = `<button class="btn gold" onclick="titleNew()">Bước Vào Tu Tiên Giới</button>`;
  }
  requestAnimationFrame(()=>box.classList.add('show'));
  const acc = document.getElementById('lsAccount'); if(acc) acc.innerHTML = titleAccountLine();
  const first = box.querySelector('button'); if(first) first.focus({preventScroll:true});
}
function hideTitle(){ const ls = document.getElementById('loadingScreen'); if(ls) ls.classList.add('hide'); }
function titleContinue(){
  const sv = readSave();
  hideTitle();
  if(sv){ restoreFromSave(sv); toast(`Tiếp tục đạo đồ của ${state.name}`); }
  else showModal('start');
}
function titleNew(){ hideTitle(); showModal('start'); }


function selectPath(id){
  const input = document.getElementById('nameInput');
  if(input) pendingName = input.value||'';
  pendingPath = PATHS.find(p=>p.id===id) || null;
  renderStartModal();
}

function startGame(){
  const name = (pendingName||'').trim() || 'Vô Danh';
  if(!pendingRoot) pendingRoot = rollSpiritRoot();
  if(!pendingPath) return;
  state = freshState(name, pendingRoot, pendingPath, pendingPhysique);
  const origin = ORIGINS.find(o=>o.id===pendingOrigin) || ORIGINS[0];
  state.origin = origin.id;
  if(origin.id==='nongia') state.luDich = 15;
  if(origin.id==='giatoc'){ state.spiritStones += 150; state.healPills[1] = (state.healPills[1]||0)+2; }
  if(origin.id==='tantu'){ state.talismans.hoa_dan = 3; state.talismans.an_than = 1; }
  closeCreation();
  const physiqueMsg = (pendingPhysique && !pendingPhysique.hidden) ? `, mang trong mình 【${pendingPhysique.name}】` : '';
  addLog(`${name} — xuất thân ${origin.name} — mang theo Chưởng Thiên Bình, tư chất 【${pendingRoot.name}】${physiqueMsg} và bước chân vào 【${pendingPath.name}】, chính thức dấn thân vào con đường tu tiên nghịch thiên.`);
  computeStats();
  checkBreakthroughAvailable();
  closeModal();
  render();
}

function restartGame(){
  pendingName = state.name;
  pendingRoot = null;
  pendingPath = null;
  pendingPhysique = null;
  pendingPhysiqueRolled = false;
  creationStep = 1;
  pendingOrigin = null; rootTries = 0;
  openCreation();
}

      </div>
    `;
  }

  const cardTuChat = `
    <div class="card">
      <div class="sec-title">${ic('root')} Linh Căn Tư Chất<span style="font-size:11px;color:var(--text-faint);font-weight:400;">${state.root.elementLabel}</span></div>
      <div class="root-result" style="margin:0 0 9px;">
        <div class="root-name" style="font-size:15px;">${state.root.name}</div>
        <p class="flavor" style="margin:5px 0 0;">${state.root.desc}</p>
        ${state.root.isDynamic?`<div class="sec-note" style="margin-top:6px;color:${rmods.lateActive?'var(--jade)':'var(--text-faint)'};">${rmods.lateActive?'Đã phi thăng — Ngũ Hành Cụ Toàn nay là tư chất mạnh nhất.':'Còn ở Nhân Giới — tư chất này hiện bị xem như phế vật, chờ đến Hóa Thần Kỳ.'}</div>`:''}
      </div>
      <div class="row"><span class="k">Tốc độ tu luyện</span><span class="v">×${rmods.tuViMult}</span></div>
      <div class="row"><span class="k">Hiệu quả đan dược</span><span class="v">×${rmods.pillMult}</span></div>
      <div class="row"><span class="k">Bạo kích từ tư chất</span><span class="v">${rmods.critBonus>=0?'+':''}${rmods.critBonus}%</span></div>
    </div>

    ${renderPhysiqueCard()}

    <div class="card">
      <div class="sec-title">${ic('compass')} Đạo Lộ Tu Luyện</div>
      <div class="root-result" style="margin:0 0 9px;">
        <div class="root-name" style="font-size:15px;">${state.path.name}</div>
        <p class="flavor" style="margin:5px 0 0;">${state.path.desc}</p>
      </div>
      <div class="row"><span class="k">Công / Thủ / Tốc / Sinh lực</span><span class="v">×${state.path.atkMult} / ×${state.path.defMult} / ×${state.path.spdMult} / ×${state.path.hpMult}</span></div>
      <div class="row"><span class="k">Bạo kích từ đạo lộ</span><span class="v">${state.path.critBonus>=0?'+':''}${state.path.critBonus}%</span></div>
    </div>
  `;

  const cardSucManh = `
    <div class="card">
      <div class="sec-title">${ic('chart')} Thuộc Tính</div>
      <div class="row"><span class="k">Công kích</span><span class="v">${s.atk}</span></div>
      <div class="row"><span class="k">Phòng ngự</span><span class="v">${s.def}</span></div>
      <div class="row"><span class="k">Thân pháp</span><span class="v">${s.spd}</span></div>
      <div class="row"><span class="k">Tỷ lệ bạo kích</span><span class="v">${s.crit}%</span></div>
      <div class="row"><span class="k">Khí huyết tối đa</span><span class="v">${s.hpMax}</span></div>
      <div class="row"><span class="k">Thọ nguyên ước tính</span><span class="v">${LIFESPAN[state.realmIdx]} năm</span></div>
      ${state.caiMenhBonus>0?`<div class="row"><span class="k">Cải Mệnh Đan tích lũy</span><span class="v">+${Math.round(state.caiMenhBonus*100)}% tốc độ tu luyện</span></div>`:''}
      ${state.phapTacInsight>0?`<div class="row"><span class="k">Pháp tắc lĩnh ngộ</span><span class="v">${state.phapTacInsight}/4 (−${Math.min(20,state.phapTacInsight*5)}% sát thương thiên kiếp)</span></div>`:''}
    </div>

    ${STAT_PILLS.some(sp=>(state.statPillBonus[sp.stat]||0)>0) ? `
    <div class="card">
      <div class="sec-title">${ic('pill')} Đan Dược Kỳ Ngộ</div>
      <p class="flavor">Những viên đan cực phẩm không tu sĩ luyện đan nào chế ra được — chỉ có thể tình cờ tìm thấy giữa thiên địa.</p>
      ${STAT_PILLS.filter(sp=>(state.statPillBonus[sp.stat]||0)>0).map(sp=>`<div class="row"><span class="k">${sp.name}</span><span class="v">+${state.statPillBonus[sp.stat]}${sp.stat==='crit'?'%':''}</span></div>`).join('')}
    </div>
    ` : ''}

    <div class="card">
      <div class="sec-title">${ic('bolt')} Đột Phá Cảnh Giới</div>
      <p class="flavor">${state.canBreak ? 'Tu vi đã viên mãn — thiên địa dị tượng, đây chính là thời khắc để đột phá.' : 'Tu vi chưa đủ để khuấy động cảnh giới mới, hãy tiếp tục tu luyện và tích lũy đan dược.'}</p>
      <button class="btn gold" ${state.canBreak?'':'disabled'} onclick="attemptBreakthrough()">${breakLabel}</button>
      ${!isFinal?`<div class="sec-note" style="margin-top:8px;">Tỷ lệ thành công cơ bản 55%, mỗi viên đan dược đã dùng gần đây (+${state.buffStack} lớp) cộng thêm 10%.${state.breakthroughBoost>0?` Phá Cảnh Đan đang cộng thêm +${state.breakthroughBoost}%.`:''}</div>`:''}
    </div>
  `;

  const cardTrangBi = `
    <div class="card">
      <div class="sec-title">${ic('swords')} Pháp Bảo Tùy Thân</div>
      ${state.treasure ? `
        <div class="row"><span class="k">Tên pháp bảo</span><span class="v">${state.treasure.name}</span></div>
        <div class="row"><span class="k">Công kích cộng thêm</span><span class="v">+${state.treasure.bonus.atk||0}</span></div>
        <div class="row"><span class="k">Bạo kích cộng thêm</span><span class="v">+${state.treasure.bonus.crit||0}%</span></div>
      ` : `<p class="flavor">Chưa luyện chế hay đoạt được pháp bảo nào. Hãy thám hiểm những vùng đất nguy hiểm để tìm cơ duyên.</p>`}
    </div>

    <div class="card">
      <div class="sec-title">${ic('book')} Công Pháp Đã Lĩnh Ngộ (${state.techniques.length})</div>
      ${state.techniques.length ? state.techniques.map(t=>`<div class="row"><span class="k">${t.name}</span><span class="v">${t.desc}</span></div>`).join('') : `<p class="flavor">Chưa lĩnh ngộ được thất truyền công pháp nào. Những vùng cấm địa hiểm ác thường ẩn chứa cơ duyên này.</p>`}
    </div>

    ${state.manuals.length ? `
    <div class="card">
      <div class="sec-title">${ic('key')} Bí Kíp Tìm Được (${state.manuals.length})</div>
      <p class="flavor">Có bí kíp trong tay không có nghĩa là luyện được ngay — cần đủ cảnh giới và tài nguyên phụ trợ.</p>
      ${state.manuals.map(id=>{
        const t = ADVANCED_TECHNIQUES.find(x=>x.id===id);
        const realmOk = state.realmIdx>=t.minRealm;
        const herbHave = state.herbs[t.cost.herbTier]||0;
        const resOk = state.spiritStones>=t.cost.stones && herbHave>=t.cost.herbCount;
        return `
          <div class="root-result" style="margin-bottom:9px;">
            <div class="root-name" style="font-size:14px;">${t.name}</div>
            <p class="flavor" style="margin:5px 0 8px;">${t.desc}</p>
            <div class="row"><span class="k">Yêu cầu cảnh giới</span><span class="v">${MAJOR_REALMS[t.minRealm].name}${realmOk?' '+ic('check','ok-mark'):''}</span></div>
            <div class="row"><span class="k">Tài nguyên phụ trợ</span><span class="v">${t.cost.stones} linh thạch, ${t.cost.herbCount} ${HERB_NAMES[t.cost.herbTier-1]}${resOk?' '+ic('check','ok-mark'):''}</span></div>
            ${t.madnessRisk?`<div class="sec-note" style="margin-top:4px;color:var(--blood);">${ic('warn')} Có nguy cơ tẩu hỏa nhập ma nếu cưỡng luyện khi cảnh giới còn thấp.</div>`:''}
            <button class="btn ${realmOk&&resOk?'gold':'ghost'}" onclick="learnAdvancedTechnique('${t.id}')" style="margin-top:8px;">Tu Luyện</button>
          </div>
        `;
      }).join('')}
    </div>
    ` : ''}
  `;

  return {cardTuChat, cardSucManh, cardTrangBi};
}




function renderTribulationPanel(){
  const t = state.tribulation;
  return `
    <div class="card">
      <div class="sec-title">${ic('storm')} Cửu Cửu Lôi Kiếp — Đợt ${t.wave}/9</div>
      <p class="flavor">Cửu cửu quy nhất, mỗi đợt lôi kiếp mãnh liệt hơn đợt trước. Chỉ cần trụ vững cả chín đợt, ngươi sẽ đạp nát hư không phi thăng Tiên Giới.</p>
      <button class="btn blood" onclick="faceTribulationWave()">Vận Chuyển Linh Lực Chống Đỡ</button>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn ghost" ${healPillCount()<1?'disabled':''} onclick="tribulationHeal()">${ic('drop')}Dùng Đan Liệu Thương (${healPillCount()})</button>
      </div>
    </div>
  `;
}


function renderWormTab(){
  if(!state.worm.have){
    return `
      <div class="card">
        <div class="sec-title">${ic('bug')} Linh Sủng</div>
        <p class="flavor">Ngươi chưa thu phục được linh sủng nào. Hãy thám hiểm những vùng đất nguy hiểm — từ Huyết Sắc Cấm Địa trở lên — để tìm cơ duyên khuất phục một trong bốn loại kỳ trùng dị thú: Phệ Kim Trùng, Hỏa Vân Điệp, Huyền Quy Linh, hoặc Thanh Vân Báo.</p>
      </div>
    `;
  }
  const pt = PET_TYPES.find(p=>p.id===state.worm.typeId) || PET_TYPES[0];
  const cost = state.worm.level*80;
  return `
    <div class="card">
      <div class="sec-title">${ic('bug')} ${pt.name} — Cấp ${state.worm.level}/10</div>
      <p class="flavor">${pt.desc}</p>
      <div class="row"><span class="k">Công kích cộng thêm</span><span class="v">+${state.worm.level*pt.atkPerLvl}</span></div>
      <div class="row"><span class="k">Phòng ngự cộng thêm</span><span class="v">+${state.worm.level*pt.defPerLvl}</span></div>
      <div class="row"><span class="k">Khí huyết cộng thêm</span><span class="v">+${state.worm.level*pt.hpPerLvl}</span></div>
      <div class="row"><span class="k">Bạo kích cộng thêm</span><span class="v">+${state.worm.level*pt.critPerLvl}%</span></div>
      <div class="row"><span class="k">${pt.skillName} (chiến đấu)</span><span class="v">≈ ${Math.round(state.stats.atk*0.5+state.worm.level*10)}</span></div>
      <button class="btn" ${state.worm.level>=10?'disabled':''} onclick="feedWorm()" style="margin-top:9px;">Luyện Hóa Huyết Nhục (${cost} linh thạch)</button>
    </div>
  `;
}



/* =====================================================================
   KHỞI TẠO
===================================================================== */
window.onload = function(){
  applySettings();
  state = freshState('', null, null, null);
  pendingName = '';
  pendingRoot = null;
  pendingPath = null;
  pendingPhysique = null;
  pendingPhysiqueRolled = false;
  creationStep = 1;
  render();
  runTitleScreen();
  cloudInit();
};
</script>
