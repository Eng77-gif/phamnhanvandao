<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Phàm Nhân Vấn Đạo — Tam Giới Tu Tiên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090b0d;
    --bg-hero: radial-gradient(ellipse at 50% -20%, #1e3230 0%, #0d1414 45%, #090b0d 80%);
    --panel:#12181c;
    --panel2:#171e23;
    --border:#2a3532;
    --border-soft:#1e2624;
    --jade:#57bb96;
    --jade-dim:#2f6e57;
    --jade-bright:#7fd4b0;
    --jade-glow: rgba(87,187,150,.25);
    --gold:#d4af6a;
    --gold-dim:#7d6737;
    --gold-bright:#eecb8f;
    --gold-glow: rgba(212,175,106,.22);
    --blood:#c15d4a;
    --blood-dim:#5e2f28;
    --blood-bright:#e08268;
    --blood-glow: rgba(193,93,74,.22);
    --text:#efe9d8;
    --text-dim:#9aa19a;
    --text-faint:#606a63;
    --radius:7px;
    --radius-sm:5px;
    --shadow-card: 0 3px 10px rgba(0,0,0,.32), 0 1px 2px rgba(0,0,0,.4);
    --shadow-pop: 0 8px 28px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Be Vietnam Pro',sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(87,187,150,.05) 0%, transparent 35%),
      radial-gradient(circle at 85% 0%, rgba(212,175,106,.04) 0%, transparent 30%);
    background-attachment:fixed;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif',serif;}
  ::selection{background:var(--jade-dim);color:#fff;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--bg-hero);
    border-bottom:1px solid var(--border);
    padding:18px 16px 15px;
    position:relative;
  }
  .topbar::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    opacity:.6;
  }
  .topbar .name-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .topbar .name{font-family:'Noto Serif',serif;font-weight:700;font-size:20px;color:var(--text);letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.4);}
  .topbar .title{font-size:12.5px;color:var(--gold-bright);letter-spacing:.2px;}
  .topbar .realm{font-size:12px;color:var(--jade-bright);margin-top:2px;font-weight:600;letter-spacing:.3px;padding:3px 9px;background:rgba(87,187,150,.1);border:1px solid var(--jade-dim);border-radius:20px;}
  .stat-bars{margin-top:12px;display:flex;flex-direction:column;gap:7px;}
  .bar-row{display:flex;align-items:center;gap:9px;}
  .bar-label{font-size:10.5px;color:var(--text-dim);width:40px;flex:none;letter-spacing:.2px;}
  .bar-track{flex:1;height:9px;background:#141a19;border-radius:20px;overflow:hidden;border:1px solid var(--border-soft);box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
  .bar-fill{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1);border-radius:20px;position:relative;}
  .bar-fill::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.18), transparent 55%);
  }
  .bar-fill.hp{background:linear-gradient(90deg,var(--blood-dim),var(--blood));box-shadow:0 0 8px var(--blood-glow);}
  .bar-fill.tuvi{background:linear-gradient(90deg,var(--jade-dim),var(--jade));box-shadow:0 0 8px var(--jade-glow);}
  .bar-num{font-size:10.5px;color:var(--text-faint);width:76px;text-align:right;flex:none;font-variant-numeric:tabular-nums;}
  .resource-row{display:flex;gap:8px;margin-top:11px;font-size:11.5px;color:var(--text-dim);flex-wrap:wrap;}
  .resource-row span{background:rgba(255,255,255,.03);border:1px solid var(--border-soft);padding:4px 9px;border-radius:20px;}
  .resource-row span b{color:var(--gold-bright);font-weight:700;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;border-bottom:1px solid var(--border);background:var(--panel);overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:0;z-index:10;}
  .tab-btn{
    flex:1 0 auto;min-width:76px;background:none;border:none;color:var(--text-faint);
    padding:12px 6px 10px;font-size:12.5px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;
    transition:color .15s, background .15s;
  }
  .tab-btn:active{background:rgba(255,255,255,.03);}
  .tab-btn.active{color:var(--jade-bright);border-bottom-color:var(--jade);background:linear-gradient(180deg, rgba(87,187,150,.09), transparent);}

  /* ---------- Sub-tabs (within a main tab) ---------- */
  .subtab-row{display:flex;gap:7px;margin-bottom:1px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:1px;}
  .subtab-btn{
    flex:none;background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);
    padding:8px 15px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;
    transition:all .15s;
  }
  .subtab-btn.active{
    background:linear-gradient(180deg, rgba(87,187,150,.2), rgba(87,187,150,.05));
    border-color:var(--jade);color:var(--jade-bright);box-shadow:0 0 0 1px var(--jade-glow);
  }

  main{flex:1;padding:15px 14px 90px;display:flex;flex-direction:column;gap:13px;}

  /* ---------- Cards / sections ---------- */
  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel2));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px 15px;
    box-shadow:var(--shadow-card);
    position:relative;
  }
  .card + .card{margin-top:0;}
  .sec-title{
    font-family:'Noto Serif',serif;font-size:14px;color:var(--gold-bright);margin:0 0 11px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px;
    padding-bottom:8px;border-bottom:1px solid var(--border-soft);
  }
  .sec-note{font-size:11.5px;color:var(--text-faint);margin:-6px 0 10px;line-height:1.5;}
  .flavor{font-size:12.5px;color:var(--text-dim);font-style:italic;line-height:1.6;margin:0 0 9px;}

  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:var(--text-dim);}
  .row .v{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600;text-align:right;}

  .btn{
    background:linear-gradient(180deg, var(--jade-dim), #285f4a);color:#eafff4;border:1px solid var(--jade);
    border-radius:var(--radius-sm);padding:11px 14px;font-size:13.5px;font-weight:700;
    width:100%;text-align:center;transition:transform .1s, box-shadow .15s, filter .15s;
    box-shadow:0 2px 6px rgba(0,0,0,.3);letter-spacing:.2px;
  }
  .btn:active{transform:translateY(1px) scale(.99);filter:brightness(1.15);}
  .btn.gold{background:linear-gradient(180deg,#4a3c22,#332a17);border-color:var(--gold);color:var(--gold-bright);}
  .btn.gold:active{filter:brightness(1.25);}
  .btn.blood{background:linear-gradient(180deg,var(--blood-dim),#4a231d);border-color:var(--blood);color:#ffe9e2;}
  .btn.blood:active{filter:brightness(1.2);}
  .btn.ghost{background:rgba(255,255,255,.02);border-color:var(--border);color:var(--text-dim);box-shadow:none;}
  .btn.ghost:active{background:rgba(255,255,255,.06);}
  .btn:disabled{opacity:.3;pointer-events:none;filter:grayscale(.4);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;min-width:120px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .tile{
    background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:11px 12px;display:flex;flex-direction:column;gap:7px;
    box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  .tile.locked{opacity:.38;}
  .tile-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;}
  .tile-head .tn{color:var(--text);font-weight:700;}
  .tile-head .tc{color:var(--text-faint);font-size:11px;}
  .tile .btn{padding:8px 8px;font-size:11.5px;}

  .zone-card{border-left:3px solid var(--jade-dim);}
  .zone-card.locked{border-left-color:var(--border);}
  .zone-card h3{font-family:'Noto Serif',serif;font-size:15px;margin:0 0 4px;color:var(--gold-bright);}
  .zone-card p{font-size:11.5px;color:var(--text-dim);margin:0 0 10px;line-height:1.55;}
  .zone-lock{font-size:11px;color:var(--text-faint);font-style:italic;}

  /* ---------- Combat ---------- */
  .enemy-block{text-align:center;padding:8px 0 6px;}
  .enemy-name{font-family:'Noto Serif',serif;font-size:16px;color:var(--blood-bright);margin-bottom:8px;letter-spacing:.2px;}
  .combat-log{
    background:#0c1110;border:1px solid var(--border-soft);border-radius:var(--radius-sm);
    padding:9px 11px;max-height:130px;overflow-y:auto;font-size:11.5px;color:var(--text-dim);
    display:flex;flex-direction:column-reverse;gap:5px;box-shadow:inset 0 2px 6px rgba(0,0,0,.4);
  }

  /* ---------- Log ---------- */
  .log-entry{font-size:12px;color:var(--text-dim);padding:8px 0;border-bottom:1px solid var(--border-soft);line-height:1.55;}
  .log-entry:first-child{color:var(--text);}
  .log-entry:last-child{border-bottom:none;}

  /* ---------- Overlay ---------- */
  #overlay{
    position:fixed;inset:0;background:rgba(4,6,7,.9);
    display:none;align-items:center;justify-content:center;z-index:110;padding:22px;
    backdrop-filter:blur(3px);
  }
  #overlay.show{display:flex;}
  .modal{
    background:linear-gradient(180deg, var(--panel), #0f1518);border:1px solid var(--gold-dim);border-radius:10px;
    max-width:440px;width:100%;padding:24px 21px;max-height:86vh;overflow-y:auto;
    box-shadow:var(--shadow-pop), 0 0 40px rgba(212,175,106,.06);
  }
  .modal h2{font-size:20px;margin:0 0 11px;color:var(--gold-bright);letter-spacing:.2px;}
  .modal p{font-size:13.5px;color:var(--text-dim);line-height:1.7;margin:0 0 10px;}
  .modal .epilogue{color:var(--text);}
  .modal .stat-list{margin:14px 0;padding:0;}
  .modal .stat-list .row{font-size:12.5px;}

  .root-result{
    background:#0d1211;border:1px solid var(--border-soft);border-radius:var(--radius-sm);
    padding:12px 13px;margin:2px 0 12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.3);
  }
  .root-tier{font-size:10.5px;color:var(--text-faint);}
  .root-name{font-family:'Noto Serif',serif;font-size:17px;color:var(--gold-bright);margin-top:2px;}

  .path-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 0;}
  .path-tile{
    background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:13px 10px;cursor:pointer;transition:all .15s;
    text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60px;gap:4px;
  }
  .path-tile:active{transform:scale(.97);}
  .path-tile.selected{
    border-color:var(--jade);background:linear-gradient(180deg, rgba(87,187,150,.16), rgba(87,187,150,.04));
    box-shadow:0 0 0 1px var(--jade-glow), 0 4px 14px rgba(87,187,150,.18);
  }
  .path-icon{font-size:19px;line-height:1;}
  .path-name{font-family:'Noto Serif',serif;font-size:12.5px;color:var(--text);line-height:1.3;}
  .path-tile.selected .path-name{color:var(--jade-bright);font-weight:700;}
  .path-desc{font-size:11px;color:var(--text-dim);line-height:1.55;margin:0;}

  .step-progress{display:flex;gap:6px;margin:2px 0 16px;}
  .step-seg{flex:1;height:5px;border-radius:3px;background:var(--border-soft);overflow:hidden;position:relative;}
  .step-seg.done{background:var(--jade-dim);}
  .step-seg.current{background:var(--border-soft);}
  .step-seg.current::after{
    content:'';position:absolute;inset:0;width:55%;border-radius:3px;
    background:linear-gradient(90deg, var(--jade), var(--gold-bright));
    box-shadow:0 0 6px var(--jade-glow);
  }

  input.name-input{
    width:100%;background:#0d1211;border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text);padding:11px 13px;font-size:14px;margin:10px 0 14px;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.4);transition:border-color .15s;
  }
  input.name-input:focus{outline:none;border-color:var(--jade);box-shadow:inset 0 1px 3px rgba(0,0,0,.4), 0 0 0 2px var(--jade-glow);}

  /* ---------- Nhân Giới ---------- */
  .ng-route{display:flex;align-items:flex-start;gap:0;margin:2px 0 0;}
  .ng-stop{flex:none;width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;}
  .ng-dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;
    background:var(--panel2);border:1px solid var(--border);}
  .ng-stop.here .ng-dot{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow);}
  .ng-stop.locked{opacity:.4;}
  .ng-stop-name{font-family:'Noto Serif',serif;font-size:12px;color:var(--text);}
  .ng-stop.here .ng-stop-name{color:var(--gold-bright);font-weight:700;}
  .ng-stop-req{font-size:10px;color:var(--text-faint);line-height:1.3;}
  .ng-link{flex:1;height:1px;margin-top:19px;background:repeating-linear-gradient(90deg,var(--gold-dim) 0 4px,transparent 4px 8px);min-width:10px;}
  .sword-grid{display:grid;grid-template-columns:repeat(24,1fr);gap:2px 3px;margin:4px 0 10px;padding:10px;
    background:#0c1110;border:1px solid var(--border-soft);border-radius:var(--radius-sm);}
  .sword-grid span{height:30px;background:var(--border-soft);
    clip-path:polygon(50% 0,72% 12%,60% 100%,40% 100%,28% 12%);}
  .sword-grid span.on{background:linear-gradient(180deg,#e8fff4 0%,var(--jade-bright) 25%,var(--jade-dim) 100%);}
  .sword-grid.tran span.on{background:linear-gradient(180deg,#fff6df 0%,var(--gold-bright) 25%,var(--gold-dim) 100%);}

  /* ---------- Biểu tượng ---------- */
  .ic{width:1.2em;height:1.2em;vertical-align:-0.24em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .no-icons .ic:not(.keep){display:none;}
  .tab-btn .ic, .subtab-btn .ic{margin-right:5px;}
  .btn .ic{margin-right:6px;}
  .sec-title{justify-content:flex-start;gap:8px;}
  .sec-title > span{margin-left:auto;}
  .sec-title .ic{color:var(--gold);width:17px;height:17px;}
  .zone-card h3 .ic{color:var(--gold);margin-right:6px;}
  .resource-row .ic{color:var(--gold);margin-right:4px;}
  .path-icon .ic{width:24px;height:24px;color:var(--gold-bright);}
  .ng-dot .ic{width:19px;height:19px;color:var(--gold-bright);}
  .enemy-name .ic{margin-left:6px;color:var(--gold);}
  .ok-mark{color:var(--jade);} .bad-mark{color:var(--blood-bright);}

  /* ---------- Nút biểu tượng trên đầu ---------- */
  .hdr-right{display:flex;align-items:center;gap:8px;flex:none;}
  .icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
    background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text-dim);padding:0;}
  .icon-btn .ic{width:19px;height:19px;margin:0;}
  .icon-btn:active{background:rgba(255,255,255,.08);color:var(--gold-bright);}
  .icon-btn:focus-visible, .btn:focus-visible, .tab-btn:focus-visible, .subtab-btn:focus-visible, .switch:focus-visible, .seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- Bảng cài đặt ---------- */
  .modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .modal-top h2{margin:0;}
  .modal-head{display:flex;align-items:center;gap:9px;}
  .modal-head .ic{color:var(--blood-bright);}
  .set-group{font-family:'Noto Serif',serif;font-size:13px;color:var(--gold-bright);margin:16px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--border-soft);}
  .set-group:first-of-type{margin-top:4px;}
  .set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
  .set-row.col{flex-direction:column;align-items:stretch;gap:9px;}
  .set-title{font-size:13.5px;color:var(--text);font-weight:600;}
  .set-desc{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin-top:2px;}
  .switch{flex:none;width:46px;height:26px;border-radius:13px;border:1px solid var(--border);background:#0d1211;position:relative;padding:0;transition:background .2s,border-color .2s;}
  .switch span{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text-faint);transition:transform .2s,background .2s;}
  .switch.on{background:var(--jade-dim);border-color:var(--jade);}
  .switch.on span{transform:translateX(20px);background:#eafff4;}
  .seg{display:flex;background:#0d1211;border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;gap:3px;}
  .seg button{flex:1;background:none;border:none;color:var(--text-dim);font-size:12.5px;font-weight:600;padding:7px 4px;border-radius:4px;}
  .seg button.on{background:var(--panel2);color:var(--gold-bright);box-shadow:inset 0 0 0 1px var(--gold-dim);}

  /* ---------- Nhật ký cập nhật: dòng thời gian ---------- */
  .changelog{list-style:none;margin:0;padding:0 0 0 18px;position:relative;}
  .changelog::before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--border);}
  .changelog > li{position:relative;padding:0 0 18px;}
  .changelog > li::before{content:'';position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:1px solid var(--text-faint);}
  .changelog > li.latest::before{background:var(--gold);border-color:var(--gold-bright);box-shadow:0 0 0 3px var(--gold-glow);}
  .cl-head{display:flex;align-items:baseline;gap:10px;}
  .cl-ver{font-family:'Noto Serif',serif;font-size:15px;color:var(--gold-bright);font-weight:700;}
  .cl-date{font-size:11px;color:var(--text-faint);}
  .cl-title{font-size:13px;color:var(--text);font-weight:600;margin:2px 0 6px;}
  .changelog ul{margin:0;padding-left:16px;}
  .changelog ul li{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin-bottom:4px;}

  /* ---------- Thông báo nhỏ ---------- */
  #toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--gold-dim);
    color:var(--text);font-size:13px;padding:9px 16px;border-radius:20px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:60;}
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- Cỡ chữ & chuyển động ---------- */
  html[data-scale="sm"] body{zoom:.92;}
  html[data-scale="lg"] body{zoom:1.1;}
  html[data-scale="xl"] body{zoom:1.22;}
  html.no-motion *, html.no-motion *::before, html.no-motion *::after{transition:none !important;animation:none !important;}

  /* ================= v1.3 — điều hướng & bố cục mới ================= */
  .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;z-index:20;
    display:grid;grid-template-columns:repeat(5,1fr);background:rgba(14,19,22,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));}
  .bottom-nav.locked{opacity:.35;pointer-events:none;}
  .nav-btn{background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:10px;position:relative;}
  .nav-ic{position:relative;display:flex;}
  .nav-ic .ic{width:22px;height:22px;}

  /* Dòng sự kiện mới nhất */

  /* Tổng quan nhân vật */

    border:1px solid var(--gold-dim);background:radial-gradient(circle at 50% 35%, rgba(212,175,106,.18), transparent 70%);}
  .hero-sigil .ic{width:28px;height:28px;color:var(--gold-bright);}
  .hero-realm{font-family:'Noto Serif',serif;font-size:17px;color:var(--gold-bright);}
  .hero-sub{font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.5;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat-tile{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .stat-tile .ic{color:var(--jade);width:17px;height:17px;}
  .st-v{font-size:16px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
  .st-l{font-size:10.5px;color:var(--text-faint);}
  .row small{color:var(--text-faint);font-weight:400;font-size:11px;}
  .tech-row{padding:9px 0;border-bottom:1px solid var(--border-soft);}

  .tech-name{font-size:13.5px;font-weight:700;color:var(--text);}
  .tech-bonus{font-size:11.5px;color:var(--jade-bright);margin:2px 0;}
  .tech-desc{font-size:11.5px;color:var(--text-faint);line-height:1.5;}

  /* Tu luyện */
  .realm-card{text-align:center;}
  .realm-world{font-size:11px;color:var(--text-faint);letter-spacing:.5px;}
  .realm-name{font-size:21px;color:var(--gold-bright);margin:2px 0 12px;}

  /* Công thức chế tác */
  .prof-card .sec-title{margin-bottom:9px;}
  .recipe{border:1px solid var(--border);border-radius:var(--radius-sm);background:#10161a;padding:11px 12px;margin-top:9px;}
  .recipe:first-of-type{margin-top:0;}

  .recipe-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .rn{font-size:13.5px;font-weight:700;color:var(--text);}
  .rc{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .rd{font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.5;}
  .rnote{font-size:11px;margin-top:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}

  .chip b{font-weight:700;font-variant-numeric:tabular-nums;}

  .recipe-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;}
  .rate{font-size:11.5px;font-weight:700;}
  .rate.hi{color:var(--jade-bright);} .rate.mid{color:var(--gold-bright);} .rate.lo{color:var(--blood-bright);}
  .btn.sm{width:auto;padding:7px 13px;font-size:12px;flex:none;}

  .btn-inline{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
  .btn.pressed{border-color:var(--gold);color:var(--gold-bright);}
  .mat-group{padding:6px 0;border-bottom:1px solid var(--border-soft);}

  .mat-head{font-family:'Noto Serif',serif;font-size:13px;color:var(--gold-bright);margin:10px 0 2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .mat-head small{font-family:'Be Vietnam Pro',sans-serif;font-size:11px;color:var(--text-faint);}
  .mat-head .ic{width:15px;height:15px;}

  /* Chiến đấu */
  .combat-card .enemy-block .bar-row{max-width:none;}
  .self-bar{margin-top:10px;}
  .phu-menu{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding:8px;border:1px dashed var(--gold-dim);border-radius:var(--radius-sm);}

  /* ================= v1.4 — bí cảnh, sự kiện, nhân mạch ================= */
  .zone-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;}
  .zone-top h3{margin:0;}
  .zone-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;border:1px solid var(--border);color:var(--text-faint);}
  .zone-badge.open{color:var(--jade-bright);border-color:var(--jade-dim);}
  .zone-badge.hot{color:#1a1206;background:var(--gold);border-color:var(--gold-bright);}
  .zone-badge.wait{color:var(--text-dim);}
  .realm-hot{border-left-color:var(--gold);box-shadow:var(--shadow-card), 0 0 0 1px var(--gold-glow);}
  .realm-wait, .realm-lock{border-left-color:var(--border);}
  .rule-list{margin:0 0 12px;padding-left:17px;}
  .rule-list li{font-size:11.5px;color:var(--text-dim);line-height:1.55;margin-bottom:3px;}
  .step-dots{display:flex;gap:5px;}

  .step-dots .step-dot.done{background:var(--blood-dim);}
  .step-dots .step-dot.cur{background:var(--blood-bright);box-shadow:0 0 6px var(--blood-glow);}
  .expd-card{border-left:3px solid var(--blood);}

    background:rgba(193,93,74,.12);border:1px solid var(--blood-dim);color:var(--blood-bright);border-radius:var(--radius-sm);padding:9px 11px;}
  .expd-banner .ic{flex:none;}
  .event-card{border:1px solid var(--gold-dim);background:linear-gradient(180deg,#1b1a14,var(--panel2));}
  .ev-head{display:flex;align-items:center;gap:11px;margin-bottom:9px;}
  .ev-sigil{width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold-dim);color:var(--gold-bright);}
  .ev-sigil .ic{width:21px;height:21px;}
  .ev-title{font-size:16px;color:var(--gold-bright);}
  .ev-sub{font-size:11.5px;color:var(--text-faint);}
  .ev-text{font-size:13px;color:var(--text);line-height:1.65;margin:0 0 12px;}

  .ev-opt{text-align:left;display:flex;flex-direction:column;gap:2px;}
  .ev-opt small{font-size:11px;font-weight:500;opacity:.75;}
  .npc-head{display:flex;align-items:center;gap:11px;}
  .npc-sigil{width:42px;height:42px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);}
  .npc-sigil .ic{width:21px;height:21px;}
  .npc-friend .npc-sigil{border-color:var(--jade-dim);color:var(--jade-bright);}
  .npc-enemy .npc-sigil{border-color:var(--blood-dim);color:var(--blood-bright);}
  .npc-neutral .npc-sigil{color:var(--gold-bright);}
  .npc-dead{opacity:.55;}
  .npc-id{flex:1;min-width:0;}
  .npc-name{font-size:15px;color:var(--text);}
  .npc-title{font-size:11.5px;color:var(--text-faint);}
  .npc-tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:12px;border:1px solid var(--border);white-space:nowrap;}
  .npc-tag.friend{color:var(--jade-bright);border-color:var(--jade-dim);}
  .npc-tag.enemy{color:var(--blood-bright);border-color:var(--blood-dim);}
  .npc-tag.neutral{color:var(--gold-bright);border-color:var(--gold-dim);}
  .npc-tag.dead{color:var(--text-faint);}
  .npc-desc{font-size:12px;color:var(--text-dim);line-height:1.6;margin:10px 0 4px;}
  .favor-track{position:relative;height:6px;border-radius:3px;background:var(--border-soft);margin-top:11px;overflow:hidden;}
  .favor-fill{position:absolute;top:0;bottom:0;}
  .favor-fill.pos{background:var(--jade);}
  .favor-fill.neg{background:var(--blood);}
  .favor-mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--text-faint);}
  .boon-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .boon{font-size:10.5px;padding:3px 8px;border-radius:12px;border:1px dashed var(--border);color:var(--text-faint);display:inline-flex;align-items:center;gap:3px;}
  .boon .ic{width:12px;height:12px;margin:0;}
  .boon.got{border-style:solid;color:var(--jade-bright);border-color:var(--jade-dim);}
  .boon.ready{border-style:solid;color:#1a1206;background:var(--gold);border-color:var(--gold-bright);}

  .lg-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;}
  .lg-node{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);font-family:inherit;text-align:center;}
  .lg-node.here{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-glow);}
  .lg-node.here .lg-node-name{color:var(--gold-bright);}
  .lg-node.locked{opacity:.4;}
  .lg-node:disabled{cursor:default;}
  .lg-node-name{font-family:'Noto Serif',serif;font-size:12px;line-height:1.3;}
  .lg-node-sub{font-size:10px;color:var(--text-faint);}
  .khieu-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:4px 0 10px;padding:10px;background:#0c1110;border:1px solid var(--border-soft);border-radius:var(--radius-sm);}
  .khieu-grid span{aspect-ratio:1;border-radius:50%;background:var(--border-soft);}
  .khieu-grid span.half{background:radial-gradient(circle,var(--gold-dim) 0%,var(--border-soft) 80%);}
  .khieu-grid span.on{background:radial-gradient(circle,#fff6df 0%,var(--gold-bright) 45%,var(--gold-dim) 100%);box-shadow:0 0 4px var(--gold-glow);}
  .recipe.law-main{border-color:var(--gold-dim);box-shadow:0 0 0 1px var(--gold-glow);}
  /* ---------- Tạo nhân vật ---------- */
  #creation{position:fixed;inset:0;z-index:101;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;
    background:radial-gradient(ellipse at 50% 0%, #1b2a33 0%, #0d1417 55%, #080c0e 100%);}
  #creation.show{display:block;}
  .cr-wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));}
  .cr-top{display:flex;justify-content:space-between;align-items:center;min-height:36px;}
  .cr-back{background:none;border:none;color:var(--text-dim);font-size:14px;font-family:inherit;padding:6px 8px 6px 0;}
  .cr-brand{font-family:'Noto Serif',serif;font-size:13px;color:var(--gold);letter-spacing:.5px;}

  .cr-steps li{display:flex;flex-direction:column;align-items:center;gap:5px;}

  .cr-steps .lb{font-size:10px;color:var(--text-faint);white-space:nowrap;}
  .cr-steps .cur .lb{color:var(--gold-bright);font-weight:600;}
  .cr-body{flex:1;}

  .cr-lead{font-size:14px;color:var(--text-dim);line-height:1.7;margin:0 0 20px;}

  .cr-name-row{display:flex;gap:8px;}
  .cr-input{flex:1;min-width:0;background:#0b1113;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);
    font-family:'Noto Serif',serif;font-size:19px;padding:14px 14px;outline:none;}
  .cr-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow);}
  .cr-dice{flex:none;width:54px;border-radius:var(--radius-sm);background:var(--panel2);border:1px solid var(--border);color:var(--gold-bright);display:flex;align-items:center;justify-content:center;}
  .cr-dice .ic{width:22px;height:22px;margin:0;}
  .cr-hint{font-size:12px;color:var(--text-faint);margin:10px 0 0;line-height:1.5;}
  .cr-foot{position:sticky;bottom:0;padding:16px 0 4px;background:linear-gradient(180deg,rgba(9,13,15,0),#0a0f11 35%);}
  .cr-foot .btn{padding:15px;font-size:15px;}
  .cr-cards,.cr-paths{display:flex;flex-direction:column;gap:10px;}
  .cr-card,.cr-path{width:100%;text-align:left;font-family:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;}
  .cr-card.sel,.cr-path.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-glow), 0 8px 24px rgba(0,0,0,.35);background:linear-gradient(180deg,#1a1f19,var(--panel));}
  .cr-card-ic,.cr-path-ic{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold-bright);}

  .cr-card-tag{font-size:11.5px;color:var(--jade-bright);}
  .cr-card-desc{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin-top:4px;}
  .cr-card-bonus{font-size:12px;color:var(--text);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);}
  .cr-path{flex-direction:column;gap:8px;}
  .cr-path-head{display:flex;align-items:center;gap:12px;}
  .cr-path-name{flex:1;}
  .cr-path-atk{font-size:11px;color:var(--text-faint);}

  .cr-stats{display:flex;flex-direction:column;gap:6px;}

  .cr-stat b{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;}
  .cr-stat-track{height:6px;border-radius:3px;background:var(--border-soft);overflow:hidden;}
  .cr-stat-fill{height:100%;background:var(--text-faint);border-radius:3px;}
  .cr-stat-fill.hi{background:var(--jade);} .cr-stat-fill.lo{background:var(--blood);}
  .cr-orb-wrap{display:flex;justify-content:center;margin:6px 0 20px;}

  .cr-mini{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--text-dim);}
  .cr-mini b{color:var(--text);}
  .cr-phys{margin-top:10px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}

  .cr-tablet{position:relative;margin:4px auto 0;max-width:340px;padding:26px 20px 18px;border-radius:18px 18px 12px 12px;text-align:center;
    background:linear-gradient(180deg,#1f3a31 0%,#132520 60%,#0f1d19 100%);border:1px solid #3f7a62;box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 16px 40px rgba(0,0,0,.45);}

  .phy-item{border:1px solid var(--border);border-radius:10px;padding:12px;background:#10161a;}

  .phy-item p{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin:6px 0 0;}
  .phy-owner{font-size:11.5px;color:var(--jade-bright);margin-top:6px;}
  .phy-row{padding:9px 0;border-bottom:1px solid var(--border-soft);}
  .phy-row:last-child{border-bottom:none;}
  .phy-row-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--text-dim);}
  .phy-row-head b{font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .phy-row.has .phy-row-head span{color:var(--gold-bright);} .phy-row.has .phy-row-head b{color:var(--jade-bright);}
  .phy-row.race{opacity:.7;}
  .phy-row-how{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin-top:3px;}
  .phy-codex summary{cursor:pointer;list-style:none;margin-bottom:0;}
  .phy-codex[open] summary{margin-bottom:8px;}
  .phy-codex summary::-webkit-details-marker{display:none;}

  /* ---------- Thời gian ---------- */
  .time-big{display:flex;align-items:baseline;gap:8px;margin:2px 0 2px;}
  .tb-num{font-family:'Noto Serif',serif;font-size:40px;color:var(--gold-bright);line-height:1;font-variant-numeric:tabular-nums;}
  .tb-unit{font-size:14px;color:var(--text-dim);}
  .tb-month{margin-left:auto;font-size:12px;color:var(--text-faint);}
  .time-sub{font-size:12px;color:var(--text-faint);margin-bottom:12px;}
  .life-track{height:8px;border-radius:4px;background:var(--border-soft);overflow:hidden;margin-bottom:8px;}
  .life-fill{height:100%;border-radius:4px;transition:width .5s;}
  .life-track.jade .life-fill{background:linear-gradient(90deg,var(--jade-dim),var(--jade));}
  .life-track.gold .life-fill{background:linear-gradient(90deg,var(--gold-dim),var(--gold));}
  .life-track.blood .life-fill{background:linear-gradient(90deg,var(--blood-dim),var(--blood-bright));animation:life-pulse 1.4s ease-in-out infinite;}
  @keyframes life-pulse{50%{opacity:.55}}
  .timeline{list-style:none;margin:0;padding:0 0 0 16px;position:relative;}
  .timeline::before{content:'';position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--border);}
  .timeline li{position:relative;display:flex;gap:10px;padding:7px 0;font-size:12.5px;}
  .timeline li::before{content:'';position:absolute;left:-16px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:1px solid var(--text-faint);}
  .timeline li.hot::before{background:var(--gold);border-color:var(--gold-bright);}
  .timeline li.blood::before{background:var(--blood);border-color:var(--blood-bright);}
  .tl-when{flex:none;width:78px;color:var(--gold-bright);font-weight:600;font-variant-numeric:tabular-nums;}
  .timeline li.blood .tl-when{color:var(--blood-bright);}
  .tl-what{color:var(--text-dim);}
  /* ---------- Hiệu ứng ---------- */
  #fxLayer{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden;}
  .fx-float{position:absolute;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7);transform:translate(-50%,0);animation:fx-rise 1.25s cubic-bezier(.2,.7,.3,1) forwards;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .fx-float.crit{font-size:26px;color:#ffd77a;}
  .fx-float.hurt{color:#ff8a78;}
  .fx-float.heal,.fx-float.tuvi{color:#9ff0c6;font-size:15px;}
  @keyframes fx-rise{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
  .fx-flash{position:absolute;inset:0;animation:fx-flash ease-out forwards;}
  @keyframes fx-flash{0%{opacity:1}100%{opacity:0}}
  .fx-shake{animation:fx-shake .42s cubic-bezier(.36,.07,.19,.97);}
  @keyframes fx-shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
  .fx-banner{position:absolute;left:0;right:0;top:34%;display:flex;justify-content:center;animation:fx-banner 2s ease forwards;}
  .fx-banner span{font-family:'Noto Serif',serif;font-size:clamp(24px,7vw,34px);font-weight:700;padding:10px 26px;
    background:linear-gradient(90deg,transparent,rgba(10,14,16,.85) 20%,rgba(10,14,16,.85) 80%,transparent);
    color:#f0cf8c;text-shadow:0 0 18px rgba(240,207,140,.55);letter-spacing:2px;}
  .fx-banner.jade span{color:#9ff0c6;text-shadow:0 0 18px rgba(80,200,140,.55);}
  .fx-banner.blood span{color:#ff8a78;text-shadow:0 0 18px rgba(220,80,60,.55);}
  @keyframes fx-banner{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1.04)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
  .fx-bolt{position:absolute;top:0;width:60px;height:62vh;animation:fx-bolt .45s ease-out forwards;filter:drop-shadow(0 0 12px #fff3c4) drop-shadow(0 0 30px #b9a3ff);}
  .fx-bolt svg{width:100%;height:100%;}
  @keyframes fx-bolt{0%{opacity:0}10%{opacity:1}30%{opacity:.3}45%{opacity:1}100%{opacity:0}}
  .btn:active:not(:disabled){transform:scale(.97);}
  html.no-motion .fx-float, html.no-motion .fx-banner, html.no-motion .fx-flash{display:none;}

  .asc-card.done{opacity:.6;}
  .asc-card.here{border:1px solid var(--gold-dim);box-shadow:0 0 0 1px var(--gold-glow);}
  .asc-head{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .asc-ic{width:42px;height:42px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold-dim);color:var(--gold-bright);}
  .asc-ic .ic{width:21px;height:21px;margin:0;}
  .asc-route{font-family:'Noto Serif',serif;font-size:17px;color:var(--gold-bright);}
  .asc-route span{color:var(--text-faint);margin:0 4px;}
  .asc-sub{font-size:11.5px;color:var(--text-faint);}
  .asc-after{margin-top:10px;padding:10px 12px;border-left:2px solid var(--jade-dim);background:rgba(80,200,140,.05);border-radius:0 8px 8px 0;}
  .asc-after div{font-size:12px;color:var(--text-dim);line-height:1.6;}
  .dbg-group{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin:12px 0 6px;}
  .dbg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .dbg-btn{font-family:inherit;font-size:12px;font-weight:600;text-align:left;padding:10px 11px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);line-height:1.35;}
  .dbg-btn:active{transform:scale(.97);}
  .dbg-btn.gold{border-color:var(--gold-dim);color:var(--gold-bright);}
  .dbg-btn.blood{border-color:var(--blood-dim);color:var(--blood-bright);}
  .dbg-realms{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
  .dbg-realm{font-family:inherit;font-size:11px;font-weight:600;padding:8px 2px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text-dim);}
  .dbg-realm.ng{border-left:3px solid var(--jade-dim);} .dbg-realm.lg{border-left:3px solid var(--gold-dim);} .dbg-realm.tg{border-left:3px solid #7d6bb0;}
  .dbg-realm.on{background:var(--gold);color:#1a1206;border-color:var(--gold-bright);}
  .dbg-kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border-soft);color:var(--text-dim);}
  .dbg-kv b{color:var(--text);font-variant-numeric:tabular-nums;text-align:right;}
  .seg button .ic{width:13px;height:13px;margin:0 2px 0 0;vertical-align:-2px;}

  .loc-chip{cursor:pointer;border-color:var(--jade-dim) !important;}
  .loc-chip b{color:var(--jade-bright) !important;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom;}
  .alerts{border:1px solid var(--gold-dim);}
  .alert-item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;font-family:inherit;font-size:12.5px;color:var(--text);background:none;border:none;border-bottom:1px solid var(--border-soft);padding:9px 2px;}
  .alert-item:last-child{border-bottom:none;}
  .alert-item .ic{flex:none;width:17px;height:17px;color:var(--text-dim);}
  .alert-item span{flex:1;line-height:1.45;}
  .alert-item b{color:var(--text-faint);font-size:16px;}
  .alert-item.gold .ic{color:var(--gold-bright);} .alert-item.blood .ic{color:var(--blood-bright);} .alert-item.blood span{color:var(--blood-bright);}

  .acc-steps{margin:0 0 12px;padding-left:18px;}
  .acc-steps li{font-size:12.5px;color:var(--text-dim);line-height:1.65;margin-bottom:8px;}
  .acc-steps b{color:var(--text);}
  .acc-sql{display:block;width:100%;height:120px;margin:8px 0 6px;background:#0b1113;color:#9ff0c6;border:1px solid var(--border);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;resize:vertical;}
  .acc-input{display:block;width:100%;background:#0b1113;border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:15px;padding:12px;outline:none;}
  .acc-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow);}
  .acc-user{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--jade-dim);border-radius:10px;margin-bottom:10px;}
  .acc-user .ic{width:24px;height:24px;color:var(--jade-bright);margin:0;flex:none;}
  .acc-email{font-weight:700;color:var(--text);word-break:break-all;}
  .acc-sub{font-size:11.5px;color:var(--text-faint);}
  .acc-save{font-size:12.5px;color:var(--gold-bright);padding:10px 12px;border:1px solid var(--gold-dim);border-radius:8px;}
  .acc-save.dim{color:var(--text-dim);border-color:var(--border);}
  #lsAccount{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--text-faint);text-align:center;min-height:18px;}
  #lsAccount .ic{width:15px;height:15px;color:var(--jade-bright);}
  .ls-link{background:none;border:none;color:var(--jade-bright);font-family:inherit;font-size:12px;text-decoration:underline;text-underline-offset:2px;padding:4px;}

  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  /* ---------- Màn hình mở đầu ---------- */
  #loadingScreen{
    position:fixed;inset:0;z-index:100;overflow:hidden;
    background:radial-gradient(ellipse at 50% 18%, #1b2a33 0%, #0d1417 55%, #080c0e 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    transition:opacity .6s ease, visibility .6s;
  }
  #loadingScreen.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .ls-sky span{position:absolute;width:2px;height:2px;border-radius:50%;background:#f3dfa6;opacity:.0;animation:ls-twinkle 4s ease-in-out infinite;}
  .ls-sky span:nth-child(1){top:12%;left:14%;animation-delay:.2s}
  .ls-sky span:nth-child(2){top:22%;left:82%;animation-delay:1.1s}
  .ls-sky span:nth-child(3){top:8%;left:64%;animation-delay:2.3s}
  .ls-sky span:nth-child(4){top:34%;left:9%;animation-delay:1.7s}
  .ls-sky span:nth-child(5){top:30%;left:91%;animation-delay:.6s}
  .ls-sky span:nth-child(6){top:15%;left:36%;animation-delay:2.9s}
  .ls-sky span:nth-child(7){top:42%;left:76%;animation-delay:3.4s}
  .ls-sky span:nth-child(8){top:5%;left:24%;animation-delay:1.4s}
  @keyframes ls-twinkle{0%,100%{opacity:0}50%{opacity:.8}}
  .ls-bottle{width:min(46vw,180px);height:auto;overflow:visible;filter:drop-shadow(0 10px 28px rgba(60,190,130,.18));}
  .ls-halo{animation:ls-pulse 3.2s ease-in-out infinite;transform-origin:90px 34px;}
  @keyframes ls-pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
  .ls-beam{animation:ls-beam 2.4s ease-in-out infinite;}
  @keyframes ls-beam{0%,100%{opacity:.55}50%{opacity:1}}
  .ls-drop{opacity:0;animation:ls-drop 1.6s ease-in infinite;}
  .ls-drop.d2{animation-delay:.55s} .ls-drop.d3{animation-delay:1.1s}
  @keyframes ls-drop{0%{opacity:0;transform:translateY(0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(88px)}}
  #lsWave{animation:ls-wave 2.2s ease-in-out infinite alternate;}
  @keyframes ls-wave{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
  .ls-title{font-family:'Noto Serif',serif;font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.2;margin:22px 0 6px;text-align:center;
    background:linear-gradient(180deg,#fff3d2 0%,#f0cf8c 55%,#b8904a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px;text-wrap:balance;}
  .ls-sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#8fae9f;margin-bottom:18px;text-align:center;}
  .ls-status{min-height:20px;font-size:13px;color:var(--text-faint);font-style:italic;text-align:center;transition:opacity .3s;}
  .ls-actions{display:flex;flex-direction:column;gap:9px;width:min(100%,320px);margin-top:18px;opacity:0;transform:translateY(8px);transition:opacity .5s, transform .5s;}
  .ls-actions.show{opacity:1;transform:none;}
  .ls-actions .btn small{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:2px;}
  .ls-note{font-size:11px;color:var(--text-faint);text-align:center;margin-top:2px;}

  @media (prefers-reduced-motion: reduce){
    .bar-fill{transition:none;}
    .btn{transition:none;}
    .ls-halo,.ls-beam,.ls-drop,#lsWave,.ls-sky span{animation:none;}
    .ls-sky span{opacity:.5;}
  }
</style>
</head>

<script>
/* =====================================================================
   HỆ THỐNG BIỂU TƯỢNG — bộ ký hiệu SVG nét mảnh thay cho emoji,
   hiển thị giống nhau trên mọi thiết bị và tự đổi màu theo ngữ cảnh.
===================================================================== */
function ic(name, extra){
  return `<svg class="ic${extra?' '+extra:''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
}

/* =====================================================================
   CÀI ĐẶT · LƯU TRỮ · NHẬT KÝ CẬP NHẬT
===================================================================== */
const GAME_VERSION = '1.14.0';
const SAVE_KEY = 'ntcm_save_v1';
const SETTINGS_KEY = 'ntcm_settings_v1';
const DEFAULT_SETTINGS = {textScale:'md', motion:true, showIcons:true, autosave:true, logLen:90, confirmDanger:true};

function loadSettings(){
  try{ const raw = localStorage.getItem(SETTINGS_KEY); return Object.assign({}, DEFAULT_SETTINGS, raw?JSON.parse(raw):{}); }
  catch(e){ return Object.assign({}, DEFAULT_SETTINGS); }
}
let settings = loadSettings();
let settingsTab = 'caidat';
let lastSaveAt = null;
let saveTimer = null;
let pendingConfirm = null;

function persistSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }
function applySettings(){
  const r = document.documentElement;
  r.dataset.scale = settings.textScale;
  r.classList.toggle('no-motion', !settings.motion);
  r.classList.toggle('no-icons', !settings.showIcons);
}
function setSetting(k, v){
  settings[k] = v;
  persistSettings();
  applySettings();
  if(state && state.log && k==='logLen' && state.log.length>v) state.log.length = v;
  if(k==='autosave' && v) saveGame(true);
  if(state && state.root && state.path) render();
  showSettings(settingsTab);
}

function toast(msg){
  let el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1800);
}

function saveGame(silent){
  if(!state || !state.root || !state.path) return false;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({v:GAME_VERSION, t:Date.now(), state}));
    lastSaveAt = Date.now();
    if(typeof scheduleCloudPush==='function') scheduleCloudPush();
    if(!silent) toast('Đã lưu tiến trình');
    return true;
  }catch(e){
    if(!silent) toast('Không lưu được — trình duyệt đang chặn bộ nhớ');
    return false;
  }
}
function scheduleSave(){
  if(!settings.autosave || !state || !state.root || !state.path) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveGame(true), 500);
}
function readSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !d.state || !d.state.root || !d.state.path) return null;
    return d;
  }catch(e){ return null; }
}
function deleteSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  lastSaveAt = null;
  toast('Đã xóa bản lưu');
}
function restoreFromSave(d){
  state = d.state;
  if(!state.subTabs) state.subTabs = {nhanvat:'tuchat', tuluyen:'tuluyen', nghephu:'nghe', nhangioi:'diavuc'};
  if(!state.ng) state.ng = ngFresh();
  migrateState();
  canonMigrate();
  lastSaveAt = d.t || null;
  computeStats();
  checkBreakthroughAvailable();
  render();
}

/* Hộp xác nhận tự dựng — không dùng confirm() vì trang có thể bị chặn hộp thoại */
const CONFIRM_ACTIONS = {
  leaveSect:{title:'Rời tông môn?', body:'Từ Nội Môn Đệ Tử trở lên, rời đi sẽ bị coi là phản môn và bị truy sát vĩnh viễn. Cống hiến tích lũy mất sạch.', ok:'Rời tông môn', run:()=>{ closeModal(); leaveSect(); }},
  restart:{title:'Chơi lại từ đầu?', body:'Toàn bộ tiến trình hiện tại sẽ bị thay thế khi ngươi bắt đầu nhân vật mới. Thao tác này không hoàn tác được.', ok:'Chơi lại', run:()=>{ deleteSave(); restartGame(); }},
  wipe:{title:'Xóa bản lưu?', body:'Bản lưu trong trình duyệt này sẽ bị xóa. Ván đang chơi vẫn còn cho tới khi tải lại trang, và sẽ được lưu lại nếu Tự động lưu đang bật.', ok:'Xóa bản lưu', run:()=>{ deleteSave(); showSettings('caidat'); }}
};
function askConfirm(key){
  const a = CONFIRM_ACTIONS[key];
  if(!a) return;
  if(!settings.confirmDanger){ a.run(); return; }
  pendingConfirm = key;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('modalBody').innerHTML = `
    <h2 class="serif modal-head">${ic('warn')}<span>${a.title}</span></h2>
    <p>${a.body}</p>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn ghost" onclick="closeModal()">Hủy</button>
      <button class="btn blood" onclick="runConfirm()">${a.ok}</button>
    </div>`;
}
function runConfirm(){ const k = pendingConfirm; pendingConfirm = null; if(k) CONFIRM_ACTIONS[k].run(); }

const CHANGELOG = [
  {v:'1.14.0', date:'25/09/2026', title:'Tài khoản & lưu trên đám mây', items:[
    'Đăng nhập bằng email và mật khẩu qua Supabase (miễn phí). Hướng dẫn thiết lập từng bước nằm ở Hệ Thống ▸ Tài Khoản, kèm nút sao chép SQL.',
    'Bản lưu tự đồng bộ lên đám mây mỗi 20 giây khi có thay đổi và mỗi khi rời game. Mở game ở máy khác, đăng nhập là chơi tiếp.',
    'Khi hai bên đều có tiến trình, game cho xem tên, cảnh giới, tuổi, thời điểm lưu của từng bản để chọn giữ bản nào.',
    'Màn hình mở đầu hiện trạng thái tài khoản; lúc mở game, nếu bản trên đám mây mới hơn thì tự tải về.'
  ]},
  {v:'1.13.0', date:'24/09/2026', title:'Giao diện sắp xếp lại theo logic', items:[
    'Tu Luyện thành trang chính (đầu thanh điều hướng), gom mọi thứ về cảnh giới: Bế Quan, Công Pháp, Bí Truyền, Pháp Tắc, Phi Thăng, Thời Gian. Đầu trang Bế Quan có thẻ Cần Chú Ý gom các việc đang chờ (đột phá, thọ nguyên, bí cảnh/đấu giá mở cửa, cơ duyên từ quý nhân...).',
    'Nhân Vật chỉ còn những gì về bản thân: Tổng Quan, Tư Chất, Nhân Mạch, Linh Sủng.',
    'Hành Tẩu tự đổi theo giới đang đứng: Bản Đồ và Thế Lực của Nhân Giới, Linh Giới hoặc Tiên Giới — không còn 8 thẻ con lẫn lộn. Đầu trang có ô vị trí hiện tại, chạm để mở bản đồ.',
    'Công pháp theo tài liệu: Liễm Tức Thuật và Ngũ Hành cơ sở pháp thuật (Hỏa Đạn, Thủy Tráo, Ngự Phong, Độn Thổ, Dẫn Lực); tông môn có Hoàng Phong Quyết, Song Tu Âm Dương Quyết, Băng Tâm Tuyệt Tình Quyết, Đại Thiên Cự Kiếm Thuật (Cự Kiếm Môn mới), Tinh Thần Hộ Thể Quyết, Đại Diễn Quyết bản gốc, Huyền Cốt Ma Công, Huyết Ảnh Độn Pháp; Minh Vương Quyết ở Tu Di Kim Sơn. Bỏ các công pháp tự đặt.',
    'Bản đồ Linh Giới: Thiên Nguyên Cảnh, Tam Hoàng Cảnh, Phi Linh Tinh Vực, Lôi Minh · Huyết Thiên Đại Lục, Minh Hà Chi Địa, Man Hoang Thế Giới. Tiên Giới: Hắc Phong Hải Vực · Ô Mông Đảo, Minh Hàn Tiên Phủ, Trung Thổ Tiên Vực, Tu Di Kim Sơn, Man Hoang Giới Vực.'
  ]},
  {v:'1.12.0', date:'24/09/2026', title:'Lọc nội dung, phi thăng, danh hiệu, debug', items:[
    'Nhân vật đổi sang người trong nguyên tác: Lý Hóa Nguyên, Nam Cung Uyển, Tề Vân Tiêu, Tân Như Âm (mất sớm vì Long Ngâm Chi Thể), Băng Phượng; cừu địch Vương Thiền (Quỷ Linh Môn), Cực Âm Tổ Sư. Bỏ các nhân vật tự đặt.',
    'Bỏ hệ thống bảo vật tự đặt (bản lưu cũ đổi thành linh thạch), bỏ kình địch Bạch Vân Phong, bỏ Diên Thọ Đan.',
    'Đổi tên bí cảnh theo nguyên tác: Hư Thiên Điện, Địa Uyên, Ma Giới · Tẩy Linh Trì, Lôi Minh Đại Lục, Hôi Giới, Tích Không Giới, Hắc Phong Hải, Man Hoang Tiên Vực.',
    'Tên tự đặt đổi thành cách gọi mô tả: linh thảo theo năm tuổi (mười năm … vạn năm), Liệu Thương Đan hạ/trung/thượng phẩm, khoáng thạch và linh mộc theo phẩm; đan tu vi dùng tên trong truyện.',
    'Mục Tu Luyện ▸ Phi Thăng: điều kiện, quá trình và những gì chờ đợi khi lên Linh Giới, Tiên Giới và chứng đạo.',
    'Danh hiệu: danh xưng theo cảnh giới + 16 danh hiệu thành tựu (Lão Ma, Thanh Trúc Kiếm Chủ, Trảm Ma Tôn, Thiên Đình Tội Đồ, Đạo Tổ...) chọn để hiện cạnh tên.',
    'Debug panel làm lại: chia 4 thẻ, lưới nút, nhảy cảnh giới theo màu từng giới, tua thời gian, bảng trạng thái.'
  ]},
  {v:'1.11.0', date:'24/09/2026', title:'Thời gian, thọ nguyên, hiệu ứng', items:[
    'Thiên Sát Trấn Ngục Công nâng lên 1080 huyền khiếu (9 tầng × 120) cho khớp Huyền Khiếu Thể; bản lưu cũ tự quy đổi.',
    'Mục Tu Luyện ▸ Thời Gian: tuổi, thọ nguyên còn lại, bế quan 1/10/50 năm, dòng thời gian các sự kiện sắp tới (bí cảnh mở cửa, đấu giá, Ma Kiếp, hạn Luyện Thần Thuật, Long Ngâm, tọa hóa).',
    'Thọ nguyên có hiệu lực: Luyện Khí 120, Trúc Cơ 200, Kết Đan 500, Nguyên Anh 1000, Hóa Thần 2000, Luyện Hư 5000, Hợp Thể 10000, Đại Thừa 30000 năm, tiên nhân bất lão. Hết thọ nguyên là tọa hóa; từ Nguyên Anh có thể xuất khiếu đoạt xá. Diên Thọ Đan kéo dài 10%, tối đa 3 viên mỗi cảnh giới.',
    'Thời gian đột phá theo cảnh giới: Luyện Khí 1 năm, Trúc Cơ 5, Kết Đan 15, Nguyên Anh 40... Đầu trang hiện tuổi / thọ nguyên, đỏ lên khi sắp cạn.',
    'Hiệu ứng: số sát thương bay lên, rung màn hình khi bạo kích và trọng thương, chớp sáng và biểu ngữ khi đột phá, sét giáng khi độ kiếp, biểu ngữ khi lên tay nghề hay thành tựu thể chất. Tắt được trong Cài Đặt ▸ Hiệu ứng chuyển động.'
  ]},
  {v:'1.10.0', date:'24/09/2026', title:'Thể chất chuẩn nguyên tác', items:[
    'Tiên Thiên: Long Ngâm Chi Thể (thiên tài trận pháp, khó sống qua 30 tuổi nếu thiếu Long Ngâm Quả), Huyền Âm Chi Thể (tu Âm/Băng/Quỷ đạo cực nhanh, thần hồn kiên cố, bị ma tu săn làm lô đỉnh), Huyền Linh Thể, Tiên Linh Chi Thể (chỉ thức tỉnh ở Tiên Giới), Thuần Dương Chi Thể (khắc chế yêu tà).',
    'Dị Linh Thể tự hình thành khi mang Biến Dị Linh Căn: Lôi Linh Thể (kháng lôi kiếp), Phong Linh Thể (độn thuật, né đòn), Băng Linh Thể (đóng băng linh lực đối phương).',
    'Hậu Thiên — tự đạt được khi đủ điều kiện: Phạn Thánh Chân Ma Thể, Huyền Khiếu Thể, Chân Long Chi Thể, Ngũ Hành Chân Thân; Cương Thi Chi Thể / Đồng Đầu Thiết Tí luyện được cho Ma Tu, Yêu/Quỷ Tu, Thể Tu.',
    'Thể Chất Đồ Giám ở Nhân Vật ▸ Tư Chất, kèm cả thể chất chủng tộc (Chân Long, Chân Phượng, Mộc Tộc, Ảnh Tộc).',
    'Bỏ các thể chất không có trong nguyên tác; bản lưu cũ được đổi sang thể chất tương ứng gần nhất.'
  ]},
  {v:'1.9.3', date:'24/09/2026', title:'Long Ngâm Chi Thể theo nguyên tác', items:[
    'Long Ngâm Chi Thể (Tân Như Âm, Điền Cầm Nhi): trời sinh thiên phú trận pháp — bố trận +15%, tay nghề Trận Pháp Sư tăng nhanh gấp rưỡi — không còn bị giới hạn đạo lộ.',
    'Người mang thể chất này thường chết trẻ: quá 50 tuổi chưa Kết Đan thì dương khí phản phệ (khí huyết −30%, tu luyện −30%); ngưng kết Kim Đan mới áp chế được.'
  ]},
  {v:'1.9.2', date:'24/09/2026', title:'Tạo nhân vật làm lại', items:[
    'Màn tạo nhân vật toàn màn hình, 5 bước: Đạo Hiệu → Xuất Thân → Trắc Linh Căn → Đạo Lộ → Mệnh Bài.',
    'Nút gieo tên ngẫu nhiên. Ba xuất thân với hành trang khác nhau: Sơn Thôn Nông Gia, Tu Tiên Gia Tộc Sa Sút, Tiểu Tán Tu Giang Hồ.',
    'Trắc Linh Thạch đổi màu theo thuộc tính linh căn, hiện phẩm cấp bằng sao; mỗi kiếp được thử tối đa 3 lần.',
    'Đạo lộ hiển thị bằng thanh chỉ số trực quan. Bước cuối là mệnh bài tổng kết trước khi bước vào tu tiên giới.'
  ]},
  {v:'1.9.1', date:'24/09/2026', title:'Tên mới: Phàm Nhân Vấn Đạo', items:[
    'Đổi tên game thành Phàm Nhân Vấn Đạo — một phàm nhân hỏi đạo qua ba cõi Nhân Giới, Linh Giới, Tiên Giới.',
    'Màn hình mở đầu mới: Chưởng Thiên Bình hứng ánh trăng, lục dịch dâng dần theo tiến độ tải. Tải xong hiện lựa chọn Tiếp Tục Đạo Đồ (kèm tên, cảnh giới, tuổi của bản lưu) hoặc Bắt Đầu Kiếp Tu Mới.'
  ]},
  {v:'1.9.0', date:'24/09/2026', title:'Hội đấu giá & thương minh nguyên tác', items:[
    'Nhân Giới: Bí Điếm (chợ đen Việt Quốc, Khê Châu — bắt buộc che mặt, hàng lai lịch bất minh, có Đại Diễn Quyết tàn bản và Trường Xuân Công tàn phiến), Thiên Tinh Thành Đấu Giá Hội (Tứ Đại Thương Minh, hạt giống linh thảo, tàn phương, vật liệu trận pháp), Tấn Kinh Địa Hạ Đấu Giá Hội (Canh Tinh, Khôi Lỗi Thạch).',
    'Linh Giới: Hách Liên Thương Minh (giao dịch bằng Cực Phẩm Linh Thạch, Mảnh vỡ Huyền Thiên; ký gửi linh dược vạn năm, bán đủ 10 cây thành khách khanh trưởng lão), Hắc Vực Đại Hội (không gian độc lập, thân phận che tuyệt đối, không bị bám đuôi), Vân Thành Đấu Giá Hội (dị bảo lôi chống thiên kiếp), Quảng Nguyên Trai (bán tình báo).',
    'Tiên Giới: Vô Thường Minh (mặt nạ con vật, đấu giá ảo ở bất cứ đâu, nhận nhiệm vụ), Hắc Phong Đảo (tinh luyện 72 phi kiếm), Bách Tạo Các (Tiên Khí Hạ tới Cực phẩm, đỉnh lô tiên giai), Cửu Nguyên Thành · Bồ Đề Yến (trăm năm một lần, Đạo Đan, dị bảo pháp tắc), Thập Phương Lâu (ám sát, tang vật Thiên Đình).',
    'Tình báo: truy tung cừu địch, manh mối truyền thừa, hành tung Ma Tôn, lộ tuyến tuần tra Thiên Đình.'
  ]},
  {v:'1.8.0', date:'24/09/2026', title:'Đấu Giá Hội làm lại', items:[
    'Mục mới Túi Đồ ▸ Đấu Giá với 5 hội: Thái Nam Hội (cấp thấp), Thiên Tinh Thành Đấu Giá Hội (cấp cao), Hội Hoán Đổi Ngầm (chỉ đổi hàng), Thiên Uyên Thành Đấu Giá Hội (Linh Giới), Vạn Bảo Tiên Phủ (Tiên Giới). Mỗi hội có chu kỳ khai hội riêng.',
    'Điều kiện vào cửa: cảnh giới tối thiểu (hoặc theo hầu một vị tiền bối thân thiết), phí báo danh, chứng minh tài lực, và tư cách — thiệp mời đích danh, lệnh bài mua bằng tiền (có hạn, ai nhanh tay được), hoặc người bảo lãnh.',
    'Cảnh giới cao được phòng riêng có cấm chế: ít bị nhòm ngó.',
    'Trả giá với đối thủ có ngân sách riêng; bảo vật áp trục bị tranh giành dữ dội. Dĩ vật dịch vật: người bán chỉ nhận vật phẩm — linh thảo vạn năm từ bình nhỏ gần như luôn thắng, nhưng khiến kẻ khác để ý.',
    'Áo choàng cản thần thức và mặt nạ dịch dung. Ra khỏi cửa có thể bị bám đuôi: dịch dung lẩn trốn, dùng phù ẩn thân / độn không / Thái Nhất Hóa Thanh, dụ vào trận pháp, hoặc nghênh chiến.'
  ]},
  {v:'1.7.0', date:'24/09/2026', title:'Chuẩn nguyên tác', items:[
    'Chưởng Thiên Bình: hấp thụ ánh trăng mỗi tháng ngưng Tạo Hóa Lộ; dùng lục dịch thúc linh dược (thay linh lực). Lên Tiên Giới lục dịch nhanh gấp đôi, hỗ trợ Thời Gian Pháp Tắc. Thêm Nghê Thường Thảo dụ yêu thú săn yêu đan, Ngũ Sắc Tức Nhưỡng.',
    'Đan dược: Hoàng Long Đan, Đằng Long Đan; đan đột phá đúng từng đại cảnh giới — Trúc Cơ Đan (Ngọc Tủy Chi + Tử Hầu Hoa + Thiên Linh Quả từ Huyết Sắc Cấm Địa), Giáng Trần Đan, Tạo Hóa Đan, Bồi Anh Đan, Thái Ất Đan; Diệt Trần Đan tẩy phi thăng chi khí khi lên Linh Giới; Đạo Đan chứa pháp tắc.',
    'Phù lục: Hỏa Đạn, Ngự Phong, Ẩn Thân, Hàng Linh, Huyết Độn, Độn Không, Giáp Nguyên phù; tiên phù Cửu Thiên Lôi Công và Thái Nhất Hóa Thanh cần Lục Giáp Thiên Thư. Phù bảo Kim Quang Chuyên.',
    'Khôi lỗi: Sói, Trăn, Hổ, Cung Thủ (đủ 3 lập trận bắn tỉa), Cự Viên; Giải Đạo Nhân ở Tiên Giới chạy bằng tiên nguyên thạch.',
    'Trận pháp: Điên Đảo Ngũ Hành Trận (có ảo ảnh né đòn), Bát Môn Kim Quang Trận (nhốt địch), Tụ Linh Trận, Xuân Thu Luân Hồi Trận (trăm năm bên trong, một tháng bên ngoài).',
    'Linh thú: Phệ Kim Trùng (tiến hóa Phệ Kim Tiên ở Tiên Giới), Đề Hồn Thú, Lục Dực Sương Ngô. Pháp bảo: Phong Lôi Xí, Huyền Thiên Trảm Tinh Kiếm; Hư Thiên Đỉnh nhốt địch và cướp linh tính pháp bảo.',
    'Công pháp: Trường Xuân Công, Thanh Nguyên Kiếm Quyết có hộ thể kiếm thuẫn, Đại Diễn Quyết của Thiên Trúc giáo chống ảo thuật, Minh Vương Quyết · Phạm Thánh Chân Ma Công ba đầu sáu tay, Kinh Chập Thập Nhị Quyết biến thân thật sự (có Sơn Cự Viên), Phá Miệt Pháp Mục mới, Luyện Thần Thuật phản phệ leo thang, năm bộ công pháp Thời Gian đúng tên, Ích Tà Thần Lôi.'
  ]},
  {v:'1.6.0', date:'24/09/2026', title:'Tiên Giới — Chứng Đạo Đạo Tổ', items:[
    'Phi thăng Tiên Giới bị mất trí nhớ, tỉnh dậy ở Bắc Hàn Tiên Vực: công pháp hạ giới chỉ còn một nửa uy lực cho tới khi tìm lại 3 mảnh ký ức.',
    'Tiền tệ mới: tiên nguyên thạch. Sáu địa vực: Bắc Hàn Tiên Vực, Cửu Nguyên Quan, Bách Tạo Sơn, Chân Ngôn Môn Phế Tích, Thiên Đình Trung Khu, và Luân Hồi Điện Ẩn Cứ (chỉ người của điện mới vào được).',
    'Bốn Pháp Tắc Hỏa, Không Gian, Thời Gian, Luân Hồi — mỗi cái một hiệu ứng chiến đấu, trần lĩnh ngộ tăng theo cảnh giới, chọn một làm đại đạo chủ tu.',
    'Độ truy nã của Thiên Đình: tu Thời Gian Pháp Tắc, lui tới Chân Ngôn Môn, giết tuần tra đều bị ghi sổ. Làm tiên quan Thiên Đình thì miễn truy nã — trừ khi bị phát hiện lén tu Thời Gian.',
    'Tông môn Chúc Long Đạo, Cửu Nguyên Quan, Bách Tạo Sơn; phe Thiên Đình hoặc Luân Hồi Điện (tự tìm tới khi ngươi bị Thiên Đình để mắt). Mật lệnh đoạt Đạo Thần Châu.',
    'Đại Ngũ Hành Huyễn Thế Quyết (gom 5 bộ công pháp Thời Gian rồi dung hợp), Thiên Sát Trấn Ngục Công (đả thông huyền khiếu bằng Tinh Thần chi lực), Luyện Thần Thuật hoàn chỉnh tới tầng 6 (thần hồn bất diệt).',
    'Muốn thành Đại La phải Trảm Tam Thi. Muốn thành Đạo Tổ phải viên mãn chủ tu pháp tắc và đánh bại Đạo Tổ đang chiếm giữ đại đạo đó — với Thời Gian là Cổ Hoặc Kim.'
  ]},
  {v:'1.5.0', date:'24/09/2026', title:'Linh Giới — Bách Tộc Tranh Bá', items:[
    'Phi thăng tới Tiếp Dẫn Điện của Thiên Uyên Thành. Hành Tẩu có thêm Linh Giới và Bách Tộc; Nhân Giới, Tông Môn tự ẩn khi đã rời hạ giới.',
    'Năm địa vực: Thiên Uyên Thành, Phi Linh Tộc, Thiên Vân Thập Tam Tộc, Giác Xi Tộc, Ma Kiếp Tiền Tuyến. Danh vọng với từng tộc quyết định bị tấn công hay được giao dịch chân huyết.',
    'Thiên Uyên Thành: trấn thủ tường thành lấy quân công, 4 cấp chức vị, Quân Nhu Khố.',
    'Chân Linh thế gia Long Gia, Cốc Gia, Diệp Gia: làm khách khanh, 3 cấp, mỗi nhà giữ một loại chân huyết riêng.',
    'Ma Kiếp: 15 năm sau khi phi thăng, Ma tộc xâm lược kéo dài 150 năm. Chém hóa thân ba Ma Tôn Thủy Tổ Bảo Hoa (tự hồi máu), Lục Cực (cực hàn tích tụ), Nguyên Yểm (mộng yểm mất lượt) để chấm dứt sớm.',
    'Bốn truyền thừa: Phạm Thánh Chân Ma Công (5 tầng, cần Ma Tinh + Xá Lợi, tầng 5 Niết Bàn Kim Thân), Kinh Chập Thập Nhị Quyết (luyện hóa chân huyết 12 Chân Linh), Bách Mạch Luyện Bảo Quyết (luyện pháp bảo vào tới 20 huyệt đạo), Luyện Thần Thuật (3 tầng, bỏ dở quá 150 năm sẽ bị cắn trả).',
    'Thêm Hạo Thiên Yêu Vương (quý nhân) và Giác Xi Thánh Tử (cừu địch).'
  ]},

function segButtons(key, opts){
  return `<div class="seg">${opts.map(([val,label])=>`<button class="${settings[key]===val?'on':''}" onclick="setSetting('${key}', ${JSON.stringify(val).replace(/"/g,'&quot;')})">${label}</button>`).join('')}</div>`;
}
function toggleRow(key, title, desc){
  return `<div class="set-row">
    <div class="set-text"><div class="set-title">${title}</div><div class="set-desc">${desc}</div></div>
    <button class="switch ${settings[key]?'on':''}" role="switch" aria-checked="${settings[key]}" onclick="setSetting('${key}', ${!settings[key]})"><span></span></button>
  </div>`;
}

function showSettings(tab){
  settingsTab = tab || settingsTab;
  const overlay = document.getElementById('overlay');
  const body = document.getElementById('modalBody');
  const nav = `<div class="subtab-row" style="margin:0 0 14px;">
    <button class="subtab-btn ${settingsTab==='caidat'?'active':''}" onclick="showSettings('caidat')">${ic('gear')} Cài Đặt</button>
    <button class="subtab-btn ${settingsTab==='taikhoan'?'active':''}" onclick="showSettings('taikhoan')">${ic('cloud')} Tài Khoản</button>
    <button class="subtab-btn ${settingsTab==='capnhat'?'active':''}" onclick="showSettings('capnhat')">${ic('bell')} Nhật Ký Cập Nhật</button>
  </div>`;
  let content = '';
  if(settingsTab==='caidat'){
    const hasGame = state && state.root && state.path;
    const saveInfo = lastSaveAt ? `Lần lưu gần nhất lúc ${new Date(lastSaveAt).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}.` : 'Chưa có bản lưu nào.';
    content = `
      <div class="set-group">Hiển thị</div>
      <div class="set-row col">
        <div class="set-text"><div class="set-title">Cỡ chữ</div><div class="set-desc">Phóng to hay thu nhỏ toàn bộ giao diện.</div></div>
        ${segButtons('textScale', [['sm','Nhỏ'],['md','Vừa'],['lg','Lớn'],['xl','Rất lớn']])}
      </div>
      ${toggleRow('showIcons','Hiện biểu tượng','Tắt đi để giao diện chỉ còn chữ.')}
      ${toggleRow('motion','Hiệu ứng chuyển động','Thanh máu trượt, nút nhún khi bấm. Tắt nếu máy chậm hoặc dễ chóng mặt.')}
      <div class="set-group">Lối chơi</div>
      <div class="set-row col">
        <div class="set-text"><div class="set-title">Độ dài nhật ký</div><div class="set-desc">Số sự kiện gần nhất được giữ lại trong mục Nhật Ký.</div></div>
        ${segButtons('logLen', [[50,'50'],[90,'90'],[200,'200']])}
      </div>
      ${toggleRow('confirmDanger','Hỏi lại trước thao tác nguy hiểm','Rời tông môn, chơi lại từ đầu, xóa bản lưu.')}
      <div class="set-group">Lưu trữ</div>
      ${toggleRow('autosave','Tự động lưu','Lưu vào trình duyệt này sau mỗi hành động. Mở lại trang sẽ tiếp tục hành trình.')}
      <p class="sec-note" style="margin:6px 0 10px;">${saveInfo}</p>
      <div class="btn-row">
        <button class="btn ghost" ${hasGame?'':'disabled'} onclick="saveGame(false); showSettings('caidat')">${ic('save')} Lưu ngay</button>
        <button class="btn ghost" onclick="askConfirm('wipe')">${ic('trash')} Xóa bản lưu</button>
      </div>
      <button class="btn blood" style="margin-top:8px;" ${hasGame?'':'disabled'} onclick="askConfirm('restart')">${ic('reset')} Chơi lại từ đầu</button>
      <p class="sec-note" style="margin:14px 0 0;text-align:center;">Phàm Nhân Vấn Đạo, phiên bản ${GAME_VERSION}</p>`;
  } else if(settingsTab==='taikhoan'){
    content = renderAccountTab();
  } else {
    content = `<ol class="changelog">${CHANGELOG.map((c,i)=>`
      <li class="${i===0?'latest':''}">
        <div class="cl-head"><span class="cl-ver">v${c.v}</span><span class="cl-date">${c.date}</span></div>
        <div class="cl-title">${c.title}</div>
        <ul>${c.items.map(x=>`<li>${x}</li>`).join('')}</ul>
      </li>`).join('')}</ol>`;
  }
  body.innerHTML = `
    <div class="modal-top"><h2 class="serif">Hệ Thống</h2>
      <button class="icon-btn" aria-label="Đóng" onclick="closeModal()">${ic('close')}</button></div>
    ${nav}${content}`;
  overlay.classList.add('show');
}

/* Ba mốc đại cảnh giới kích hoạt Cửu Cửu Lôi Kiếp thay vì đột phá thường:
   Hóa Thần Kỳ (Nhân Giới → Linh Giới), Đại Thừa Kỳ (Trung Cảnh Giới → Tiên Giới),
   Đại La Kỳ (Thượng Cảnh Giới → Đạo Tổ, kết thúc thật sự). */
const TRIBULATION_REALMS = [4,7,11];

function subStageLabel(realmIdx, subStage){
  const r = MAJOR_REALMS[realmIdx];
  if(realmIdx===0) return `Tầng ${subStage+1}`;
  if(r.substageCount<=1) return '';
  return SUBSTAGE_NAMES[subStage] || '';
}
function fullRealmName(realmIdx, subStage){
  const r = MAJOR_REALMS[realmIdx];
  const sub = subStageLabel(realmIdx, subStage);
  return sub ? `${r.name} — ${sub}` : r.name;
}
/* Chỉ số/tu vi cần thiết thực tế tại một tiểu cảnh giới cụ thể — tăng dần
   qua từng tiểu cảnh giới trong cùng một đại cảnh giới. */
function realmStatsAt(realmIdx, subStage){
  const r = MAJOR_REALMS[realmIdx];
  const growth = Math.pow(1.14, subStage);
  const tuViGrowth = Math.pow(1.35, subStage);
  return {
    tuViMax: r.tuViMax===Infinity ? Infinity : Math.round(r.tuViMax*tuViGrowth),
    hp: Math.round(r.hp*growth),
    atk: Math.round(r.atk*growth),
    def: Math.round(r.def*growth),
    spd: Math.round(r.spd*growth)
  };
}

function isAdvancedTechAccessible(t){
  if(state.techniques.some(x=>x.name===t.name)) return false;
  if(state.manuals.includes(t.id)) return false;
  if(t.reqType==='any'){
    return true;
  }
  if(t.reqType==='realm_only'){
    return state.realmIdx >= t.minRealm-1;
  }
  if(t.reqType==='element'){
    return !!(state.root && state.root.elements && state.root.elements.includes(t.element));
  }
  if(t.reqType==='element_or_physique'){
    const elMatch = state.root && state.root.elements && state.root.elements.includes(t.element);
    const phyMatch = state.physique && state.physiqueKnown && state.physique.id===t.physiqueId;
    return !!(elMatch || phyMatch);
  }
  if(t.reqType==='path'){
    return !!(state.path && state.path.id===t.pathId);
  }
  return false;
}

function learnAdvancedTechnique(id){
  const t = ADVANCED_TECHNIQUES.find(x=>x.id===id);
  if(!t || !state.manuals.includes(id)) return;
  if(state.realmIdx<t.minRealm){ addLog(`Cảnh giới chưa đủ, cần đạt ${MAJOR_REALMS[t.minRealm].name} trở lên mới đủ sức tu luyện 【${t.name}】.`); render(); return; }
  const herbHave = state.herbs[t.cost.herbTier]||0;
  if(state.spiritStones<t.cost.stones || herbHave<t.cost.herbCount){
    addLog(`Cần ${t.cost.stones} linh thạch và ${t.cost.herbCount} ${HERB_NAMES[t.cost.herbTier-1]} làm tài nguyên phụ trợ mới đủ luyện 【${t.name}】.`);
    render(); return;
  }
  state.spiritStones -= t.cost.stones;
  state.herbs[t.cost.herbTier] -= t.cost.herbCount;
  let success = true, chance = 100;
  if(t.madnessRisk){
    chance = Math.min(95, Math.max(15, 50+(state.realmIdx-t.minRealm)*15+daiDienMadnessBonus()));
    success = Math.random()*100<chance;
  }
  state.manuals = state.manuals.filter(m=>m!==id);
  if(success){
    state.techniques.push({name:t.name, desc:t.desc, bonus:t.bonus});
    state.learnedNames.push(t.name);
    addLog(`Sau bao gian khổ, ngươi luyện thành 【${t.name}】— ${t.desc}`);
  } else {
    const dmg = Math.round(state.stats.hpMax*0.35);
    state.hp = Math.max(1, state.hp-dmg);
    addLog(`Tâm cảnh không đủ vững, cưỡng luyện 【${t.name}】khiến tẩu hỏa nhập ma! Chịu ${dmg} sát thương, bí kíp cũng theo đó thất truyền.`);
  }
  computeStats();
  render();
}

function pickDistinctElements(pool, n){
  const p = [...pool], res = [];
  for(let i=0;i<n && p.length;i++){
    const idx = Math.floor(Math.random()*p.length);
    res.push(p.splice(idx,1)[0]);
  }
  return res;
}

function rollSpiritRoot(){
  const total = ROOT_TEMPLATES.reduce((s,r)=>s+r.weight,0);
  let roll = Math.random()*total;
  let tpl = ROOT_TEMPLATES[0];
  for(const r of ROOT_TEMPLATES){
    if(roll<r.weight){ tpl = r; break; }
    roll -= r.weight;
  }
  let elements=[], elementLabel='';
  if(tpl.id==='thien'){
    elements = pickDistinctElements(NGU_HANH,1);
    elementLabel = elements[0];
  } else if(tpl.id==='bienli'){
    elements = pickDistinctElements(DI_THUOC,1);
    elementLabel = elements[0];
  } else if(tpl.id==='chan'){
    const n = Math.random()<0.5?2:3;
    elements = pickDistinctElements(NGU_HANH,n);
    elementLabel = elements.join(' + ');
  } else if(tpl.id==='nguy'){
    const n = Math.random()<0.5?4:5;
    elements = pickDistinctElements(NGU_HANH,n);
    elementLabel = elements.join(' + ');
  } else if(tpl.id==='nguhanh'){
    elements = [...NGU_HANH];
    elementLabel = elements.join(' + ');
  }
  return {
    id: tpl.id,
    name: tpl.catName,
    desc: tpl.desc,
    elements, elementLabel,
    isDynamic: !!tpl.isDynamic,
    tuViMult: tpl.tuViMult, critBonus: tpl.critBonus, pillMult: tpl.pillMult, breakEase: tpl.breakEase,
    early: tpl.early, late: tpl.late
  };
}

/* Trả về chỉ số hiệu lực thực tế của linh căn tại cảnh giới hiện tại.
   Với Ngũ Hành Cụ Toàn, chỉ số đảo chiều khi realmIdx đạt NGUHANH_LATE_REALM. */
function rootMods(root, realmIdx){
  if(!root){
    return {tuViMult:1, critBonus:0, pillMult:1, breakEase:0, lateActive:false};
  }
  if(root.isDynamic){
    const late = realmIdx >= NGUHANH_LATE_REALM;
    const src = late ? root.late : root.early;
    return {...src, lateActive:late};
  }
  return {tuViMult:root.tuViMult, critBonus:root.critBonus, pillMult:root.pillMult, breakEase:root.breakEase, lateActive:false};
}

function scaleBloodline(b, mult, suffix){
  const scaled = {name: b.name+(suffix||''), desc: b.desc};
  ['atkMult','defMult','spdMult','hpMult','pillMult','tuViMult'].forEach(k=>{
    if(b[k]!==undefined) scaled[k] = 1+(b[k]-1)*mult;
  });
  if(b.critBonus!==undefined) scaled.critBonus = Math.round(b.critBonus*mult);
  return scaled;
}
