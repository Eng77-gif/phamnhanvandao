const NG_MAT_NAMES = {kimLoiTruc:'Kim Lôi Trúc', canhTinh:'Canh Tinh'};
const THANH_NGUYEN_MAX_LAYER = 9;
const SWORDS_MAX = 72;
const SWORDS_PER_BAMBOO = 6;
const DAI_DIEN_MAX_LAYER = 4;

function ngFresh(){
  return {
    region:'thiennam',
    sect:null,            // {id, rank, merit, contrib, bought:[]}
    betrayed:[],          // tông môn đã phản bội → truy sát
    kimLoiTruc:0, canhTinh:0,
    thanhNguyen:{have:false, layer:0},
    swords:0, kiemTran:false,
    daiDien:{have:false, layer:0},
    huThien:{maps:0, have:false, bangDiem:false, hanThe:false}
  };
}
function ng(){ if(!state.ng) state.ng = ngFresh(); return state.ng; }
function ngActive(){ return state.realmIdx<=NG_LAST_REALM && !state.ascended; }
function ngRegion(){ return NG_REGIONS.find(r=>r.id===ng().region) || NG_REGIONS[0]; }
function ngSectDef(id){ return SECTS.find(s=>s.id===id); }
function ngCurSect(){ const s = ng().sect; return s ? ngSectDef(s.id) : null; }

function ngFmtBonus(b){
  const parts = [];
  if(b.atk) parts.push(`Công +${b.atk}`);
  if(b.def) parts.push(`Phòng +${b.def}`);
  if(b.spd) parts.push(`Tốc +${b.spd}`);
  if(b.hp) parts.push(`Khí huyết +${b.hp}`);
  if(b.crit) parts.push(`Bạo kích +${b.crit}%`);
  if(b.tuViRate) parts.push(`Tu vi +${Math.round(b.tuViRate*100)}%`);
  return parts.join(', ');
}

/* Bổng lộc thụ động của tông môn — tăng theo cấp bậc trong môn */
function sectBonus(){
  const s = ng().sect;
  if(!s) return {};
  const def = ngSectDef(s.id);
  let mult = 1+s.rank*0.6;
  if(def.affinityPath && state.path && state.path.id===def.affinityPath) mult *= 1.3;
  const out = {};
  Object.keys(def.bonus).forEach(k=>{
    out[k] = k==='tuViRate' ? Math.round(def.bonus[k]*mult*100)/100 : Math.round(def.bonus[k]*mult);
  });
  return out;
}

/* Tổng hợp chỉ số cộng thêm từ tông môn + bí truyền, dùng trong computeStats */
function ngStatBonus(){
  const g = ng();
  const b = {atk:0,def:0,spd:0,hp:0,crit:0};
  const sb = sectBonus();
  ['atk','def','spd','hp','crit'].forEach(k=>{ b[k] += sb[k]||0; });
  if(g.thanhNguyen.have){
    const L = g.thanhNguyen.layer;
    const kiemMult = (state.path && state.path.id==='kiem') ? 1.3 : 1;
    b.atk += Math.round((L*3 + g.swords*0.35*(1+L*0.15)*(1+0.2*(g.swordRefine||0)))*kiemMult);
    b.crit += Math.floor(L/2);
    b.def += L*5;
    if(g.kiemTran){ b.atk += 20; b.crit += 5; }
  }
  if(g.daiDien.have){
    b.crit += g.daiDien.layer*2;
    b.spd += g.daiDien.layer*2;
  }
  if(g.huThien.have){ b.def += 15; b.hp += 120; }
  if(g.huThien.bangDiem){ b.crit += 3; }
  if(g.huThien.hanThe){ b.def += 25; b.hp += 200; b.spd += 5; }
  return b;
}
function ngTuViRate(){ return sectBonus().tuViRate||0; }
function daiDienPuppetCap(){ return ng().daiDien.have ? ng().daiDien.layer*6 : 0; }
function daiDienMult(){ return ng().daiDien.have ? 1+ng().daiDien.layer*0.3 : 1; }
function daiDienMadnessBonus(){ return ng().daiDien.have ? ng().daiDien.layer*8 : 0; }

/* ---------------- Di chuyển giữa các địa vực ---------------- */
function travelTo(id){
  if(!ngActive()) return;
  const to = NG_REGIONS.find(r=>r.id===id);
  const from = ngRegion();
  if(!to || to.id===from.id) return;
  if(state.realmIdx<to.minRealm){ addLog(`Tu vi còn nông cạn, cần đạt ${MAJOR_REALMS[to.minRealm].name} mới dám vượt đường xa tới ${to.name}.`); render(); return; }
  const cost = Math.max(to.travelCost, from.travelCost);
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để kích hoạt cổ truyền tống trận tới ${to.name}.`); render(); return; }
  state.spiritStones -= cost;
  ng().region = to.id;
  state.age += 1;
  const flavor = {
    thiennam:'Cổ truyền tống trận rung chuyển, cảnh vật trước mắt hóa thành những ngọn núi quen thuộc của Thiên Nam.',
    loantinh:'Ánh sáng truyền tống trận lóe lên rồi tắt, gió biển mặn chát ập vào mặt — ngươi đã đặt chân tới Loạn Tinh Hải.',
    daitan:'Xuyên qua trận truyền tống cổ xưa nối liền hai miền, linh khí nồng đậm của Đại Tấn khiến ngươi thoáng choáng váng.'
  };
  addLog(`${flavor[to.id]} (tốn ${cost} linh thạch)`);
  render();
}

/* ---------------- Thám hiểm địa vực ---------------- */
function genRegionEnemy(power, pool, bossMult, nameOverride){
  let name = nameOverride || pool[Math.floor(Math.random()*pool.length)];
  const isBoss = bossMult ? true : Math.random()<0.12;
  if(isBoss && !nameOverride && !bossMult) name += ' · Thủ Lĩnh';
  const mult = bossMult || (isBoss?2.2:1);
  const baseR = realmStatsAt(Math.min(power, MAJOR_REALMS.length-1), 1);
  const jitter = 0.8+Math.random()*0.4;
  return {
    name,
    hpMax: Math.round(baseR.hp*(0.55+power*0.05)*mult*jitter),
    atk:   Math.round(baseR.atk*0.6*mult*jitter),
    def:   Math.round(baseR.def*0.55*mult),
    spd:   Math.round(baseR.spd*0.7*mult),
    isBoss
  };
}

function ngHostileSectsHere(){
  const g = ng();
  const ids = new Set(g.betrayed);
  const cur = ngCurSect();
  if(cur && cur.enemyOf) ids.add(cur.enemyOf);
  return [...ids].map(ngSectDef).filter(s=>s && s.region===g.region);
}

function exploreRegion(locId){
  if(!ngActive()) return;
  const region = ngRegion();
  const loc = region.locations.find(l=>l.id===locId);
  if(!loc || state.realmIdx<loc.power) return;
  state.currentZone = Math.min(loc.power, ZONES.length-1);
  const hostile = ngHostileSectsHere();
  if(hostile.length && Math.random()<0.12){
    const hs = hostile[Math.floor(Math.random()*hostile.length)];
    const e = genRegionEnemy(Math.max(loc.power, state.realmIdx), null, 1.6, `${hs.name} Truy Sát Sứ`);
    e.hunterOf = hs.id;
    addLog(`Giữa ${loc.name}, một luồng sát khí khóa chặt lấy ngươi — người của ${hs.name} đã tìm tới!`);
    startCombat(e);
    return;
  }
  if(Math.random()<0.12 && npcEncounterAt({region:ng().region})){ render(); return; }
  const roll = Math.random()*100;
  if(roll<45){
    startCombat(genRegionEnemy(loc.power, loc.enemies));
    return;
  } else if(roll<60){
    const stones = Math.round(20+loc.power*18+Math.random()*25);
    const tv = Math.round(6+loc.power*6);
    state.spiritStones += stones; state.tuVi += tv;
    addLog(`Lần theo dấu vết linh khí ở ${loc.name}, ngươi đào được một mạch linh thạch nhỏ: +${stones} linh thạch, +${tv} tu vi.`);
  } else if(roll<85){
    if(!ngRegionEvent(region, loc)) rareEvent(state.currentZone);
  } else {
    rareEvent(state.currentZone);
  }
  checkPhysiqueDiscovery();
  checkBreakthroughAvailable();
  computeStats();
  render();
}

function ngRegionEvent(region, loc){
  const g = ng();
  const opts = [];
  if(!g.thanhNguyen.have && state.realmIdx>=1) opts.push('thanhNguyen','thanhNguyen');
  if(region.id==='thiennam'){
    opts.push('kimLoiTruc_rare','spring');
  } else if(region.id==='loantinh'){
    opts.push('kimLoiTruc','kimLoiTruc','yeuDan');
    if(!g.huThien.have && g.huThien.maps<3) opts.push('map','map');
    if(!g.daiDien.have && state.realmIdx>=2) opts.push('daiDien');
    if(Math.random()<0.3) opts.push('canhTinh');
  } else if(region.id==='daitan'){
    opts.push('canhTinh','canhTinh','kimLoiTruc','tangKinh');
  }
  if(!opts.length) return false;
  const pick = pickEventOpt(opts);
  if(pick==='thanhNguyen'){
    g.thanhNguyen.have = true; g.thanhNguyen.layer = 0;
    addLog(`Trong động phủ sụp lở của một cổ tu sĩ tại ${loc.name}, ngươi nhặt được Ngọc Giản ghi chép 【Thanh Nguyên Kiếm Quyết】 — kiếm quyết lấy Kim Lôi Trúc luyện thành bộ phi kiếm, đại thành có thể bày ra Đại Canh Kiếm Trận! Vào mục Bí Truyền để tu luyện.`);
  } else if(pick==='kimLoiTruc' || pick==='kimLoiTruc_rare'){
    if(pick==='kimLoiTruc_rare' && Math.random()<0.6){
      const tv = Math.round(8+loc.power*5);
      state.tuVi += tv;
      addLog(`Ngươi nghe tiếng sét nổ trong rừng trúc nhưng tìm mãi không thấy Kim Lôi Trúc, đành ngồi tĩnh tọa lĩnh hội lôi ý, tu vi +${tv}.`);
      return true;
    }
    const n = pick==='kimLoiTruc' ? 1+(Math.random()<0.4?1:0) : 1;
    g.kimLoiTruc += n;
    addLog(`Giữa bãi đá bị sét đánh cháy xém, ngươi phát hiện ${n} cây Kim Lôi Trúc — thân trúc ẩn chứa Ích Tà Thần Lôi, tài liệu thượng hạng để luyện Thanh Trúc Phong Vân Kiếm (đang có ${g.kimLoiTruc}).`);
  } else if(pick==='canhTinh'){
    g.canhTinh += 1;
    addLog(`Ngươi đào được một khối Canh Tinh sắc lạnh từ vỉa quặng sâu dưới ${loc.name} — kim loại cứng nhất Nhân Giới, là trận nhãn không thể thiếu của Đại Canh Kiếm Trận (đang có ${g.canhTinh}).`);
  } else if(pick==='map'){
    g.huThien.maps++;
    addLog(`Từ túi trữ vật của một tu sĩ vừa vẫn lạc trên biển, ngươi thu được một mảnh Hư Thiên Tàn Đồ (${g.huThien.maps}/3). ${g.huThien.maps>=3?'Ba mảnh hợp nhất, lộ ra đường vào Hư Thiên Điện!':'Nghe đồn đủ ba mảnh sẽ chỉ ra lối vào Hư Thiên Điện.'}`);
  } else if(pick==='daiDien'){
    g.daiDien.have = true; g.daiDien.layer = 0;
    addLog(`Lạc vào một động phủ bị hải thủy nhấn chìm, ngươi tìm thấy di hài một cao tăng Thiên Trúc giáo, trong tay còn nắm ngọc giản 【Đại Diễn Quyết】 — bí thuật rèn luyện thần thức của Thiên Trúc giáo! Vào mục Bí Truyền để tu luyện.`);
  } else if(pick==='yeuDan'){
    const stones = Math.round(60+loc.power*45+Math.random()*40);
    state.spiritStones += stones;
    addLog(`Ngươi mai phục giết được một con hải yêu đang lột xác, moi ra yêu đan đem bán ở phường thị trên đảo được ${stones} linh thạch.`);
  } else if(pick==='tangKinh'){
    const tv = Math.round(30+loc.power*20);
    state.tuVi += tv;
    addLog(`Ngươi tình cờ nghe một vị Hóa Thần lão tổ giảng đạo ngoài trời tại ${loc.name}, lĩnh ngộ được không ít, tu vi +${tv}.`);
  } else if(pick==='spring'){
    const heal = Math.round(state.stats.hpMax*0.4);
    state.hp = Math.min(state.stats.hpMax, state.hp+heal);
    const tv = Math.round(10+loc.power*6);
    state.tuVi += tv;
    addLog(`Ngươi tìm thấy một linh tuyền nhỏ khuất trong khe núi, ngâm mình hồi phục ${heal} khí huyết, tu vi +${tv}.`);
  }
  return true;
}

/* ---------------- Tông môn ---------------- */
function sectJoinBlock(def){
  const g = ng();
  if(g.betrayed.includes(def.id)) return 'Ngươi là kẻ phản môn, bị truy nã';
  if(state.realmIdx<def.minRealm) return `Cần ${MAJOR_REALMS[def.minRealm].name}`;
  if(def.forbidPath && state.path && state.path.id===def.forbidPath) return `Không nhận ${state.path.name}`;
  if(g.region!==def.region) return `Phải có mặt tại ${NG_REGIONS.find(r=>r.id===def.region).name}`;
  if(g.sect) return 'Đang thuộc tông môn khác';
  return '';
}

function joinSect(id){
  if(!ngActive()) return;
  const def = ngSectDef(id);
  const block = sectJoinBlock(def);
  if(block){ addLog(`Không thể bái nhập ${def.name}: ${block}.`); render(); return; }
  if(state.spiritStones<def.joinCost){ addLog(`Cần ${def.joinCost} linh thạch làm lễ nhập môn ${def.name}.`); render(); return; }
  state.spiritStones -= def.joinCost;
  ng().sect = {id, rank:0, merit:0, contrib:0, bought:[]};
  addLog(`Ngươi dâng lễ bái sơn, chính thức gia nhập ${def.name} với thân phận ${SECT_RANKS[0]}. Từ nay có chỗ dựa, nhưng cũng có kẻ thù chung.`);
  render();
}

function leaveSect(){
  const g = ng(); const s = g.sect; if(!s) return;
  const def = ngSectDef(s.id);
  if(s.rank>=1){
    g.betrayed.push(s.id);
    addLog(`Ngươi phản xuất ${def.name}! Là ${SECT_RANKS[s.rank]} nắm không ít bí mật, tông môn phát lệnh truy sát — từ nay đặt chân tới ${NG_REGIONS.find(r=>r.id===def.region).name} phải luôn đề phòng.`);
  } else {
    addLog(`Ngươi lặng lẽ rời khỏi ${def.name}. Một ngoại môn đệ tử ra đi, chẳng ai buồn để ý.`);
  }
  g.sect = null;
  computeStats();
  render();
}

function sectRankRealmReq(def, rank){
  return rank===3 ? Math.max(def.minRealm+1, 2) : def.minRealm;
}

function promoteSect(){
  const s = ng().sect; if(!s) return;
  const def = ngSectDef(s.id);
  if(s.rank>=SECT_RANKS.length-1) return;
  const need = SECT_RANK_MERIT[s.rank+1];
  const realmReq = sectRankRealmReq(def, s.rank+1);
  if(s.merit<need){ addLog(`Cần tích lũy ${need} công lao mới đủ tư cách khảo hạch lên ${SECT_RANKS[s.rank+1]}.`); render(); return; }
  if(state.realmIdx<realmReq){ addLog(`Muốn làm ${SECT_RANKS[s.rank+1]} của ${def.name}, ít nhất phải đạt ${MAJOR_REALMS[realmReq].name}.`); render(); return; }
  s.rank++;
  addLog(`Vượt qua khảo hạch trước mặt chư vị trưởng lão, ngươi được tấn thăng làm ${SECT_RANKS[s.rank]} của ${def.name}! Bổng lộc tông môn tăng lên.`);
  computeStats();
  render();
}

function sectMission(){
  if(!ngActive()) return;
  const s = ng().sect; if(!s) return;
  const def = ngSectDef(s.id);
  if(ng().region!==def.region){ addLog(`Nhiệm vụ của ${def.name} chỉ nhận được khi có mặt tại ${NG_REGIONS.find(r=>r.id===def.region).name}.`); render(); return; }
  const scale = 1+state.realmIdx*0.35;
  if(Math.random()<0.4){
    const foe = def.foes[Math.floor(Math.random()*def.foes.length)];
    const e = genRegionEnemy(Math.min(state.realmIdx, NG_LAST_REALM), null, 1.25, foe);
    e.sectMission = Math.round((30+Math.random()*20)*scale);
    state.currentZone = Math.min(state.realmIdx, ZONES.length-1);
    addLog(`${def.name} giao nhiệm vụ diệt trừ ${foe}. Ngươi lên đường nghênh chiến.`);
    startCombat(e);
    return;
  }
  const task = def.tasks[Math.floor(Math.random()*def.tasks.length)];
  if(Math.random()<0.78){
    const merit = Math.round((15+Math.random()*15)*scale);
    const stones = Math.round(10+state.realmIdx*12);
    s.merit += merit; s.contrib += merit;
    state.spiritStones += stones;
    addLog(`Nhiệm vụ 「${task}」 hoàn thành gọn gàng: +${merit} cống hiến, nhận ${stones} linh thạch bổng lộc.`);
  } else {
    const dmg = Math.round(state.stats.hpMax*0.12);
    state.hp = Math.max(1, state.hp-dmg);
    s.merit += 5; s.contrib += 5;
    addLog(`Nhiệm vụ 「${task}」 gặp biến cố, ngươi bị thương ${dmg} khí huyết, chỉ được ghi nhận 5 cống hiến.`);
  }
  render();
}

function ngShopItemLabel(it){
  if(it.type==='herbs') return {name:`${HERB_NAMES[it.tier-1]} ×${it.count}`, note:'Dược liệu'};
  if(it.type==='pills') return {name:`${PILL_NAMES[it.tier-1]} ×${it.count}`, note:'Đan dược'};
  if(it.type==='boost') return {name:it.name, note:it.desc};
  if(it.type==='breakpill') return {name:BREAK_PILLS.find(p=>p.id===it.pill).name, note:'Đan đột phá đại cảnh giới'};
  if(it.type==='kimquang') return {name:'Kim Quang Chuyên', note:'Phù bảo, dùng được 8 lần'};
  if(it.type==='tech') return {name:it.name, note:`Công pháp: ${ngFmtBonus(it.bonus)}`};
  if(it.type==='ngHeritage') return {name:{thanhNguyen:'Thanh Nguyên Kiếm Quyết',daiDien:'Đại Diễn Quyết (bản gốc)'}[it.key], note:'Ngọc giản truyền thừa'};
  if(it.type==='mat') return {name:`${NG_MAT_NAMES[it.mat]} ×${it.count}`, note:'Tài liệu bí truyền'};
  if(it.type==='map') return {name:'Hư Thiên Tàn Đồ', note:'Một mảnh bản đồ Hư Thiên Điện'};
  if(it.type==='statpill'){ const sp = STAT_PILLS.find(p=>p.id===it.stat); return {name:sp.name, note:'Tăng chỉ số vĩnh viễn'}; }
  if(it.type==='recipe'){
    const map = {danPhuong:'Đan Phương cấp kế tiếp', khiPhuong:'Khí Phương', tranDo:'Trận Đồ', khoiLoiVe:'Bản Vẽ Khôi Lỗi'};
    return {name:map[it.key], note:'Công thức nghề phụ'};
  }
  return {name:'?', note:''};
}

function ngShopItemBlocked(it){
  const s = ng().sect;
  if(it.minRank && s.rank<it.minRank) return `Cần ${SECT_RANKS[it.minRank]}`;
  if(it.type==='tech' && state.learnedNames.includes(it.name)) return 'Đã luyện';
  if(it.type==='ngHeritage' && ng()[it.key].have) return 'Đã có';
  if(it.type==='boost' && state.realmIdx>it.maxRealm) return 'Không còn tác dụng';
  if(it.type==='breakpill' && state.realmIdx>BREAK_PILLS.find(p=>p.id===it.pill).realm) return 'Không còn tác dụng';
  if(it.type==='kimquang' && state.kimQuang>0) return 'Đang có';
  if(it.type==='map' && (ng().huThien.have || ng().huThien.maps>=3)) return 'Đã đủ';
  if(it.type==='recipe'){
    if(it.key==='danPhuong'){ const nt = Math.max(...state.danPhuongTiers)+1; if(nt>6) return 'Đã đủ'; }
    if(it.key==='khiPhuong' && state.hasKhiPhuong) return 'Đã có';
    if(it.key==='tranDo' && state.hasTranDo) return 'Đã có';
    if(it.key==='khoiLoiVe' && state.hasKhoiLoiVe) return 'Đã có';
  }
  return '';
}

function buySectItem(idx){
  const s = ng().sect; if(!s) return;
  const def = ngSectDef(s.id);
  const it = def.shop[idx]; if(!it) return;
  const block = ngShopItemBlocked(it);
  if(block){ addLog(`Không thể đổi vật phẩm này: ${block}.`); render(); return; }
  if(s.contrib<it.cost){ addLog(`Cần ${it.cost} cống hiến để đổi tại Tàng Bảo Các của ${def.name}.`); render(); return; }
  s.contrib -= it.cost;
  const label = ngShopItemLabel(it).name;
  if(it.type==='herbs') state.herbs[it.tier] = (state.herbs[it.tier]||0)+it.count;
  else if(it.type==='pills') state.pills[it.tier] = (state.pills[it.tier]||0)+it.count;
  else if(it.type==='boost') state.breakthroughBoost = Math.min(60, state.breakthroughBoost+it.amount);
  else if(it.type==='breakpill') state.breakPills[it.pill] = (state.breakPills[it.pill]||0)+1;
  else if(it.type==='kimquang') state.kimQuang = 8;
  else if(it.type==='ngHeritage'){ ng()[it.key].have = true; }
  else if(it.type==='tech'){ state.techniques.push({name:it.name, desc:it.desc, bonus:it.bonus}); state.learnedNames.push(it.name); }
  else if(it.type==='mat') ng()[it.mat] += it.count;
  else if(it.type==='map') ng().huThien.maps++;
  else if(it.type==='statpill'){ grantStatPill(STAT_PILLS.find(p=>p.id===it.stat)); }
  else if(it.type==='recipe'){
    if(it.key==='danPhuong') state.danPhuongTiers.push(Math.max(...state.danPhuongTiers)+1);
    else if(it.key==='khiPhuong') state.hasKhiPhuong = true;
    else if(it.key==='tranDo') state.hasTranDo = true;
    else if(it.key==='khoiLoiVe') state.hasKhoiLoiVe = true;
  }
  if(it.type!=='statpill') addLog(`Dùng ${it.cost} cống hiến đổi lấy 【${label}】 tại Tàng Bảo Các của ${def.name}.`);
  computeStats();
  render();
}

/* ---------------- Bí truyền: Thanh Nguyên Kiếm Quyết ---------------- */
function thanhNguyenMaxLayer(){ return Math.min(THANH_NGUYEN_MAX_LAYER, (state.realmIdx+1)*2); }
function thanhNguyenLayerCost(L){ return {stones:60+L*55, herbTier:Math.min(6, 1+Math.ceil((L+1)/2)), herbCount:2}; }

function cultivateThanhNguyen(){
  const tn = ng().thanhNguyen;
  if(!tn.have) return;
  if(tn.layer>=THANH_NGUYEN_MAX_LAYER){ addLog('Thanh Nguyên Kiếm Quyết đã đạt tầng cao nhất.'); render(); return; }
  if(tn.layer>=thanhNguyenMaxLayer()){ addLog(`Cảnh giới hiện tại chỉ đủ lĩnh ngộ tới tầng ${thanhNguyenMaxLayer()} — cần đột phá thêm.`); render(); return; }
  const c = thanhNguyenLayerCost(tn.layer);
  if(state.spiritStones<c.stones || (state.herbs[c.herbTier]||0)<c.herbCount){
    addLog(`Tu luyện tầng ${tn.layer+1} cần ${c.stones} linh thạch và ${c.herbCount} ${HERB_NAMES[c.herbTier-1]}.`); render(); return;
  }
  state.spiritStones -= c.stones; state.herbs[c.herbTier] -= c.herbCount;
  tn.layer++;
  addLog(`Kiếm ý thanh lãnh lưu chuyển khắp kinh mạch — Thanh Nguyên Kiếm Quyết đột phá tầng ${tn.layer}!`);
  computeStats(); render();
}

function forgeSwords(){
  const g = ng();
  if(!g.thanhNguyen.have || g.thanhNguyen.layer<1){ addLog('Phải tu luyện Thanh Nguyên Kiếm Quyết ít nhất tầng 1 mới biết pháp môn luyện Thanh Trúc Phong Vân Kiếm.'); render(); return; }
  if((state.professions.khiSu||0)<1){ addLog('Cần học nghề Luyện Khí Sư trước mới đủ hỏa hầu luyện phi kiếm từ Kim Lôi Trúc.'); render(); return; }
  if(g.swords>=SWORDS_MAX){ addLog('Đã đủ bộ 72 thanh Thanh Trúc Phong Vân Kiếm.'); render(); return; }
  if(g.kimLoiTruc<1){ addLog('Cần có Kim Lôi Trúc — tìm ở Loạn Tinh Hải, Đại Tấn, hoặc đổi tại Tàng Bảo Các của tông môn.'); render(); return; }
  const cost = 50+state.realmIdx*25;
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để khai lò luyện kiếm.`); render(); return; }
  state.spiritStones -= cost; g.kimLoiTruc--;
  const n = Math.min(SWORDS_PER_BAMBOO, SWORDS_MAX-g.swords);
  g.swords += n;
  addLog(`Một cây Kim Lôi Trúc được chẻ làm ${n} đoạn, luyện thành ${n} thanh Thanh Trúc Phong Vân Kiếm, thân kiếm lấp lánh hồ quang Ích Tà Thần Lôi (${g.swords}/${SWORDS_MAX}).`);
  computeStats(); render();
}

function formKiemTran(){
  const g = ng();
  if(g.kiemTran) return;
  if(g.swords<SWORDS_MAX || g.canhTinh<3 || g.thanhNguyen.layer<6 || state.realmIdx<3){
    addLog('Bày Đại Canh Kiếm Trận cần đủ 72 thanh kiếm, 3 khối Canh Tinh, Thanh Nguyên Kiếm Quyết tầng 6 và tu vi Nguyên Anh Kỳ.'); render(); return;
  }
  g.canhTinh -= 3;
  g.kiemTran = true;
  addLog(`Ba khối Canh Tinh được luyện vào trận nhãn, 72 thanh phi kiếm xếp thành đại trận — kim quang và lôi hồ đan xen phủ kín bầu trời. 【Đại Canh Kiếm Trận】 đại thành!`);
  computeStats(); render();
}

/* ---------------- Bí truyền: Đại Diễn Quyết ---------------- */
function daiDienLayerCost(L){ return {stones:150*(L+1), herbTier:Math.min(6, L+2), herbCount:3, realm:L+1}; }
function cultivateDaiDien(){
  const dd = ng().daiDien;
  if(!dd.have) return;
  if(dd.layer>=DAI_DIEN_MAX_LAYER){ addLog('Đại Diễn Quyết đã tu tới tầng cao nhất mà Nhân Giới có thể lĩnh ngộ.'); render(); return; }
  const c = daiDienLayerCost(dd.layer);
  if(state.realmIdx<c.realm){ addLog(`Tầng ${dd.layer+1} Đại Diễn Quyết cần thần thức của ${MAJOR_REALMS[c.realm].name}.`); render(); return; }
  if(state.spiritStones<c.stones || (state.herbs[c.herbTier]||0)<c.herbCount){
    addLog(`Tu luyện tầng ${dd.layer+1} cần ${c.stones} linh thạch và ${c.herbCount} ${HERB_NAMES[c.herbTier-1]}.`); render(); return;
  }
  state.spiritStones -= c.stones; state.herbs[c.herbTier] -= c.herbCount;
  const isHon = state.path && state.path.id==='hon';
  if(!isHon && Math.random()<0.25){
    const dmg = Math.round(state.stats.hpMax*0.25);
    state.hp = Math.max(1, state.hp-dmg);
    addLog(`Thần thức phân hóa quá sức, đầu đau như búa bổ — tu luyện tầng ${dd.layer+1} thất bại, chịu ${dmg} sát thương. (Hồn Tu sẽ không gặp rủi ro này.)`);
    render(); return;
  }
  dd.layer++;
  addLog(`Thần thức khuếch trương gấp bội — Đại Diễn Quyết đạt tầng ${dd.layer}! Có thể điều khiển thêm ${6} khôi lỗi, uy lực khôi lỗi quân tăng mạnh.`);
  computeStats(); render();
}

/* ---------------- Bí truyền: Hư Thiên Đỉnh ---------------- */
function enterHuThien(){
  const g = ng();
  if(g.huThien.have || g.huThien.maps<3) return;
  if(g.region!=='loantinh'){ addLog('Lối vào Hư Thiên Điện nằm giữa Loạn Tinh Hải — phải tới đó trước.'); render(); return; }
  if(state.realmIdx<2){ addLog('Hư Thiên Điện hung hiểm vô cùng, ít nhất phải Kết Đan Kỳ mới có cơ sống sót.'); render(); return; }
  const cost = 150;
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để phá cấm chế ngoài cửa điện.`); render(); return; }
  state.spiritStones -= cost;
  const e = genRegionEnemy(Math.min(state.realmIdx+1, NG_LAST_REALM), null, 1.7, 'Nguyên Anh Lão Quái · Tranh Đoạt Hư Thiên Đỉnh');
  e.huThienBoss = true;
  state.currentZone = Math.min(state.realmIdx, ZONES.length-1);
  addLog('Vượt qua những tầng huyễn cảnh và cấm chế, ngươi tới được điện sâu nhất — Hư Thiên Đỉnh lơ lửng giữa không trung. Nhưng một lão quái Nguyên Anh đã chờ sẵn ở đó!');
  startCombat(e);
}

function bangPhachAffinity(){
  const els = (state.root && state.root.elements) || [];
  return els.includes('Thủy') || els.includes('Băng') || (state.physique && state.physiqueKnown && ['huyen_am','bang_linh'].includes(state.physique.id));
}

function comprehendBangPhach(stage){
  const h = ng().huThien;
  if(!h.have) return;
  const cfg = stage==='bangDiem'
    ? {name:'Càn Lam Băng Diễm', realm:2, stones:350, herbTier:3, herbCount:3}
    : {name:'Băng Phách Hàn Thể', realm:3, stones:600, herbTier:4, herbCount:3};
  if(h[stage]) return;
  if(stage==='hanThe' && !h.bangDiem){ addLog('Phải luyện thành Càn Lam Băng Diễm trước.'); render(); return; }
  if(state.realmIdx<cfg.realm){ addLog(`Tham ngộ 【${cfg.name}】 cần đạt ${MAJOR_REALMS[cfg.realm].name}.`); render(); return; }
  if(state.spiritStones<cfg.stones || (state.herbs[cfg.herbTier]||0)<cfg.herbCount){
    addLog(`Tham ngộ 【${cfg.name}】 cần ${cfg.stones} linh thạch và ${cfg.herbCount} ${HERB_NAMES[cfg.herbTier-1]}.`); render(); return;
  }
  state.spiritStones -= cfg.stones; state.herbs[cfg.herbTier] -= cfg.herbCount;
  const chance = bangPhachAffinity() ? 100 : 55;
  if(Math.random()*100>=chance){
    const dmg = Math.round(state.stats.hpMax*0.3);
    state.hp = Math.max(1, state.hp-dmg);
    addLog(`Hàn khí trong Hư Thiên Đỉnh phản phệ, kinh mạch đóng băng từng đoạn — tham ngộ 【${cfg.name}】 thất bại, chịu ${dmg} sát thương. (Thủy/Băng linh căn hoặc Khuê Thủy Chi Thể sẽ chắc chắn thành công.)`);
    render(); return;
  }
  h[stage] = true;
  addLog(stage==='bangDiem'
    ? 'Băng Phách Tiên Tử lưu lại một tia ý niệm trong đỉnh, dẫn ngươi luyện hóa ngọn lửa xanh lam lạnh thấu xương — 【Càn Lam Băng Diễm】 đã thuộc về ngươi! Đòn đánh có thể đóng băng kẻ địch.'
    : 'Hàn khí Băng Phách thấm vào tận cốt tủy, nhục thân như được đúc lại từ băng tinh vạn năm — 【Băng Phách Hàn Thể】 đại thành!');
  computeStats(); render();
}

/* ---------------- Móc vào chiến đấu ---------------- */
function ngCombatAction(type){
  const c = state.combat; const g = ng();
  let dmg = 0, msg = '';
  if(type==='kiem'){
    if(g.swords<1 || c.cdKiem>0) return null;
    const mult = 1.1+g.swords/60;
    const r = pathAdjustedDamage(state.stats.atk*mult, c.enemy.def, state.stats.crit+((state.path&&state.path.id==='kiem')?10:0), c.enemy, false);
    dmg = r.dmg;
    if(isEvilEnemy(c.enemy)) dmg = Math.round(dmg*1.25);
    msg = `${g.swords} thanh Thanh Trúc Phong Vân Kiếm hóa thành cơn lốc kiếm quang${r.crit?' — bạo kích':''}, gây ${dmg} sát thương!${isEvilEnemy(c.enemy)?' Ích Tà Thần Lôi khắc chế tà vật, uy lực tăng mạnh.':''}`;
    c.cdKiem = 2;
  } else if(type==='kiemtran'){
    if(!g.kiemTran || c.kiemTranUsed) return null;
    const r = pathAdjustedDamage(state.stats.atk*3.5, c.enemy.def*0.4, state.stats.crit, c.enemy, false);
    dmg = r.dmg;
    c.frozen = Math.max(c.frozen||0, 1);
    c.kiemTranUsed = true;
    msg = `【Đại Canh Kiếm Trận】! 72 thanh phi kiếm vây thành lồng kiếm kim quang, ${c.enemy.name} bị giam chặt bên trong, lãnh trọn ${dmg} sát thương!`;
  } else if(type==='bangdiem'){
    if(!g.huThien.bangDiem || c.cdBangDiem>0) return null;
    const r = pathAdjustedDamage(state.stats.atk*1.8, c.enemy.def*0.7, state.stats.crit, c.enemy, false);
    dmg = r.dmg;
    const freezeChance = c.enemy.isBoss ? 0.35 : 0.6;
    const frozen = Math.random()<freezeChance;
    if(frozen) c.frozen = Math.max(c.frozen||0, 1);
    msg = `Ngọn Càn Lam Băng Diễm xanh lam bao trùm ${c.enemy.name}, gây ${dmg} sát thương${frozen?' và đóng băng đối phương!':'.'}`;
    c.cdBangDiem = 3;
  } else if(type==='dinh'){
    if(!g.huThien.have || c.dinhUsed) return null;
    c.dinhUsed = true;
    c.enemy.atk = Math.round(c.enemy.atk*0.7);
    c.enemy.def = Math.round(c.enemy.def*0.8);
    c.frozen = Math.max(c.frozen||0, 1);
    combatLog(`Hư Thiên Đỉnh bay lên, miệng đỉnh hút ${c.enemy.name} vào trong nhốt một lượt, đồng thời cướp đoạt linh tính pháp bảo của nó — công kích và phòng ngự giảm mạnh!`);
    enemyTurn();
    return 'done';
  } else return null;
  return {dmg, msg};
}

function ngTickCooldowns(c){
  if(c.cdKiem>0) c.cdKiem--;
  if(c.cdBangDiem>0) c.cdBangDiem--;
}

function ngOnCombatWin(enemy){
  const g = ng();
  let msg = '';
  if(enemy.sectMission && g.sect){
    g.sect.merit += enemy.sectMission; g.sect.contrib += enemy.sectMission;
    msg += ` Hoàn thành nhiệm vụ tông môn: +${enemy.sectMission} cống hiến.`;
  }
  if(enemy.hunterOf){
    const bonus = Math.round(40+state.realmIdx*25);
    state.spiritStones += bonus;
    msg += ` Đánh lui truy sát sứ, thu được ${bonus} linh thạch.`;
    const cur = ngCurSect();
    if(cur && cur.enemyOf===enemy.hunterOf){
      const m = Math.round(20*(1+state.realmIdx*0.35));
      g.sect.merit += m; g.sect.contrib += m;
      msg += ` Tông môn ghi nhận chiến công: +${m} cống hiến.`;
    }
  }
  if(enemy.huThienBoss){
    g.huThien.have = true;
    msg += ' Lão quái tháo chạy, ngươi đoạt được 【Hư Thiên Đỉnh】! Bên trong đỉnh còn lưu giữ truyền thừa của Băng Phách Tiên Tử — vào mục Bí Truyền để tham ngộ.';
    computeStats();
  }
  return msg;
}
function ngOnCombatLose(enemy){
  if(enemy.huThienBoss) return ' Hư Thiên Tàn Đồ vẫn còn, có thể quay lại khi đã chuẩn bị kỹ hơn.';
  return '';
}

function renderNgCombatButtons(c){
  const g = ng();
  const btns = [];
  if(g.swords>0) btns.push(`<button class="btn gold" ${c.cdKiem>0?'disabled':''} onclick="playerAttack('kiem')">${ic('sword')}Thanh Trúc Kiếm${c.cdKiem>0?` (${c.cdKiem})`:''}</button>`);
  if(g.kiemTran) btns.push(`<button class="btn gold" ${c.kiemTranUsed?'disabled':''} onclick="playerAttack('kiemtran')">${ic('swords')}Đại Canh Kiếm Trận</button>`);
  if(g.huThien.bangDiem) btns.push(`<button class="btn gold" ${c.cdBangDiem>0?'disabled':''} onclick="playerAttack('bangdiem')">${ic('crystal')}Càn Lam Băng Diễm${c.cdBangDiem>0?` (${c.cdBangDiem})`:''}</button>`);
  if(g.huThien.have) btns.push(`<button class="btn ghost" ${c.dinhUsed?'disabled':''} onclick="playerAttack('dinh')">${ic('ding')}Hư Thiên Đỉnh Trấn Áp</button>`);

function renderNgRoute(){
  const g = ng();
  const curIdx = NG_REGIONS.findIndex(r=>r.id===g.region);
  return `<div class="ng-route">${NG_REGIONS.map((r,i)=>{
    const locked = state.realmIdx<r.minRealm;
    const cls = i===curIdx ? 'here' : (locked ? 'locked' : '');
    return `<div class="ng-stop ${cls}"><span class="ng-dot">${ic(r.icon,'keep')}</span><span class="ng-stop-name">${r.name}</span><span class="ng-stop-req">${locked?MAJOR_REALMS[r.minRealm].name:(i===curIdx?'Đang ở đây':'Có thể tới')}</span></div>`;
  }).join('<div class="ng-link"></div>')}</div>`;
}


function renderNgRegions(){
  const g = ng();
  const region = ngRegion();
  const locs = region.locations.map(l=>{
    const locked = state.realmIdx<l.power;
    return `
      <div class="card zone-card ${locked?'locked':''}">
        <h3>${l.name}</h3>
        <p>${l.blurb}</p>
        ${locked
          ? `<div class="zone-lock">Cần đạt ${MAJOR_REALMS[l.power].name} để tiến vào.</div>`
          : `<button class="btn blood" onclick="exploreRegion('${l.id}')">Thám Hiểm ${l.name}</button>`}
      </div>`;
  }).join('');
  const travel = NG_REGIONS.filter(r=>r.id!==region.id).map(r=>{
    const cost = Math.max(r.travelCost, region.travelCost);
    const locked = state.realmIdx<r.minRealm;
    return `<button class="btn ghost" ${locked?'disabled':''} onclick="travelTo('${r.id}')">${ic(r.icon)} Tới ${r.name} (${cost} linh thạch)</button>`;
  }).join('');
  const hostile = ngHostileSectsHere();
  return `
    <div class="card">
      <div class="sec-title">${ic(region.icon)} ${region.name}<span style="font-size:11px;color:var(--text-faint);font-weight:400;">Nhân Giới</span></div>
      ${renderNgRoute()}
      <p class="flavor" style="margin-top:12px;">${region.blurb}</p>
      ${hostile.length?`<div class="sec-note" style="margin:0 0 10px;color:var(--blood-bright);">${ic('warn')} Thế lực thù địch đang hoạt động tại đây: ${hostile.map(s=>s.name).join(', ')}.</div>`:''}
      <div class="btn-row">${travel}</div>
    </div>
    ${locs}
  `;
}

function renderNgSectStatus(readOnly){
  const s = ng().sect; const def = ngSectDef(s.id);
  const next = s.rank<SECT_RANKS.length-1 ? SECT_RANK_MERIT[s.rank+1] : null;
  const pct = next ? Math.min(100, (s.merit/next)*100) : 100;
  const canPromote = next && s.merit>=next && state.realmIdx>=sectRankRealmReq(def, s.rank+1);
  const inRegion = ng().region===def.region;
  const shop = def.shop.map((it,i)=>{
    const lb = ngShopItemLabel(it);
    const block = ngShopItemBlocked(it);
    return `
      <div class="tile ${block?'locked':''}">
        <div class="tile-head"><span class="tn">${lb.name}</span></div>
        <div class="tile-head"><span class="tc">${lb.note}</span></div>
        <button class="btn ghost" ${(block||s.contrib<it.cost||readOnly)?'disabled':''} onclick="buySectItem(${i})">${block||`${it.cost} cống hiến`}</button>

  }).join('');
  return `
    <div class="card">
      <div class="sec-title">${ic(def.icon)} ${def.name}<span style="font-size:11px;color:var(--text-faint);font-weight:400;">${def.align}</span></div>
      <div class="row"><span class="k">Thân phận</span><span class="v">${SECT_RANKS[s.rank]}</span></div>
      <div class="row"><span class="k">Cống hiến khả dụng</span><span class="v">${s.contrib}</span></div>
      <div class="row"><span class="k">Bổng lộc thụ động</span><span class="v">${ngFmtBonus(sectBonus())}</span></div>
      <div class="bar-row" style="margin:10px 0 4px;">
        <div class="bar-label" style="width:64px;">Công lao</div>
        <div class="bar-track"><div class="bar-fill tuvi" style="width:${pct}%"></div></div>
        <div class="bar-num">${next?`${s.merit}/${next}`:'Tối cao'}</div>
      </div>
      ${readOnly?'':`
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn" ${inRegion?'':'disabled'} onclick="sectMission()">Nhận Nhiệm Vụ</button>
        <button class="btn gold" ${canPromote?'':'disabled'} onclick="promoteSect()">${next?`Khảo Hạch ${SECT_RANKS[s.rank+1]}`:'Đã Là Trưởng Lão'}</button>
      </div>
      ${inRegion?'':`<div class="sec-note" style="margin:8px 0 0;">Phải có mặt tại ${NG_REGIONS.find(r=>r.id===def.region).name} mới nhận được nhiệm vụ.</div>`}
      ${next && s.merit>=next && !canPromote ? `<div class="sec-note" style="margin:8px 0 0;">Đủ công lao, nhưng cần đạt ${MAJOR_REALMS[sectRankRealmReq(def, s.rank+1)].name} để khảo hạch.</div>`:''}`}
    </div>
    <div class="card">
      <div class="sec-title">${ic('hall')} Tàng Bảo Các</div>
      <p class="flavor">Dùng cống hiến tích lũy từ nhiệm vụ để đổi tài nguyên của tông môn. Vật phẩm quý chỉ mở cho đệ tử có thân phận cao.</p>
      <div class="grid2">${shop}</div>
      ${readOnly?'':`<button class="btn ghost" style="margin-top:12px;" onclick="${s.rank>=1?`askConfirm('leaveSect')`:'leaveSect()'}">${s.rank>=1?'Phản Xuất Tông Môn (sẽ bị truy sát)':'Rời Tông Môn'}</button>`}
    </div>`;
}

function renderNgSects(){
  const g = ng();
  const status = g.sect ? renderNgSectStatus(false) : `
    <div class="card"><div class="sec-title">${ic('pagoda')} Tông Môn</div>
      <p class="flavor">Tán tu tự do nhưng thiếu thốn đủ bề. Bái nhập một tông môn để có bổng lộc, nhiệm vụ và Tàng Bảo Các — đổi lại phải gánh ân oán của tông môn đó. Mỗi người chỉ thuộc về một nơi.</p></div>`;
  const list = NG_REGIONS.map(r=>{
    const sects = SECTS.filter(s=>s.region===r.id).map(s=>{
      const isMine = g.sect && g.sect.id===s.id;
      const block = isMine ? '' : sectJoinBlock(s);
      const betrayed = g.betrayed.includes(s.id);
      return `
        <div class="card zone-card ${block && !isMine?'locked':''}" ${betrayed?'style="border-left-color:var(--blood);"':''}>
          <h3>${ic(s.icon)}${s.name}</h3>
          <div class="sec-note" style="margin:0 0 6px;">${s.align}. Bổng lộc gốc: ${ngFmtBonus(s.bonus)}${s.enemyOf?`. Tử địch: ${ngSectDef(s.enemyOf).name}`:''}</div>
          <p>${s.blurb}</p>
          ${isMine ? `<div class="zone-lock" style="color:var(--jade-bright);">Ngươi đang là ${SECT_RANKS[g.sect.rank]} của tông môn này.</div>`
            : block ? `<div class="zone-lock">${block}.</div>`
            : `<button class="btn" onclick="joinSect('${s.id}')">Bái Nhập${s.joinCost?` (${s.joinCost} linh thạch)`:''}</button>`}
        </div>`;
    }).join('');
    return `<div class="sec-title" style="margin:6px 2px 0;border:none;">${ic(r.icon)} ${r.name}</div>${sects}`;
  }).join('');
  return status + list;
}

   Nguyên tắc: mỗi nghề dùng đúng loại nguyên liệu của nó, tay nghề tăng
   nhờ thực hành (điểm thành thạo) thay vì bỏ linh thạch mua cấp, và mọi
   công thức đều hiện rõ nguyên liệu + tỷ lệ thành công trước khi làm.
===================================================================== */
const MAT_TYPES = {
  khoang:{name:'Khoáng Thạch', icon:'stone',   use:'Luyện khí, trận kỳ, thủ khôi', tiers:['Khoáng thạch hạ phẩm','Khoáng thạch trung phẩm','Khoáng thạch thượng phẩm']},
  moc:   {name:'Linh Mộc',     icon:'root',    use:'Khôi lỗi, trận pháp',          tiers:['Linh mộc trăm năm','Linh mộc ngàn năm','Linh mộc vạn năm']},
  huyet: {name:'Yêu Huyết',    icon:'drop',    use:'Mực vẽ phù, đan liệu thương',  tiers:['Nhất Giai Yêu Huyết','Tam Giai Yêu Huyết','Ngũ Giai Yêu Huyết']},
  yeudan:{name:'Yêu Đan',      icon:'crystal', use:'Lõi khôi lỗi, phù cao cấp, Phá Cảnh Đan', tiers:['Nhất Giai Yêu Đan','Tam Giai Yêu Đan','Ngũ Giai Yêu Đan']}
};
const MAT_PRICE = [15, 60, 200];
const MAT_BUY_REALM = [0, 2, 4];
function freshMats(){ const m={}; Object.keys(MAT_TYPES).forEach(k=>m[k]={1:0,2:0,3:0}); return m; }
function matName(type, t){ return MAT_TYPES[type].tiers[t-1]; }
function zoneMatTier(z){ return z<=1 ? 1 : (z<=3 ? 2 : 3); }
function addMat(type, t, n){ state.mats[type][t] = (state.mats[type][t]||0)+n; }

/* ---------------- Nguyên liệu công thức ---------------- */
const H = (tier,n)=>({kind:'herb',tier,n});
const M = (type,tier,n)=>({kind:'mat',type,tier,n});
const S = (n)=>({kind:'stones',n});
function ingLabel(i){
  if(i.kind==='herb') return HERB_NAMES[i.tier-1];
  if(i.kind==='mat') return matName(i.type,i.tier);
  if(i.kind==='ng') return NG_MAT_NAMES[i.type];
  if(i.kind==='spec' || i.kind==='special') return SPEC_NAMES[i.type];
  if(i.kind==='tien') return 'Tiên thạch';
  return 'Linh thạch';
}
function ingHave(i){
  if(i.kind==='herb') return state.herbs[i.tier]||0;
  if(i.kind==='mat') return state.mats[i.type][i.tier]||0;
  if(i.kind==='ng') return ng()[i.type]||0;
  if(i.kind==='spec' || i.kind==='special') return specHave(i.type);
  if(i.kind==='tien') return state.tg ? tg().tienThach : 0;
  return state.spiritStones;
}
function ingOk(spec){ return spec.every(i=>ingHave(i)>=i.n); }
function ingTake(spec){
  spec.forEach(i=>{
    if(i.kind==='herb') state.herbs[i.tier] -= i.n;
    else if(i.kind==='mat') state.mats[i.type][i.tier] -= i.n;
    else if(i.kind==='ng') ng()[i.type] -= i.n;
    else if(i.kind==='spec' || i.kind==='special') specTake(i.type, i.n);
    else if(i.kind==='tien') tg().tienThach -= i.n;
    else state.spiritStones -= i.n;
  });
}
function ingMissing(spec){ return spec.filter(i=>ingHave(i)<i.n).map(i=>`${i.n} ${ingLabel(i)}`).join(', '); }
function ingChips(spec){
  return `<div class="chips">${spec.map(i=>{
    const have = ingHave(i), ok = have>=i.n;
    const cnt = i.kind==='stones' ? `${i.n}` : `${Math.min(have,99)}/${i.n}`;
    return `<span class="chip ${ok?'ok':'miss'}">${i.kind==='stones'?ic('stone'):''}${ingLabel(i)==='Linh thạch'?'':ingLabel(i)+' '}<b>${cnt}</b></span>`;
  }).join('')}</div>`;
}

/* ---------------- Tay nghề: cấp & thành thạo ---------------- */
const PROF_NEED = [0, 25, 70, 150, 280]; // điểm thành thạo cần để lên cấp kế tiếp, theo cấp hiện tại
const PROF_ICON = {danSu:'flask', khiSu:'hammer', tranPhap:'seal', phuLuc:'scroll', khoiLoi:'puppet'};
const APPRENTICE_COST = 50;
function profLvl(id){ return (state.professions && state.professions[id]) || 0; }
function profDef(id){ return PROFESSIONS.find(p=>p.id===id); }

function learnOrLevelProfession(id){
  const p = profDef(id);
  if(profLvl(id)>0){ addLog(`${p.name} chỉ tinh tấn nhờ thực hành — cứ chế tác, tay nghề sẽ tự tăng.`); render(); return; }
  if(state.spiritStones<APPRENTICE_COST){ addLog(`Cần ${APPRENTICE_COST} linh thạch làm lễ bái sư học nghề ${p.name}.`); render(); return; }
  state.spiritStones -= APPRENTICE_COST;
  state.professions[id] = 1;
  state.profExp[id] = 0;
  addLog(`Ngươi bái sư, chính thức nhập môn ${p.name}. Từ đây, mỗi lần chế tác đều tích lũy thành thạo.`);
  computeStats(); render();
}

function gainProfExp(id, amt){
  const p = profDef(id);
  let lvl = profLvl(id);
  if(lvl<1 || lvl>=p.maxLevel) return '';
  if(id==='tranPhap' && phyId()==='long_ngam') amt = Math.round(amt*1.5);
  state.profExp[id] = (state.profExp[id]||0)+amt;
  let msg = '';
  while(lvl<p.maxLevel && state.profExp[id]>=PROF_NEED[lvl]){
    state.profExp[id] -= PROF_NEED[lvl];
    lvl++;
    state.professions[id] = lvl;
    msg = ` Tay nghề tinh tấn — ${p.name} đạt cấp ${lvl}!`;
    fx('banner',{text:`${p.name} cấp ${lvl}`, cls:'jade'});
  }
  if(lvl>=p.maxLevel) state.profExp[id] = 0;
  return msg;
}

/* Tỷ lệ thành công minh bạch: tay nghề cao, công thức đầy đủ thì dễ thành; món càng khó càng dễ hỏng. */
function craftChance(id, difficulty, hasRecipe, extra){
  const lvl = profLvl(id);
  let c = 58 + lvl*9 - difficulty*11 + (hasRecipe===false ? -30 : 12) + (extra||0) + ((id==='danSu'||id==='khiSu') && hasRelic('cuu_long_trao') ? 8 : 0) + (id==='phuLuc' && state.learnedNames && state.learnedNames.includes('Trường Xuân Công') ? 10 : 0) + (id==='danSu' && state.tienDinhLo ? 12 : 0) + (id==='tranPhap' && phyId()==='long_ngam' ? 20 : 0);
  return Math.max(5, Math.min(97, Math.round(c)));
}

/* ---------------- Luyện Đan ---------------- */
const HEAL_PILLS = [
  {tier:1, name:'Liệu Thương Đan hạ phẩm', pct:0.30, minLvl:1, diff:0, price:30,  ing:[H(1,2), M('huyet',1,1)]},
  {tier:2, name:'Liệu Thương Đan trung phẩm', pct:0.50, minLvl:2, diff:2, price:120, ing:[H(3,2), M('huyet',2,1)]},
  {tier:3, name:'Liệu Thương Đan thượng phẩm', pct:0.80, minLvl:4, diff:4, price:400, ing:[H(5,2), M('huyet',3,1)]}
];
function breakthroughPillRecipe(){
  const r = state.realmIdx;
  return {ing:[H(Math.min(6,r+2),3), M('yeudan', zoneMatTier(r), 1), S(100+r*50)], minLvl:3, diff:3};
}

function brewPill(kind, tier){
  if(profLvl('danSu')<1){ addLog('Cần bái sư học nghề Luyện Đan Sư trước.'); render(); return; }
  let rec, name, hasRecipe = true;
  if(kind==='tuvi'){ rec = tuviPillRecipe(tier); name = PILL_NAMES[tier-1]; hasRecipe = state.danPhuongTiers.includes(tier); }
  else if(kind==='heal'){ rec = HEAL_PILLS[tier-1]; name = rec.name; }
  else { rec = breakthroughPillRecipe(); name = BREAKTHROUGH_PILL_NAME; }
  if(profLvl('danSu')<rec.minLvl){ addLog(`Luyện ${name} cần Luyện Đan Sư cấp ${rec.minLvl}.`); render(); return; }
  if(!ingOk(rec.ing)){ addLog(`Luyện ${name} còn thiếu: ${ingMissing(rec.ing)}.`); render(); return; }
  ingTake(rec.ing);
  const chance = craftChance('danSu', rec.diff, hasRecipe);
  const lvl = profLvl('danSu');
  let msg;
  if(Math.random()*100 < chance){
    let n = 1 + (Math.random()<0.2+lvl*0.08 ? 1 : 0) + (lvl>=4 && Math.random()<0.2 ? 1 : 0);
    if(kind==='tuvi') state.pills[tier] = (state.pills[tier]||0)+n;
    else if(kind==='heal') state.healPills[tier] = (state.healPills[tier]||0)+n;
    if(kind==='pocanh'){
      state.breakthroughBoost = Math.min(30, state.breakthroughBoost+15);
      msg = `Đan thành! Ngươi nuốt ngay 【${name}】, chân khí ổn định hẳn — tỷ lệ đột phá kế tiếp +${state.breakthroughBoost}%.`;
    } else {
      msg = `Đan hương ngào ngạt — luyện thành ${n} viên ${name}.`;
    }
    msg += gainProfExp('danSu', 3+rec.diff*2);
  } else if(chance<35){
    const dmg = Math.round(state.stats.hpMax*0.1);
    state.hp = Math.max(1, state.hp-dmg);
    msg = `Hỏa hầu mất kiểm soát, lò đan nổ tung! ${name} không thành, ngươi chịu ${dmg} sát thương.${hasRecipe?'':' Thiếu Đan Phương mà cưỡng luyện thì khó tránh.'}` + gainProfExp('danSu', 1+rec.diff);
  } else {
    msg = `Dược lực không dung hợp, mẻ ${name} hóa thành tro.` + gainProfExp('danSu', 1+rec.diff);
  }
  addLog(msg); render();
}

function healPillMult(){ return danSuPillMult(); }
function bestHealTier(){
  const missing = state.stats.hpMax - state.hp;
  const owned = HEAL_PILLS.filter(p=>(state.healPills[p.tier]||0)>0);
  if(!owned.length) return 0;
  const enough = owned.find(p=>state.stats.hpMax*p.pct*healPillMult() >= missing);
  return (enough || owned[owned.length-1]).tier;
}
function healPillCount(){ return HEAL_PILLS.reduce((s,p)=>s+(state.healPills[p.tier]||0),0); }
function consumeHealPill(){
  const t = bestHealTier();
  if(!t) return null;
  const p = HEAL_PILLS[t-1];
  state.healPills[t]--;
  const heal = Math.round(state.stats.hpMax*p.pct*healPillMult());
  state.hp = Math.min(state.stats.hpMax, state.hp+heal);
  return {name:p.name, heal};
}
function useHealPillOutside(){
  const r = consumeHealPill();
  if(!r){ addLog('Không còn đan liệu thương nào.'); render(); return; }
  addLog(`Nuốt một viên ${r.name}, hồi phục ${r.heal} khí huyết.`); render();
}
function bestPillTier(){ return bestHealTier(); }

/* ---------------- Luyện Khí ---------------- */
let forgeTier = 1;
const FORGE_MIN_LVL = [1, 2, 4];
const FORGE_GRADE = ['Hạ phẩm','Trung phẩm','Thượng phẩm'];
function setForgeTier(t){ forgeTier = t; render(); }
function forgeIng(t){ return [M('khoang',t,3), S([40,150,450][t-1])]; }
function forgePreview(base, t){
  const lvl = Math.max(1, profLvl('khiSu'));
  const scale = (1 + t*0.6 + state.realmIdx*0.15 + lvl*0.1) * (state.hasKhiPhuong ? 1 : 0.6);
  return {atk:Math.round((base.bonus.atk||0)*scale), def:Math.round((base.bonus.def||0)*scale), crit:Math.round((base.bonus.crit||0)*scale)};
}
function treasureScore(b){ return (b.atk||0)+(b.def||0)+(b.crit||0)*2; }

function forgeTreasure(idx){
  const t = forgeTier;
  const base = TREASURES[idx==null?0:idx];
  if(profLvl('khiSu')<1){ addLog('Cần bái sư học nghề Luyện Khí Sư trước.'); render(); return; }
  if(profLvl('khiSu')<FORGE_MIN_LVL[t-1]){ addLog(`Luyện pháp bảo ${FORGE_GRADE[t-1]} cần Luyện Khí Sư cấp ${FORGE_MIN_LVL[t-1]}.`); render(); return; }
  const ing = forgeIng(t);
  if(!ingOk(ing)){ addLog(`Luyện ${base.name} còn thiếu: ${ingMissing(ing)}.`); render(); return; }
  ingTake(ing);
  const chance = craftChance('khiSu', (t-1)*1.5, state.hasKhiPhuong);
  if(Math.random()*100 >= chance){
    addLog(`Cấm chế khắc lệch một nét, ${base.name} nứt vỡ ngay trong lò — khoáng thạch hóa phế liệu.` + gainProfExp('khiSu', 1+t));
    render(); return;
  }
  const bonus = forgePreview(base, t);
  const item = {name:`${base.name} · ${FORGE_GRADE[t-1]}`, tier:t, bonus, temperCount:0};
  let msg;
  if(!state.treasure || treasureScore(bonus) > treasureScore(state.treasure.bonus)){
    const keep = state.treasure && state.lg && lg().bachMach.have && lg().spare.length<12;
    if(keep) lg().spare.push(state.treasure);
    msg = state.treasure ? `Luyện thành ${item.name}, mạnh hơn ${state.treasure.name} — đổi sang dùng ngay, món cũ ${keep?'cất vào kho chờ luyện vào huyệt đạo':'nấu chảy bỏ đi'}.` : `Luyện thành ${item.name}, trang bị làm pháp bảo tùy thân!`;
    state.treasure = item;
  } else {
    if(state.lg && lg().bachMach.have && lg().spare.length<12){
      lg().spare.push(item);
      msg = `Luyện thành ${item.name}, cất vào kho chờ luyện vào huyệt đạo (Bách Mạch Luyện Bảo Quyết).`;
    } else {
      const refund = Math.round(ing.find(i=>i.kind==='stones').n*0.5);
      state.spiritStones += refund;
      msg = `Luyện thành ${item.name} nhưng không hơn pháp bảo đang dùng, đem bán lấy ${refund} linh thạch.`;
    }
  }
  addLog(msg + gainProfExp('khiSu', 3+t*2));
  computeStats(); render();
}

function temperIng(){
  const n = (state.treasure && state.treasure.temperCount) || 0;
  return [M('khoang', Math.min(3, 1+Math.floor(n/4)), 2), S(60+n*30)];
}
function temperTreasure(){
  if(profLvl('khiSu')<3){ addLog('Cần Luyện Khí Sư cấp 3 mới đủ hỏa hầu tôi luyện pháp bảo.'); render(); return; }
  if(!state.treasure){ addLog('Chưa có pháp bảo để tôi luyện.'); render(); return; }
  const n = state.treasure.temperCount||0;
  if(n>=10){ addLog('Pháp bảo đã tôi luyện tới cực hạn, thêm nữa sẽ nứt vỡ.'); render(); return; }
  const ing = temperIng();
  if(!ingOk(ing)){ addLog(`Tôi luyện còn thiếu: ${ingMissing(ing)}.`); render(); return; }
  ingTake(ing);
  const chance = craftChance('khiSu', n*0.5, state.hasKhiPhuong);
  if(Math.random()*100 >= chance){ addLog('Tôi luyện thất bại, linh quang pháp bảo chập chờn rồi lắng xuống như cũ.' + gainProfExp('khiSu', 2)); render(); return; }
  state.treasure.bonus.atk = (state.treasure.bonus.atk||0)+6;
  state.treasure.bonus.crit = (state.treasure.bonus.crit||0)+1;
  state.treasure.temperCount = n+1;
  addLog(`Tôi luyện thêm một tầng cho ${state.treasure.name} (${n+1}/10) — công kích +6, bạo kích +1%.` + gainProfExp('khiSu', 4));
  computeStats(); render();
}

function buildFormation(kind){

  const next = kind==='tulinh' ? TU_LINH[(state.tuLinhTran||0)+1] : TRAN_KY[(state.tranKyTier||0)+1];
  if(!next){ addLog('Trận pháp này đã đạt bậc cao nhất.'); render(); return; }

  if(!ingOk(next.ing)){ addLog(`Bố trí ${next.name} còn thiếu: ${ingMissing(next.ing)}.`); render(); return; }
  ingTake(next.ing);
  const tier = kind==='tulinh' ? next.lvl : next.tier;
  const chance = craftChance('tranPhap', (tier-1)*1.5, state.hasTranDo);
  if(Math.random()*100 >= chance){
    addLog(`Trận nhãn đặt lệch, linh khí hỗn loạn tan biến — bố trí ${next.name} thất bại, vật liệu hao tổn.${state.hasTranDo?'':' Có Trận Đồ sẽ dễ thành hơn nhiều.'}` + gainProfExp('tranPhap', 1+tier));
    render(); return;
  }
  if(kind==='tulinh'){
    state.tuLinhTran = next.lvl;
    addLog(`${next.name} vận chuyển trong động phủ, linh khí bốn phương cuồn cuộn đổ về — tu vi khi bế quan +${Math.round(next.mult*100)}%.` + gainProfExp('tranPhap', 4+tier*3));
  } else {
    state.tranKyTier = next.tier;
    addLog(`Luyện thành bộ ${next.name}, mang theo người để bố trận hộ thân giữa trận chiến.` + gainProfExp('tranPhap', 4+tier*3));
  }
  render();
}

/* ---------------- Khôi Lỗi ---------------- */
function isHonTu(){ return !!(state.path && state.path.id==='hon'); }
function puppetCap(){
  const lvl = profLvl('khoiLoi');
  if(lvl<1) return 0;
  return lvl*3 + (isHonTu()?3:0) + daiDienPuppetCap() + luyenThanPuppetCap();
}
function craftPuppet(id){
  const p = PUPPETS.find(x=>x.id===id); if(!p) return;
  if(profLvl('khoiLoi')<1){ addLog('Cần bái sư học nghề Khôi Lỗi Sư trước.'); render(); return; }
  if(profLvl('khoiLoi')<p.minLvl){ addLog(`Chế tạo ${p.name} cần Khôi Lỗi Sư cấp ${p.minLvl}.`); render(); return; }
  if(puppetCount()>=puppetCap()){ addLog(`Thần thức chỉ đủ điều khiển ${puppetCap()} khôi lỗi. Phân giải bớt hoặc nâng tay nghề trước.`); render(); return; }
  if(!ingOk(p.ing)){ addLog(`Chế tạo ${p.name} còn thiếu: ${ingMissing(p.ing)}.`); render(); return; }
  ingTake(p.ing);
  const chance = craftChance('khoiLoi', (p.tier-1)*1.5, state.hasKhoiLoiVe, isHonTu()?10:0);
  if(Math.random()*100 >= chance){ addLog(`Khớp nối lệch, phù văn dẫn thần thức không thông — ${p.name} thành đống phế liệu.${state.hasKhoiLoiVe?'':' Có Bản Vẽ Khôi Lỗi sẽ dễ thành hơn.'}` + gainProfExp('khoiLoi', 1+p.tier)); render(); return; }
  state.puppetInv[p.id] = (state.puppetInv[p.id]||0)+1;
  addLog(`Rót một tia thần thức vào lõi yêu đan, ${p.name} mở mắt đứng dậy. Quân đoàn: ${puppetCount()}/${puppetCap()}.` + gainProfExp('khoiLoi', 3+p.tier*2));
  render();
}
function dismantlePuppet(id){
  const p = PUPPETS.find(x=>x.id===id);
  if(!p || (state.puppetInv[id]||0)<1) return;
  state.puppetInv[id]--;
  addMat('yeudan', p.tier, 1);
  addLog(`Phân giải một ${p.name}, thu hồi 1 ${matName('yeudan',p.tier)}.`);
  render();
}
function destroyRandomPuppet(){
  const pool = [];
  PUPPETS.forEach(p=>{ for(let i=0;i<(state.puppetInv[p.id]||0);i++) pool.push(p); });
  if(!pool.length) return null;
  const p = pool[Math.floor(Math.random()*pool.length)];
  state.puppetInv[p.id]--;
  return p.name;
}

function dropMaterials(enemy){
  const t = zoneMatTier(state.currentZone||0);
  const got = [];
  const roll = ()=>{ const r = Math.random()*100; return r<35?'huyet':r<55?'yeudan':r<78?'khoang':'moc'; };
  if(Math.random()<0.6){ const k = roll(); addMat(k,t,1); got.push(matName(k,t)); }
  if(enemy.isBoss){ addMat('yeudan',t,1); got.push(matName('yeudan',t)); }
  return got.length ? `, nhặt được ${got.join(', ')}` : '';
}
function buyMat(type, t, n){
  if(state.realmIdx<MAT_BUY_REALM[t-1]) return;
  const cost = Math.round(MAT_PRICE[t-1]*n*(state.flags.discount?0.8:1));
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để mua ${n} ${matName(type,t)}.`); render(); return; }
  state.spiritStones -= cost; addMat(type,t,n);
  addLog(`Mua ${n} ${matName(type,t)} ở phường thị, tốn ${cost} linh thạch.`); render();
}
function buyHealPill(t, n){
  const p = HEAL_PILLS[t-1];
  const cost = Math.round(p.price*n*(state.flags.discount?0.8:1));
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để mua ${n} ${p.name}.`); render(); return; }
  state.spiritStones -= cost; state.healPills[t] = (state.healPills[t]||0)+n;
  addLog(`Mua ${n} viên ${p.name} ở phường thị, tốn ${cost} linh thạch.`); render();
}
function sellThing(kind, key, t, all){
  let have, price, label;
  if(kind==='herb'){ have = state.herbs[t]||0; price = t*4; label = HERB_NAMES[t-1]; }
  else if(kind==='mat'){ have = state.mats[key][t]||0; price = Math.round(MAT_PRICE[t-1]*0.4); label = matName(key,t); }
  else if(kind==='tuvi'){ have = state.pills[t]||0; price = t*15; label = PILL_NAMES[t-1]; }
  else if(kind==='heal'){ have = state.healPills[t]||0; price = Math.round(HEAL_PILLS[t-1].price*0.4); label = HEAL_PILLS[t-1].name; }
  if(!have) return;
  const n = all ? have : 1;
  if(kind==='herb') state.herbs[t]-=n;
  else if(kind==='mat') state.mats[key][t]-=n;
  else if(kind==='tuvi') state.pills[t]-=n;
  else state.healPills[t]-=n;
  state.spiritStones += n*price;
  addLog(`Bán ${n} ${label}, thu về ${n*price} linh thạch.`); render();
}

/* ---------------- Tương thích bản lưu cũ ---------------- */
function migrateState(){
  const s = state;
  if(!s || !s.root) return;
  if(!s.profExp) s.profExp = {danSu:0,khiSu:0,tranPhap:0,phuLuc:0,khoiLoi:0};
  if(!s.mats) s.mats = freshMats();
  if(!s.healPills) s.healPills = {1:3,2:0,3:0};
  if(!s.puppetInv){
    s.puppetInv = {};
    const pb = s.puppetsByTier || {};
    ['chien1','chien2','chien3'].forEach((id,i)=>{ if(pb[i+1]) s.puppetInv[id] = pb[i+1]; });
  }
  if(!s.talismans || ('1' in s.talismans)){
    const o = s.talismans || {};
    s.talismans = {hoa_cau:o[1]||0, ngu_loi:o[2]||0, truc_tien:o[3]||0};
  }
  if(s.tuLinhTran==null) s.tuLinhTran = 0;
  if(!s.pills) s.pills = {};
  if(!s.npcs) s.npcs = {};
  if(!s.relics) s.relics = [];
  if(!s.realmSched) s.realmSched = {};
  if(!s.flags) s.flags = {};
  if(s.month==null) s.month = 0;
  if(s.expd===undefined) s.expd = null;
  if(s.pendingEvent===undefined) s.pendingEvent = null;
  const legacyTab = {thamhiem:'hanhtau', nhangioi:'hanhtau', trung:'nhanvat', nghephu:'dongphu', hanhtrang:'tuido', nhatky:'nhanvat'};
  if(legacyTab[s.activeTab]) s.activeTab = legacyTab[s.activeTab];
  if(!NAV.some(n=>n.id===s.activeTab)) s.activeTab = 'tuluyen';
  if(!s.subTabs) s.subTabs = {};
}

/* =====================================================================
   CHIẾN ĐẤU (viết lại cho khớp với phù lục, trận kỳ, khôi lỗi mới)
===================================================================== */
function startCombat(enemy){
  state.combat = {
    enemy:{...enemy, hp:enemy.hpMax},
    log:[`Bất ngờ chạm trán ${enemy.name}!`],
    cdTreasure:0, cdWorm:0,
    formationActive:false, puppetsOut:false, shield:0, phuMenu:false,
    cdKiem:0, cdBangDiem:0, frozen:0, kiemTranUsed:false, dinhUsed:false
  };
  render();
}

function playerAttack(type){
  const c = state.combat;
  if(!c) return;
  if(c.playerStun>0){ c.playerStun--; combatLog('Ngươi còn chìm trong mộng yểm, không thể hành động!'); enemyTurn(); return; }
  if(type==='flee'){ tryFlee(); return; }
  if(type==='pill'){ usePillInCombat(); return; }
  if(type==='phuMenu'){ c.phuMenu = !c.phuMenu; render(); return; }
  if(type.indexOf('phu:')===0){ useTalisman(type.slice(4)); return; }
  let dmg=0, msg='';
  if(type==='atk'){
    const r = pathAdjustedDamage(state.stats.atk, c.enemy.def*(1-physiqueMods().ignoreDef), state.stats.crit, c.enemy, true);
    dmg = r.dmg;
    const label = (state.path && state.path.atkLabel) ? state.path.atkLabel : 'công kích';
    msg = `${r.crit?'Bạo kích! ':''}Ngươi thi triển ${label}, gây ${dmg} sát thương.`;
    const heal = applyLifesteal(dmg);
    if(heal>0) msg += ` Hấp thu sinh cơ, hồi ${heal} khí huyết.`;
  } else if(type==='treasure'){
    if(!state.treasure || c.cdTreasure>0 || c.enemy.noTreasure) return;
    const hk = state.treasure.special==='huyenthien';
    const r = pathAdjustedDamage(state.stats.atk*(hk?2.1:1.6), c.enemy.def*(hk?0.4:1), state.stats.crit+15, c.enemy, false);
    dmg = r.dmg;
    msg = `${state.treasure.name} bộc phát uy năng, gây ${dmg} sát thương!`;
    const heal = applyLifesteal(dmg);
    if(heal>0) msg += ` Hồi ${heal} khí huyết.`;
    c.cdTreasure = hasAcq('phan_thanh') ? 0 : 2;
  } else if(type==='worm'){
    if(!state.worm.have || c.cdWorm>0) return;
    const pr = petStrike(c); dmg = pr.dmg; msg = pr.msg;
  } else if(type==='khoiLoi'){
    if(c.puppetsOut || puppetCount()<1) return;
    c.puppetsOut = true;
    if(state.puppetInv.giai_dao){ if(state.tg && tg().tienThach>=5){ tg().tienThach -= 5; c.giaiDaoOn = true; combatLog('Nạp 5 tiên nguyên thạch, Giải Đạo Nhân mở mắt, lôi quang pháp tắc cuộn quanh người.'); } else combatLog('Giải Đạo Nhân thiếu tiên nguyên thạch làm năng lượng, đứng im bất động.'); }
    combatLog(`Ngươi tung ra ${puppetCount()} khôi lỗi — từ lượt này chúng tự động công kích và đỡ đòn.`);
    enemyTurn(); return;
  } else if(type==='tran'){
    if(!state.tranKyTier || c.formationActive) return;
    c.formationActive = true;
    combatLog(`Cắm ${TRAN_KY[state.tranKyTier].name} quanh thân, trận pháp hộ thân mở ra — giảm ${Math.round(tranMitigation()*100)}% sát thương nhận vào.`);
    enemyTurn(); return;
  } else if(type==='kimquang' || type==='batmon' || type==='phamiet'){
    const r = canonCombatAction(type);
    if(!r){ render(); return; }
    dmg = r.dmg; msg = r.msg;
  } else if(type==='huyenthe' || type==='tranguc'){
    const r = tgCombatAction(type);
    if(!r){ render(); return; }
    dmg = r.dmg; msg = r.msg;
  } else if(type==='phamthanh' || type==='kinhchap'){
    const r = lgCombatAction(type);
    if(!r){ render(); return; }
    dmg = r.dmg; msg = r.msg;
  } else if(['kiem','kiemtran','bangdiem','dinh'].includes(type)){
    const r = ngCombatAction(type);
    if(r===null){ render(); return; }
    if(r==='done') return;
    dmg = r.dmg; msg = r.msg;
    const heal = applyLifesteal(dmg);
    if(heal>0) msg += ` Hồi ${heal} khí huyết.`;
  } else return;
  if(dmg>0) dmg = Math.round(dmg*phyEvilMult(c.enemy));
  if(dmg>0 && physiqueMods().freeze && Math.random()<physiqueMods().freeze){ c.frozen = Math.max(c.frozen||0, 1); msg += ' Hàn khí Băng Linh Thể đóng băng linh lực đối phương!'; }
  if(c.bienBuff && dmg>0){ dmg = Math.round(dmg*c.bienBuff); msg += ` (Chân Linh biến thân ×${c.bienBuff.toFixed(2)})`; }
  c.enemy.hp -= dmg;
  if(dmg>0){ const cr = /bạo kích/i.test(msg); fx('float',{sel:'.enemy-block', text:`-${dmg}`, cls:cr?'crit':''}); if(cr && c.enemy.isBoss) fx('shake'); }
  combatLog(msg);
  if(c.enemy.hp<=0){ winCombat(); return; }
  enemyTurn();
}


function puppetsStrike(c){
  if(!c.puppetsOut || puppetCount()<1) return false;
  const p = puppetPower();
  const dmg = Math.max(1, Math.round(p.dmg - c.enemy.def*0.25));
  c.enemy.hp -= dmg;
  combatLog(`Khôi lỗi quân đồng loạt xuất kích, gây ${dmg} sát thương.`);
  if(c.enemy.hp<=0){ winCombat(); return true; }
  return false;
}
function tickCombatCooldowns(c){
  if(c.cdTreasure>0) c.cdTreasure--;
  if(c.cdWorm>0) c.cdWorm--;
  ngTickCooldowns(c);
}
function enemyTurn(){
  const c = state.combat;
  if(!c) return;
  if(puppetsStrike(c)) return;
  if(c.frozen>0){
    c.frozen--;
    combatLog(`${c.enemy.name} bị khống chế, không thể phản kích!`);
    tickCombatCooldowns(c); render(); return;
  }
  if(hasRelic('ho_tam_kinh') && Math.random()<0.12){
    combatLog(`Hộ Tâm Kính lóe sáng, hóa giải trọn đòn của ${c.enemy.name}!`);
    tickCombatCooldowns(c); render(); return;
  }
  if(state.tg && tgSeen() && tgTimeSkip(c)){ tickCombatCooldowns(c); render(); return; }
  if(c.clone>0){ c.clone--; combatLog(`Phân thân Giáp Nguyên đỡ trọn đòn của ${c.enemy.name}${c.clone?` (còn đỡ ${c.clone} đòn)`:' rồi tan biến'}.`); tickCombatCooldowns(c); render(); return; }
  if(physiqueMods().dodge && Math.random()<physiqueMods().dodge){ combatLog(`Phong Linh Thể lướt đi như gió, đòn của ${c.enemy.name} đánh vào khoảng không.`); tickCombatCooldowns(c); render(); return; }
  if(c.formationActive && Math.random()<0.1){ combatLog(`Ảo ảnh Điên Đảo Ngũ Hành Trận khiến ${c.enemy.name} đánh trượt!`); tickCombatCooldowns(c); render(); return; }
  const r = calcDamage(c.enemy.atk, state.stats.def, 5);
  let dmg = r.dmg;
  const notes = [];
  if(c.formationActive){ dmg = Math.max(1, Math.round(dmg*(1-tranMitigation()))); notes.push('trận pháp hóa giải bớt'); }
  if(c.puppetsOut && puppetCount()>0){
    const g = puppetPower().guard;
    if(g>0){ dmg = Math.max(1, Math.round(dmg*(1-g))); notes.push('khôi lỗi đỡ đòn'); }
    if(Math.random()<0.12){ const lost = destroyRandomPuppet(); if(lost) notes.push(`một ${lost} bị đánh nát`); }
  }
  { const pm = physiqueMods(); let f = pm.dmgTaken; if(hasAcq('phan_thanh') && (c.enemy.lgRace==='ma' || isEvilEnemy(c.enemy))) f *= 0.7; if(f<1){ dmg = Math.max(1, Math.round(dmg*f)); notes.push('nhục thân hóa giải'); } }
  if(state.tg && tgSeen() && tgSpaceReduce()>0){ dmg = Math.max(1, Math.round(dmg*(1-tgSpaceReduce()))); notes.push('không gian bẻ cong'); }
  if(c.shield>0){ const ab = Math.min(c.shield, dmg); c.shield -= ab; dmg -= ab; notes.push(`khiên phù hấp thụ ${ab}`); }
  state.hp -= dmg;
  if(dmg>0){ fx('float',{sel:'.self-bar', text:`-${dmg}`, cls:'hurt'}); if(r.crit) fx('shake'); }
  if(hasAcq('chan_long') && state.hp>0){ state.hp = Math.min(state.stats.hpMax, state.hp+Math.round(state.stats.hpMax*0.05)); }
  const sp = lgSpecialEnemyTurn(c);
  combatLog(`${c.enemy.name} phản kích${r.crit?' chí mạng':''}, ngươi chịu ${dmg} sát thương${notes.length?` (${notes.join(', ')})`:''}.${sp}`);
  tickCombatCooldowns(c);
  if(state.hp<=0 && !(state.tg && tgSeen() && tgTryRevive(c))){ loseCombat(); return; }
  render();
}

function usePillInCombat(){
  const r = consumeHealPill();
  if(!r){ combatLog('Trong người không còn đan liệu thương nào.'); render(); return; }
  combatLog(`Nuốt vội một viên ${r.name}, hồi ${r.heal} khí huyết.`);
  enemyTurn();
}
function tribulationHeal(){
  const r = consumeHealPill();
  if(!r){ addLog('Không còn đan liệu thương nào để trợ lực giữa các đợt lôi kiếp.'); render(); return; }
  addLog(`Giữa hai đợt lôi kiếp, ngươi vội nuốt ${r.name}, hồi ${r.heal} khí huyết.`);
  render();
}

function curSub(tabId){
  const d = NAV.find(n=>n.id===tabId);

  if(!vs.some(x=>x[0]===s)) s = vs[0][0];

function goTo(tab, sub){ state.subTabs[tab] = sub; setTab(tab); }

function renderTabs(){
  const el = document.getElementById('tabs');
  el.classList.toggle('locked', !!(state.combat || state.tribulation));
  el.innerHTML = NAV.map(n=>{
    const badge = (n.id==='tuluyen' && state.canBreak) ? '<span class="nav-badge"></span>' : '';

function renderSubnav(tabId){
  const d = NAV.find(n=>n.id===tabId);

function renderFeed(){

function statTile(label, val, icon){ return `<div class="stat-tile">${ic(icon)}<span class="st-v">${val}</span><span class="st-l">${label}</span></div>`; }
function profHeader(id, extraRows){
  const p = profDef(id); const lvl = profLvl(id);
  if(lvl<1){
    return `<div class="card prof-card">
      <div class="sec-title">${ic(PROF_ICON[id])} ${p.name}<span>chưa nhập môn</span></div>
      <p class="flavor">${p.desc}</p>

    </div>`;
  }
  const maxed = lvl>=p.maxLevel;
  const need = PROF_NEED[lvl]||1;
  const exp = state.profExp[id]||0;
  return `<div class="card prof-card">
    <div class="sec-title">${ic(PROF_ICON[id])} ${p.name}<span>cấp ${lvl}/${p.maxLevel}</span></div>
    <div class="bar-row"><div class="bar-label" style="width:64px;">Thành thạo</div>

      <div class="bar-num">${maxed?'Viên mãn':`${exp}/${need}`}</div></div>
    <p class="sec-note" style="margin:8px 0 0;">${p.desc}</p>
    ${extraRows||''}
  </div>`;
}
function recipeCard(o){
  const lvl = profLvl(o.prof);
  const learned = lvl>=1;
  const lvlOk = lvl>=o.minLvl;
  const ok = ingOk(o.ing);
  let rate;
  if(!learned) rate = `<span class="rate lo">Chưa nhập môn</span>`;
  else if(!lvlOk) rate = `<span class="rate lo">Cần cấp ${o.minLvl}</span>`;
  else rate = `<span class="rate ${o.chance>=70?'hi':o.chance>=40?'mid':'lo'}">Thành công ${o.chance}%</span>`;
  return `<div class="recipe ${learned&&lvlOk?'':'locked'}">
    <div class="recipe-head"><span class="rn">${o.title}</span>${o.owned!=null?`<span class="rc">đang có ${o.owned}</span>`:''}</div>
    ${o.desc?`<div class="rd">${o.desc}</div>`:''}
    ${ingChips(o.ing)}
    ${o.note?`<div class="rnote">${o.note}</div>`:''}
    <div class="recipe-foot">${rate}<button class="btn sm ${o.gold?'gold':''}" ${(!learned||!lvlOk||!ok||o.block)?'disabled':''} onclick="${o.action}">${o.btn||'Chế tác'}</button></div>
  </div>`;
}
function recipeFlag(ok, yes, no){ return `<span class="${ok?'ok-mark':'bad-mark'}">${ok?ic('check'):ic('warn')} ${ok?yes:no}</span>`; }

/* ---------- TU LUYỆN ---------- */
function breakChanceNow(){
  const mods = rootMods(state.root, state.realmIdx);
  const easeFactor = state.realmIdx<=2 ? 1 : 0.5;
  const danSuBonus = profLvl('danSu')*3;
  return {
    total: Math.min(95, Math.max(5, 55+state.buffStack*10+mods.breakEase*easeFactor+danSuBonus+state.breakthroughBoost+physiqueMods().breakBonus)),
    parts:[['Cơ bản',55],['Đan dược gần đây',state.buffStack*10],['Tư chất',Math.round(mods.breakEase*easeFactor)],['Luyện Đan Sư',danSuBonus],['Phá Cảnh Đan',state.breakthroughBoost]].filter(p=>p[1])
  };
}
function previewMeditateGain(){
  const base = Math.round(6 + state.realmIdx*4);
  const mods = rootMods(state.root, state.realmIdx);
  const pathTuViMult = (state.path && state.path.meditateMult) ? state.path.meditateMult : 1;
  const pm = physiqueMods();
  const physiqueEarlyMult = (state.realmIdx<=pm.earlyRealmCap) ? pm.earlyTuViMult : 1;
  return Math.max(1, Math.round(base*(1+tuViRateBonus())*mods.tuViMult*(1+state.caiMenhBonus)*pathTuViMult*physiqueEarlyMult*tuLinhMult()));
}
function renderCultivatePage(){
  const curRealm = MAJOR_REALMS[state.realmIdx];

  const r = realmStatsAt(state.realmIdx, state.subStage||0);
  const pct = r.tuViMax===Infinity ? 100 : Math.min(100, state.tuVi/r.tuViMax*100);
  const bc = breakChanceNow();
  const pills = PILL_NAMES.map((n,i)=>({n, t:i+1, have:state.pills[i+1]||0})).filter(p=>p.have>0);
  return `

      <div class="realm-world">${curRealm.world}</div>
      <div class="realm-name serif">${fullRealmName(state.realmIdx, state.subStage||0)}</div>

      ${!isFinal?`<div class="sec-note" style="margin:8px 0 0;">Tỷ lệ đột phá ${bc.total}%: ${bc.parts.map(p=>`${p[0]} ${p[1]>0&&p[0]!=='Cơ bản'?'+':''}${p[1]}%`).join(', ')}. Thất bại mất 35% tu vi và 20% khí huyết.</div>`:`<div class="sec-note" style="margin:8px 0 0;">Chín đợt lôi kiếp liên tiếp — chuẩn bị đủ đan liệu thương (${healPillCount()} viên).</div>`}

  if(!state.hasTranDo) auction.push({type:'tranDo', label:'Trận Đồ', cost:500});
  if(!state.hasKhoiLoiVe) auction.push({type:'khoiLoiVe', label:'Bản Vẽ Khôi Lỗi', cost:600});
  return `
    <div class="card"><div class="sec-title">${ic('hall')} Phường Thị<span>${state.spiritStones} linh thạch</span></div>
      <p class="sec-note" style="margin:0 0 6px;">Hàng phẩm giai cao chỉ bán cho tu sĩ đủ cảnh giới. Bán lại chỉ được 40% giá.${state.flags.discount?' Lệnh bài Lục gia: mọi món giảm 20% (giá niêm yết chưa trừ).':''}</p>
      <div class="mat-head">${ic('drop')} Đan dược</div>${pillRows}

}

/* ---------------- Dòng thời gian ----------------
   Mỗi canh giờ bế quan = 1 tháng, mỗi lần đột phá tốn nhiều năm, mỗi chuyến
   bí cảnh tốn 1 tháng. Bí cảnh có chu kỳ mở cửa tính theo năm thật trong game. */
function nowYears(){ return state.age + (state.month||0)/12; }
function advanceTime(months){
  accrueLuDich(months);
  state.month = (state.month||0) + months;
  while(state.month>=12){ state.month -= 12; state.age++; npcYearTick(); }
  checkRealmOpenings();
}
function npcYearTick(){
  NPCS.filter(n=>n.mortal).forEach(n=>{ const r = state.npcs && state.npcs[n.id]; if(!r || !r.met || r.dead || r.metYear==null) return;
    if(nowYears()-r.metYear>=n.mortal){ r.dead = true; let extra = '';
      if(r.favor>=50 && !r.boons.includes(100)){ r.boons.push(100); const m = gainProfExp('tranPhap', 80); extra = ` Nàng để lại cho ngươi bộ trận pháp thư ghi chép cả đời tâm huyết.${m}`; }
      addLog(`Tin dữ truyền tới: ${n.name} đã qua đời khi tuổi còn rất trẻ — Long Ngâm Chi Thể rốt cuộc không tha cho nàng.${extra}`); } });
  Object.keys(state.npcs||{}).forEach(id=>{
    const r = state.npcs[id];
    if(r.met && !r.dead && npcStatus(id)==='enemy') r.power = Math.round((r.power+0.02)*100)/100;
  });
}

/* ---------------- Bảo vật bất ngờ ---------------- */
const RELICS = [];
function hasRelic(id){ return !!(state && state.relics && state.relics.includes(id)); }
function relicDef(id){ return RELICS.find(r=>r.id===id); }
function relicMods(){
  const m = {atk:1, def:1, hp:1, crit:0};
  if(hasRelic('huyen_am_kinh')) m.crit += 5;
  if(hasRelic('ti_doc_chau')) m.hp *= 1.05;
  if(hasRelic('phan_thien_hoan')){ m.atk *= 1.06; m.crit += 3; }
  if(hasRelic('hon_nguyen_y')){ m.def *= 1.08; m.hp *= 1.08; }
  return m;
}
function grantRelic(id, how){
  const r = relicDef(id);
  if(!r){ const st = 500+state.realmIdx*300; state.spiritStones += st; return `${how||''}Thu được ${st} linh thạch.`; }
  if(hasRelic(id)){
    const stones = 300 + state.realmIdx*150;
    state.spiritStones += stones;
    return `${how||''}Lại là một ${r.name} — ngươi đã có rồi, đem bán được ${stones} linh thạch.`;
  }
  state.relics.push(id);
  computeStats();
  return `${how||''}Ngươi có được bảo vật 【${r.name}】! ${r.desc}`;
}
function randomRelicFor(z){
  const pool = RELICS.filter(r=>z>=r.minZ && z<=r.maxZ && !hasRelic(r.id));
  return pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
}

/* ---------------- Cơ duyên ---------------- */
const FORTUNES = [
  {id:'toa_hoa',    name:'Động Phủ Tiền Bối Tọa Hóa', minZ:0},
  {id:'linh_nhu',   name:'Vạn Niên Thạch Nhũ',        minZ:0},
  {id:'ngo_dao',    name:'Ngộ Đạo Dưới Cổ Thụ',       minZ:0},
  {id:'thien_tai',  name:'Thiên Tài Địa Bảo',         minZ:0},
  {id:'tay_tuy',    name:'Tẩy Tủy Linh Tuyền',        minZ:1},
  {id:'truyen_cong',name:'Tàn Hồn Truyền Công',       minZ:2},
  {id:'linh_thu',   name:'Ổ Trứng Linh Thú',          minZ:1},
  {id:'dan_lo',     name:'Đan Lô Cổ Bị Vùi Lấp',      minZ:0},
  {id:'tuc_nhuong', name:'Ngũ Sắc Tức Nhưỡng',        minZ:3}
];
function fortuneOk(f, z){
  if(z<f.minZ) return false;
  if(f.id==='tay_tuy' && state.caiMenhBonus>=0.3) return false;
  if(f.id==='linh_thu' && state.worm.have) return false;
  if(f.id==='dan_lo' && !getMissingRecipeOptions().length) return false;
  if(f.id==='tuc_nhuong' && state.tucNhuong) return false;
  return true;
}
function grantFortune(id, z){
  const f = FORTUNES.find(x=>x.id===id);
  const scale = 1+z*0.6;
  let msg = `Cơ duyên — 【${f.name}】: `;
  if(id==='toa_hoa'){
    const stones = Math.round(80*scale);
    state.spiritStones += stones;
    const learnable = TECHNIQUES.filter(t=>!state.learnedNames.includes(t.name));
    const manuals = ADVANCED_TECHNIQUES.filter(isAdvancedTechAccessible);
    msg += `bên bồ đoàn là bộ hài cốt ngồi ngay ngắn, túi trữ vật còn ${stones} linh thạch`;
    if(manuals.length && Math.random()<0.5){
      const t = manuals[Math.floor(Math.random()*manuals.length)];
      state.manuals.push(t.id);
      msg += `, cùng ngọc giản 【${t.name}】 (xem ở Nhân Vật ▸ Công Pháp).`;
    } else if(learnable.length){
      const base = learnable[Math.floor(Math.random()*learnable.length)];
      const t = {name:base.name, desc:base.desc, bonus:{}};
      Object.keys(base.bonus).forEach(k=>t.bonus[k] = k==='tuViRate' ? base.bonus[k] : Math.round(base.bonus[k]*(1+z*0.4)));
      state.techniques.push(t); state.learnedNames.push(base.name);
      msg += `, cùng di thư ghi 【${t.name}】 — ngươi lĩnh ngộ ngay tại chỗ.`;
    } else msg += '.';
  } else if(id==='linh_nhu'){
    const hp = Math.round(20*scale);
    state.statPillBonus.hp = (state.statPillBonus.hp||0)+hp;
    computeStats(); state.hp = state.stats.hpMax;
    msg += `giọt thạch nhũ vạn năm nhỏ xuống môi, thương thế lành hẳn, khí huyết tối đa vĩnh viễn +${hp}.`;
  } else if(id==='ngo_dao'){
    const tv = Math.round(previewMeditateGain()*6*(1+z*0.2));
    state.tuVi += tv;
    msg += `ngồi dưới cổ thụ ngàn năm, lá rơi mà tâm lặng, tu vi +${tv}.`;
  } else if(id==='thien_tai'){
    const t1 = Math.min(6, z+2), t2 = Math.min(6, z+3);
    state.herbs[t1] = (state.herbs[t1]||0)+3; state.herbs[t2] = (state.herbs[t2]||0)+1;
    msg += `một khóm linh dược chưa ai chạm tới — 3 ${HERB_NAMES[t1-1]} và 1 ${HERB_NAMES[t2-1]}.`;
  } else if(id==='tay_tuy'){
    state.caiMenhBonus = Math.min(0.3, state.caiMenhBonus+0.05);
    msg += `ngâm mình trong linh tuyền, tạp chất trong kinh mạch bị đẩy ra ngoài, tốc độ tu luyện vĩnh viễn +5% (tổng +${Math.round(state.caiMenhBonus*100)}%).`;
  } else if(id==='truyen_cong'){
    const sp = STAT_PILLS[Math.floor(Math.random()*STAT_PILLS.length)];
    state.statPillBonus[sp.stat] = (state.statPillBonus[sp.stat]||0)+sp.amount;
    msg += `một tia tàn hồn cổ tu truyền lại chút tinh hoa trước khi tiêu tán — ${sp.stat==='atk'?'công kích':sp.stat==='def'?'phòng ngự':sp.stat==='spd'?'thân pháp':'bạo kích'} vĩnh viễn +${sp.amount}${sp.stat==='crit'?'%':''}.`;
  } else if(id==='linh_thu'){
    const pt = PET_TYPES[Math.floor(Math.random()*PET_TYPES.length)];
    state.worm = {have:true, level:1, typeId:pt.id};
    msg += `một quả trứng còn ấm nứt vỡ trong tay, ${pt.name} chui ra nhận ngươi làm chủ.`;
  } else if(id==='tuc_nhuong'){
    state.tucNhuong = true;
    msg += 'một nắm đất năm màu tự sinh sôi — đất thần thoại nuôi sống kỳ hoa dị thảo. Từ nay mỗi lần dùng Tạo Hóa Lộ thúc dược liệu thu gấp đôi.';
  } else if(id==='dan_lo'){
    const opts = getMissingRecipeOptions();
    const r = opts[Math.floor(Math.random()*opts.length)];
    let label = '';
    if(r.type==='danPhuong'){ state.danPhuongTiers.push(r.tier); label = `Đan Phương ${PILL_NAMES[r.tier-1]}`; }
    else if(r.type==='khiPhuong'){ state.hasKhiPhuong = true; label = 'Khí Phương'; }
    else if(r.type==='khoiLoiVe'){ state.hasKhoiLoiVe = true; label = 'Bản Vẽ Khôi Lỗi'; }
    else { state.hasTranDo = true; label = 'Trận Đồ'; }
    msg += `trong lòng đan lô cổ còn khắc nguyên 【${label}】.`;
  }
  computeStats(); checkBreakthroughAvailable();
  return msg;
}
