function npcDef(id){ return NPCS.find(n=>n.id===id); }
function npcRel(id){
  if(!state.npcs[id]) state.npcs[id] = {met:false, favor:0, dead:false, power:0, boons:[], escapes:0, lastGift:-99};
  return state.npcs[id];
}
function npcStatus(id){
  const r = npcRel(id);
  if(r.dead) return 'dead';
  if(r.favor>=50) return 'friend';
  if(r.favor<=-30) return 'enemy';
  return 'neutral';
}
function npcStatusLabel(id){
  const r = npcRel(id), s = npcStatus(id);
  if(s==='dead') return 'Đã vẫn lạc';
  if(s==='enemy') return r.favor<=-80 ? 'Tử thù' : 'Thù địch';
  if(s==='friend') return r.favor>=80 ? 'Tri kỷ' : 'Thân thiết';
  return 'Trung lập';
}
function npcFavor(id, delta){
  const r = npcRel(id), n = npcDef(id);
  const before = npcStatus(id);
  r.met = true;
  if(r.metYear==null) r.metYear = nowYears();
  r.favor = Math.max(-100, Math.min(100, r.favor+delta));
  const after = npcStatus(id);
  if(before!==after){
    if(after==='friend') addLog(`${n.name} từ nay coi ngươi là người đáng tin.`);
    if(after==='enemy') addLog(`${n.name} đã ghi thù ngươi — kẻ này sẽ còn tìm tới.`);
  }
}
function npcNextBoon(id){
  const n = npcDef(id), r = npcRel(id);
  if(!n.boons || npcStatus(id)==='dead') return null;
  return n.boons.find(b=>r.favor>=b.at && !r.boons.includes(b.at)) || null;
}
function npcEnemyFor(id, fight){
  const n = npcDef(id), r = npcRel(id);
  const power = Math.min(MAJOR_REALMS.length-1, Math.max(n.minRealm, state.realmIdx) + ((fight&&fight.over)||n.over||0));
  const mult = ((fight&&fight.mult)||n.mult||1.3)*(1+r.power)*(r.tracked?0.75:1);
  return mkEnemy(power, (fight&&fight.name)||`${n.name} · ${n.title}`, mult);
}
const HERITAGE_OPTS = ['thanhNguyen','daiDien','map','phamThanh','luyenThan','bachMach','kinhChap','phamiet','channgon','tuenguyet','quangam','thienSat','ltExt','lucgiap','huyenthien','giaidao'];
function pickEventOpt(opts){
  if(state.intelHeritage){ const h = opts.filter(o=>HERITAGE_OPTS.includes(o)); if(h.length){ state.intelHeritage = false; return h[Math.floor(Math.random()*h.length)]; } }
  return opts[Math.floor(Math.random()*opts.length)];
}
function mkEnemy(power, name, mult, extra){
  const p = Math.min(Math.max(0,power), MAJOR_REALMS.length-1);
  const baseR = realmStatsAt(p, 1);
  const j = 0.85+Math.random()*0.3;
  return Object.assign({
    name,
    hpMax: Math.round(baseR.hp*(0.55+p*0.05)*mult*j),
    atk:   Math.round(baseR.atk*0.6*mult*j),
    def:   Math.round(baseR.def*0.55*mult),
    spd:   Math.round(baseR.spd*0.7*mult),
    isBoss: mult>=1.6
  }, extra||{});
}

function grantBoon(id, b){
  const r = npcRel(id), n = npcDef(id), g = b.grant;
  r.boons.push(b.at);
  const parts = [];
  if(g.recipe){ const opts = getMissingRecipeOptions().filter(o=>o.type==='danPhuong'); if(opts.length){ state.danPhuongTiers.push(opts[0].tier); parts.push(`Đan Phương ${PILL_NAMES[opts[0].tier-1]}`); } else { state.spiritStones += 300; parts.push('300 linh thạch'); } }
  if(g.herbs) g.herbs.forEach(([t,c])=>{ state.herbs[t]=(state.herbs[t]||0)+c; parts.push(`${c} ${HERB_NAMES[t-1]}`); });
  if(g.profExp){ const [pid,amt] = g.profExp; if(profLvl(pid)<1){ state.professions[pid]=1; parts.push(`nhập môn ${profDef(pid).name}`); } const m = gainProfExp(pid, amt); parts.push(`${amt} thành thạo ${profDef(pid).name}${m?' — '+m.trim():''}`); }
  if(g.tech){ if(!state.learnedNames.includes(g.tech.name)){ state.techniques.push({...g.tech}); state.learnedNames.push(g.tech.name); parts.push(`công pháp 【${g.tech.name}】`); } }
  if(g.statpill){ const sp = STAT_PILLS.find(p=>p.id===g.statpill); state.statPillBonus[sp.stat]=(state.statPillBonus[sp.stat]||0)+sp.amount; parts.push(`${sp.name} (+${sp.amount}${sp.stat==='crit'?'%':''} vĩnh viễn)`); }
  if(g.caimenh){ state.caiMenhBonus = Math.min(0.36, state.caiMenhBonus+g.caimenh); parts.push(`tốc độ tu luyện vĩnh viễn +${Math.round(g.caimenh*100)}%`); }
  if(g.heal){ computeStats(); state.hp = state.stats.hpMax; parts.push('hồi phục toàn bộ khí huyết'); }
  if(g.manual){ const pool = ADVANCED_TECHNIQUES.filter(isAdvancedTechAccessible); if(pool.length){ const t = pool[Math.floor(Math.random()*pool.length)]; state.manuals.push(t.id); parts.push(`bí kíp 【${t.name}】`); } else { state.spiritStones += 500; parts.push('500 linh thạch'); } }
  if(g.discount){ state.flags.discount = true; parts.push('giảm 20% giá ở Phường Thị'); }
  if(g.map){ const h = ng().huThien; if(!h.have && h.maps<3){ h.maps++; parts.push(`Hư Thiên Tàn Đồ (${h.maps}/3)`); } else { state.spiritStones += 800; parts.push('800 linh thạch'); } }
  if(g.kiemQuyet){ const tn = ng().thanhNguyen; if(!tn.have){ tn.have = true; tn.layer = 0; parts.push('ngọc giản 【Thanh Nguyên Kiếm Quyết】'); } else if(!state.learnedNames.includes('Cô Hàn Kiếm Ý')){ state.techniques.push({name:'Cô Hàn Kiếm Ý', desc:'Kiếm ý cô độc lạnh lẽo, chiêu nào cũng nhắm chỗ hiểm.', bonus:{crit:10, atk:20}}); state.learnedNames.push('Cô Hàn Kiếm Ý'); parts.push('công pháp 【Cô Hàn Kiếm Ý】'); } }
  if(g.breakPill){ state.breakPills[g.breakPill] = (state.breakPills[g.breakPill]||0)+1; parts.push(BREAK_PILLS.find(p=>p.id===g.breakPill).name); }
  if(g.tuvi){ const tv = previewMeditateGain()*12*g.tuvi; state.tuVi += tv; parts.push(`${tv} tu vi`); }
  if(g.recipeKey){ state[{khiPhuong:'hasKhiPhuong',tranDo:'hasTranDo',khoiLoiVe:'hasKhoiLoiVe'}[g.recipeKey]] = true; parts.push({khiPhuong:'Khí Phương',tranDo:'Trận Đồ',khoiLoiVe:'Bản Vẽ Khôi Lỗi'}[g.recipeKey]); }
  if(g.boost){ state.breakthroughBoost = Math.min(60, state.breakthroughBoost+g.boost); parts.push(`tỷ lệ đột phá kế tiếp +${g.boost}%`); }
  if(g.introNpc){ const rr = npcRel(g.introNpc); rr.met = true; if(rr.metYear==null) rr.metYear = nowYears(); if(rr.favor<30) rr.favor = 30; parts.push(`quen biết ${npcDef(g.introNpc).name}`); }
  if(g.blood){ addBlood(g.blood); parts.push(`chân huyết ${bloodName(g.blood)}`); }
  if(g.rep){ addRep(g.rep[0], g.rep[1]); parts.push(`danh vọng ${LG_RACES[g.rep[0]].name} +${g.rep[1]}`); }
  let tail = '';
  if(g.fortune) tail += ' ' + grantFortune(g.fortune, Math.max(2, state.realmIdx));
  if(g.relic) tail += ' ' + grantRelic(g.relic);
  computeStats(); checkBreakthroughAvailable();
  return `${n.name}: ${b.text}${parts.length?` Nhận được ${parts.join(', ')}.`:''}${tail}`;
}
function claimBoon(id){
  const b = npcNextBoon(id);
  if(!b) return;
  addLog(grantBoon(id, b)); render();
}

function reqOk(req){
  if(!req) return true;
  if(req.stones && state.spiritStones<req.stones) return false;
  if(req.heal && healPillCount()<req.heal) return false;
  if(req.talisman && !(state.talismans[req.talisman]>0)) return false;
  if(req.mat && (state.mats[req.mat[0]][req.mat[1]]||0)<req.mat[2]) return false;
  if(req.herb && (state.herbs[req.herb[0]]||0)<req.herb[1]) return false;
  return true;
}
function reqLabel(req){
  if(!req) return '';
  if(req.stones) return `${req.stones} linh thạch`;
  if(req.heal) return 'cần đan liệu thương';
  if(req.talisman) return `cần ${TALISMANS.find(t=>t.id===req.talisman).name}`;
  if(req.mat) return `cần ${req.mat[2]} ${matName(req.mat[0],req.mat[1])}`;
  if(req.herb) return `cần ${req.herb[1]} ${HERB_NAMES[req.herb[0]-1]}`;
  return '';
}
function canSeeThrough(){ return isHonTu() || hasRelic('thanh_tam_boi') || phaMietOpen(); }

/* Chọn NPC xuất hiện theo nơi chốn */
function npcCandidates(ctx){
  return NPCS.filter(n=>{
    const r = npcRel(n.id);
    if(r.dead || state.realmIdx<n.minRealm) return false;
    if(ctx.zone!=null) return n.zones.includes(ctx.zone);
    if(ctx.region) return n.regions.includes(ctx.region);
    return false;
  });
}
function npcEncounterAt(ctx){
  const pool = npcCandidates(ctx);
  if(!pool.length) return false;
  const weighted = [];
  pool.forEach(n=>{
    const r = npcRel(n.id), s = npcStatus(n.id);
    const w = !r.met ? 3 : s==='enemy' ? 2.5 : (s==='friend' && npcNextBoon(n.id)) ? 2 : 1;
    for(let i=0;i<w*2;i++) weighted.push(n);
  });
  const n = weighted[Math.floor(Math.random()*weighted.length)];
  meetNpc(n.id);
  return true;
}
function meetNpc(id){
  const n = npcDef(id), r = npcRel(id), s = npcStatus(id);
  if(!r.met){
    presentEvent({title:n.name, sub:n.title, icon:n.icon, text:n.intro,
      options:n.options.map((o,i)=>({label:o.label, req:o.req, reqSee:o.reqSee, act:'npcIntro', args:[id,i]}))});
    return;
  }
  if(s==='enemy'){
    const goon = n.goon && Math.random()<0.5;
    const e = npcEnemyFor(id, goon?{name:n.goon, mult:1.3}:null);
    e.npcId = id; e.npcHostile = !goon;
    presentEvent({title:n.name, sub:npcStatusLabel(id), icon:n.icon,
      text: goon ? `Đám ${n.goon} do ${n.name} phái tới đã chặn sẵn phía trước.` : `${n.name} lại xuất hiện, sát khí còn nặng hơn lần trước.`,
      options:[{label:'Nghênh chiến', act:'fightEnemy', args:[e]}, ...(state.talismans.than_hanh>0?[{label:'Dùng Độn Không Phù độn tẩu', act:'fleeTalisman', args:[id]}]:[])]});
    return;
  }
  if(s==='friend'){
    const b = npcNextBoon(id);
    if(b){ addLog(grantBoon(id, b)); return; }
    const heal = Math.round(state.stats.hpMax*0.3);
    state.hp = Math.min(state.stats.hpMax, state.hp+heal);
    npcFavor(id, 3);
    addLog(`Tình cờ gặp lại ${n.name}. Hàn huyên một lúc, ngươi hồi ${heal} khí huyết. (Hảo cảm ${r.favor})`);
    return;
  }
  npcFavor(id, 5);
  addLog(`Gặp lại ${n.name} (${n.title}). Hai bên gật đầu chào, hảo cảm nhích lên đôi chút (${r.favor}).`);
}

function presentEvent(ev){ state.pendingEvent = ev; }
const EVENT_ACTS = {
  npcIntro(id, i){
    const n = npcDef(id), o = n.options[i];
    if(o.req && !reqOk(o.req)) return;
    if(o.consume && o.consume.talisman) state.talismans[o.consume.talisman]--;
    if(o.req && o.req.stones) state.spiritStones -= o.req.stones;
    if(o.req && o.req.heal) consumeHealPill();
    if(o.req && o.req.mat) state.mats[o.req.mat[0]][o.req.mat[1]] -= o.req.mat[2];
    if(o.req && o.req.herb) state.herbs[o.req.herb[0]] -= o.req.herb[1];
    if(o.reward) state.spiritStones += o.reward;
    npcRel(id).met = true;
    let extra = '';
    if(o.pay){ const lost = Math.round(state.spiritStones*o.pay); state.spiritStones -= lost; extra += ` Mất ${lost} linh thạch.`; }
    if(o.hurt){ const d = Math.round(state.stats.hpMax*o.hurt); state.hp = Math.max(1, state.hp-d); extra += ` Chịu ${d} sát thương.`; if(state.expd) state.expd.mods.lootMult = o.loot||1; }
    if(o.kill){
      npcRel(id).dead = true; npcRel(id).favor = -100;
      const tv = Math.round(realmStatsAt(state.realmIdx, state.subStage||0).tuViMax*0.35);
      state.tuVi += tv; extra += ` Tu vi +${tv}.`;
      checkBreakthroughAvailable();
      addLog(`${o.text}${extra}`); return;
    }
    if(o.ally && state.expd){ state.expd.flags.docNuong = true; }
    if(o.favor) npcFavor(id, o.favor);
    addLog(`${o.text}${extra}`);
    if(o.fight){
      const e = npcEnemyFor(id, o.fight);
      e.npcId = id; e.npcHostile = !o.fight.name && n.kind==='enemy';
      e.winFavor = o.fight.winFavor; e.loseFavor = o.fight.loseFavor; e.winStones = o.fight.winStones; e.duel = o.fight.duel; e.sideEnemy = o.fight.sideEnemy;
      if(o.fight.name==null && n.kind==='friend') e.npcHostile = true;
      startCombat(e);
    }
  },
  fightEnemy(e){ startCombat(e); },
  fleeTalisman(id){ state.talismans.than_hanh--; addLog(`Độn quang lóe lên, ngươi thoát khỏi ${npcDef(id).name} trong gang tấc.`); },
  expd(key, choice){ EXPD_CHOICES[key](choice); },
  ok(){}
};
function chooseOption(i){
  const ev = state.pendingEvent;
  if(!ev) return;
  const o = ev.options[i];
  if(o.req && !reqOk(o.req)) return;
  if(o.reqSee && !canSeeThrough()) return;
  state.pendingEvent = null;
  EVENT_ACTS[o.act](...(o.args||[]));
  checkBreakthroughAvailable();
  render();
}
function renderEventCard(){
  const ev = state.pendingEvent;
  if(!ev || state.combat) return '';
  return `<div class="card event-card">
    <div class="ev-head">${ev.icon?`<span class="ev-sigil">${ic(ev.icon,'keep')}</span>`:''}<div><div class="ev-title serif">${ev.title}</div>${ev.sub?`<div class="ev-sub">${ev.sub}</div>`:''}</div></div>
    <p class="ev-text">${ev.text}</p>
    <div class="ev-opts">${ev.options.map((o,i)=>{
      const ok = reqOk(o.req) && (!o.reqSee || canSeeThrough());
      const note = !reqOk(o.req) ? reqLabel(o.req) : (o.reqSee && !canSeeThrough()) ? 'cần Hồn Tu hoặc Phá Miệt Pháp Mục' : (o.note||'');
      return `<button class="btn ${i===0?'':'ghost'} ev-opt" ${ok?'':'disabled'} onclick="chooseOption(${i})">${o.label}${note?`<small>${note}</small>`:''}</button>`;
    }).join('')}</div>
  </div>`;
}

/* ---------------- Lịch mở cửa ---------------- */
function realmSched(z){
  const R = REALMS[z];
  if(!R.cycle) return null;
  if(!state.realmSched[z]){
    if(state.realmIdx<z) return null;
    state.realmSched[z] = {nextOpen: Math.floor(nowYears())+R.firstDelay, visited:false, announced:false};
  }
  const s = state.realmSched[z];
  while(nowYears() >= s.nextOpen+R.window || (s.visited && nowYears()>=s.nextOpen)){
    if(!s.visited && !s.missedLogged){ s.missedLogged = true; }
    s.nextOpen += R.cycle; s.visited = false; s.announced = false; s.missedLogged = false;
  }
  return s;
}
function realmOpenInfo(z){
  const R = REALMS[z];
  if(state.realmIdx<z) return {open:false, label:`Cần ${MAJOR_REALMS[z].name}`, cls:'lock'};
  if(!R.cycle) return {open:true, label:'Luôn mở', cls:'open'};
  const s = realmSched(z), t = nowYears();
  if(t>=s.nextOpen && !s.visited){
    const left = Math.ceil(s.nextOpen+R.window-t);
    return {open:true, label:`Đang mở — còn ${left} năm`, cls:'hot'};
  }
  const wait = Math.ceil(s.nextOpen-t);
  return {open:false, label:`Mở cửa sau ${wait} năm`, cls:'wait'};
}
function checkRealmOpenings(){
  if(!state.realmSched) return;
  REALMS.forEach(R=>{
    if(!R.cycle || state.realmIdx<R.z) return;
    const s = realmSched(R.z);
    if(nowYears()>=s.nextOpen && !s.visited && !s.announced){
      s.announced = true;
      addLog(`Thiên địa dị động — ${ZONES[R.z].name} đã mở cửa! Chỉ kéo dài ${Math.ceil(s.nextOpen+R.window-nowYears())} năm.`);
    }
  });
}

function emptyLoot(){ return {stones:0, herbs:{}, mats:{}, thao:0, thaoSet:{}, huyettinh:0}; }
function enterRealm(z){
  if(state.expd || state.combat) return;
  const info = realmOpenInfo(z);
  if(!info.open){ addLog(`${ZONES[z].name}: ${info.label}.`); render(); return; }
  const R = REALMS[z];
  if(R.cycle) realmSched(z).visited = true;
  state.expd = {z, step:0, loot:emptyLoot(), mods:{pressure:0, streak:0, lootMult:1, nextEnemyMult:1, rule:null}, flags:{}, log:[], done:false};
  state.currentZone = z;
  state.activeTab = 'hanhtau'; state.subTabs.hanhtau = 'bicanh';
  expLog(`Ngươi bước qua cửa ${ZONES[z].name}. ${R.cycle?`Cửa sẽ đóng sau ${R.steps} ${R.unit.toLowerCase()}.`:''}`);
  render(); window.scrollTo(0,0);
}
function expLog(msg){
  if(state.expd){ state.expd.log.unshift(msg); if(state.expd.log.length>40) state.expd.log.pop(); }
  addLog(msg);
}
function lootMult(){ return (state.expd && state.expd.mods.lootMult) || 1; }
function lootStones(n){
  const L = state.expd.loot;
  let v = Math.round(n*lootMult()*(hasRelic('tu_bao_bon')?1.25:1)*(1+(state.expd.mods.streak||0)*0.1));
  L.stones += v; return v;
}
function lootHerb(t, n){ n = Math.round(n*lootMult()); state.expd.loot.herbs[t] = (state.expd.loot.herbs[t]||0)+n; return `${n} ${HERB_NAMES[t-1]}`; }
function lootMat(k, t, n){ n = Math.round(n*lootMult()); const m = state.expd.loot.mats; m[k] = m[k]||{}; m[k][t] = (m[k][t]||0)+n; return `${n} ${matName(k,t)}`; }
function expEnemy(name, mult, extra){
  const E = state.expd, R = REALMS[E.z];
  const e = mkEnemy(E.z, name, mult*(E.mods.nextEnemyMult||1), Object.assign({expd:true, noTreasure:!!R.noTreasure}, extra||{}));
  E.mods.nextEnemyMult = 1;

}
function expFightRandom(){
  const E = state.expd;
  const pool = ENEMY_NAMES[E.z];
  let name = pool[Math.floor(Math.random()*pool.length)];
  const boss = Math.random()<0.12;

function expAdvance(){
  const E = state.expd, R = REALMS[E.z];
  if(!E || state.pendingEvent || state.combat || E.done) return;
  E.step++;
  E.mods.lootMult = 1;
  expLog(`— ${R.unit} ${E.step}/${R.steps} —`);
  if(expHazard()) { if(!state.expd) return; }
  if(state.hp<=0){ state.hp = 1; }
  if(E.step>=R.steps){ expFinal(); render(); return; }
  if(phyId()==='huyen_am' && Math.random()<(hasTech('Liễm Tức Thuật')?0.03:0.05)){ state.physiqueKnown = true; expLog('Một ma tu cảm nhận được Âm khí thuần khiết trên người ngươi, mắt đỏ ngầu lao tới — hắn muốn bắt ngươi làm lô đỉnh!'); startCombat(expEnemy('Ma Tu Săn Lô Đỉnh', 1.4)); return; }
  if(E.z===0 && E.loot.thao>0 && Math.random()<Math.min(0.5, 0.1*E.loot.thao)){
    expLog('Mùi linh thảo trên người ngươi đã thu hút kẻ khác — đệ tử phe địch phục kích!');
    startCombat(expEnemy('Đệ Tử Phe Địch Phục Kích', 1.25)); return;
  }
  if(R.pathChoice){
    presentEvent({title:'Vùng nứt không gian', icon:'warn', text:'Không khí phía trước méo mó như mặt nước. Vết nứt không gian vô hình có thể nằm ở bất kỳ đâu.',
      options:[{label:'Dò đường cẩn thận', note:isHonTu()?'thần thức Hồn Tu: rất an toàn':'ít nguy hiểm, ít bảo vật', act:'expd', args:['path','slow']},
               {label:'Xông thẳng tới trước', note:'nguy hiểm, nhiều bảo vật', act:'expd', args:['path','fast']}]});
    render(); return;
  }
  const forced = R.forced && R.forced[E.step];
  expRunEvent(forced || pickWeighted(R.pool));
  render();
}
function pickWeighted(pool){
  const total = pool.reduce((s,p)=>s+p[1],0);
  let r = Math.random()*total;
  for(const [k,w] of pool){ r -= w; if(r<=0) return k; }
  return pool[0][0];
}
function expHazard(){
  const E = state.expd, R = REALMS[E.z], hp = state.stats.hpMax;
  if(R.hazard==='poison'){
    if(hasRelic('ti_doc_chau') || hasAcq('chan_long')) expLog('Độc chướng lượn lờ nhưng nhục thân vạn độc bất xâm.');
    else { const d = Math.max(1, Math.round(hp*0.04)); state.hp = Math.max(1, state.hp-d); expLog(`Độc chướng thấm vào phổi, mất ${d} khí huyết.`); }
  } else if(R.hazard==='pressure'){
    if(!hasAcq('huyen_khieu')) E.mods.pressure = Math.min(10, E.mods.pressure+1); computeStats();
    expLog(`Áp lực không gian đè nặng thêm (công thủ −${Math.round(Math.min(0.5, E.mods.pressure*0.05*(state.path.id==='the'?0.5:1))*100)}%).`);
  } else if(R.hazard==='thunder'){
    if(Math.random()<0.3){ const d = Math.round(hp*0.1*(1-Math.min(0.4,state.phapTacInsight*0.1))); state.hp = Math.max(1, state.hp-d); expLog(`Một đạo lôi đình giáng thẳng xuống, mất ${d} khí huyết.`); }
  } else if(R.hazard==='grief'){
    if(state.hp < hp*0.5){ const d = Math.round(hp*0.06); state.hp = Math.max(1, state.hp-d); expLog(`Tàn hồn bám riết lấy kẻ suy yếu, rút đi ${d} khí huyết.`); }
  } else if(R.hazard==='chaos'){
    const rule = CHAOS_RULES[Math.floor(Math.random()*CHAOS_RULES.length)];
    E.mods.rule = rule.id;
    if(rule.id==='weak') E.mods.nextEnemyMult = 0.7;
    if(rule.id==='strong') E.mods.nextEnemyMult = 1.4;
    if(rule.id==='loot2') E.mods.lootMult = 2;
    if(rule.id==='drain') state.hp = Math.max(1, state.hp-Math.round(hp*0.08));
    if(rule.id==='mend') state.hp = Math.min(hp, state.hp+Math.round(hp*0.2));
    if(rule.id==='skip') advanceTime(24);
    expLog(`Quy luật thiên địa đổi chiều: ${rule.text}`);
  } else if(R.hazard==='timeflow'){
    const y = 1+Math.floor(Math.random()*3); advanceTime(y*12);
    expLog(`Dòng thời gian cuộn xoáy — ${y} năm trôi qua trong một bước chân.`);
  } else if(R.hazard==='void'){
    if(Math.random()<0.1 && E.loot.stones>0){ const lost = Math.round(E.loot.stones*0.2); E.loot.stones -= lost; expLog(`Hư vô nuốt mất ${lost} linh thạch trong túi.`); }
  }
  return false;
}

function expRunEvent(type){
  const E = state.expd, z = E.z, R = REALMS[z];
  const t = zoneMatTier(z);
  if(type==='fight'){ expFightRandom(); return; }
  if(type==='misc'){ rareEvent(Math.min(z, 4)); return; }
  if(type==='herb'){ const a = Math.min(6, z+1), b = Math.min(6, z+2); expLog(`Hái được ${lootHerb(Math.random()<0.6?a:b, 1+Math.floor(Math.random()*2))}.`); return; }
  if(type==='mat'){ const k = ['khoang','moc','huyet','yeudan'][Math.floor(Math.random()*4)]; expLog(`Thu được ${lootMat(k, t, 1+Math.floor(Math.random()*3))}.`); return; }
  if(type==='stones'){ expLog(`Nhặt được ${lootStones(30+z*40+Math.random()*30)} linh thạch rơi vãi.`); return; }
  if(type==='trap'){
    const tranPhap = profLvl('tranPhap');
    const d = Math.max(1, Math.round(state.stats.hpMax*(0.1+z*0.01)*(1-tranPhap*0.08)*(hasRelic('huyen_am_kinh')?0.5:1)*physiqueMods().trapDmgMult));

    expLog(`${R.trap||'Chạm phải cấm chế tàn lưu'}, mất ${d} khí huyết.${hasRelic('huyen_am_kinh')?' Huyền Âm Kính đã soi ra trước một nửa.':''}`); return;
  }
  if(type==='rest'){ const h = Math.round(state.stats.hpMax*0.3); state.hp = Math.min(state.stats.hpMax, state.hp+h); expLog(`Gặp một trạm dừng chân của tán tu, nghỉ ngơi hồi ${h} khí huyết.`); return; }
  if(type==='npc'){ if(!npcEncounterAt({zone:z})) expRunEvent('mat'); return; }
  if(type==='fortune'){
    const pool = FORTUNES.filter(f=>fortuneOk(f,z));
    if(!pool.length){ expRunEvent('stones'); return; }
    expLog(grantFortune(pool[Math.floor(Math.random()*pool.length)].id, z)); return;
  }
  if(type==='relic'){

    const how = ['Dưới lớp bụi dày, một vật phát ra ánh sáng mờ ảo. ','Xác một tu sĩ vô danh vẫn nắm chặt thứ gì đó trong tay. ','Đá vỡ, lộ ra một hộp ngọc phong ấn. '][Math.floor(Math.random()*3)];

  if(type==='huyettinh'){ const n = 1+(Math.random()<0.35?1:0); E.loot.huyettinh += n; expLog(`Đào được ${n} viên Huyết Tinh đỏ thẫm trong khe đá (đang mang ${E.loot.huyettinh}).`); return; }
  if(type==='linhkhi'){ const tv = previewMeditateGain()*8; state.tuVi += tv; expLog(`Linh khí nơi đây đặc tới mức ngưng thành sương, tĩnh tọa chốc lát tu vi +${tv}.`); return; }
  if(type==='loitinh'){

  }
  if(type==='daotac'){ const tv = previewMeditateGain()*14; state.tuVi += tv; expLog(`Chạm vào một sợi đạo tắc hữu hình, thức hải chấn động — tu vi +${tv}.`); return; }
  if(type==='illusion'){
    if(hasRelic('thanh_tam_boi') || phaMietOpen() || physiqueMods().soulGuard){ const tv = previewMeditateGain()*3; state.tuVi += tv; expLog(`Huyễn cảnh ập tới nhưng tâm thần ngươi vững như gương, ngươi đi thẳng qua và ngộ ra đôi điều (tu vi +${tv}).`); return; }
    const chance = Math.min(95, 45+state.realmIdx*6+(isHonTu()?25:0)+(ng().daiDien.have?ng().daiDien.layer*8:0));
    presentEvent({title:'Ải Huyễn Cảnh', icon:'eye', text:'Cảnh vật tan chảy. Người thân đã khuất đứng trước mặt ngươi, gọi tên ngươi thật khẽ...',
      options:[{label:'Giữ vững tâm thần, bước thẳng qua', note:`${chance}% vượt qua, thành công được lĩnh ngộ`, act:'expd', args:['illusion', chance]},
               {label:'Nhắm mắt lần theo vách tường', note:'chắc chắn qua nhưng bị cấm chế cào xước', act:'expd', args:['illusion', -1]}]});
    return;

  if(type==='laoquai'){

      options:[{label:'Khai quật', note:'tiên bảo hoặc oán niệm', act:'expd', args:['tomb','open']},
               {label:'Thắp hương bái tế rồi đi qua', note:'an toàn', act:'expd', args:['tomb','pray']}]});

               {label:'Lặng lẽ tránh đi', act:'expd', args:['faction','none']}]});

const EXPD_CHOICES = {
  path(mode){
    const E = state.expd;
    const risk = (mode==='slow' ? (isHonTu()?0.05:0.12) : 0.35)*(phaMietOpen()?0.5:1);
    if(Math.random()<risk){
      const d = Math.round(state.stats.hpMax*0.3*(hasRelic('pha_khong_toa')?0.4:1));
      state.hp = Math.max(1, state.hp-d);
      expLog(`Xoẹt — một vết nứt không gian lướt qua người, máu tươi bắn ra, mất ${d} khí huyết!${hasRelic('pha_khong_toa')?' Phá Không Toa đã đỡ phần lớn.':''}`);
    } else expLog(mode==='slow' ? 'Từng bước dò dẫm, ngươi an toàn vượt qua vùng nứt.' : 'Ngươi lao vút qua vùng nứt không gian, may mắn không sứt mẻ gì.');
    if(mode==='fast') E.mods.lootMult = 1.8;
    expRunEvent(pickWeighted(REALMS[E.z].pool));
  },
  illusion(chance){
    if(chance<0){ const d = Math.round(state.stats.hpMax*0.12); state.hp = Math.max(1, state.hp-d); expLog(`Ngươi lần mò qua ải, bị cấm chế cào rách da thịt, mất ${d} khí huyết.`); return; }
    if(Math.random()*100<chance){ const tv = previewMeditateGain()*4; state.tuVi += tv; expLog(`Ngươi mỉm cười bước qua ảo ảnh. Tâm cảnh vững thêm một bậc, tu vi +${tv}.`); }
    else { const tl = Math.round(state.tuVi*0.1), d = Math.round(state.stats.hpMax*0.15); state.tuVi -= tl; state.hp = Math.max(1, state.hp-d); expLog(`Ngươi sa vào huyễn cảnh hồi lâu mới tỉnh, tâm thần tổn thương: mất ${tl} tu vi và ${d} khí huyết.`); }
  },
  tomb(mode){
    const E = state.expd;
    if(mode==='pray'){ const tv = Math.round(previewMeditateGain()*2); state.tuVi += tv; expLog(`Ngươi bái lạy ba lần. Gió âm thổi qua, như có ai gật đầu. Tu vi +${tv}.`); return; }
    const r = Math.random();
    if(r<0.3){ const rel = randomRelicFor(E.z); if(rel){ expLog(grantRelic(rel.id, 'Nắp quan tài trượt ra, ánh bảo quang chói mắt. ')); return; } }
    if(r<0.62){ expLog(`Trong quan tài là túi trữ vật của tiên nhân: ${lootStones(250+E.z*80)} linh thạch và ${lootMat('yeudan', zoneMatTier(E.z), 2)}.`); return; }
    expLog('Nắp quan tài vừa hé, oán niệm ngàn năm cuộn trào ra!');
    startCombat(expEnemy('Oán Niệm Tiên Nhân', 1.6));
  },
  faction(side){
    if(side==='none'){ expLog('Ngươi lặng lẽ đi vòng qua chiến trường tàn hồn.'); return; }
    startCombat(expEnemy(side==='tien'?'Ma Tộc Tàn Hồn':'Tiên Tộc Tàn Hồn', 1.5, {factionReward: side==='tien'?'def':'atk'}));
  },
  tombFinal(mode){
    const E = state.expd;
    if(mode==='leave'){ state.caiMenhBonus = Math.min(0.36, state.caiMenhBonus+0.03); expLog('Ngươi cúi đầu lui ra. Một luồng tiên khí nhẹ nhàng thấm vào kinh mạch — tốc độ tu luyện vĩnh viễn +3%.'); E.done = true; return; }
    const rel = randomRelicFor(E.z);
    if(rel) expLog(grantRelic(rel.id, 'Quan tài chính mở ra. '));
    if(!lg().luyenThan.have && Math.random()<0.4) expLog('Dưới gối tiên nhân có một mảnh ngọc giản khắc chữ Tiên Giới. '+grantLgHeritage('luyenThan'));
    expLog('Thi thể tiên nhân bỗng mở mắt!');
    startCombat(expEnemy('Thi Tiên Tỉnh Giấc', 2.2, {finalBoss:true}));
  },
  daotac(mode){
    const E = state.expd;
    if(mode==='insight'){ const tv = previewMeditateGain()*40; state.tuVi += tv; if(state.phapTacInsight<4) state.phapTacInsight++; advanceTime(120); expLog(`Ngươi ngồi xuống bên nguồn đạo tắc, mở mắt ra đã mười năm — tu vi +${tv}, pháp tắc lĩnh ngộ ${state.phapTacInsight}/4.`); }
    else expLog(`Ngươi thu gom tinh hoa đạo tắc kết tinh: ${lootStones(2500)} linh thạch.`);
    E.done = true;
  }
};

function expFinal(){
  const E = state.expd, R = REALMS[E.z];
  if(R.final==='hs_exit'){
    if(E.loot.thao>0 && Math.random()<0.65){
      expLog('Trước cửa ra, đệ tử phe địch đã giăng sẵn phục binh để đoạt linh thảo!');
      startCombat(expEnemy('Đệ Tử Phe Địch Chặn Cửa Ra', 1.4, {finalBoss:true}));
    } else { expLog('Cửa cấm chế rung chuyển sắp đóng — ngươi là một trong số ít người bước ra được.'); E.done = true; }
    return;
  }
  if(R.final==='tomb_final'){
    presentEvent({title:'Mộ Chính Của Tiên Nhân', icon:'ding', text:'Chín cỗ quan tài xếp thành vòng tròn quanh một cỗ quan tài ngọc. Khí tức bên trong khiến ngươi run rẩy.',
      options:[{label:'Mở quan tài ngọc', note:'bảo vật + trận chiến sinh tử', act:'expd', args:['tombFinal','open']},{label:'Cúi đầu rời đi', note:'nhận một tia tiên khí', act:'expd', args:['tombFinal','leave']}]});
    return;
  }
  if(R.final==='daotac_final'){
    presentEvent({title:'Đạo Tắc Chi Nguyên', icon:'taiji', text:'Trước mặt là nơi mọi pháp tắc khởi sinh. Ngồi xuống lĩnh ngộ có thể mất cả chục năm.',
      options:[{label:'Ngồi xuống lĩnh ngộ', note:'tu vi cực lớn, trôi qua 10 năm', act:'expd', args:['daotac','insight']},{label:'Thu gom tinh hoa rồi đi', note:'linh thạch', act:'expd', args:['daotac','loot']}]});
    return;
  }
  const [name, mult] = R.boss;
  expLog(`Tầng sâu nhất — ${name} chắn ngang lối đi.`);

}
function finalReward(z){
  const E = state.expd, t = zoneMatTier(z), parts = [];
  if(z===1){ parts.push(lootMat('yeudan',1,2), lootMat('khoang', Math.min(2,t+1), 3)); }
  else if(z===2){ parts.push(`${lootStones(400)} linh thạch`); const h = ng().huThien; if(!h.have && h.maps<3){ h.maps++; parts.push(`Hư Thiên Tàn Đồ (${h.maps}/3)`); } if(Math.random()<0.5){ const r = randomRelicFor(z); if(r) expLog(grantRelic(r.id,'Trong bảo khố: ')); } }
  else if(z===3){ parts.push(lootMat('yeudan',2,2), `${lootStones(500)} linh thạch`); if(Math.random()<0.4){ const r = randomRelicFor(z); if(r) expLog(grantRelic(r.id,'Phong ấn vỡ, lộ ra: ')); } }
  else if(z===4){ E.loot.huyettinh += 3; parts.push('3 Huyết Tinh'); }
  else if(z===5){ parts.push(`${lootStones(800)} linh thạch`, lootMat('yeudan',3,1)); }
  else if(z===7){ if(state.phapTacInsight<4) state.phapTacInsight++; parts.push(`${lootStones(1200)} linh thạch`, `pháp tắc ${state.phapTacInsight}/4`); }
  else if(z===8){ ['atk','def'].forEach(k=>{ const sp = STAT_PILLS.find(p=>p.id===k); state.statPillBonus[k]=(state.statPillBonus[k]||0)+sp.amount*2; }); parts.push('công và thủ vĩnh viễn +10'); }
  else if(z===9){ parts.push(`${lootStones(2500)} linh thạch`); if(Math.random()<0.6){ const r = randomRelicFor(z); if(r) expLog(grantRelic(r.id,'Hỗn độn tan đi, để lại: ')); } }
  else if(z===11){ parts.push(`${lootStones(6000)} linh thạch`); const r = randomRelicFor(z); if(r) expLog(grantRelic(r.id,'Ở rìa hư vô: ')); }
  else if(z===0){ parts.push(`${lootStones(60)} linh thạch từ túi kẻ chặn đường`); if(!state.kimQuang && Math.random()<0.35){ state.kimQuang = 8; parts.push('phù bảo Kim Quang Chuyên (8 lần)'); } }
  else if(z===6){ parts.push(`${lootStones(1500)} linh thạch`); state.caiMenhBonus = Math.min(0.36, state.caiMenhBonus+0.05); parts.push('tẩy luyện linh căn trong Tẩy Linh Trì (tu luyện vĩnh viễn +5%)'); }
  else if(z===10){ parts.push(`${lootStones(3000)} linh thạch`, lootMat('yeudan',3,2)); }
  if(z>=5 && z<=7 && Math.random()<0.3){ const b = randomBloodId(); addBlood(b); parts.push(`chân huyết ${bloodName(b)}`); }
  E.done = true;
  return parts.length ? ` Chiến lợi phẩm tầng cuối: ${parts.join(', ')}.` : '';
}

function expRest(){
  const E = state.expd, R = REALMS[E.z];
  if(!E || state.pendingEvent || state.combat || E.done) return;
  E.step++;
  const h = Math.round(state.stats.hpMax*0.25);
  state.hp = Math.min(state.stats.hpMax, state.hp+h);
  const tv = Math.round(previewMeditateGain()*ZONES[E.z].linhMachDensity);
  state.tuVi += tv;
  expLog(`Tìm góc khuất điều tức (${R.unit} ${E.step}/${R.steps}): hồi ${h} khí huyết, tu vi +${tv}.`);
  expHazard();
  if(E.step>=R.steps) expFinal();
  checkBreakthroughAvailable(); render();
}

function expBank(){
  const E = state.expd, L = E.loot, parts = [];
  if(L.stones){ state.spiritStones += L.stones; parts.push(`${L.stones} linh thạch`); }
  Object.keys(L.herbs).forEach(t=>{ if(L.herbs[t]){ state.herbs[t]=(state.herbs[t]||0)+L.herbs[t]; parts.push(`${L.herbs[t]} ${HERB_NAMES[t-1]}`); } });
  Object.keys(L.mats).forEach(k=>Object.keys(L.mats[k]).forEach(t=>{ if(L.mats[k][t]){ addMat(k, +t, L.mats[k][t]); parts.push(`${L.mats[k][t]} ${matName(k,+t)}`); } }));
  if(L.thao){
    const g = ng(), set = L.thaoSet||{};
    ['ngocTuy','tuHau','thienLinh'].forEach(k=>{ if(set[k]) state.specHerbs[k] = (state.specHerbs[k]||0)+set[k]; });
    let extra = ['ngocTuy','tuHau','thienLinh'].filter(k=>set[k]).map(k=>`${set[k]} ${SPEC_NAMES[k]}`).join(', ');
    if(g.sect && g.sect.id==='hoang_phong'){
      let sets = 0;
      while(['ngocTuy','tuHau','thienLinh'].every(k=>state.specHerbs[k]>0)){ ['ngocTuy','tuHau','thienLinh'].forEach(k=>state.specHerbs[k]--); sets++; }
      if(sets){ state.breakPills.trucCo = (state.breakPills.trucCo||0)+sets; const m = sets*40; g.sect.merit += m; g.sect.contrib += m; extra += ` — nộp đủ ${sets} bộ linh thảo cho Hoàng Phong Cốc, đổi ${sets} viên Trúc Cơ Đan và ${m} cống hiến`; }
    }
    parts.push(extra);
  }
  if(L.huyettinh){ const hp = L.huyettinh*40; state.statPillBonus.hp = (state.statPillBonus.hp||0)+hp; parts.push(`luyện hóa ${L.huyettinh} Huyết Tinh — khí huyết vĩnh viễn +${hp}`); }
  return parts;
}
function expLeave(){
  const E = state.expd;
  if(!E || state.combat || state.pendingEvent) return;
  let betray = '';
  if(E.flags.docNuong && npcDef('doc_nuong') && !npcRel('doc_nuong').dead){
    if(canSeeThrough()){ npcFavor('doc_nuong', -60); betray = ' Độc Nương Tử định hạ độc ở cửa ra, nhưng ngươi đã nhìn thấu từ trước — ả tháo chạy.'; }
    else if(Math.random()<0.6){
      const L = E.loot; L.stones = Math.round(L.stones/2); Object.keys(L.herbs).forEach(t=>L.herbs[t]=Math.floor(L.herbs[t]/2)); Object.keys(L.mats).forEach(k=>Object.keys(L.mats[k]).forEach(t=>L.mats[k][t]=Math.floor(L.mats[k][t]/2)));
      if(!hasRelic('ti_doc_chau')){ const d = Math.round(state.stats.hpMax*0.25); state.hp = Math.max(1, state.hp-d); }
      npcFavor('doc_nuong', -70);
      betray = ` Độc Nương Tử trở mặt ở cửa ra, hạ độc rồi cuỗm mất một nửa chiến lợi phẩm!${hasRelic('ti_doc_chau')?' (Tị Độc Châu giải được độc.)':''}`;
    } else { E.loot.stones = Math.round(E.loot.stones*1.3); npcFavor('doc_nuong', 40); betray = ' Độc Nương Tử giữ lời chia chác sòng phẳng, còn góp thêm phần của ả — linh thạch +30%.'; }
  }
  const parts = expBank();
  const name = ZONES[E.z].name;
  state.expd = null;
  advanceTime(1);
  addLog(`Rời khỏi ${name}.${betray} Mang về: ${parts.join(', ')||'hai bàn tay trắng'}.`);
  computeStats(); checkBreakthroughAvailable(); render();
}
function expBust(msg){
  const E = state.expd, L = E.loot;
  const all = E.z===11;
  const keep = all ? 0 : 0.5;
  L.stones = Math.floor(L.stones*keep); L.thao = Math.floor(L.thao*keep); if(L.thaoSet) Object.keys(L.thaoSet).forEach(k=>L.thaoSet[k]=Math.floor(L.thaoSet[k]*keep)); L.huyettinh = Math.floor(L.huyettinh*keep);
  Object.keys(L.herbs).forEach(t=>L.herbs[t]=Math.floor(L.herbs[t]*keep));
  Object.keys(L.mats).forEach(k=>Object.keys(L.mats[k]).forEach(t=>L.mats[k][t]=Math.floor(L.mats[k][t]*keep)));
  E.flags.docNuong = false;
  const parts = expBank();
  const name = ZONES[E.z].name;
  state.expd = null; state.pendingEvent = null;
  advanceTime(1);
  return ` Trọng thương, ngươi bị đẩy văng khỏi ${name}${all?', hư vô nuốt trọn mọi thứ đã nhặt':', đánh rơi một nửa chiến lợi phẩm'}. Giữ lại: ${parts.join(', ')||'không còn gì'}.`;
}

/* ---------------- Móc vào chiến đấu ---------------- */
function advOnCombatWin(enemy){
  let msg = '';
  if(enemy.npcId){
    const id = enemy.npcId, n = npcDef(id), r = npcRel(id);
    r.tracked = false;
    if(enemy.winFavor!=null){ npcFavor(id, enemy.winFavor); msg += ` ${n.name} ${n.kind==='friend'&&!enemy.duel?'cảm kích vô cùng':'nhìn ngươi bằng ánh mắt khác'} (hảo cảm ${r.favor}).`; }
    if(enemy.winStones){ state.spiritStones += enemy.winStones; msg += ` Nhận ${enemy.winStones} linh thạch tạ lễ.`; }
    if(enemy.sideEnemy){ const [sid, d] = enemy.sideEnemy; npcRel(sid).met = true; npcFavor(sid, d); msg += ` Người của ${npcDef(sid).name} bị đánh tan — hắn sẽ không bỏ qua.`; }
    if(enemy.npcHostile && n.death){
      if(Math.random() < 0.4 + r.escapes*0.15){
        r.dead = true;
        state.spiritStones += n.death.stones;
        const [k,t,c] = n.death.mat; addMat(k,t,c);
        if(n.death.blood){ addBlood(n.death.blood); msg += ` Trong người hắn còn một giọt chân huyết ${bloodName(n.death.blood)}.`; }
        msg += ` ${n.death.text} Thu ${n.death.stones} linh thạch, ${c} ${matName(k,t)}. ${grantRelic(n.death.relic)}`;
      } else {
        r.escapes++; r.power = Math.round((r.power+0.15)*100)/100;
        msg += ` ${n.name} trọng thương độn tẩu, thề sẽ quay lại báo thù.`;
      }
    } else if(enemy.npcHostile && n.kind==='friend'){
      npcFavor(id, -20);
      msg += ` ${n.name} ôm hận bỏ đi.`;
    }
  }
  if(enemy.factionReward){ const sp = STAT_PILLS.find(p=>p.id===enemy.factionReward); state.statPillBonus[sp.stat]=(state.statPillBonus[sp.stat]||0)+sp.amount; msg += ` Tàn hồn được giúp tan đi trong thanh thản, để lại một tia tinh hoa: ${sp.stat==='atk'?'công kích':'phòng ngự'} vĩnh viễn +${sp.amount}.`; }
  if(enemy.expd && state.expd){
    state.expd.mods.streak = REALMS[state.expd.z].z===5 ? state.expd.mods.streak+1 : state.expd.mods.streak;
    const t = zoneMatTier(state.expd.z);
    if(Math.random()<0.5) msg += ` Nhặt vào túi: ${lootMat(['huyet','yeudan','khoang','moc'][Math.floor(Math.random()*4)], t, 1)}.`;
    if(enemy.finalBoss) msg += finalReward(state.expd.z);
  }
  return msg;
}
function advOnCombatLose(enemy){
  let msg = '';
  if(enemy.npcId){
    const id = enemy.npcId, n = npcDef(id), r = npcRel(id);
    r.tracked = false;
    if(enemy.loseFavor!=null){ npcFavor(id, enemy.loseFavor); msg += ` ${n.name} vẫn ghi nhận tấm lòng của ngươi (hảo cảm ${r.favor}).`; }
    if(enemy.npcHostile && n.kind==='enemy'){ const lost = Math.round(state.spiritStones*0.2); state.spiritStones -= lost; r.power = Math.round((r.power+0.05)*100)/100; msg += ` ${n.name} lục túi ngươi, cướp đi ${lost} linh thạch.`; }
  }
  if(state.expd) msg += expBust();
  return msg;
}

function giftSpec(id){
  const n = npcDef(id);
  if(n.likes==='herb'){ const t = [6,5,4,3,2,1].find(x=>(state.herbs[x]||0)>0); return t ? {label:`1 ${HERB_NAMES[t-1]}`, favor:6+t*2, take:()=>state.herbs[t]--} : null; }
  if(n.likes==='heal'){ return healPillCount()>0 ? {label:'1 viên đan liệu thương', favor:12, take:()=>consumeHealPillItem()} : null; }
  if(n.likes==='yeudan'){ const t = [3,2,1].find(x=>(state.mats.yeudan[x]||0)>0); return t ? {label:`1 ${matName('yeudan',t)}`, favor:8+t*4, take:()=>state.mats.yeudan[t]--} : null; }
  if(n.likes==='khoang'){ const t = [3,2,1].find(x=>(state.mats.khoang[x]||0)>=2); return t ? {label:`2 ${matName('khoang',t)}`, favor:8+t*4, take:()=>state.mats.khoang[t]-=2} : null; }
  const cost = 100*(state.realmIdx+1);
  return state.spiritStones>=cost ? {label:`${cost} linh thạch`, favor:10, take:()=>state.spiritStones-=cost} : null;
}
function consumeHealPillItem(){ const t = [1,2,3].find(x=>(state.healPills[x]||0)>0); if(t) state.healPills[t]--; }
function giftNpc(id){
  const r = npcRel(id), n = npcDef(id);
  if(Math.floor(nowYears())<=r.lastGift){ addLog(`Mới tặng quà cho ${n.name} năm nay, dồn dập quá lại thành thất lễ.`); render(); return; }
  const g = giftSpec(id);
  if(!g){ addLog(`Trong người không có thứ ${n.name} thích.`); render(); return; }
  g.take(); r.lastGift = Math.floor(nowYears());
  npcFavor(id, g.favor);
  addLog(`Ngươi gửi tặng ${n.name} ${g.label}. Hảo cảm +${g.favor} (${r.favor}).`);
  render();
}
function huntNpc(id){
  if(state.combat || state.expd) return;
  const n = npcDef(id), e = npcEnemyFor(id, null);
  e.npcId = id; e.npcHostile = true;
  advanceTime(1);
  addLog(`Lần theo dấu vết suốt một tháng, ngươi tìm ra chỗ ẩn thân của ${n.name}.`);
  startCombat(e);
}

function meditateLong(){
  const before = state.tuVi;
  let mishaps = 0, dmgTotal = 0;
  const mods = rootMods(state.root, state.realmIdx);
  const pm = physiqueMods();
  const mishapChance = 0.08*((state.path && state.path.meditateMishapMult) ? state.path.meditateMishapMult : 1)*pm.meditateMishapMult*(hasRelic('thanh_tam_boi')?0.5:1)*(luyenThanBacklash()?2:1);
  let gain = 0;
  for(let i=0;i<12;i++){
    let g = previewMeditateGain();
    if(Math.random()<mishapChance){ g*=2; mishaps++; const d = Math.round(state.stats.hpMax*0.08); dmgTotal += d; }
    gain += g;
  }
  state.tuVi += gain;
  state.linhLuc += (3+state.realmIdx)*12;
  state.hp = Math.max(1, state.hp-dmgTotal);
  advanceTime(12);
  addLog(`Bế quan tròn một năm: tu vi +${gain}, linh lực +${(3+state.realmIdx)*12}.${mishaps?` ${mishaps} lần tâm cảnh dao động, mất tổng ${dmgTotal} khí huyết.`:''}`);
  checkPhysiqueDiscovery(); checkBreakthroughAvailable(); render();
}

function repLabel(v){ return v>=70?'Tôn kính':v>=30?'Thân thiện':v>=-20?'Trung lập':v>=-60?'Thù địch':'Huyết thù'; }
function addRep(race, d){
  if(!race || race==='ma') return '';
  const g = lg(); const before = repLabel(g.rep[race]);
  g.rep[race] = Math.max(-100, Math.min(100, g.rep[race]+d));
  const after = repLabel(g.rep[race]);
  return before!==after ? ` Thái độ của ${LG_RACES[race].name} chuyển thành ${after}.` : '';
}

function refineBlood(id){
  const g = lg();
  if(!g.kinhChap.have){ addLog('Chưa có Kinh Chập Thập Nhị Quyết, không biết cách luyện hóa chân huyết.'); render(); return; }
  if(!(g.blood[id]>0) || g.forms.includes(id)) return;
  const cost = 1500 + g.forms.length*500;
  if(state.spiritStones<cost || (state.mats.yeudan[3]||0)<2){ addLog(`Luyện hóa chân huyết cần ${cost} linh thạch và 2 ${matName('yeudan',3)} làm dẫn.`); render(); return; }
  state.spiritStones -= cost; state.mats.yeudan[3] -= 2;
  let chance = 65 + (state.physiqueAwakened?15:0) + (isBodyPath()?10:0) + (state.path.id==='yeuquy'?15:0);
  if(Math.random()*100>=Math.min(95,chance)){
    const d = Math.round(state.stats.hpMax*0.3); state.hp = Math.max(1, state.hp-d);
    addLog(`Chân huyết ${bloodName(id)} cuồng bạo phản phệ, kinh mạch như bị lửa đốt — mất ${d} khí huyết. Huyết dịch vẫn còn, có thể thử lại (tỷ lệ ${Math.min(95,chance)}%).`); render(); return;
  }
  g.blood[id]--; g.forms.push(id);
  const b = CHAN_LINH.find(x=>x.id===id);
  addLog(`Luyện hóa thành công chân huyết ${b.name}, lĩnh ngộ biến hóa 【${b.form}】 (${g.forms.length}/12). ${ngFmtBonus(b.bonus)}.`);
  computeStats(); render();
}

function refineIntoMeridian(src){
  const g = lg(), h = g.bachMach;
  if(!h.have || h.slots.length>=BM_SLOTS[h.layer]){ addLog('Không còn huyệt đạo trống — tu luyện tầng tiếp theo để khai thông thêm.'); render(); return; }
  let t;
  if(src==='eq'){ t = state.treasure; if(!t) return; state.treasure = null; }
  else { t = g.spare[src]; if(!t) return; g.spare.splice(src,1); }
  const cost = 800 + h.slots.length*150;
  if(state.spiritStones<cost){ if(src==='eq') state.treasure = t; else g.spare.splice(src,0,t); addLog(`Luyện pháp bảo vào huyệt đạo cần ${cost} linh thạch.`); render(); return; }
  state.spiritStones -= cost;
  h.slots.push({name:t.name, bonus:{atk:t.bonus.atk||0, def:t.bonus.def||0, crit:t.bonus.crit||0}});
  addLog(`${t.name} tan thành dòng linh quang chảy vào huyệt đạo thứ ${h.slots.length} — nhục thân thêm một phần binh khí.`);
  computeStats(); render();
}

function lgStatBonus(){
  const g = lg(), b = {atk:0,def:0,spd:0,hp:0,crit:0,tuViRate:0,atkMult:1,defMult:1};
  if(g.family){ const f = famDef(g.family.id), m = 1+g.family.rank*0.5; Object.keys(f.bonus).forEach(k=>b[k] += k==='tuViRate'? f.bonus[k]*m : Math.round(f.bonus[k]*m)); }
  b.def += g.tyRank*20; b.hp += g.tyRank*150;
  if(g.phamThanh.have){ const L = g.phamThanh.layer, m = state.path && state.path.id==='the' ? 1.3 : 1; b.atk += Math.round(25*L*m); b.def += Math.round(20*L*m); b.hp += Math.round(200*L*m); }
  g.forms.forEach(id=>{ const bn = CHAN_LINH.find(x=>x.id===id).bonus; Object.keys(bn).forEach(k=>b[k] += bn[k]); });
  if(g.bachMach.have){
    const f = 0.5+0.1*g.bachMach.layer;
    g.bachMach.slots.forEach(s=>{ b.atk += Math.round(s.bonus.atk*f); b.def += Math.round(s.bonus.def*f); b.crit += Math.round(s.bonus.crit*f*0.5); });
    b.atkMult *= 1+0.015*g.bachMach.slots.length;
  }
  if(g.luyenThan.have && g.luyenThan.layer>0){ const L = g.luyenThan.layer; b.crit += [0,5,10,18,24,30,40][L]; b.atkMult *= [1,1.05,1.1,1.2,1.26,1.33,1.45][L]; }
  const ltSev = luyenThanSeverity(); if(ltSev){ b.atkMult *= 1-ltSev; b.defMult *= 1-ltSev; }
  if(g.phiThangKhi){ b.atkMult *= 0.8; b.defMult *= 0.8; b.tuViRate -= 0.3; }
  return b;
}

function lgTick(){
  if(!state || !state.root || !lgSeen()) return;
  const g = lg();
  if(!g.arrived){
    g.arrived = true; g.region = 'thienuyen'; g.phiThangKhi = true;
    state.spiritStones += 2000;
    g.maKiep.startAge = Math.floor(nowYears())+15;
    addLog('Xuyên qua bão táp hư không, ngươi rơi xuống quảng trường Tiếp Dẫn Điện của Thiên Uyên Thành. Chấp sự ghi danh, phát lệnh bài thân phận Nhân tộc cùng 2000 linh thạch an cư. "Ở Linh Giới, Nhân tộc chỉ là tộc nhỏ — hãy nhớ lấy." Trên người ngươi còn phi thăng chi khí của hạ giới: thiên địa bài xích, công thủ −20%, tu luyện chậm 30% cho tới khi dùng Diệt Trần Đan (Quân Nhu Khố có bán).');
  }
  const mk = g.maKiep, t = nowYears();
  if(!mk.ended && mk.startAge!=null && t>=mk.startAge && !mk.announced){
    mk.announced = true; mk.endAge = Math.floor(t)+150;
    addLog('MA KIẾP GIÁNG LÂM! Thông đạo Ma Giới xé rách không gian, Ma tộc do các Ma Tôn Thủy Tổ dẫn dắt tràn vào Linh Giới. Thiên Uyên Thành ban lệnh tổng động viên — Ma Kiếp Tiền Tuyến đã mở.');
  }
  if(mk.announced && !mk.ended && (t>=mk.endAge || mk.tonKilled.length>=3)){
    mk.ended = true;
    if(g.region==='makiep') g.region = 'thienuyen';
    addLog(mk.tonKilled.length>=3 ? 'Cả ba hóa thân Ma Tôn Thủy Tổ đều bị chém — Ma tộc tháo chạy, thông đạo Ma Giới khép lại. Ma Kiếp kết thúc!' : 'Sau trăm năm huyết chiến, thông đạo Ma Giới dần khép lại. Ma Kiếp tạm lui.');
  }
  const lt = g.luyenThan;
  if(luyenThanBacklash() && !lt.warned){ lt.warned = true; addLog('Đã quá kỳ hạn mà chưa tìm được tầng tiếp theo của Luyện Thần Thuật — thần thức bắt đầu phản phệ! Công thủ giảm 15% và cứ mỗi 10 năm lại nặng thêm 5% (tối đa 50% — thần hồn bên bờ vỡ nát), bế quan dễ tẩu hỏa hơn.'); }
  if(!luyenThanBacklash()) lt.warned = false;
}

function lgTravel(id){
  if(!lgActive()) return;
  const to = LG_REGIONS.find(r=>r.id===id), from = lgRegion();
  if(!to || to.id===from.id) return;
  if(state.realmIdx<to.minRealm){ addLog(`Cần ${MAJOR_REALMS[to.minRealm].name} mới dám tới ${to.name}.`); render(); return; }
  if(to.maKiep && !maKiepActive()){ addLog('Thông đạo Ma Giới chưa mở — Ma Kiếp chưa giáng lâm.'); render(); return; }
  const cost = Math.max(to.travelCost, from.travelCost);
  if(state.spiritStones<cost){ addLog(`Cần ${cost} linh thạch để dùng truyền tống trận siêu viễn tới ${to.name}.`); render(); return; }
  state.spiritStones -= cost; lg().region = id; advanceTime(3);
  addLog(`Qua ba tháng truyền tống và phi hành, ngươi tới ${to.name}. (tốn ${cost} linh thạch)`);
  render();
}
function lgExplore(locId){
  if(!lgActive() || state.combat || state.expd) return;
  const g = lg(), region = lgRegion(), loc = region.locations.find(l=>l.id===locId);
  if(!loc || state.realmIdx<loc.power) return;
  state.currentZone = Math.min(ZONES.length-1, loc.power);
  if(maKiepActive() && region.id!=='makiep' && Math.random()<0.15){
    const e = genRegionEnemy(loc.power, null, 1.5, 'Ma Tộc Đột Kích Đội'); e.lgRace = 'ma';
    addLog(`Ma khí cuồn cuộn — một toán Ma tộc đột kích ${loc.name}!`); startCombat(e); return;
  }
  if(region.id==='makiep' && locId==='ma_thong_dao' && (state.intelMaTon || Math.random()<0.14)){
    const alive = MA_TON.filter(m=>!g.maKiep.tonKilled.includes(m.id));
    if(alive.length){
      state.intelMaTon = false;
      const m = alive[Math.floor(Math.random()*alive.length)];
      const e = genRegionEnemy(7, null, 2.6, `Hóa Thân ${m.title} ${m.name}`); e.lgRace = 'ma'; e.maTon = m.id; e.special = m.special;
      presentEvent({title:`${m.title} ${m.name}`, sub:'hóa thân giáng lâm', icon:'demoneye', text:`Bầu trời nứt toác, một hóa thân Ma Tôn bước ra từ thông đạo. ${m.desc} Uy áp khiến không gian quanh ngươi đông cứng.`,
        options:[{label:'Liều chết nghênh chiến', act:'fightEnemy', args:[e]}, ...(state.talismans.than_hanh>0?[{label:'Dùng Độn Không Phù chạy thoát', act:'lgFlee', args:[]}]:[]), {label:'Nín thở ẩn thân chờ nó đi qua', act:'lgHide', args:[]}]});
      render(); return;
    }
  }
  if(Math.random()<0.1 && npcEncounterAt({region:region.id})){ render(); return; }
  const rep = loc.race ? g.rep[loc.race] : -20;
  const fightChance = loc.race==='ma' ? 55 : Math.max(20, 45 - rep*0.25);
  const roll = Math.random()*100;
  if(roll<fightChance){
    const e = genRegionEnemy(loc.power, loc.enemies); e.lgRace = loc.race;
    startCombat(e); return;
  }
  if(roll<fightChance+15){
    const st = Math.round(300+loc.power*120+Math.random()*300);
    state.spiritStones += st; state.tuVi += Math.round(previewMeditateGain()*2);
    addMat('yeudan',3,1);
    addLog(`Ở ${loc.name}, ngươi tìm được một mạch linh thạch thượng phẩm: +${st} linh thạch, 1 ${matName('yeudan',3)}.`);
  } else if(roll<fightChance+40){
    lgRegionEvent(region, loc);
  } else rareEvent(4);
  advanceTime(1);
  checkBreakthroughAvailable(); render();
}
function lgRegionEvent(region, loc){
  const g = lg(), opts = [];
  if(loc.race && loc.race!=='ma') opts.push('task','task');
  if(Math.random()<0.25) opts.push('blood');
  if(region.id==='makiep'){ opts.push('matinh','matinh','xaloi'); if(!g.phamThanh.have) opts.push('phamThanh'); }
  if(region.id==='thienuyen') opts.push('refugee','xaloi');
  if(region.id==='giacxi' && !g.luyenThan.have) opts.push('luyenThan');
  if((region.id==='makiep'||region.id==='giacxi') && !g.phaMietFound) opts.push('phamiet');
  if(region.id==='thienvan' && !g.bachMach.have) opts.push('bachMach');
  if(region.id==='philinh' && !g.kinhChap.have && Math.random()<0.5) opts.push('kinhChap');
  if(!opts.length){ rareEvent(4); return; }
  const pick = pickEventOpt(opts);
  if(pick==='task'){
    const race = LG_RACES[loc.race];
    const st = 400+loc.power*100; state.spiritStones += st;
    addLog(`Ngươi giúp ${race.name} dẹp một ổ hung thú quấy phá bộ lạc, nhận ${st} linh thạch tạ lễ. Danh vọng +8.${addRep(loc.race, 8)}`);
  } else if(pick==='blood'){
    const id = randomBloodId();
    addLog(`Giữa xác một đầu hung thú cổ đại, ngươi thu được một giọt ${addBlood(id)} còn nóng hổi!${lg().kinhChap.have?'':' (Cần Kinh Chập Thập Nhị Quyết mới luyện hóa được.)'}`);
  } else if(pick==='matinh'){ const n = 2+Math.floor(Math.random()*3); g.maTinh += n; addLog(`Thu gom ${n} viên Ma Tinh kết tụ từ ma khí nồng đặc.`); }
  else if(pick==='xaloi'){ g.xaLoi += 1; addLog('Trong đống đổ nát, ngươi tìm thấy một viên Phật Cốt Xá Lợi của vị cao tăng đã vẫn lạc khi chống Ma Kiếp.'); }
  else if(pick==='refugee'){ const m = 60+state.realmIdx*10; g.merit += m; g.meritTotal += m; addLog(`Ngươi hộ tống một đoàn tu sĩ vừa phi thăng về tới Thiên Uyên Thành an toàn. Quân công +${m}.`); }
  else if(pick==='phamThanh'){ addLog(`Trong động phủ của một ma tu Phật môn đã chết, ngươi tìm thấy ngọc giản song sắc nửa kim nửa hắc. ${grantLgHeritage('phamThanh')}`); }
  else if(pick==='luyenThan'){ addLog(`Trong kho của một tế ti Giác Xi bị ngươi đánh lén, có một mảnh ngọc giản khắc chữ Tiên Giới. ${grantLgHeritage('luyenThan')}`); }
  else if(pick==='bachMach'){ addLog(`Một lão thợ rèn Thiên Vân tộc sắp tọa hóa trao lại tuyệt học cả đời cho ngươi. ${grantLgHeritage('bachMach')}`); }
  else if(pick==='phamiet'){ g.phaMietFound = true; addLog('Trên trán một cổ thi dị tộc có vết nứt khép kín, bên trong cất pháp quyết khai mở con mắt thứ ba — Phá Miệt Pháp Mục! (Nhân Vật ▸ Bí Truyền)'); }
  else if(pick==='kinhChap'){ addLog(`Trên vách sào huyệt Phi Linh cổ có khắc đồ hình mười hai Chân Linh biến hóa. ${grantLgHeritage('kinhChap')}`); }
}

/* ---------------- Thiên Uyên Thành: trấn thủ ---------------- */
function tyDefend(){
  if(!lgActive() || state.combat || state.expd) return;
  if(lg().region!=='thienuyen'){ addLog('Phải có mặt ở Thiên Uyên Thành mới nhận được phiên trấn thủ.'); render(); return; }
  const mk = maKiepActive();
  const pool = mk ? ['Ma Tộc Công Thành Quân','Ma Giới Phi Thiên Quỷ','Ma Tướng Tiên Phong'] : ['Dị Tộc Công Thành Đội','Thú Triều Đầu Lĩnh','Giác Xi Tộc Du Kích'];
  const e = genRegionEnemy(Math.min(7,state.realmIdx), pool, mk?1.5:1.3, pool[Math.floor(Math.random()*pool.length)]);
  e.tyWave = mk ? 2 : 1; e.lgRace = mk ? 'ma' : null;
  advanceTime(1);
  addLog(mk ? 'Tiếng tù và vang khắp tường thành — Ma tộc công thành! Ngươi lên tường nghênh chiến.' : 'Phiên trấn thủ tường thành: một toán dị tộc đang áp sát.');
  startCombat(e);
}
function tyPromote(){
  const g = lg(); if(g.tyRank>=TY_RANKS.length-1) return;
  const need = TY_MERIT[g.tyRank+1];
  if(g.meritTotal<need){ addLog(`Cần tổng quân công ${need} để được tấn thăng ${TY_RANKS[g.tyRank+1]}.`); render(); return; }
  g.tyRank++; addLog(`Thiên Uyên Thành ghi công, tấn thăng ngươi làm ${TY_RANKS[g.tyRank]}.`); computeStats(); render();
}
function famJoin(id){
  const g = lg(), f = famDef(id);
  if(g.family || g.famLeft.includes(id)) return;
  if(g.region!=='thienuyen'){ addLog('Các Chân Linh thế gia đều đặt phủ đệ trong Thiên Uyên Thành.'); render(); return; }
  if(g.tyRank<1){ addLog(`${f.name} chỉ mời khách khanh đã có danh tiếng ở Thiên Uyên Thành (cần Tuần Thành Thống Lĩnh).`); render(); return; }
  if(state.spiritStones<3000){ addLog('Cần 3000 linh thạch làm lễ ra mắt thế gia.'); render(); return; }
  state.spiritStones -= 3000;
  g.family = {id, rank:0, merit:0, contrib:0};
  addLog(`${f.name} nhận ngươi làm ${FAM_RANKS[0]}. Bổng lộc thế gia từ nay chu cấp đều đặn.`); computeStats(); render();
}
function famLeave(){
  const g = lg(); if(!g.family) return;
  const f = famDef(g.family.id);
  g.famLeft.push(g.family.id); g.family = null;
  addLog(`Ngươi từ biệt ${f.name}. Thế gia không làm khó, nhưng cửa cũng không mở lại lần hai.`); computeStats(); render();
}
function famTask(){
  const g = lg(), fm = g.family; if(!fm || state.combat) return;
  const f = famDef(fm.id);
  advanceTime(2);
  if(Math.random()<0.4){
    const e = genRegionEnemy(Math.min(7,state.realmIdx), null, 1.35, `Thích Khách Thế Gia Đối Địch`); e.famTask = Math.round(60+state.realmIdx*8);
    addLog(`${f.name} giao việc hộ tống tộc nhân — dọc đường gặp thích khách.`); startCombat(e); return;
  }
  const m = Math.round(35+state.realmIdx*6);
  fm.merit += m; fm.contrib += m;
  addLog(`Hoàn thành việc ${f.name} giao phó, +${m} cống hiến gia tộc.`); render();
}
function famPromote(){
  const g = lg(), fm = g.family; if(!fm || fm.rank>=FAM_RANKS.length-1) return;
  const need = FAM_MERIT[fm.rank+1];
  if(fm.merit<need){ addLog(`Cần ${need} công lao để được thăng ${FAM_RANKS[fm.rank+1]}.`); render(); return; }
  fm.rank++; addLog(`${famDef(fm.id).name} tôn ngươi làm ${FAM_RANKS[fm.rank]}.`); computeStats(); render();
}

/* ---------------- Cửa hàng dùng chung ---------------- */
function lgItemLabel(it){
  if(it.type==='blood') return `Chân huyết ${bloodName(it.blood)}`;
  if(it.type==='bloodRandom') return 'Chân huyết ngẫu nhiên';
  if(it.type==='heal') return `${HEAL_PILLS[it.tier-1].name} ×${it.n}`;
  if(it.type==='mat') return `${matName(it.mat,it.tier)} ×${it.n}`;
  if(it.type==='herbs') return `${HERB_NAMES[it.tier-1]} ×${it.n}`;
  if(it.type==='statpill') return STAT_PILLS.find(p=>p.id===it.stat).name;
  if(it.type==='relic') return relicDef(it.relic).name;
  if(it.type==='heritage') return LG_HERITAGE[it.key].name;
  if(it.type==='xaloi') return 'Phật Cốt Xá Lợi';
  if(it.type==='dietTran') return 'Diệt Trần Đan';
  return '?';
}
function lgItemGive(it){
  if(it.type==='blood') return addBlood(it.blood);
  if(it.type==='bloodRandom') return addBlood(randomBloodId());
  if(it.type==='heal'){ state.healPills[it.tier] = (state.healPills[it.tier]||0)+it.n; return lgItemLabel(it); }
  if(it.type==='mat'){ addMat(it.mat,it.tier,it.n); return lgItemLabel(it); }
  if(it.type==='herbs'){ state.herbs[it.tier] = (state.herbs[it.tier]||0)+it.n; return lgItemLabel(it); }
  if(it.type==='statpill'){ grantStatPill(STAT_PILLS.find(p=>p.id===it.stat)); return lgItemLabel(it); }
  if(it.type==='relic') return grantRelic(it.relic);
  if(it.type==='heritage') return grantLgHeritage(it.key);
  if(it.type==='xaloi'){ lg().xaLoi += it.n; return 'Phật Cốt Xá Lợi'; }
  if(it.type==='dietTran'){ state.dietTran = (state.dietTran||0)+1; return 'Diệt Trần Đan'; }
}
function lgItemBlocked(it){
  if(it.type==='heritage' && lg()[it.key].have) return 'Đã có';
  if(it.type==='relic' && hasRelic(it.relic)) return 'Đã có';
  return '';
}
function lgBuy(shop, idx, race){
  const g = lg();
  let it, pay, cur;
  if(shop==='ty'){ it = TY_SHOP[idx]; if(g.tyRank<it.rank) return; cur = 'merit'; }
  else if(shop==='fam'){ it = famDef(g.family.id).shop[idx]; if(g.family.rank<it.rank) return; cur = 'contrib'; }
  else { it = LG_RACES[race].shop[idx]; if(g.rep[race]<it.rep) return; cur = 'stones'; }
  if(lgItemBlocked(it)) return;
  const have = cur==='merit' ? g.merit : cur==='contrib' ? g.family.contrib : state.spiritStones;
  if(have<it.cost){ addLog(`Không đủ ${cur==='merit'?'quân công':cur==='contrib'?'cống hiến gia tộc':'linh thạch'}.`); render(); return; }
  if(cur==='merit') g.merit -= it.cost; else if(cur==='contrib') g.family.contrib -= it.cost; else state.spiritStones -= it.cost;
  const got = lgItemGive(it);
  if(it.type!=='statpill') addLog(`Đổi được ${got}.`);
  computeStats(); render();
}

/* ---------------- Móc chiến đấu ---------------- */
function lgOnCombatWin(enemy){
  if(!state.lg) return '';
  const g = lg(); let msg = '';
  if(enemy.lgRace && enemy.lgRace!=='ma'){ msg += addRep(enemy.lgRace, -3); }
  if(enemy.lgRace==='ma'){ const n = 1+(Math.random()<0.4?1:0); g.maTinh += n; msg += ` Thu ${n} Ma Tinh.`; }
  if(enemy.tyWave){ const m = Math.round((40+state.realmIdx*10)*enemy.tyWave); g.merit += m; g.meritTotal += m; msg += ` Quân công +${m}.`; addRep('yeu', 1); }
  if(enemy.famTask && g.family){ g.family.merit += enemy.famTask; g.family.contrib += enemy.famTask; msg += ` Cống hiến gia tộc +${enemy.famTask}.`; }
  if(enemy.maTon){
    const m = MA_TON.find(x=>x.id===enemy.maTon);
    g.maKiep.tonKilled.push(m.id);
    const b1 = randomBloodId(), b2 = randomBloodId();
    addBlood(b1); addBlood(b2); g.maTinh += 10; state.spiritStones += 20000; g.merit += 1500; g.meritTotal += 1500;
    msg += ` Hóa thân ${m.title} ${m.name} tan vỡ! Chấn động toàn Linh Giới. Thu 20000 linh thạch, 10 Ma Tinh, chân huyết ${bloodName(b1)} và ${bloodName(b2)}, quân công +1500.`;
    if(!g.luyenThan.have) msg += ' ' + grantLgHeritage('luyenThan');
  }
  if(!enemy.maTon && state.realmIdx>=LG_FIRST && enemy.isBoss && Math.random()<0.12){ const id = randomBloodId(); addBlood(id); msg += ` Kẻ địch để lại một giọt chân huyết ${bloodName(id)}!`; }
  if(enemy.lgRace || enemy.tyWave || enemy.maTon) lgTick();
  return msg;
}
function lgSpecialEnemyTurn(c){
  if(!c.enemy.special) return '';
  if(c.enemy.special==='regen'){ const h = Math.round(c.enemy.hpMax*0.06); c.enemy.hp = Math.min(c.enemy.hpMax, c.enemy.hp+h); return ` Ma thể tự hồi ${h} khí huyết.`; }
  if(c.enemy.special==='frost'){ c.frost = (c.frost||0)+1; const d = Math.round(state.stats.hpMax*0.02*c.frost); state.hp -= d; return ` Cực hàn tích tụ tầng ${c.frost}, thêm ${d} sát thương.`; }
  if(c.enemy.special==='dream' && Math.random()<0.25){ if(soulImmortal()||phaMietOpen()) return ' Mộng yểm tan vỡ trước thần hồn bất diệt.'; c.playerStun = 1; return ' Ngươi rơi vào mộng yểm — mất lượt kế tiếp!'; }
  if(c.enemy.special==='timestop' && Math.random()<0.2){ if(soulImmortal() || (state.tg && tg().daiNguHanh)) return ' Cổ Hoặc Kim ngưng đọng thời gian — nhưng dòng thời gian của chính ngươi không bị lay chuyển.'; c.playerStun = 1; return ' Thời gian quanh ngươi bị ngưng đọng — mất lượt kế tiếp!'; }
  return '';
}
function lgCombatAction(type){
  const c = state.combat, g = lg();
  if(type==='phamthanh'){
    if(!g.phamThanh.have || g.phamThanh.layer<3 || c.phamUsed) return null;
    const mult = g.phamThanh.layer>=5 ? 4 : 2.8;
    const r = pathAdjustedDamage(state.stats.atk*mult, c.enemy.def*0.4, state.stats.crit, c.enemy, true);
    const heal = Math.round(state.stats.hpMax*0.2); state.hp = Math.min(state.stats.hpMax, state.hp+heal);
    c.phamUsed = true;
    return {dmg:r.dmg, msg:`Pháp tướng ${g.phamThanh.layer>=5?'Niết Bàn Kim Thân ba đầu sáu tay':'Phạm Thánh'} hiện ra, một quyền giáng xuống gây ${r.dmg} sát thương, hồi ${heal} khí huyết!`};
  }
  if(type==='kinhchap'){
    if(!g.forms.length || c.bienUsed) return null;
    const n = g.forms.length;
    const r = pathAdjustedDamage(state.stats.atk*(1.5+0.25*n), c.enemy.def, state.stats.crit+n, c.enemy, false);
    const heal = Math.round(state.stats.hpMax*0.04*n); state.hp = Math.min(state.stats.hpMax, state.hp+heal);
    c.bienUsed = true;
    c.bienBuff = 1+0.04*n;
    const names = g.forms.slice(-3).map(id=>bloodName(id)).join(', ');
    return {dmg:r.dmg, msg:`Kinh Chập Thập Nhị Quyết — biến thân Chân Linh, cả trận còn lại sát thương ×${(1+0.04*n).toFixed(2)}. Mượn sức ${n} Chân Linh (${names}${n>3?'...':''}), gây ${r.dmg} sát thương, hồi ${heal} khí huyết!`};
  }
  return null;
}
function renderLgCombatButtons(c){
  if(!state.lg) return '';
  const g = lg(), btns = [];
  if(g.phamThanh.have && g.phamThanh.layer>=3) btns.push(`<button class="btn gold" ${c.phamUsed?'disabled':''} onclick="playerAttack('phamthanh')">${ic('lotus')}${g.phamThanh.layer>=5?'Niết Bàn Kim Thân':'Phạm Thánh Pháp Tướng'}</button>`);
  if(g.forms.length) btns.push(`<button class="btn gold" ${c.bienUsed?'disabled':''} onclick="playerAttack('kinhchap')">${ic('crystal')}Chân Linh Biến Thân (${g.forms.length})</button>`);
  return btns.length ? `<div class="btn-row" style="margin-top:8px;">${btns.join('')}</div>` : '';
}

/* ---------------- Giao diện ---------------- */
function repBar(v){ return favorBar(v); }
function lgShopTiles(items, shop, race, curLabel, have, rankOk){
  return `<div class="grid2">${items.map((it,i)=>{
    const block = lgItemBlocked(it), ok = rankOk(it);
    return `<div class="tile ${ok&&!block?'':'locked'}">
      <div class="tile-head"><span class="tn">${lgItemLabel(it)}</span></div>
      <div class="tile-head"><span class="tc">${block || (ok ? `${it.cost} ${curLabel}` : (it.rank!=null ? `Cần ${shop==='fam'?FAM_RANKS[it.rank]:TY_RANKS[it.rank]}` : `Danh vọng ${it.rep}`))}</span></div>
      <button class="btn ghost" ${(!ok||block||have<it.cost)?'disabled':''} onclick="lgBuy('${shop}',${i}${race?`,'${race}'`:''})">Đổi</button>
    </div>`;
  }).join('')}</div>`;
}
function renderLgWorld(){
  if(!lgActive()) return `<div class="card"><p class="flavor">${state.realmIdx>LG_LAST?'Ngươi đã phi thăng Tiên Giới. Thiên Uyên Thành và vạn tộc Linh Giới giờ chỉ còn trong hồi ức.':'Linh Giới chỉ mở ra sau khi vượt Cửu Cửu Lôi Kiếp ở Hóa Thần Kỳ.'}</p></div>`;
  const g = lg(), region = lgRegion(), mk = g.maKiep;
  const t = nowYears();
  const mkLine = maKiepActive() ? `<span class="zone-badge hot">Ma Kiếp đang diễn ra — còn ${Math.ceil(mk.endAge-t)} năm, đã chém ${mk.tonKilled.length}/3 hóa thân Ma Tôn</span>`
    : mk.ended ? `<span class="zone-badge open">Ma Kiếp đã qua</span>` : `<span class="zone-badge wait">Ma Kiếp giáng lâm sau ${Math.max(0,Math.ceil(mk.startAge-t))} năm</span>`;

  if(R.lawAff===k) m *= 1.3;
  if(k==='thoi'){ m *= 1.2 * (1 + g.timeArts.length*0.1); if(g.daiNguHanh) m *= 2; }
  const f = g.sect ? tgFaction(g.sect.id) : null, sd = g.side ? tgFaction(g.side.id) : null;
  if(f && f.lawBonus===k) m *= 1.25;
  if(sd && sd.lawBonus===k) m *= 1.25;
  if(g.daoThanChau) m *= 1.5;
  return m;
}
function comprehendLaw(k){
  if(!tgActive() || state.combat || state.expd) return;
  const g = tg(), cap = lawCap(), cost = 20*(state.realmIdx-7);
  if(g.laws[k]>=cap){ addLog(`Cảnh giới hiện tại chỉ đủ lĩnh ngộ ${LAWS[k].short} tới ${cap}. Đột phá thêm mới hiểu sâu hơn.`); render(); return; }
  if(g.tienThach<cost){ addLog(`Tham ngộ pháp tắc cần ${cost} tiên nguyên thạch để duy trì tiên lực suốt 5 năm bế quan.`); render(); return; }
  g.tienThach -= cost;
  advanceTime(60);
  const gain = Math.max(1, Math.round((2+Math.random()*3)*tgLawMult(k)));
  g.laws[k] = Math.min(cap, g.laws[k]+gain);
  let extra = '';
  if(k==='thoi'){
    if(g.side && g.side.id==='thiendinh' && Math.random()<0.25){
      g.side = null; g.sideLeft.push('thiendinh'); g.wanted = Math.max(g.wanted, 70);
      extra = ' Thiên Đình phát hiện ngươi lén tu Thời Gian Pháp Tắc — thứ Cổ Hoặc Kim không cho ai chạm tới. Ngươi bị trục xuất và phát lệnh truy nã!';
    } else if(g.hiddenUntil && nowYears()<g.hiddenUntil){ extra = ' Thái Nhất Hóa Thanh Phù che giấu mọi dao động thời gian.';
    } else if(!(g.side && g.side.id==='thiendinh')){ g.wanted = Math.min(100, g.wanted+4); extra = ' Dao động thời gian đã lọt vào mắt tuần tra Thiên Đình (truy nã +4).'; }
  }
  addLog(`Năm năm tham ngộ ${LAWS[k].name}: +${gain} (${g.laws[k]}/${cap}, ${lawTier(g.laws[k])}).${extra}`);
  computeStats(); render();
}
function setMainLaw(k){
  const g = tg();
  if(g.mainLaw && g.laws[g.mainLaw]>=60){ addLog('Chủ tu pháp tắc đã tới Đại Thành, đạo tâm đã định — không thể đổi nữa.'); render(); return; }
  g.mainLaw = k;
  addLog(`Ngươi chọn ${LAWS[k].name} làm đại đạo chủ tu. Lĩnh ngộ nó nhanh hơn 50%, và muốn chứng đạo thì phải viên mãn chính nó.`);
  render();
}

function openKhieu(useSand){
  const g = tg(), ts = g.thienSat;
  if(!ts.have || ts.khieu>=1080 || state.combat || state.expd) return;
  if(useSand && g.tinhSa<1) return;
  if(useSand) g.tinhSa--;
  advanceTime(12);
  let n = (useSand?40:10) * (state.path && state.path.id==='the' ? 1.5 : 1);
  n = Math.min(1080-ts.khieu, Math.round(n));
  const before = Math.floor(ts.khieu/120);
  ts.khieu += n;
  const after = Math.floor(ts.khieu/120);
  addLog(`Một năm hấp thu Tinh Thần chi lực${useSand?' (dùng Tinh Thần Sa)':''}, đả thông ${n} huyền khiếu (${ts.khieu}/1080).${after>before?` Thiên Sát Trấn Ngục Công đạt tầng ${after}!`:''}${ts.khieu>=1080?' Một ngàn không trăm tám mươi huyền khiếu thông suốt — thân thể sánh ngang thần ma!':''}`);
  computeStats(); render();
}

  if(!h.have || h.layer>=6) return;
  const L = h.layer+1;
  if(L>=4 && !(state.tg && tg().ltExt)){ addLog('Ba tầng đầu đã viên mãn. Các tầng sau nằm trong tàn thiên Tiên Giới — cần tìm được trước.'); render(); return; }
  const realm = L<=3 ? LT_REALM[L] : LT_EXT_REALM[L];
  if(state.realmIdx<realm){ addLog(`Tầng ${L} Luyện Thần Thuật cần ${MAJOR_REALMS[realm].name}.`); render(); return; }
  if(L<=3){
    const stones = 3000*L;
    if(state.spiritStones<stones || (state.mats.yeudan[3]||0)<L){ addLog(`Tầng ${L} cần ${stones} linh thạch và ${L} ${matName('yeudan',3)}.`); render(); return; }
    state.spiritStones -= stones; state.mats.yeudan[3] -= L;
  } else {
    const cost = 150*(L-3);
    if(tg().tienThach<cost){ addLog(`Tầng ${L} cần ${cost} tiên nguyên thạch.`); render(); return; }
    tg().tienThach -= cost;
  }
  h.layer = L;
  h.deadline = (L===1||L===2||L===4||L===5) ? Math.floor(nowYears())+LT_DEADLINE : null;
  addLog(L===6 ? 'Luyện Thần Thuật hoàn chỉnh! Thần hồn cường đại tới mức vô pháp diệt sát — mỗi trận được trùng sinh một lần, miễn nhiễm mộng yểm và đình trệ thời gian.'
       : L===3 ? 'Luyện Thần Thuật tầng 3 — hết phần Linh Giới, thần thức tạm ổn định. Các tầng sau nằm ở Tiên Giới.'
       : `Luyện Thần Thuật tầng ${L}: thần thức bạo tăng. Trong ${LT_DEADLINE} năm phải luyện tiếp tầng ${L+1}, bằng không sẽ bị cắn trả.`);
  computeStats(); render();
}
function luyenThanBacklash(){ const h = state.lg && state.lg.luyenThan; return !!(h && h.have && h.deadline!=null && [1,2,4,5].includes(h.layer) && nowYears()>h.deadline); }
function luyenThanPuppetCap(){ const h = state.lg && state.lg.luyenThan; return h && h.have ? [0,6,12,20,26,32,40][h.layer] : 0; }
function soulImmortal(){ return !!(state.lg && state.lg.luyenThan.layer>=6); }

/* ---------------- Chỉ số, thời gian ---------------- */
function tgStatBonus(){
  const g = tg(), b = {atk:0,def:0,hp:0,crit:0,tuViRate:0,atkMult:1};
  const fb = tgFactionBonus(); Object.keys(fb).forEach(k=>b[k] += fb[k]);
  b.atkMult *= 1 + Math.min(0.4, g.laws.hoa/250);
  if(g.thienSat.have){ const k = g.thienSat.khieu; b.atk += Math.round(k*0.8); b.def += Math.round(k*0.6); b.hp += k*6; }
  if(g.daiNguHanh){ b.crit += 10; b.atkMult *= 1.1; }
  if(g.daoThanChau){ b.hp += 5000; }
  return b;
}
function tgTick(){
  if(!state || !state.root || !tgSeen()) return;
  const g = tg();
  if(!g.arrived){
    g.arrived = true; g.region = 'bachan'; g.lastYear = Math.floor(nowYears()); g.tienThach += 30;
    addLog('Phi thăng Tiên Giới — nhưng lực xé rách của Tiên Giới chi môn nghiền nát thức hải. Ngươi tỉnh dậy giữa tuyết trắng Bắc Hàn Tiên Vực, chỉ nhớ được tên mình. Tu vi còn đó, nhưng mọi công pháp, bí truyền hạ giới chỉ còn phát huy một nửa cho tới khi tìm lại ký ức (0/3 mảnh). Túi trữ vật còn 30 tiên nguyên thạch.');
  }
  const y = Math.floor(nowYears());
  if(g.lastYear==null) g.lastYear = y;
  if(y>g.lastYear){
    const passed = y-g.lastYear; g.lastYear = y;
    if(!(g.side && g.side.id==='thiendinh')) g.wanted = Math.max(0, Math.round((g.wanted - passed*0.2)*10)/10);
  }
  if(g.side && g.side.id==='thiendinh') g.wanted = 0;
  if(g.huyenDang && y-(g.huyenLastYear||y)>=50){ g.huyenLastYear = y; g.huyenQua = (g.huyenQua||0)+1; addLog('Huyền Thiên Tiên Đằng kết thêm một quả Huyền Thiên Chi Bảo.'); }
}
function memorySealed(){ return !!(state.tg && tgSeen() && !tg().memoryRestored); }
function addMemory(){
  const g = tg();
  if(g.memoryRestored) return '';
  g.memory++;
  if(g.memory>=3){ g.memoryRestored = true; computeStats(); return ' Mảnh ký ức thứ ba khớp vào — Nhân Giới, Linh Giới, bao gương mặt cũ ùa về. Ký ức khôi phục hoàn toàn, mọi công pháp hạ giới phát huy trọn vẹn!'; }
  return ` Một mảnh ký ức trở về (${g.memory}/3).`;
}

/* ---------------- Di chuyển, thám hiểm ---------------- */
function tgTravel(id){
  if(!tgActive() || state.combat || state.expd) return;
  const to = TG_REGIONS.find(r=>r.id===id), from = tgRegion();
  if(!to || to.id===from.id || !tgRegionVisible(to)) return;
  if(state.realmIdx<to.minRealm){ addLog(`Cần ${MAJOR_REALMS[to.minRealm].name} mới đủ sức vượt tinh không tới ${to.name}.`); render(); return; }
  const cost = Math.max(to.travelCost, from.travelCost);
  if(tg().tienThach<cost){ addLog(`Cần ${cost} tiên nguyên thạch để đi Tinh Không Truyền Tống Trận.`); render(); return; }
  tg().tienThach -= cost; tg().region = id; advanceTime(12);
  addLog(`Một năm vượt tinh không, ngươi tới ${to.name}.${to.forbidden?' Nơi đây bị Thiên Đình phong cấm.':''}`);
  render();
}
function tgPatrolEnemy(power){
  const g = tg();
  const elite = g.wanted>=80;
  const e = genRegionEnemy(Math.min(11,power+(elite?1:0)), null, elite?1.8:1.4, elite?'Thiên Đình Truy Nã Kim Tiên':'Thiên Đình Tuần Tra Sứ');
  e.tgPatrol = true; return e;
}
function tgExplore(locId){
  if(!tgActive() || state.combat || state.expd) return;
  const g = tg(), region = tgRegion(), loc = region.locations.find(l=>l.id===locId);
  if(!loc || state.realmIdx<loc.power) return;
  state.currentZone = Math.min(ZONES.length-1, loc.power);
  advanceTime(6);
  if(region.forbidden) g.wanted = Math.min(100, g.wanted+2);
  const hidden = g.hiddenUntil && nowYears()<g.hiddenUntil;
  const patrolChance = (hidden || (g.side && g.side.id==='thiendinh')) ? 0 : (hasTech('Liễm Tức Thuật')?0.6:1) * Math.min(0.4, g.wanted/250 + (region.id==='thiendinh'?0.1:0));
  if(Math.random()<patrolChance){
    addLog(`Tuần tra Thiên Đình chặn đường ngươi ở ${loc.name}${g.wanted>=80?' — chân dung ngươi đã dán trên lệnh truy nã':''}!`);
    startCombat(tgPatrolEnemy(loc.power)); return;
  }
  if(!g.side && !g.luanHoiContact && (g.wanted>=20 || region.id==='channgon') && Math.random()<0.25){ tgLuanHoiContact(); render(); return; }
  const roll = Math.random()*100;
  if(roll<40){ const e = genRegionEnemy(loc.power, loc.enemies); startCombat(e); return; }
  if(roll<58){ const t = Math.round((6+Math.random()*10)*(state.realmIdx-7)); g.tienThach += t; addLog(`Ở ${loc.name}, ngươi tìm được một mạch tiên nguyên thạch nhỏ: +${t}.`); }
  else if(roll<90) tgRegionEvent(region, loc);
  else { const tv = previewMeditateGain()*6; state.tuVi += tv; addLog(`Tiên khí nồng đậm ở ${loc.name} giúp tu vi +${tv}.`); }
  checkBreakthroughAvailable(); render();
}
function tgRegionEvent(region, loc){
  const g = tg(), opts = ['insight','tinhsa'];
  if(!g.memoryRestored && (region.id==='bachan')) opts.push('memory','memory');
  if(region.id==='channgon' && !g.timeArts.includes('channgon')) opts.push('channgon','channgon');
  if(region.id==='cuunguyen' && loc.id==='hoang_tuyen' && !g.timeArts.includes('tuenguyet')) opts.push('tuenguyet');
  if(region.id==='thiendinh' && loc.id==='dao_than_dien' && !g.timeArts.includes('quangam')) opts.push('quangam');
  if(region.id==='cuunguyen' && !g.thienSat.have) opts.push('thienSat');
  if((region.id==='channgon'||region.id==='luanhoi') && !g.ltExt) opts.push('ltExt');
  if(region.id==='tudi' && !hasTech('Minh Vương Quyết') && !state.manuals.includes('minh_vuong')) opts.push('minhvuong');
  if(region.id==='manhoang_tg') opts.push('tinhsa');
  if((region.id==='channgon'||region.id==='thiendinh') && !g.lucGiap) opts.push('lucgiap');
  if((region.id==='cuunguyen'||region.id==='bachtao') && !g.huyenDang && Math.random()<0.4) opts.push('huyenthien');
  if(loc.id==='than_lo_phong' && !state.puppetInv.giai_dao) opts.push('giaidao');
  const pick = pickEventOpt(opts);
  if(pick==='insight'){ const k = region.lawAff, gain = Math.max(1, Math.round(2*tgLawMult(k))); g.laws[k] = Math.min(lawCap(), g.laws[k]+gain); addLog(`Pháp tắc ${LAWS[k].short} ở ${loc.name} hiện rõ trong chớp mắt — ngươi lĩnh ngộ thêm ${gain} (${g.laws[k]}/${lawCap()}).`); }
  else if(pick==='tinhsa'){ const n = 1+Math.floor(Math.random()*2); g.tinhSa += n; addLog(`Một trận mưa sao băng rơi xuống ${loc.name}, ngươi nhặt được ${n} Tinh Thần Sa.`); }
  else if(pick==='memory'){ addLog(`Giữa băng nguyên, một khung cảnh xa lạ mà quen thuộc lóe lên trong đầu.${addMemory()}`); }
  else if(pick==='minhvuong'){ state.manuals.push('minh_vuong'); addLog('Một vị cao tăng trên Tu Di Kim Sơn trao cho ngươi ngọc giản 【Minh Vương Quyết】 — công pháp luyện thể Phật tông khắc chế yêu ma.'); }
  else if(pick==='lucgiap'){ g.lucGiap = true; addLog('Trong một hộp ngọc phủ cấm chế, ngươi tìm thấy 【Lục Giáp Thiên Thư】 — bộ sách ghi chép tiên phù, trong đó có Thái Nhất Hóa Thanh Phù và Cửu Thiên Lôi Công Phù.'); }
  else if(pick==='huyenthien'){ g.huyenDang = true; g.huyenQua = (g.huyenQua||0)+1; g.huyenLastYear = Math.floor(nowYears()); addLog('Sâu dưới lòng đất, ngươi đào được một đoạn rễ cây đen bóng tỏa ra pháp tắc thiên địa — rễ Huyền Thiên Tiên Đằng! Kèm một quả Huyền Thiên Chi Bảo. Rễ có thể luyện thành Huyền Thiên Trảm Tinh Kiếm (Luyện Khí), và cứ 50 năm lại kết một quả.'); }
  else if(pick==='giaidao'){ state.puppetInv.giai_dao = 1; addLog('Trong đống phế khí dưới chân Thần Lò Phong, một khôi lỗi hình người bỗng mở mắt nhìn ngươi. Nó xưng là Giải Đạo Nhân, tinh thông Lôi pháp tắc, cần tiên nguyên thạch làm năng lượng — lai lịch thật sự thì không chịu nói.'); }
  else if(pick==='thienSat'){ addLog(`Trên một bia đá ở Cửu Nguyên Quan khắc đồ hình tinh tú và huyệt khiếu. ${grantTgHeritage('thienSat')}`); }
  else if(pick==='ltExt'){ addLog(`Giữa đống kinh thư cháy dở, một quyển có khí tức giống hệt Luyện Thần Thuật ngươi từng luyện. ${grantTgHeritage('ltExt')}`); }
  else { addLog(`Dưới lớp cấm chế tàn lưu, ngươi lấy được quyển công pháp Thời Gian thất truyền. ${grantTimeArt(pick)}`); }
  computeStats();
}
function tgLuanHoiContact(){
  const g = tg(); g.luanHoiContact = true;
  presentEvent({title:'Sứ Giả Luân Hồi Điện', sub:'đeo mặt nạ bạc', icon:'taiji',
    text:'Một bóng người đeo mặt nạ bạc bước ra từ khe không gian: "Thiên Đình đã để mắt tới ngươi. Luân Hồi Điện không hỏi quá khứ, chỉ hỏi — ngươi có dám đối đầu với Cổ Hoặc Kim không?"',
    options:[{label:'Gia nhập Luân Hồi Điện', act:'tgJoinSide', args:['luanhoi']},{label:'Từ chối, giữ mình trung lập', act:'ok', args:[]}]});
}
EVENT_ACTS.tgJoinSide = function(id){ tgJoin(id, true); };

function tgJoin(id, viaEvent){
  const g = tg(), f = tgFaction(id);
  const slot = f.kind==='sect' ? 'sect' : 'side';
  if(g[slot]){ addLog(f.kind==='sect'?'Đã thuộc một tông môn Tiên Giới.':'Đã chọn phe giữa Thiên Đình và Luân Hồi Điện.'); render(); return; }
  if(g.sideLeft.includes(id)){ addLog(`${f.name} không nhận lại kẻ đã rời đi.`); render(); return; }
  if(state.realmIdx<f.minRealm){ addLog(`${f.name} chỉ nhận ${MAJOR_REALMS[f.minRealm].name} trở lên.`); render(); return; }
  if(f.secret && !viaEvent && !g.luanHoiContact){ addLog('Không ai biết Luân Hồi Điện ở đâu — phải chờ họ tìm tới.'); render(); return; }
  if(!viaEvent && g.region!==f.region){ addLog(`Phải tới ${TG_REGIONS.find(r=>r.id===f.region).name} mới bái nhập được.`); render(); return; }
  if(id==='thiendinh' && g.wanted>=30){ addLog('Thiên Đình không nhận kẻ đang bị truy nã (cần độ truy nã dưới 30).'); render(); return; }
  if(g.tienThach<f.joinCost){ addLog(`Cần ${f.joinCost} tiên nguyên thạch làm lễ nhập môn.`); render(); return; }
  g.tienThach -= f.joinCost;
  g[slot] = {id, rank:0, merit:0, contrib:0};
  let extra = '';
  if(id==='chuclong' && g.laws.thoi<5){ g.laws.thoi = 5; extra = ' Trưởng lão truyền pháp chỉ cho ngươi lần đầu cảm nhận dòng chảy thời gian (Thời Gian Pháp Tắc 5).'; }
  if(id==='thiendinh'){ g.wanted = 0; extra = ' Lệnh bài tiên quan xóa sạch mọi truy nã.'; }
  if(id==='luanhoi'){ g.wanted = Math.min(100, g.wanted+10); extra = ' Đường vào Luân Hồi Điện Ẩn Cứ đã được khắc vào thức hải. Từ nay Thiên Đình là kẻ thù.'; }
  addLog(`Gia nhập ${f.name}.${extra}`);
  computeStats(); render();
}
function tgLeave(slot){
  const g = tg(), m = g[slot]; if(!m) return;
  const f = tgFaction(m.id);
  g.sideLeft.push(m.id); g[slot] = null;
  if(m.id==='thiendinh') g.wanted = Math.max(g.wanted, 50);
  addLog(`Rời khỏi ${f.name}.${m.id==='thiendinh'?' Thiên Đình liệt ngươi vào danh sách phản đồ (truy nã 50).':''}`);
  computeStats(); render();
}
function tgMission(slot){
  const g = tg(), m = g[slot]; if(!m || state.combat || state.expd) return;
  const f = tgFaction(m.id);
  if(g.region!==f.region){ addLog(`Nhiệm vụ của ${f.name} nhận ở ${TG_REGIONS.find(r=>r.id===f.region).name}.`); render(); return; }
  advanceTime(12);
  if(m.id==='luanhoi') g.wanted = Math.min(100, g.wanted+5);
  if(Math.random()<0.45){
    const e = genRegionEnemy(Math.min(11,state.realmIdx), null, 1.35, f.foes[Math.floor(Math.random()*f.foes.length)]);
    e.tgMission = slot; e.tgPatrol = m.id==='luanhoi';
    addLog(`${f.name} giao nhiệm vụ — dọc đường chạm trán ${e.name}.`); startCombat(e); return;
  }

  m.merit += c; m.contrib += c; g.tienThach += t;
  addLog(`Hoàn thành "${f.tasks[Math.floor(Math.random()*f.tasks.length)]}": +${c} cống hiến, +${t} tiên nguyên thạch.${m.id==='luanhoi'?' (truy nã +5)':''}`);
  render();
}
function tgPromote(slot){
  const m = tg()[slot]; if(!m || m.rank>=TG_RANKS.length-1) return;
  const need = TG_MERIT[m.rank+1];
  if(m.merit<need){ addLog(`Cần ${need} công lao.`); render(); return; }
  m.rank++; addLog(`${tgFaction(m.id).name} tấn thăng ngươi làm ${TG_RANKS[m.rank]}.`); computeStats(); render();
}
function tgRaidDaoThan(){
  const g = tg();
  if(!(g.side && g.side.id==='luanhoi' && g.side.rank>=2) || g.daoThanChau || state.combat) return;

  g.wanted = 100;

  startCombat(e);
